<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Rehberleri | Türkçe IT Destek, Sistem ve Ağ Yönetimi Kılavuzu</title>
<meta name="description" content="IT destek, sistem yöneticisi ve BT yöneticileri için Türkçe rehberler: sorun giderme senaryoları, ağ, güvenlik duvarı, Windows Server, Active Directory, veri merkezi, Microsoft 365, güvenlik ve BT yönetimi.">
<meta name="theme-color" content="#2a56d6">
<meta property="og:title" content="IT Rehberleri">
<meta property="og:description" content="IT destek, sistem ve ağ yönetimi için Türkçe, uygulamalı ve modern rehber koleksiyonu.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a56d6'/%3E%3Cpath d='M9 11l5 5-5 5M17 21h6' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
  --bg:#f5f7fb;--surface:#ffffff;--text:#192033;--muted:#5a6479;--border:#e1e6ef;
  --accent:#2a56d6;--accent-2:#7c3aed;--accent-soft:#e8eefc;--code-bg:#eef1f7;--pre-bg:#0f1420;--pre-text:#e4e8f1;
  --mark:#ffe58f;--mark-text:#192033;--cur:#ff9f1c;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --hero-a:#e9efff;--hero-b:#f3ecff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017;--surface:#151a24;--text:#e5e8ef;--muted:#9aa3b6;--border:#252b39;
    --accent:#7aa2ff;--accent-2:#b794f6;--accent-soft:#1b2640;--code-bg:#1e2331;--pre-bg:#090c12;--pre-text:#e4e8f1;
    --mark:#8a6d00;--mark-text:#fff;--cur:#d97706;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --hero-a:#16213d;--hero-b:#241a3d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1017;--surface:#151a24;--text:#e5e8ef;--muted:#9aa3b6;--border:#252b39;
  --accent:#7aa2ff;--accent-2:#b794f6;--accent-soft:#1b2640;--code-bg:#1e2331;--pre-bg:#090c12;--pre-text:#e4e8f1;
  --mark:#8a6d00;--mark-text:#fff;--cur:#d97706;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --hero-a:#16213d;--hero-b:#241a3d;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.68 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Üst Başlık & Arama */
.top{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px;color:var(--text);text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:18px;height:18px}
.search{flex:1;max-width:640px;position:relative;margin:0 auto 0 8px}
.search input{width:100%;height:40px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:0 70px 0 40px;font:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search input::-webkit-search-cancel-button{display:none}
.search svg.s-icon{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search-kbd{position:absolute;right:34px;top:9px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 6px;pointer-events:none}
#clearQ{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;border-radius:6px}
#clearQ:hover{background:var(--code-bg)}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none;transition:border-color .15s,transform .1s}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
#menuBtn{display:none}

/* Ana Düzen */
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);align-items:start}
.side{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:14px 12px 40px;border-right:1px solid var(--border);background:var(--surface);overscroll-behavior:contain}
.main{padding:30px 32px 100px;max-width:1020px;width:100%;margin:0 auto;outline:none;min-width:0}

/* Kenar Çubuğu (Accordion & Menü) */
.nav-tools{display:flex;align-items:center;justify-content:space-between;padding:0 8px 10px;border-bottom:1px solid var(--border);margin-bottom:12px}
.nav-home{display:block;padding:8px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:600;font-size:14.5px;transition:all .15s}
.nav-home:hover{background:var(--code-bg)}
.nav-home.active{background:var(--accent-soft);color:var(--accent)}
.nav-tool-btn{background:transparent;border:0;color:var(--muted);font-size:11.5px;cursor:pointer;padding:4px 7px;border-radius:6px;transition:all .15s}
.nav-tool-btn:hover{color:var(--accent);background:var(--code-bg)}

.nav-cat{margin-top:14px}
.nav-cat-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 10px;font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-radius:8px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav-cat-h:hover{background:var(--code-bg);color:var(--text)}
.nav-cat-h .cat-left{display:flex;align-items:center;gap:8px}
.nav-cat-h .chevron{width:14px;height:14px;transition:transform .2s ease;color:var(--muted);flex:none}
.nav-cat.collapsed .chevron{transform:rotate(-90deg)}
.nav-cat.collapsed .nav-cat-items{display:none}

.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.nav-doc-row{display:flex;align-items:center;gap:2px;position:relative}
.nav-doc{flex:1;display:block;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:500;font-size:14px;transition:all .15s;line-height:1.4}
.nav-doc:hover{background:var(--code-bg)}
.nav-doc.active{background:var(--accent-soft);color:var(--accent);font-weight:650}

.nav-doc-toggle{width:26px;height:26px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;display:grid;place-items:center;padding:0;transition:all .15s;flex:none}
.nav-doc-toggle:hover{background:var(--code-bg);color:var(--text)}
.nav-doc-toggle svg{width:13px;height:13px;transition:transform .2s ease}
.nav-doc-item.collapsed .nav-secs{display:none}
.nav-doc-item.collapsed .nav-doc-toggle svg{transform:rotate(-90deg)}

.nav-secs{margin:3px 0 8px 16px;border-left:1px solid var(--border)}
.nav-sec{display:block;margin-left:-1px;padding:4px 10px;font-size:12.5px;line-height:1.35;color:var(--muted);text-decoration:none;border-left:2px solid transparent;transition:all .15s}
.nav-sec:hover{color:var(--text)}
.nav-sec.l1{font-weight:600}
.nav-sec.ind.l2{padding-left:20px}
.nav-sec.cur{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.side-foot{margin:26px 10px 0;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.5}

/* Doküman & Tipografi */
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;font-size:12.5px;color:var(--muted)}
.meta span{background:var(--code-bg);border-radius:999px;padding:3px 10px}

.doc h1{font-size:31px;line-height:1.2;margin:0 0 14px;letter-spacing:-.02em}
.doc h2{font-size:22px;line-height:1.3;margin:42px 0 12px;padding-top:20px;border-top:1px solid var(--border);letter-spacing:-.01em}
.doc h3{font-size:18px;line-height:1.35;margin:30px 0 8px}
.doc h1,.doc h2,.doc h3{scroll-margin-top:76px;position:relative}
.doc hr{border:0;border-top:1px solid var(--border);margin:24px 0}
.doc p{margin:10px 0}
.doc ul,.doc ol{padding-left:24px;margin:10px 0}
.doc li{margin:5px 0}
.doc li>ul,.doc li>ol{margin:4px 0}
.doc blockquote{margin:16px 0;padding:10px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0}
.doc blockquote p{margin:6px 0}
.doc code{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);padding:1px 6px;border-radius:5px;word-break:break-word}
.doc pre{position:relative;margin:14px 0;padding:14px 16px;background:var(--pre-bg);color:var(--pre-text);border-radius:12px;overflow:auto;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4;-webkit-overflow-scrolling:touch}
.doc pre code{background:transparent;padding:0;font:inherit;word-break:normal;color:inherit}
.doc .tw{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px}
.doc th,.doc td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
.doc th{background:var(--code-bg);font-weight:650;white-space:nowrap}
.doc tr:last-child td{border-bottom:0}
.doc tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--code-bg) 45%,transparent)}
.doc td code,.doc th code{white-space:nowrap}
.doc input[type=checkbox]{margin-right:6px;width:16px;height:16px;vertical-align:-2px;accent-color:var(--accent)}
.doc img{max-width:100%;height:auto}

/* Akıllı Linkler ve Vurgular */
a.smart-link, code.doclink{color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;font-weight:550;transition:all .15s}
a.smart-link:hover, code.doclink:hover{text-decoration-style:solid;color:var(--accent-2)}
.anchor{margin-left:8px;font-size:.8em;color:var(--muted);text-decoration:none;opacity:0}
h1:hover .anchor,h2:hover .anchor,h3:hover .anchor,.anchor:focus{opacity:1}
.copy{position:absolute;top:8px;right:8px;font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid #2d3548;background:#1a2133;color:#c9d2e6;cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover .copy,.copy:focus{opacity:1}
@media (hover:none){.copy{opacity:.9}}
mark{background:var(--mark);color:var(--mark-text);border-radius:3px;padding:0 1px}
mark.hl.cur{background:var(--cur);color:#fff;outline:2px solid var(--cur)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,45%{background:var(--mark);box-shadow:0 0 0 6px var(--mark);border-radius:4px}100%{background:transparent;box-shadow:0 0 0 6px transparent}}

/* Önceki - Sonraki Butonları */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.pn a{display:block;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;transition:border-color .15s,transform .15s}
.pn a:hover{border-color:var(--accent);transform:translateY(-1px)}
.pn a.r{text-align:right}
.pn small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* Ana Sayfa Hero ve Kartlar */
.hero{position:relative;overflow:hidden;padding:34px 30px 26px;border-radius:22px;border:1px solid var(--border);background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%);pointer-events:none}
.hero .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px;margin-bottom:14px}
.hero h1{font-size:38px;line-height:1.12;margin:0 0 12px;letter-spacing:-.025em}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:680px;margin:0 0 18px;font-size:16.5px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 16px}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat small{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 13px;border-radius:999px;font-size:13.5px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sec-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:32px 0 -14px}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
.start a{display:block;padding:16px 18px;border-radius:16px;border:1px solid var(--border);background:var(--surface);text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.start a:hover{transform:translateY(-2px);border-color:var(--accent)}
.start b{display:block;font-size:15.5px;margin-bottom:3px}
.start small{color:var(--muted);font-size:13px;line-height:1.45;display:block}
.start .ic{font-size:22px;margin-bottom:6px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:30px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px 8px;box-shadow:var(--shadow)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px}
.card a.d{display:block;padding:11px 0;border-top:1px solid var(--border);color:var(--text);text-decoration:none}
.card a.d:hover strong{color:var(--accent)}
.card a.d small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}

/* Arama Sonuçları & Hızlı Komut Kutusu */
.res-head h2{font-size:20px;margin:0 0 6px}
.quick-box{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--border));border-radius:14px;padding:14px 18px;margin:14px 0 20px;box-shadow:var(--shadow)}
.quick-box-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.quick-box-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.quick-box p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.quick-code{display:flex;align-items:center;justify-content:space-between;background:var(--pre-bg);color:var(--pre-text);padding:10px 14px;border-radius:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;margin-top:6px;overflow-x:auto}
.quick-copy{padding:5px 12px;background:#242c42;color:#fff;border:1px solid #37425f;border-radius:6px;font-size:12px;cursor:pointer;flex:none;margin-left:12px;transition:all .15s}
.quick-copy:hover{background:#3a4568}

.res{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin:10px 0;color:var(--text);text-decoration:none;transition:border-color .15s,box-shadow .15s}
.res:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.res-crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.res-title{font-weight:650;margin:3px 0}
.res-snip{color:var(--muted);font-size:14px;line-height:1.5;word-break:break-word}
.empty{color:var(--muted);padding:12px 0}

.matchbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)}
.matchbar button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--text);font-size:18px;line-height:1;cursor:pointer}
.matchbar button:hover{background:var(--code-bg)}
.matchbar span{font-size:13px;color:var(--muted);padding:0 6px;min-width:56px;text-align:center}
#toTop{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:24;width:44px;height:44px;border-radius:50%;box-shadow:var(--shadow)}

/* Mobil ve Duyarlı Tasarım */
.scrim{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:grid}
  .side{position:fixed;left:0;top:58px;bottom:0;height:auto;width:min(88vw,330px);transform:translateX(-102%);transition:transform .22s ease-out;z-index:40;padding-bottom:calc(40px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
  body.menu-open .side{transform:none}
  body.menu-open{overflow:hidden}
  body.menu-open .scrim{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.45);z-index:35}
  .main{padding:20px 16px calc(90px + env(safe-area-inset-bottom))}
  .doc h1{font-size:26px}
  .doc h2{font-size:20px;margin-top:34px}
  .hero{padding:26px 20px 20px;border-radius:18px}
  .hero h1{font-size:30px}
  .nav-doc{padding-top:9px;padding-bottom:9px}
  .search-kbd{display:none}
}
@media (max-width:600px){
  .brand span{display:none}
  .search{margin-left:0}
  .pn{grid-template-columns:1fr}
  .doc table{font-size:13.5px}
  .doc th,.doc td{padding:8px 10px}
  .doc pre{font-size:12.5px;padding:12px 12px;border-radius:10px;margin-left:-4px;margin-right:-4px}
  .hero h1{font-size:27px}
  .hero p{font-size:15px}
  .grid{grid-template-columns:1fr}
}
@media print{
  .top,.side,.pn,.matchbar,#toTop,.copy,.anchor{display:none!important}
  .layout{display:block}.main{padding:0;max-width:none}
  .doc pre{white-space:pre-wrap;background:#f4f4f4;color:#000;border:1px solid #ccc}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon-btn" aria-label="Menüyü aç/kapat" aria-controls="side">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="#/" class="brand" aria-label="IT Rehberleri ana sayfa"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l5 4-5 4M13 17h5"/></svg></span><span>IT Rehberleri</span></a>
  <div class="search" role="search">

ri-merkezi-donanim-ups-kablolama-rehberi.md\n\"Yeni bilgisayar kuracağım, disk şifreleyeceğim\"\n08-istemci-donanim-windows-rehberi.md\n\"Şüpheli e-posta, virüs, fidye yazılımı vakası\"\n03-guvenlik-olay-mudahale-rehberi.md\n\"Bunu 50 bilgisayarda betikle yapmam lazım\"\n04-powershell-bash-otomasyon-rehberi.md\n\"Ticket nasıl yazılır, değişiklik nasıl yönetilir\"\n05-itil-surec-dokumantasyon-rehberi.md\n\"SLA, KPI, onboarding/offboarding, felaket kurtarma\"\n09-bt-yonetimi-operasyon-rehberi.md\n\"Cisco switch temel ayarları, trunk, port güvenliği\"\ncisco-switch-rehberi.md"},{"id":"s-onerilen-ogrenme-sirasi-yeni-baslayanlar-kendini-gelistirenler","title":"Önerilen Öğrenme Sırası (Yeni Başlayanlar & Kendini Geliştirenler)","level":2,"path":"","isTitle":false,"text":"it-destek-cep-rehberi.md: Ana el kitabı, önce bunu oku.\n07-ag-temelleri-rehberi.md: Ağın mantığını oturt.\n11-veri-merkezi-donanim-ups-kablolama-rehberi.md: Fiziksel altyapıyı, kablolamayı ve donanımı tanı.\ncisco-switch-rehberi.md: Packet Tracer'da switch yapılandırarak pekiştir.\n10-guvenlik-duvari-firewall-vpn-rehberi.md: Kurumsal firewall, NAT ve VPN mantığını kavra.\n02-sunucu-sanallastirma-yedekleme-rehberi.md: AD/DHCP/DNS laboratuvarını kur.\n08-istemci-donanim-windows-rehberi.md: İstemci tarafını ve Windows yönetimini öğren.\n01-bulut-kimlik-m365-intune-rehberi.md: M365 deneme kiracısı ile kimlik ve cihaz yönetimini dene.\n04-powershell-bash-otomasyon-rehberi.md: Lab'da yaptığın işleri betiğe dök.\n03-guvenlik-olay-mudahale-rehberi.md: Güvenlik kontrollerini uygula.\n05-itil-surec-dokumantasyon-rehberi.md ve 09-bt-yonetimi-operasyon-rehberi.md: Süreç ve yönetim tarafını yönetici gözüyle öğren.\n06-sik-sorunlar-cozum-senaryolari.md: Senaryoları sahada veya lab ortamında pratik et."},{"id":"s-kullanim-ipuclari","title":"Kullanım İpuçları","level":2,"path":"","isTitle":false,"text":"Sitede arama kutusu Türkçe karakter duyarsızdır (sifre yazınca şifre de bulunur). Klavyede / veya Ctrl+K tuşu aramaya odaklanır.\nKod bloklarının üzerindeki Kopyala düğmesiyle komutları anında panoya alabilirsin.\nRehberlerdeki tüm adımlar ve çapraz başlıklar tıklanabilirdir.\nKomutları üretim ortamında çalıştırmadan önce test ortamında dene; geri dönüşsüz işlemlerde daima yedek al ve onay iste."},{"id":"s-sorumluluk-reddi","title":"Sorumluluk Reddi","level":2,"path":"","isTitle":false,"text":"Bu rehberler eğitim ve kurumsal başvuru amaçlıdır; \"olduğu gibi\" sunulur. Örnek IP adresleri, alan adları (firma.local, lab.local) ve şifreler kurgusaldır. Kendi ortamında kullanmadan önce kurumunun politikalarına ve resmi üretici dokümanlarına göre uyarla."}]},{"slug":"cep","file":"it-destek-cep-rehberi.md","title":"IT Destek Cep Rehberi: Ağ, Sistem, Altyapı","short":"IT Destek Cep Rehberi","desc":"Günlük sorun giderme, ağ ve Windows komutları, AD, DHCP/DNS, Linux, ticket","words":4286,"html":"\u003ch1 id=\"s-it-destek-cep-rehberi-ag-sistem-altyapi\">IT Destek Cep Rehberi: Ağ, Sistem, Altyapı\u003c/h1>\n\u003cp>IT destek ve sistem yönetimi çalışanları için hızlı başvuru notları. Önce neyi kontrol edeceğini, sonra hangi komutu yazacağını bul. Yeni başlayanlar için öğretici, deneyimliler için hatırlatıcı olacak şekilde hazırlanmıştır.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Altın kurallar\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Değiştirmeden önce mevcut durumu not al (ekran görüntüsü, \u003ccode>ipconfig /all\u003c/code>, config yedeği).\u003c/li>\n\u003cli>Aynı anda tek şey değiştir, sonra test et.\u003c/li>\n\u003cli>Yetkin olmayan, geri dönüşü olmayan işi (silme, format, toplu değişiklik) onaysız yapma.\u003c/li>\n\u003cli>Her işlemi ticket&#39;a yaz: ne gördün, ne yaptın, sonuç ne oldu.\u003c/li>\n\u003c/ol>\n\u003c/blockquote>\n\u003chr>\n\u003ch1 id=\"s-1-sorun-giderme-yaklasimi\">1. SORUN GİDERME YAKLAŞIMI\u003c/h1>\n\u003ch2 id=\"s-1-1-once-sorular-kullaniciya\">1.1 Önce sorular (kullanıcıya)\u003c/h2>\n\u003cul>\n\u003cli>Tam olarak ne oluyor? Hata mesajı var mı? (ekran görüntüsü iste)\u003c/li>\n\u003cli>Ne zaman başladı? Öncesinde ne değişti? (güncelleme, yeni program, taşınma)\u003c/li>\n\u003cli>Sadece sende mi, başkalarında da var mı?\u003c/li>\n\u003cli>Daha önce çalışıyor muydu?\u003c/li>\n\u003cli>Bilgisayarı yeniden başlattın mı?\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-1-2-katman-katman-ilerle-osi-mantigi\">1.2 Katman katman ilerle (OSI mantığı)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sıra\u003c/th>\n\u003cth>Kontrol\u003c/th>\n\u003cth>Nasıl\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1. Fiziksel\u003c/td>\n\u003ctd>Kablo, port ışığı, Wi-Fi bağlı mı\u003c/td>\n\u003ctd>Kabloyu çıkar tak, başka porta tak\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2. Ağ bağlantısı\u003c/td>\n\u003ctd>IP alıyor mu\u003c/td>\n\u003ctd>\u003ccode>ipconfig\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. Yerel ağ\u003c/td>\n\u003ctd>Gateway&#39;e ulaşıyor mu\u003c/td>\n\u003ctd>\u003ccode>ping gateway\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. İnternet\u003c/td>\n\u003ctd>Dışarı çıkıyor mu\u003c/td>\n\u003ctd>\u003ccode>ping 8.8.8.8\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5. İsim çözümleme\u003c/td>\n\u003ctd>DNS çalışıyor mu\u003c/td>\n\u003ctd>\u003ccode>ping google.com\u003c/code>, \u003ccode>nslookup google.com\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6. Uygulama\u003c/td>\n\u003ctd>Servis/program çalışıyor mu\u003c/td>\n\u003ctd>Port testi, servis kontrolü\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Yorumlama:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>IP yok / \u003ccode>169.254.x.x\u003c/code> → DHCP&#39;ye ulaşılamıyor\u003c/li>\n\u003cli>Gateway&#39;e ping yok → yerel ağ/kablo/switch/VLAN sorunu\u003c/li>\n\u003cli>\u003ccode>8.8.8.8\u003c/code> var, \u003ccode>google.com\u003c/code> yok → DNS sorunu\u003c/li>\n\u003cli>İkisi de var, site açılmıyor → proxy, tarayıcı, güvenlik duvarı\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-2-ag-komutlari-windows\">2. AĞ KOMUTLARI (Windows)\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Komut\u003c/th>\n\u003cth>Ne yapar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ipconfig\u003c/code>\u003c/td>\n\u003ctd>IP, maske, gateway\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ipconfig /all\u003c/code>\u003c/td>\n\u003ctd>MAC, DHCP sunucusu, DNS, kira süresi (en çok işe yarayan)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ipconfig /release\u003c/code> + \u003ccode>ipconfig /renew\u003c/code>\u003c/td>\n\u003ctd>DHCP&#39;den yeni IP al\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ipconfig /flushdns\u003c/code>\u003c/td>\n\u003ctd>DNS önbelleğini temizle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ipconfig /displaydns\u003c/code>\u003c/td>\n\u003ctd>DNS önbelleğini göster\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ping adres\u003c/code>\u003c/td>\n\u003ctd>Erişim testi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ping -t adres\u003c/code>\u003c/td>\n\u003ctd>Sürekli ping (Ctrl+C ile dur)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ping -n 20 adres\u003c/code>\u003c/td>\n\u003ctd>20 paket gönder\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tracert adres\u003c/code>\u003c/td>\n\u003ctd>Paketin geçtiği yolu göster\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pathping adres\u003c/code>\u003c/td>\n\u003ctd>Tracert + kayıp analizi (uzun sürer)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>nslookup alan.adi\u003c/code>\u003c/td>\n\u003ctd>DNS sorgusu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>nslookup alan.adi 8.8.8.8\u003c/code>\u003c/td>\n\u003ctd>Belirli DNS sunucusundan sorgula\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>arp -a\u003c/code>\u003c/td>\n\u003ctd>IP-MAC tablosu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>netstat -ano\u003c/code>\u003c/td>\n\u003ctd>Açık bağlantılar ve portlar + PID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>netstat -ano | findstr :80\u003c/code>\u003c/td>\n\u003ctd>80 portunu kullanan işlem\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tasklist | findstr PID\u003c/code>\u003c/td>\n\u003ctd>PID&#39;den program adını bul\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>route print\u003c/code>\u003c/td>\n\u003ctd>Yönlendirme tablosu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>netsh wlan show profiles\u003c/code>\u003c/td>\n\u003ctd>Kayıtlı Wi-Fi&#39;lar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>netsh int ip reset\u003c/code>\u003c/td>\n\u003ctd>TCP/IP yığınını sıfırla (yeniden başlatma gerekir)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>netsh winsock reset\u003c/code>\u003c/td>\n\u003ctd>Winsock&#39;u sıfırla (yeniden başlatma gerekir)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getmac\u003c/code>\u003c/td>\n\u003ctd>MAC adresi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hostname\u003c/code>\u003c/td>\n\u003ctd>Bilgisayar adı\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Port testi (PowerShell):\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Test-NetConnection sunucu -Port 443\nTest-NetConnection 192.168.1.20 -Port 3389\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>TcpTestSucceeded : True\u003c/code> ise port açık ve erişilebilir.\u003c/p>\n\u003cp>\u003cstrong>IP sorunu 3 adımlık hızlı çözüm:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>ipconfig /release\nipconfig /flushdns\nipconfig /renew\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch1 id=\"s-3-ip-subnet-ve-vlan-ozeti\">3. IP, SUBNET VE VLAN ÖZETİ\u003c/h1>\n\u003ch2 id=\"s-3-1-ozel-private-ip-araliklari\">3.1 Özel (private) IP aralıkları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Aralık\u003c/th>\n\u003cth>Sınıf\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>10.0.0.0 – 10.255.255.255\u003c/td>\n\u003ctd>A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>172.16.0.0 – 172.31.255.255\u003c/td>\n\u003ctd>B\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>192.168.0.0 – 192.168.255.255\u003c/td>\n\u003ctd>C\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>169.254.0.0/16\u003c/td>\n\u003ctd>APIPA (DHCP bulunamadı)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>127.0.0.1\u003c/td>\n\u003ctd>Loopback (kendisi)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-3-2-subnet-hizli-tablo\">3.2 Subnet hızlı tablo\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>CIDR\u003c/th>\n\u003cth>Maske\u003c/th>\n\u003cth>Kullanılabilir host\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>/24\u003c/td>\n\u003ctd>255.255.255.0\u003c/td>\n\u003ctd>254\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/25\u003c/td>\n\u003ctd>255.255.255.128\u003c/td>\n\u003ctd>126\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/26\u003c/td>\n\u003ctd>255.255.255.192\u003c/td>\n\u003ctd>62\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/27\u003c/td>\n\u003ctd>255.255.255.224\u003c/td>\n\u003ctd>30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/28\u003c/td>\n\u003ctd>255.255.255.240\u003c/td>\n\u003ctd>14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/29\u003c/td>\n\u003ctd>255.255.255.248\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/30\u003c/td>\n\u003ctd>255.255.255.252\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/16\u003c/td>\n\u003ctd>255.255.0.0\u003c/td>\n\u003ctd>65.534\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Kural: Host sayısı = 2^(host bitleri) − 2 (ağ ve broadcast adresi hariç).\u003c/p>\n\u003ch2 id=\"s-3-3-sik-kullanilan-portlar\">3.3 Sık kullanılan portlar\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Port\u003c/th>\n\u003cth>Servis\u003c/th>\n\u003cth>Port\u003c/th>\n\u003cth>Servis\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20/21\u003c/td>\n\u003ctd>FTP\u003c/td>\n\u003ctd>110\u003c/td>\n\u003ctd>POP3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22\u003c/td>\n\u003ctd>SSH\u003c/td>\n\u003ctd>123\u003c/td>\n\u003ctd>NTP (UDP)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>23\u003c/td>\n\u003ctd>Telnet\u003c/td>\n\u003ctd>143\u003c/td>\n\u003ctd>IMAP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>25\u003c/td>\n\u003ctd>SMTP\u003c/td>\n\u003ctd>161/162\u003c/td>\n\u003ctd>SNMP (UDP)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>53\u003c/td>\n\u003ctd>DNS (UDP/TCP)\u003c/td>\n\u003ctd>389\u003c/td>\n\u003ctd>LDAP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>67/68\u003c/td>\n\u003ctd>DHCP (UDP)\u003c/td>\n\u003ctd>443\u003c/td>\n\u003ctd>HTTPS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>69\u003c/td>\n\u003ctd>TFTP (UDP)\u003c/td>\n\u003ctd>445\u003c/td>\n\u003ctd>SMB (dosya paylaşımı)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>HTTP\u003c/td>\n\u003ctd>514\u003c/td>\n\u003ctd>Syslog (UDP)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3389\u003c/td>\n\u003ctd>RDP (uzak masaüstü)\u003c/td>\n\u003ctd>3306\u003c/td>\n\u003ctd>MySQL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1433\u003c/td>\n\u003ctd>MS SQL\u003c/td>\n\u003ctd>5432\u003c/td>\n\u003ctd>PostgreSQL\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003chr>\n\u003ch1 id=\"s-4-sik-karsilasilan-sorunlar-ve-cozumleri\">4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ\u003c/h1>\n\u003ch2 id=\"s-4-1-internet-yok\">4.1 &quot;İnternet yok&quot;\u003c/h2>\n\u003col>\n\u003cli>Kablo/Wi-Fi bağlı mı? Uçak modu kapalı mı?\u003c/li>\n\u003cli>\u003ccode>ipconfig\u003c/code>: IP var mı? \u003ccode>169.254\u003c/code> ise DHCP sorunu → \u003ccode>ipconfig /renew\u003c/code>\u003c/li>\n\u003cli>\u003ccode>ping gateway\u003c/code>: gitmiyorsa kablo/port/VLAN\u003c/li>\n\u003cli>\u003ccode>ping 8.8.8.8\u003c/code>: gidiyor ama site açılmıyorsa DNS → \u003ccode>ipconfig /flushdns\u003c/code>, DNS&#39;i elle \u003ccode>8.8.8.8\u003c/code> yap\u003c/li>\n\u003cli>Başkalarında da yoksa: switch, router, modem, hat sorunu\u003c/li>\n\u003cli>Proxy kontrolü: Ayarlar &gt; Ağ &gt; Proxy\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-2-bilgisayar-yavas\">4.2 &quot;Bilgisayar yavaş&quot;\u003c/h2>\n\u003col>\n\u003cli>Görev Yöneticisi (Ctrl+Shift+Esc): CPU, RAM, disk, hangi program?\u003c/li>\n\u003cli>Disk %100 ise: Windows Update, antivirüs taraması, arızalı disk olabilir\u003c/li>\n\u003cli>Başlangıç programlarını azalt (Görev Yöneticisi &gt; Başlangıç)\u003c/li>\n\u003cli>Disk doluluk: \u003ccode>cleanmgr\u003c/code>, geçici dosyalar (\u003ccode>%temp%\u003c/code>)\u003c/li>\n\u003cli>Disk sağlığı: \u003ccode>wmic diskdrive get status\u003c/code>, \u003ccode>chkdsk C: /f\u003c/code> (yeniden başlatma ister)\u003c/li>\n\u003cli>RAM yetersizse artır, HDD ise SSD&#39;ye geçmek en büyük farkı yaratır\u003c/li>\n\u003cli>Zararlı yazılım taraması yap\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-3-yazici-calismiyor\">4.3 &quot;Yazıcı çalışmıyor&quot;\u003c/h2>\n\u003col>\n\u003cli>Yazıcı açık, kağıt/toner var mı, ekranda hata var mı?\u003c/li>\n\u003cli>Yazıcı ağda mı: yazıcının IP&#39;sine \u003ccode>ping\u003c/code> at\u003c/li>\n\u003cli>Yazdırma kuyruğunda takılı iş: Hizmetler &gt; \u003cstrong>Print Spooler\u003c/strong> &gt; durdur\u003cpre>\u003ccode>net stop spooler\ndel /Q /F /S &quot;%systemroot%\\System32\\spool\\PRINTERS\\*.*&quot;\nnet start spooler\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003cli>Sürücüyü kaldırıp yeniden yükle\u003c/li>\n\u003cli>Doğru yazıcı varsayılan mı, &quot;çevrimdışı çalış&quot; işaretli mi?\u003c/li>\n\u003cli>Ağ yazıcısını IP ile ekle (Standard TCP/IP Port): ad ile eklemeden daha kararlıdır\u003c/li>\n\u003cli>Yazıcıya sabit IP ver veya DHCP rezervasyonu yap\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-4-sifremi-unuttum-hesap-kilitlendi\">4.4 &quot;Şifremi unuttum / hesap kilitlendi&quot;\u003c/h2>\n\u003cp>\u003cstrong>Active Directory&#39;de:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Active Directory Users and Computers (ADUC) &gt; kullanıcıya sağ tık &gt; \u003cstrong>Reset Password\u003c/strong>\u003c/li>\n\u003cli>Kilitliyse \u003cstrong>Unlock Account\u003c/strong> kutusunu işaretle\u003c/li>\n\u003cli>&quot;User must change password at next logon&quot; seçeneğini işaretle\u003c/li>\n\u003cli>Kimlik doğrulaması yap (kullanıcı gerçekten o mu?). Telefonla gelen talepleri doğrulamadan işleme koyma, sosyal mühendislik riskidir.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Yerel hesapta:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>net user kullaniciadi YeniSifre123!\nnet user kullaniciadi /active:yes\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-4-5-uzak-masaustune-baglanamiyorum-rdp\">4.5 &quot;Uzak masaüstüne bağlanamıyorum&quot; (RDP)\u003c/h2>\n\u003col>\n\u003cli>Hedef bilgisayar açık mı, ağda mı? \u003ccode>ping\u003c/code>\u003c/li>\n\u003cli>Port açık mı? \u003ccode>Test-NetConnection IP -Port 3389\u003c/code>\u003c/li>\n\u003cli>Hedefte: Sistem &gt; Uzak Masaüstü \u003cstrong>açık\u003c/strong> olmalı\u003c/li>\n\u003cli>Kullanıcı &quot;Remote Desktop Users&quot; grubunda mı?\u003c/li>\n\u003cli>Güvenlik duvarı 3389&#39;u engelliyor olabilir\u003c/li>\n\u003cli>Win Home sürümü RDP sunucusu olamaz (Pro ve üstü gerekir)\u003c/li>\n\u003cli>Bağlantı komutu: \u003ccode>mstsc /v:IP\u003c/code>\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-6-paylasilan-klas-re-erisemiyorum\">4.6 &quot;Paylaşılan klasöre erişemiyorum&quot;\u003c/h2>\n\u003col>\n\u003cli>\u003ccode>ping sunucu\u003c/code>, sonra \u003ccode>\\\\sunucu\u003c/code> veya \u003ccode>\\\\IP\u003c/code> yaz\u003c/li>\n\u003cli>Kimlik bilgisi: Windows Kimlik Bilgisi Yöneticisi&#39;nde eski kayıt varsa sil\u003c/li>\n\u003cli>İki izin katmanı vardır, \u003cstrong>ikisi de\u003c/strong> uygun olmalı: Paylaşım izni + NTFS (Güvenlik sekmesi)\u003c/li>\n\u003cli>Ağ sürücüsü bağlama: \u003ccode>net use Z: \\\\sunucu\\paylasim /persistent:yes\u003c/code>\u003c/li>\n\u003cli>Mevcut bağlantıları gör/sil: \u003ccode>net use\u003c/code>, \u003ccode>net use * /delete\u003c/code>\u003c/li>\n\u003cli>SMB portu 445 engelli olabilir\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-7-outlook-e-posta-sorunu\">4.7 &quot;Outlook / e-posta sorunu&quot;\u003c/h2>\n\u003col>\n\u003cli>İnternet var mı? Başka cihazdan webmail çalışıyor mu? (çalışıyorsa sunucu sorunu değil)\u003c/li>\n\u003cli>Outlook&#39;u kapat, \u003ccode>outlook /safe\u003c/code> ile aç (eklenti sorunu mu)\u003c/li>\n\u003cli>Profili yeniden oluştur: Denetim Masası &gt; Posta &gt; Profilleri Göster\u003c/li>\n\u003cli>Posta kutusu dolu mu?\u003c/li>\n\u003cli>Şifre yakın zamanda değiştiyse kayıtlı şifreyi güncelle\u003c/li>\n\u003cli>OST dosyasını yeniden oluştur (eşitleme sorunlarında)\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-8-wi-fi-baglanmiyor-surekli-kopuyor\">4.8 &quot;Wi-Fi bağlanmıyor / sürekli kopuyor&quot;\u003c/h2>\n\u003col>\n\u003cli>Wi-Fi sürücüsünü güncelle veya kaldırıp yeniden yükle\u003c/li>\n\u003cli>Ağı unut, yeniden bağlan\u003c/li>\n\u003cli>\u003ccode>netsh wlan show wlanreport\u003c/code> rapor oluşturur\u003c/li>\n\u003cli>Sinyal zayıfsa AP&#39;ye yakınlaş, kanal çakışması olabilir\u003c/li>\n\u003cli>Güç tasarrufu: Aygıt Yöneticisi &gt; Wi-Fi adaptörü &gt; Güç Yönetimi &gt; &quot;Gücü korumak için kapatabilir&quot; işaretini kaldır\u003c/li>\n\u003cli>2.4 GHz / 5 GHz farkı: 5 GHz hızlı ama menzili kısa\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-9-mavi-ekran-bsod\">4.9 &quot;Mavi ekran (BSOD)&quot;\u003c/h2>\n\u003col>\n\u003cli>Hata kodunu not al (örn. \u003ccode>IRQL_NOT_LESS_OR_EQUAL\u003c/code>, \u003ccode>0x0000007E\u003c/code>)\u003c/li>\n\u003cli>Yeni takılan donanım/sürücü/güncelleme var mı? Geri al\u003c/li>\n\u003cli>Güvenli modda aç (açılışta F8 veya Shift + Yeniden Başlat)\u003c/li>\n\u003cli>\u003ccode>sfc /scannow\u003c/code> ve \u003ccode>DISM /Online /Cleanup-Image /RestoreHealth\u003c/code>\u003c/li>\n\u003cli>RAM testi: \u003ccode>mdsched\u003c/code>\u003c/li>\n\u003cli>Olay Görüntüleyici ve \u003ccode>C:\\Windows\\Minidump\u003c/code> kayıtları\u003c/li>\n\u003cli>Disk (\u003ccode>chkdsk\u003c/code>) ve sıcaklık kontrolü\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-10-bilgisayar-acilmiyor\">4.10 &quot;Bilgisayar açılmıyor&quot;\u003c/h2>\n\u003col>\n\u003cli>Güç kablosu, priz, ekran kablosu, ekran açık mı?\u003c/li>\n\u003cli>Bip sesi/ışık var mı? (BIOS bip kodları RAM/ekran kartı sorununu işaret eder)\u003c/li>\n\u003cli>Çevre birimlerini çıkar (USB, harici disk), sadece güç ve ekranla dene\u003c/li>\n\u003cli>Windows açılmıyorsa: kurtarma ortamı, Başlangıç Onarımı\u003c/li>\n\u003cli>Disk görünmüyorsa BIOS&#39;ta kontrol et, kablo/disk arızası olabilir\u003c/li>\n\u003cli>Veri kritikse \u003cstrong>format atmadan önce\u003c/strong> diski çıkarıp başka bilgisayarla yedekle\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch1 id=\"s-5-windows-sistem-yonetimi\">5. WINDOWS SİSTEM YÖNETİMİ\u003c/h1>\n\u003ch2 id=\"s-5-1-sistem-bilgisi-ve-onarim\">5.1 Sistem bilgisi ve onarım\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Komut\u003c/th>\n\u003cth>Ne yapar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>systeminfo\u003c/code>\u003c/td>\n\u003ctd>Sürüm, RAM, son güncelleme, açılış zamanı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>winver\u003c/code>\u003c/td>\n\u003ctd>Windows sürümü\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>msinfo32\u003c/code>\u003c/td>\n\u003ctd>Ayrıntılı sistem bilgisi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sfc /scannow\u003c/code>\u003c/td>\n\u003ctd>Bozuk sistem dosyalarını onar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DISM /Online /Cleanup-Image /RestoreHealth\u003c/code>\u003c/td>\n\u003ctd>Windows imajını onar (sfc&#39;den önce/sonra)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>chkdsk C: /f /r\u003c/code>\u003c/td>\n\u003ctd>Disk hatası tara ve onar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>gpupdate /force\u003c/code>\u003c/td>\n\u003ctd>Grup ilkelerini hemen uygula\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>gpresult /r\u003c/code>\u003c/td>\n\u003ctd>Uygulanan grup ilkelerini göster\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>whoami\u003c/code> / \u003ccode>whoami /groups\u003c/code>\u003c/td>\n\u003ctd>Mevcut kullanıcı ve grupları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>shutdown /r /t 0\u003c/code>\u003c/td>\n\u003ctd>Hemen yeniden başlat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>shutdown /s /t 60\u003c/code>\u003c/td>\n\u003ctd>60 sn sonra kapat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>shutdown /r /m \\\\PCADI\u003c/code>\u003c/td>\n\u003ctd>Uzaktaki bilgisayarı yeniden başlat\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-5-2-sik-kullanilan-windows-kisayollari-calistir-win-r\">5.2 Sık kullanılan Windows kısayolları (Çalıştır: Win+R)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Yaz\u003c/th>\n\u003cth>Açılan\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>services.msc\u003c/code>\u003c/td>\n\u003ctd>Hizmetler\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>devmgmt.msc\u003c/code>\u003c/td>\n\u003ctd>Aygıt Yöneticisi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>diskmgmt.msc\u003c/code>\u003c/td>\n\u003ctd>Disk Yönetimi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>compmgmt.msc\u003c/code>\u003c/td>\n\u003ctd>Bilgisayar Yönetimi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>eventvwr.msc\u003c/code>\u003c/td>\n\u003ctd>Olay Görüntüleyici\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>lusrmgr.msc\u003c/code>\u003c/td>\n\u003ctd>Yerel kullanıcı ve gruplar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>gpedit.msc\u003c/code>\u003c/td>\n\u003ctd>Yerel grup ilkesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>taskschd.msc\u003c/code>\u003c/td>\n\u003ctd>Görev Zamanlayıcı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ncpa.cpl\u003c/code>\u003c/td>\n\u003ctd>Ağ bağdaştırıcıları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>appwiz.cpl\u003c/code>\u003c/td>\n\u003ctd>Program ekle/kaldır\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sysdm.cpl\u003c/code>\u003c/td>\n\u003ctd>Sistem özellikleri (bilgisayar adı, etki alanı)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>regedit\u003c/code>\u003c/td>\n\u003ctd>Kayıt Defteri (dikkat, yedek al)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mstsc\u003c/code>\u003c/td>\n\u003ctd>Uzak Masaüstü\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cmd\u003c/code> / \u003ccode>powershell\u003c/code>\u003c/td>\n\u003ctd>Komut satırı (yönetici için sağ tık)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>\\\\sunucu\\paylasim\u003c/code>\u003c/td>\n\u003ctd>Ağ paylaşımı\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-5-3-powershell-hizli-komutlar\">5.3 PowerShell hızlı komutlar\u003c/h2>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-Service | Where-Object {$_.Status -eq &quot;Stopped&quot;}   # Duran servisler\nRestart-Service -Name Spooler                            # Servisi yeniden başlat\nGet-Process | Sort-Object CPU -Descending | Select -First 10   # En çok CPU kullananlar\nGet-EventLog -LogName System -Newest 20 -EntryType Error      # Son 20 sistem hatası\nGet-ComputerInfo                                         # Sistem bilgisi\nGet-NetIPConfiguration                                   # IP bilgisi\nGet-Disk; Get-Volume                                     # Disk ve bölümler\nGet-HotFix                                               # Yüklü güncellemeler\nTest-NetConnection google.com -Port 443                  # Port testi\nGet-LocalUser                                            # Yerel kullanıcılar\nRestart-Computer -ComputerName PCADI -Force              # Uzaktan yeniden başlat\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-5-4-olay-g-runtuleyici-event-viewer\">5.4 Olay Görüntüleyici (Event Viewer)\u003c/h2>\n\u003cul>\n\u003cli>Yol: \u003ccode>eventvwr.msc\u003c/code> &gt; Windows Günlükleri &gt; \u003cstrong>System\u003c/strong> / \u003cstrong>Application\u003c/strong> / \u003cstrong>Security\u003c/strong>\u003c/li>\n\u003cli>Önce \u003cstrong>Hata (Error)\u003c/strong> ve \u003cstrong>Kritik\u003c/strong> olanlara bak, sorunun yaşandığı zamana göre filtrele\u003c/li>\n\u003cli>Önemli Olay Kimlikleri (Event ID):\u003cul>\n\u003cli>\u003cstrong>4624\u003c/strong> başarılı oturum açma\u003c/li>\n\u003cli>\u003cstrong>4625\u003c/strong> başarısız oturum açma\u003c/li>\n\u003cli>\u003cstrong>4740\u003c/strong> hesap kilitlendi\u003c/li>\n\u003cli>\u003cstrong>41\u003c/strong> beklenmedik kapanma (Kernel-Power)\u003c/li>\n\u003cli>\u003cstrong>6005 / 6006\u003c/strong> olay günlüğü servisi başladı/durdu (açılış/kapanış)\u003c/li>\n\u003cli>\u003cstrong>7036\u003c/strong> servis durumu değişti\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-5-5-yedekleme-mantigi\">5.5 Yedekleme mantığı\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>3-2-1 kuralı:\u003c/strong> 3 kopya, 2 farklı ortam, 1 tanesi dışarıda (bulut/farklı bina)\u003c/li>\n\u003cli>Yedek alınıyor olması yetmez, \u003cstrong>geri yüklemeyi düzenli test et\u003c/strong>\u003c/li>\n\u003cli>Yedek türleri: Tam (full), Artımlı (incremental, son yedekten beri), Fark (differential, son tamdan beri)\u003c/li>\n\u003cli>Önemli: sunucu yedeği, veritabanı, switch/router config yedeği (TFTP/SCP)\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-6-active-directory-ad-ve-kullanici-yonetimi\">6. ACTIVE DIRECTORY (AD) ve KULLANICI YÖNETİMİ\u003c/h1>\n\u003ch2 id=\"s-6-1-temel-kavramlar\">6.1 Temel kavramlar\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kavram\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Domain (Etki alanı)\u003c/td>\n\u003ctd>Merkezi kullanıcı/bilgisayar yönetimi, ör. \u003ccode>firma.local\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DC (Domain Controller)\u003c/td>\n\u003ctd>AD&#39;yi tutan sunucu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OU\u003c/td>\n\u003ctd>Kullanıcı/bilgisayarları gruplamak için klasör benzeri yapı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Group Policy (GPO)\u003c/td>\n\u003ctd>OU&#39;lara uygulanan ayarlar (şifre kuralı, masaüstü, kısıtlamalar)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Security Group\u003c/td>\n\u003ctd>İzin yönetimi için kullanıcı grubu\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-6-2-gunluk-isler-aduc-dsa-msc\">6.2 Günlük işler (ADUC: \u003ccode>dsa.msc\u003c/code>)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>İş\u003c/th>\n\u003cth>Nasıl\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Yeni kullanıcı\u003c/td>\n\u003ctd>OU&#39;ya sağ tık &gt; New &gt; User, doğru gruplara ekle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Şifre sıfırlama\u003c/td>\n\u003ctd>Kullanıcıya sağ tık &gt; Reset Password\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hesap kilidi açma\u003c/td>\n\u003ctd>Kullanıcı özellikleri &gt; Account &gt; Unlock\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gruba ekleme\u003c/td>\n\u003ctd>Kullanıcı &gt; Member Of &gt; Add\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hesap devre dışı\u003c/td>\n\u003ctd>Sağ tık &gt; Disable Account (silme yerine önce devre dışı bırak)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bilgisayarı domaine alma\u003c/td>\n\u003ctd>\u003ccode>sysdm.cpl\u003c/code> &gt; Değiştir &gt; Etki alanı\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>İşten ayrılan kullanıcı:\u003c/strong> Hesabı sil\u003cstrong>me\u003c/strong>, önce devre dışı bırak, gruplardan çıkar, e-postayı ve dosyaları devret, belirli bir süre sonra sil.\u003c/p>\n\u003ch2 id=\"s-6-3-komut-satiri\">6.3 Komut satırı\u003c/h2>\n\u003cpre>\u003ccode>net user kullanici /domain          # Domain kullanıcı bilgisi\nnet group &quot;Domain Admins&quot; /domain   # Gruptaki kullanıcılar\ngpresult /r                         # Uygulanan GPO'lar\ndcdiag                              # DC sağlık kontrolü (DC üzerinde)\nnltest /dsgetdc:firma.local         # Hangi DC'ye bağlı\nklist purge                         # Kerberos biletlerini temizle\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-6-4-bu-is-istasyonu-ile-etki-alani-guven-iliskisi-basarisiz-hatasi\">6.4 &quot;Bu iş istasyonu ile etki alanı güven ilişkisi başarısız&quot; hatası\u003c/h2>\n\u003cul>\n\u003cli>Bilgisayarın makine hesabı şifresi uyumsuz. Çözüm: yerel yönetici ile girip domain&#39;den çık, workgroup&#39;a geç, yeniden başlat, tekrar domain&#39;e katıl (veya PowerShell: \u003ccode>Reset-ComputerMachinePassword -Credential firma\\yonetici\u003c/code>).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-6-5-dogrulama-guvenlik\">6.5 Doğrulama (güvenlik)\u003c/h2>\n\u003cp>Şifre sıfırlamadan önce kullanıcının kimliğini doğrula (çalışan no, yönetici onayı, geri arama). Bu, en sık kullanılan sosyal mühendislik yöntemidir.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-7-dhcp-ve-dns\">7. DHCP ve DNS\u003c/h1>\n\u003ch2 id=\"s-7-1-dhcp-sureci-dora\">7.1 DHCP süreci (DORA)\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>D\u003c/strong>iscover: istemci &quot;DHCP sunucusu var mı?&quot; der\u003c/li>\n\u003cli>\u003cstrong>O\u003c/strong>ffer: sunucu IP teklif eder\u003c/li>\n\u003cli>\u003cstrong>R\u003c/strong>equest: istemci teklifi ister\u003c/li>\n\u003cli>\u003cstrong>A\u003c/strong>cknowledge: sunucu onaylar\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-7-2-dhcp-sorunlari\">7.2 DHCP sorunları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sorun\u003c/th>\n\u003cth>Kontrol\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IP \u003ccode>169.254.x.x\u003c/code>\u003c/td>\n\u003ctd>DHCP&#39;ye ulaşılamıyor, kablo/VLAN/DHCP servisi kontrol et\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Havuz dolu\u003c/td>\n\u003ctd>DHCP scope&#39;ta boş IP kalmamış, havuzu genişlet veya kira süresini kısalt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Çakışma\u003c/td>\n\u003ctd>Sabit IP&#39;li cihaz DHCP havuzunun içinde, havuzu böl veya \u003cstrong>rezervasyon\u003c/strong> yap\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yanlış IP alıyor\u003c/td>\n\u003ctd>Ağa kaçak router/modem takılmış olabilir (rogue DHCP)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>İpuçları:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Yazıcı, sunucu, kameralar için \u003cstrong>DHCP rezervasyonu\u003c/strong> (MAC&#39;e sabit IP) kullan\u003c/li>\n\u003cli>Sabit IP&#39;leri DHCP aralığının dışında tut\u003c/li>\n\u003cli>\u003ccode>ipconfig /all\u003c/code> içinde &quot;DHCP Server&quot; satırı, IP&#39;yi hangi sunucunun verdiğini gösterir\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-7-3-dns-kayit-turleri\">7.3 DNS kayıt türleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kayıt\u003c/th>\n\u003cth>Görevi\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>İsim → IPv4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AAAA\u003c/td>\n\u003ctd>İsim → IPv6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CNAME\u003c/td>\n\u003ctd>Takma ad (alias)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX\u003c/td>\n\u003ctd>Mail sunucusu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PTR\u003c/td>\n\u003ctd>IP → isim (ters sorgu)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NS\u003c/td>\n\u003ctd>Yetkili DNS sunucusu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TXT\u003c/td>\n\u003ctd>Metin (SPF, doğrulama kayıtları)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SRV\u003c/td>\n\u003ctd>Servis konumu (AD için kritik)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-7-4-dns-sorun-giderme\">7.4 DNS sorun giderme\u003c/h2>\n\u003cpre>\u003ccode>nslookup firma.local              # Domain çözülüyor mu\nnslookup -type=MX firma.com       # Mail kaydı\nnslookup google.com 8.8.8.8       # Belirli sunucudan sor\nipconfig /flushdns                # İstemci önbelleğini temizle\nipconfig /registerdns             # Kaydı yeniden oluştur\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Domain&#39;e bağlı bilgisayarların DNS&#39;i \u003cstrong>domain controller&#39;ı\u003c/strong> göstermeli. İstemciye \u003ccode>8.8.8.8\u003c/code> verirsen domain&#39;i bulamaz.\u003c/li>\n\u003cli>&quot;Ping IP ile çalışıyor, isimle çalışmıyor&quot; = DNS sorunudur.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-8-switch-router-hizli-cisco-komutlari\">8. SWITCH/ROUTER HIZLI CISCO KOMUTLARI\u003c/h1>\n\u003cp>(Detaylı anlatım için \u003ccode>cisco-switch-rehberi.md\u003c/code> dosyasına bak.)\u003c/p>\n\u003ch2 id=\"s-8-1-moda-g-re\">8.1 Moda göre\u003c/h2>\n\u003cpre>\u003ccode>Switch&gt; enable                    # Yönetici moda geç\nSwitch# configure terminal        # Ayar moduna geç\nSwitch(config)# interface fa0/1   # Porta gir\nSwitch(config-if)# end            # Direkt # moduna dön\nSwitch# write memory              # Kaydet\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-8-2-sorun-giderme-show-komutlari\">8.2 Sorun giderme show komutları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Komut\u003c/th>\n\u003cth>Ne gösterir\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>show ip interface brief\u003c/code>\u003c/td>\n\u003ctd>Port ve IP durumu (en çok kullanılan)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show interfaces status\u003c/code>\u003c/td>\n\u003ctd>Port hızı, duplex, VLAN, durum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show interfaces fa0/1\u003c/code>\u003c/td>\n\u003ctd>Port detayı, hata/çarpışma sayaçları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show vlan brief\u003c/code>\u003c/td>\n\u003ctd>VLAN-port ilişkisi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show mac address-table\u003c/code>\u003c/td>\n\u003ctd>Hangi MAC hangi portta (cihazı bulmak için)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show arp\u003c/code>\u003c/td>\n\u003ctd>IP-MAC eşlemesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show running-config\u003c/code>\u003c/td>\n\u003ctd>Çalışan ayarlar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show version\u003c/code>\u003c/td>\n\u003ctd>Model, IOS, çalışma süresi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show cdp neighbors\u003c/code>\u003c/td>\n\u003ctd>Bağlı komşu cihazlar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show logging\u003c/code>\u003c/td>\n\u003ctd>Switch logları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show interfaces trunk\u003c/code>\u003c/td>\n\u003ctd>Trunk portları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>show spanning-tree\u003c/code>\u003c/td>\n\u003ctd>STP durumu\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-8-3-port-isleri\">8.3 Port işleri\u003c/h2>\n\u003cp>\u003cstrong>Bir cihaz hangi porta bağlı?\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>show mac address-table | include 1a2b\n\u003c/code>\u003c/pre>\n\u003cp>(MAC adresinin bir kısmıyla ara)\u003c/p>\n\u003cp>\u003cstrong>Port hata sayaçları:\u003c/strong> \u003ccode>show interfaces fa0/1\u003c/code> çıktısında \u003ccode>CRC\u003c/code>, \u003ccode>input errors\u003c/code> artıyorsa kablo/konnektör sorunu olabilir, duplex uyumsuzluğuna da bak.\u003c/p>\n\u003cp>\u003cstrong>Portu kapat/aç:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>interface fa0/5\n shutdown\n no shutdown\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Port err-disabled (kapanmış) ise:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>interface fa0/5\n shutdown\n no shutdown\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-8-4-duplex-hiz-uyumsuzlugu\">8.4 Duplex/hız uyumsuzluğu\u003c/h2>\n\u003cul>\n\u003cli>Belirti: yavaşlık, çok sayıda hata\u003c/li>\n\u003cli>Her iki uç da \u003ccode>auto\u003c/code> olmalı ya da aynı elle ayar yapılmalı\u003c/li>\n\u003cli>\u003ccode>show interfaces status\u003c/code> ile hız/duplex kontrol et\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-9-linux-temel-komutlar-sunucu\">9. LINUX TEMEL KOMUTLAR (Sunucu)\u003c/h1>\n\u003ch2 id=\"s-9-1-dosya-ve-dizin\">9.1 Dosya ve dizin\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Komut\u003c/th>\n\u003cth>Ne yapar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>pwd\u003c/code>\u003c/td>\n\u003ctd>Bulunduğun dizin\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ls -la\u003c/code>\u003c/td>\n\u003ctd>Dosyaları ayrıntılı listele (gizliler dahil)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cd /yol\u003c/code>\u003c/td>\n\u003ctd>Dizin değiştir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cp kaynak hedef\u003c/code>\u003c/td>\n\u003ctd>Kopyala\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mv kaynak hedef\u003c/code>\u003c/td>\n\u003ctd>Taşı/yeniden adlandır\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>rm dosya\u003c/code>\u003c/td>\n\u003ctd>Sil (\u003cstrong>geri dönüş yok\u003c/strong>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>rm -r klasor\u003c/code>\u003c/td>\n\u003ctd>Klasörü sil (\u003cstrong>dikkat\u003c/strong>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>mkdir klasor\u003c/code>\u003c/td>\n\u003ctd>Klasör oluştur\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cat dosya\u003c/code>\u003c/td>\n\u003ctd>İçeriği göster\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>less dosya\u003c/code>\u003c/td>\n\u003ctd>Sayfa sayfa oku (q ile çık)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tail -f /var/log/syslog\u003c/code>\u003c/td>\n\u003ctd>Logu canlı izle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>grep &quot;aranan&quot; dosya\u003c/code>\u003c/td>\n\u003ctd>Dosyada ara\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>find / -name &quot;dosya&quot;\u003c/code>\u003c/td>\n\u003ctd>Dosya bul\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>nano dosya\u003c/code>\u003c/td>\n\u003ctd>Basit metin editörü (Ctrl+O kaydet, Ctrl+X çık)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-9-2-sistem-ve-surecler\">9.2 Sistem ve süreçler\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Komut\u003c/th>\n\u003cth>Ne yapar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>top\u003c/code> / \u003ccode>htop\u003c/code>\u003c/td>\n\u003ctd>Canlı CPU/RAM kullanımı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>df -h\u003c/code>\u003c/td>\n\u003ctd>Disk doluluğu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>du -sh klasor\u003c/code>\u003c/td>\n\u003ctd>Klasör boyutu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>free -h\u003c/code>\u003c/td>\n\u003ctd>RAM kullanımı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>uptime\u003c/code>\u003c/td>\n\u003ctd>Ne kadar süredir açık\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ps aux | grep isim\u003c/code>\u003c/td>\n\u003ctd>Süreç ara\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>kill PID\u003c/code> / \u003ccode>kill -9 PID\u003c/code>\u003c/td>\n\u003ctd>Süreci sonlandır\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>uname -a\u003c/code>\u003c/td>\n\u003ctd>Çekirdek ve sistem bilgisi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>whoami\u003c/code> / \u003ccode>id\u003c/code>\u003c/td>\n\u003ctd>Kullanıcı ve grup\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>history\u003c/code>\u003c/td>\n\u003ctd>Geçmiş komutlar\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-9-3-servis-y-netimi-systemd\">9.3 Servis yönetimi (systemd)\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">sudo systemctl status nginx        # Durum\nsudo systemctl start nginx         # Başlat\nsudo systemctl stop nginx          # Durdur\nsudo systemctl restart nginx       # Yeniden başlat\nsudo systemctl enable nginx        # Açılışta otomatik başlat\njournalctl -u nginx -n 50          # Servisin son 50 log satırı\njournalctl -xe                     # Son hatalar\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-9-4-ag-linux\">9.4 Ağ (Linux)\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">ip a                  # IP bilgileri (ifconfig yerine)\nip route              # Yönlendirme tablosu\nss -tulpn             # Dinlenen portlar ve süreçler\nping -c 4 adres       # 4 paket ping\ntraceroute adres      # Yol izleme\ndig alan.adi          # DNS sorgusu\ncurl -I https://site  # HTTP başlıklarını getir\nsudo ufw status       # Güvenlik duvarı (Ubuntu)\nsudo ufw allow 22/tcp # Port aç\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-9-5-paket-y-netimi\">9.5 Paket yönetimi\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dağıtım\u003c/th>\n\u003cth>Güncelle\u003c/th>\n\u003cth>Kur\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ubuntu/Debian\u003c/td>\n\u003ctd>\u003ccode>sudo apt update &amp;&amp; sudo apt upgrade\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>sudo apt install paket\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RHEL/CentOS\u003c/td>\n\u003ctd>\u003ccode>sudo dnf update\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>sudo dnf install paket\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-9-6-kullanici-ve-izinler\">9.6 Kullanıcı ve izinler\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">sudo adduser ali                   # Kullanıcı ekle\nsudo passwd ali                    # Şifre belirle\nsudo usermod -aG sudo ali          # sudo yetkisi ver (Ubuntu)\nchmod 755 dosya                    # İzin ayarla\nchown kullanici:grup dosya         # Sahip değiştir\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>İzin sayıları:\u003c/strong> r=4, w=2, x=1. \u003ccode>755\u003c/code> = sahip (rwx), grup (r-x), diğerleri (r-x).\u003c/p>\n\u003ch2 id=\"s-9-7-ssh\">9.7 SSH\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">ssh kullanici@192.168.1.20         # Bağlan\nscp dosya kullanici@ip:/hedef/     # Dosya kopyala\nssh-keygen -t ed25519              # Anahtar çifti üret\nssh-copy-id kullanici@ip           # Genel anahtarı sunucuya kopyala\n\u003c/code>\u003c/pre>\n\u003cp>Güvenlik: root ile SSH girişini kapat, mümkünse anahtar tabanlı kimlik doğrulama kullan.\u003c/p>\n\u003ch2 id=\"s-9-8-onemli-log-dosyalari\">9.8 Önemli log dosyaları\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>/var/log/syslog\u003c/code> veya \u003ccode>/var/log/messages\u003c/code>: genel\u003c/li>\n\u003cli>\u003ccode>/var/log/auth.log\u003c/code>: giriş denemeleri\u003c/li>\n\u003cli>\u003ccode>/var/log/nginx/\u003c/code> ve \u003ccode>/var/log/apache2/\u003c/code>: web sunucusu\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-10-guvenlik-temelleri\">10. GÜVENLİK TEMELLERİ\u003c/h1>\n\u003ch2 id=\"s-10-1-sikca-karsilasilan-tehditler\">10.1 Sıkça karşılaşılan tehditler\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tehdit\u003c/th>\n\u003cth>Önlem\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Phishing (oltalama)\u003c/td>\n\u003ctd>Bağlantı/ekleri kontrol et, gönderici adresine bak, şüpheliyi IT&#39;ye ilet\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fidye yazılımı (ransomware)\u003c/td>\n\u003ctd>Güncel yedek (çevrimdışı kopya dahil), güncelleme, makro kısıtı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Zayıf şifre\u003c/td>\n\u003ctd>Karmaşıklık/uzunluk kuralı, MFA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güncellenmemiş sistem\u003c/td>\n\u003ctd>Düzenli yama yönetimi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sosyal mühendislik\u003c/td>\n\u003ctd>Kimlik doğrulama prosedürü, farkındalık\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yetkisiz cihaz\u003c/td>\n\u003ctd>Port güvenliği, NAC, kayıtlı cihaz listesi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-10-2-supheli-e-posta-virus-suphesi-gelince\">10.2 Şüpheli e-posta/virüs şüphesi gelince\u003c/h2>\n\u003col>\n\u003cli>Kullanıcıya bağlantıya \u003cstrong>tıklamamasını\u003c/strong>/eki açmamasını söyle\u003c/li>\n\u003cli>Tıkladıysa: bilgisayarı \u003cstrong>ağdan ayır\u003c/strong> (kabloyu çek/Wi-Fi kapat), \u003cstrong>kapatma\u003c/strong>\u003c/li>\n\u003cli>Güvenlik sorumlusuna/yöneticiye haber ver\u003c/li>\n\u003cli>Parola değişikliği gerekebilir, tam tarama yap\u003c/li>\n\u003cli>Olayı kaydet (saat, kullanıcı, e-posta başlığı, ekran görüntüsü)\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-10-3-sifre-politikasi-nerisi\">10.3 Şifre politikası önerisi\u003c/h2>\n\u003cul>\n\u003cli>En az 12 karakter, kolay tahmin edilemeyen, her hesap için farklı\u003c/li>\n\u003cli>Mümkün olan her yerde \u003cstrong>MFA (çok faktörlü doğrulama)\u003c/strong>\u003c/li>\n\u003cli>Şifre yöneticisi kullanımı teşvik et\u003c/li>\n\u003cli>Şifreleri e-posta/mesajla düz metin paylaşma\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-10-4-genel-guvenlik-aliskanliklari\">10.4 Genel güvenlik alışkanlıkları\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>En az yetki ilkesi:\u003c/strong> Kullanıcıya sadece işi için gereken yetkiyi ver\u003c/li>\n\u003cli>Yönetici hesabıyla günlük iş yapma, ayrı hesap kullan\u003c/li>\n\u003cli>Ekran kilidi (Win+L), otomatik kilitleme\u003c/li>\n\u003cli>Disk şifreleme (BitLocker), özellikle laptop&#39;larda\u003c/li>\n\u003cli>Kullanılmayan hesap ve portları kapat\u003c/li>\n\u003cli>Yazılımları ve işletim sistemini güncel tut\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-11-donanim-ve-envanter\">11. DONANIM ve ENVANTER\u003c/h1>\n\u003ch2 id=\"s-11-1-hizli-donanim-tanisi\">11.1 Hızlı donanım tanısı\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Belirti\u003c/th>\n\u003cth>Olası neden\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Açılmıyor, ışık yok\u003c/td>\n\u003ctd>Güç kaynağı/kablo/priz\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bip sesleri\u003c/td>\n\u003ctd>RAM/ekran kartı/BIOS (üretici kodlarına bak)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ekran gelmiyor, fan dönüyor\u003c/td>\n\u003ctd>RAM, ekran kablosu, ekran kartı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aşırı ısınma\u003c/td>\n\u003ctd>Toz, fan arızası, macun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disk sesi (tıkırtı)\u003c/td>\n\u003ctd>HDD arızası, \u003cstrong>hemen yedekle\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rastgele kapanma\u003c/td>\n\u003ctd>Isınma, güç kaynağı, RAM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yavaş + disk %100\u003c/td>\n\u003ctd>HDD yaşlanmış, SSD&#39;ye geç\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-11-2-disk-sagligi\">11.2 Disk sağlığı\u003c/h2>\n\u003cul>\n\u003cli>Windows: \u003ccode>wmic diskdrive get status\u003c/code>, CrystalDiskInfo (SMART)\u003c/li>\n\u003cli>Linux: \u003ccode>sudo smartctl -a /dev/sda\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-11-3-envanter-kaydi-icin-tutulmasi-gerekenler\">11.3 Envanter kaydı için tutulması gerekenler\u003c/h2>\n\u003cul>\n\u003cli>Cihaz adı, seri no, model\u003c/li>\n\u003cli>Kullanıcı/zimmet bilgisi, konum\u003c/li>\n\u003cli>IP/MAC adresi\u003c/li>\n\u003cli>Satın alma tarihi, garanti bitişi\u003c/li>\n\u003cli>İşletim sistemi ve önemli yazılımlar\u003c/li>\n\u003cli>Etiketleme: cihaza kolayca okunur bir numara yapıştır\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-12-ticket-ve-iletisim\">12. TICKET ve İLETİŞİM\u003c/h1>\n\u003ch2 id=\"s-12-1-iyi-bir-ticket-kaydi\">12.1 İyi bir ticket kaydı\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Kim:\u003c/strong> kullanıcı, departman, iletişim\u003c/li>\n\u003cli>\u003cstrong>Ne:\u003c/strong> sorunun kısa özeti + hata mesajı\u003c/li>\n\u003cli>\u003cstrong>Ne zaman:\u003c/strong> başlangıç zamanı\u003c/li>\n\u003cli>\u003cstrong>Etki:\u003c/strong> tek kişi mi, birçok kişi mi, iş durdu mu\u003c/li>\n\u003cli>\u003cstrong>Yapılanlar:\u003c/strong> denenen adımlar ve sonuçları\u003c/li>\n\u003cli>\u003cstrong>Çözüm:\u003c/strong> ne yapıldı, neden düzeldi\u003c/li>\n\u003cli>\u003cstrong>Ekler:\u003c/strong> ekran görüntüsü, log\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-12-2-oncelik-mantigi\">12.2 Öncelik mantığı\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Öncelik\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Kritik\u003c/td>\n\u003ctd>Tüm firma internetsiz, sunucu çökmüş, fidye yazılımı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yüksek\u003c/td>\n\u003ctd>Bir departman çalışamıyor, yönetici sorunu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Orta\u003c/td>\n\u003ctd>Tek kullanıcı, işi kısmen etkileniyor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Düşük\u003c/td>\n\u003ctd>Kozmetik, yeni talep, genel soru\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-12-3-kullaniciyla-iletisim\">12.3 Kullanıcıyla iletişim\u003c/h2>\n\u003cul>\n\u003cli>Teknik terim kullanma, sade anlat\u003c/li>\n\u003cli>Ne yapacağını ve tahmini süreyi söyle\u003c/li>\n\u003cli>Çözdükten sonra kullanıcıya \u003cstrong>test ettir\u003c/strong>\u003c/li>\n\u003cli>Bilmediğin bir şeyi bilmiyormuş gibi yapma: &quot;Araştırıp dönüş yapacağım&quot; demek yeterlidir\u003c/li>\n\u003cli>Kullanıcıyı suçlama, sakin ve nazik ol\u003c/li>\n\u003cli>Çözülemeyen işi zamanında üst seviyeye (L2/L3) devret, notlarla birlikte\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-12-4-escalation-yukseltme\">12.4 Escalation (yükseltme)\u003c/h2>\n\u003cp>Şu durumlarda kıdemli birine danış:\u003c/p>\n\u003cul>\n\u003cli>Tüm firmayı etkileyen kesinti\u003c/li>\n\u003cli>Güvenlik olayı şüphesi\u003c/li>\n\u003cli>Veri kaybı riski\u003c/li>\n\u003cli>Yetkin olmadığın bir sistem\u003c/li>\n\u003cli>30–60 dakikada ilerleme sağlayamadığın sorun\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-13-yeni-bir-ortama-uyum-ilk-gunler-icin-kontrol-listesi\">13. YENİ BİR ORTAMA UYUM (İlk Günler İçin Kontrol Listesi)\u003c/h1>\n\u003ch2 id=\"s-13-1-ogrenilmesi-gerekenler\">13.1 Öğrenilmesi gerekenler\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ağ şeması (IP aralıkları, VLAN&#39;lar, switch/router konumları)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Sunucu listesi ve görevleri (DC, dosya, yazdırma, yedek, mail)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yönetici hesapları ve yetki prosedürü (şifreleri nerede, nasıl saklıyorlar)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ticket sistemi ve kullanım şekli\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yedekleme politikası ve nerede tutulduğu\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yazılım lisansları ve envanter\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Acil durum iletişim listesi (ISS, donanım destek, kıdemli yöneticiler)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Mevcut dokümantasyon ve prosedürler\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Hangi işin kime devredileceği\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-13-2-aliskanlik-haline-getir\">13.2 Alışkanlık haline getir\u003c/h2>\n\u003cul>\n\u003cli>Her işlemi not et, kendi bilgi tabanını oluştur\u003c/li>\n\u003cli>Çözdüğün sorunları ekran görüntüsüyle arşivle (tekrar karşına çıkar)\u003c/li>\n\u003cli>Yönetici hesabı şifrelerini asla paylaşma, kendin sakla\u003c/li>\n\u003cli>Anlamadığın şeyi sormaktan çekinme, ama önce araştır ve denediklerini anlat\u003c/li>\n\u003cli>Yapılandırma değiştirmeden önce yedek al\u003c/li>\n\u003cli>Bakım/güncelleme işlerini mesai dışında, haber vererek yap\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-13-3-kendini-gelistirme\">13.3 Kendini geliştirme\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Sertifikalar:\u003c/strong> CompTIA A+, Network+, Security+; Cisco CCNA; Microsoft AZ-900, MD-102 (Endpoint), AZ-104; Linux için LPIC-1/RHCSA\u003c/li>\n\u003cli>\u003cstrong>Ev laboratuvarı:\u003c/strong> Packet Tracer, VirtualBox/VMware ile Windows Server (AD, DHCP, DNS), Linux sunucu, Proxmox\u003c/li>\n\u003cli>\u003cstrong>Pratik:\u003c/strong> Kendi ağında Pi-hole, Nextcloud, Wireguard, izleme (Zabbix, Grafana) kur\u003c/li>\n\u003cli>Öğrendiklerini düzenli notlara ve betik arşivine dönüştür; bir sonraki sorunda zaman kazandırır\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-14-hizli-basvuru-kartlari\">14. HIZLI BAŞVURU KARTLARI\u003c/h1>\n\u003ch2 id=\"s-14-1-hicbir-sey-calismiyor-60-saniye-listesi\">14.1 &quot;Hiçbir şey çalışmıyor&quot; 60 saniye listesi\u003c/h2>\n\u003col>\n\u003cli>Kablo/Wi-Fi bağlı mı?\u003c/li>\n\u003cli>\u003ccode>ipconfig\u003c/code>: IP var mı, \u003ccode>169.254\u003c/code> mü?\u003c/li>\n\u003cli>\u003ccode>ping gateway\u003c/code> → \u003ccode>ping 8.8.8.8\u003c/code> → \u003ccode>ping google.com\u003c/code>\u003c/li>\n\u003cli>\u003ccode>ipconfig /release\u003c/code> → \u003ccode>/flushdns\u003c/code> → \u003ccode>/renew\u003c/code>\u003c/li>\n\u003cli>Yeniden başlat\u003c/li>\n\u003cli>Başka kullanıcılarda da var mı?\u003c/li>\n\u003cli>Son zamanda ne değişti?\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-14-2-en-cok-kullanilan-15-komut\">14.2 En çok kullanılan 15 komut\u003c/h2>\n\u003cpre>\u003ccode>ipconfig /all          ping                  tracert\nnslookup               netstat -ano          arp -a\ngpupdate /force        sfc /scannow          chkdsk\nsysteminfo             tasklist              taskkill /PID x /F\nnet use                net user              shutdown /r /t 0\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-14-3-dosya-kopyalama-ve-ag-paylasimi\">14.3 Dosya kopyalama ve ağ paylaşımı\u003c/h2>\n\u003cpre>\u003ccode>robocopy C:\\kaynak D:\\hedef /E /COPYALL /R:2 /W:2    # Güvenilir kopya (yedek için ideal)\nxcopy kaynak hedef /E /I /H                           # Klasör kopyala\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-14-4-zamanlanmis-g-rev-ve-uzaktan-y-netim\">14.4 Zamanlanmış görev ve uzaktan yönetim\u003c/h2>\n\u003cpre>\u003ccode>schtasks /query                                       # Zamanlanmış görevleri listele\npsexec \\\\PCADI cmd                                    # Uzaktan komut (Sysinternals)\n\u003c/code>\u003c/pre>\n\u003cp>Sysinternals araç seti (Process Explorer, Autoruns, TCPView, PsTools) sistem yöneticisinin vazgeçilmezidir.\u003c/p>\n\u003ch2 id=\"s-14-5-faydali-araclar\">14.5 Faydalı araçlar\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Araç\u003c/th>\n\u003cth>Ne için\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Wireshark\u003c/td>\n\u003ctd>Ağ paket analizi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PuTTY / Windows Terminal\u003c/td>\n\u003ctd>SSH, console, seri bağlantı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advanced IP Scanner / Angry IP Scanner\u003c/td>\n\u003ctd>Ağdaki cihazları tara\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nmap\u003c/td>\n\u003ctd>Port taraması\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WinSCP / FileZilla\u003c/td>\n\u003ctd>SFTP/FTP dosya aktarımı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TeamViewer / AnyDesk / Quick Assist\u003c/td>\n\u003ctd>Uzak destek\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CrystalDiskInfo\u003c/td>\n\u003ctd>Disk sağlığı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rufus / Ventoy\u003c/td>\n\u003ctd>Önyüklenebilir USB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sysinternals Suite\u003c/td>\n\u003ctd>Gelişmiş Windows araçları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Zabbix / PRTG / LibreNMS\u003c/td>\n\u003ctd>Ağ izleme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Notepad++ / VS Code\u003c/td>\n\u003ctd>Metin ve config düzenleme\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003chr>\n\u003cblockquote>\n\u003cp>\u003cstrong>Not:\u003c/strong> Komutları üretim ortamında çalıştırmadan önce test ortamında dene. Silme, format, toplu değişiklik gibi geri dönüşü olmayan işlerde mutlaka yedek al ve onay iste. Şirketin kendi prosedürleri bu rehberden önceliklidir.\u003c/p>\n\u003c/blockquote>\n","sections":[{"id":"s-it-destek-cep-rehberi-ag-sistem-altyapi","title":"IT Destek Cep Rehberi: Ağ, Sistem, Altyapı","level":1,"path":"","isTitle":true,"text":"IT destek ve sistem yönetimi çalışanları için hızlı başvuru notları. Önce neyi kontrol edeceğini, sonra hangi komutu yazacağını bul. Yeni başlayanlar için öğretici, deneyimliler için hatırlatıcı olacak şekilde hazırlanmıştır.\nAltın kurallar\nDeğiştirmeden önce mevcut durumu not al (ekran görüntüsü, ipconfig /all, config yedeği).\nAynı anda tek şey değiştir, sonra test et.\nYetkin olmayan, geri dönüşü olmayan işi (silme, format, toplu değişiklik) onaysız yapma.\nHer işlemi ticket'a yaz: ne gördün, ne yaptın, sonuç ne oldu."},{"id":"s-1-sorun-giderme-yaklasimi","title":"1. SORUN GİDERME YAKLAŞIMI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-1-1-once-sorular-kullaniciya","title":"1.1 Önce sorular (kullanıcıya)","level":2,"path":"1. SORUN GİDERME YAKLAŞIMI","isTitle":false,"text":"Tam olarak ne oluyor? Hata mesajı var mı? (ekran görüntüsü iste)\nNe zaman başladı? Öncesinde ne değişti? (güncelleme, yeni program, taşınma)\nSadece sende mi, başkalarında da var mı?\nDaha önce çalışıyor muydu?\nBilgisayarı yeniden başlattın mı?"},{"id":"s-1-2-katman-katman-ilerle-osi-mantigi","title":"1.2 Katman katman ilerle (OSI mantığı)","level":2,"path":"1. SORUN GİDERME YAKLAŞIMI","isTitle":false,"text":"Sıra\nKontrol\nNasıl\n1. Fiziksel\nKablo, port ışığı, Wi-Fi bağlı mı\nKabloyu çıkar tak, başka porta tak\n2. Ağ
