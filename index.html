003ctd>Teknik destek\u003c/td>\n\u003ctd>Daha derin analiz, yerinde müdahale, sunucu/ağ kontrolleri\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>L3\u003c/td>\n\u003ctd>Uzman/mühendis\u003c/td>\n\u003ctd>Karmaşık sorunlar, tasarım, kök neden\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tedarikçi\u003c/td>\n\u003ctd>Üçüncü taraf\u003c/td>\n\u003ctd>Garanti, donanım, yazılım üreticisi desteği\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>L1&#39;de \u003cstrong>doğru bilgiyi toplamak\u003c/strong> ve \u003cstrong>doğru kişiye devretmek\u003c/strong> en önemli iş.\u003c/p>\n\u003ch2 id=\"s-3-oncelik-matrisi\">3. Öncelik Matrisi\u003c/h2>\n\u003cp>Öncelik = \u003cstrong>Etki × Aciliyet\u003c/strong>\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Aciliyet: Yüksek\u003c/th>\n\u003cth>Orta\u003c/th>\n\u003cth>Düşük\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Etki: Tüm firma/kritik hizmet\u003c/strong>\u003c/td>\n\u003ctd>P1 Kritik\u003c/td>\n\u003ctd>P1/P2\u003c/td>\n\u003ctd>P2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Etki: Departman\u003c/strong>\u003c/td>\n\u003ctd>P2 Yüksek\u003c/td>\n\u003ctd>P2/P3\u003c/td>\n\u003ctd>P3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Etki: Tek kullanıcı\u003c/strong>\u003c/td>\n\u003ctd>P3 Orta\u003c/td>\n\u003ctd>P3\u003c/td>\n\u003ctd>P4 Düşük\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Öncelik\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003cth>Örnek hedef süre (kuruma göre değişir)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Sunucu çöktü, internet yok, fidye yazılımı\u003c/td>\n\u003ctd>Anında müdahale\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Bir departman çalışamıyor\u003c/td>\n\u003ctd>Birkaç saat içinde\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P3\u003c/td>\n\u003ctd>Tek kullanıcı sorunu\u003c/td>\n\u003ctd>Aynı/ertesi iş günü\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P4\u003c/td>\n\u003ctd>Bilgi/talep, kozmetik\u003c/td>\n\u003ctd>Plana göre\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Kullanıcının &quot;acil&quot; demesi önceliği tek başına belirlemez.\u003c/strong> Etkiyi sor.\u003c/p>\n\u003ch2 id=\"s-4-sla-kavramlari\">4. SLA Kavramları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Terim\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>SLA\u003c/td>\n\u003ctd>Müşteriyle yapılan hizmet seviyesi sözleşmesi (yanıt/çözüm süresi)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OLA\u003c/td>\n\u003ctd>Firma içi ekipler arası seviye anlaşması\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UC (Underpinning Contract)\u003c/td>\n\u003ctd>Tedarikçiyle sözleşme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>İlk yanıt süresi\u003c/td>\n\u003ctd>Kullanıcıya ilk dönüşün süresi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Çözüm süresi\u003c/td>\n\u003ctd>Kaydın kapanma süresi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ölçümler\u003c/td>\n\u003ctd>İlk temasta çözüm oranı (FCR), yeniden açılma oranı, memnuniyet (CSAT), ortalama çözüm süresi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-5-iyi-ticket-yazimi\">5. İyi Ticket Yazımı\u003c/h2>\n\u003ch3 id=\"s-5-1-ticket-sablonu\">5.1 Ticket şablonu\u003c/h3>\n\u003cpre>\u003ccode>BAŞLIK: [Kısa ve net] Örn: &quot;Muhasebe 3. kat yazıcısı ağdan erişilemiyor&quot;\n\nKİM: Ad Soyad, departman, konum, iletişim\nNE ZAMAN BAŞLADI: tarih-saat\nSORUN: Ne oluyor, hata mesajı (aynen), ekran görüntüsü\nETKİ: Kaç kişi, iş durdu mu\nDAHA ÖNCE ÇALIŞIYOR MUYDU: evet/hayır, son değişiklik\nYAPILAN ADIMLAR:\n  1. ...\n  2. ...\nSONUÇ/ÇÖZÜM: ne yapıldı, neden düzeldi\nDOĞRULAMA: kullanıcı test etti mi\nKAPANIŞ NOTU: kök neden / öneri\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-5-2-kurallar\">5.2 Kurallar\u003c/h3>\n\u003cul>\n\u003cli>Başlık sorunu anlatsın (&quot;Sorun var&quot; yetersiz)\u003c/li>\n\u003cli>Hata mesajını \u003cstrong>kopyala\u003c/strong>, tahmin yazma\u003c/li>\n\u003cli>Her işlemi zaman sırasıyla yaz (başkası devralabilsin)\u003c/li>\n\u003cli>Çözümü yazmadan kapatma\u003c/li>\n\u003cli>Kullanıcıya \u003cstrong>kapatmadan önce\u003c/strong> teyit ettir\u003c/li>\n\u003cli>Aynı sorun 3. kez geliyorsa \u003cstrong>Problem\u003c/strong> kaydı aç\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-6-degisiklik-y-netimi-change-management\">6. Değişiklik Yönetimi (Change Management)\u003c/h2>\n\u003ch3 id=\"s-6-1-degisiklik-turleri\">6.1 Değişiklik türleri\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tür\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Standard\u003c/td>\n\u003ctd>Önceden onaylı, düşük riskli, rutin\u003c/td>\n\u003ctd>Yeni kullanıcı oluşturma, yazıcı sürücü yükleme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Normal\u003c/td>\n\u003ctd>İnceleme ve onay ister\u003c/td>\n\u003ctd>Switch yapılandırması, sunucu güncellemesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Emergency\u003c/td>\n\u003ctd>Acil, hızlandırılmış onay\u003c/td>\n\u003ctd>Aktif güvenlik açığına yama\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-6-2-degisiklik-talep-sablonu\">6.2 Değişiklik talep şablonu\u003c/h3>\n\u003cpre>\u003ccode>DEĞİŞİKLİK TALEBİ\nNo / Tarih:\nTalep eden:\nBaşlık:\nAmaç/Gerekçe:\nEtkilenen sistem ve kullanıcılar:\nRisk (düşük/orta/yüksek) ve olası etkisi:\nPlanlanan tarih ve saat (bakım penceresi):\nUygulama adımları:\n  1. ...\nTest/doğrulama adımları:\nGeri dönüş (rollback) planı:\n  - Yedek/snapshot alındı mı:\n  - Geri dönüş adımları:\nBilgilendirilecek kişiler:\nOnaylayan(lar): ...\nSonuç (başarılı/başarısız/geri alındı):\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-6-3-altin-kurallar\">6.3 Altın kurallar\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Yedek/snapshot al\u003c/strong>, geri dönüş planın olmadan başlama\u003c/li>\n\u003cli>Mesai dışı veya bakım penceresinde yap (mümkünse)\u003c/li>\n\u003cli>Aynı anda tek büyük değişiklik\u003c/li>\n\u003cli>Etkilenen kullanıcıları \u003cstrong>önceden\u003c/strong> bilgilendir\u003c/li>\n\u003cli>Sonucu ve gerçek süreyi kaydet\u003c/li>\n\u003cli>Cuma akşamı büyük değişiklik yapma\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-7-olay-sonrasi-inceleme-blameless-post-mortem\">7. Olay Sonrası İnceleme (Blameless Post-Mortem)\u003c/h2>\n\u003cp>Ciddi kesintilerden sonra suçlu aramadan \u003cstrong>neden olduğuna\u003c/strong> ve \u003cstrong>nasıl önleriz\u003c/strong>e bakılır.\u003c/p>\n\u003cpre>\u003ccode>OLAY SONRASI İNCELEME\nOlay özeti:\nEtki: (kim, ne kadar süre, iş etkisi)\nZaman çizelgesi:\nKök neden:\nNeyi iyi yaptık:\nNeyi daha iyi yapabilirdik:\nÖnleyici aksiyonlar: (kim, ne zamana kadar)\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-8-bilgi-tabani-knowledge-base-makale-sablonu\">8. Bilgi Tabanı (Knowledge Base) Makale Şablonu\u003c/h2>\n\u003cpre>\u003ccode>BAŞLIK: Outlook sürekli şifre soruyor\nGEÇERLİ OLDUĞU YER: Windows 10/11, Microsoft 365 Outlook\nBELİRTİ: Kullanıcı sürekli kimlik bilgisi penceresi görüyor\nNEDEN: Eski/bozuk kayıtlı kimlik bilgisi veya modern kimlik doğrulama sorunu\nÇÖZÜM:\n  1. Outlook'u kapat\n  2. Denetim Masası &gt; Kimlik Bilgisi Yöneticisi &gt; Windows Kimlik Bilgileri\n  3. &quot;MicrosoftOffice&quot; ve &quot;Outlook&quot; ile ilgili kayıtları sil\n  4. Outlook'u aç, yeniden giriş yap\nDOĞRULAMA: Outlook şifre sormadan açılıyor\nDAHA ÖNCE KARŞILAŞILAN: Ticket #1234\nEKLER / EKRAN GÖRÜNTÜSÜ: ...\nSON GÜNCELLEME: tarih / yazar\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Alışkanlık:\u003c/strong> İlk kez çözdüğün her önemli sorunu 5 dakikada makaleye çevir. Bir yıl sonra en değerli varlığın olur.\u003c/p>\n\u003ch2 id=\"s-9-standart-operasyon-proseduru-sop-runbook-sablonu\">9. Standart Operasyon Prosedürü (SOP) / Runbook Şablonu\u003c/h2>\n\u003cpre>\u003ccode>PROSEDÜR: Yeni kullanıcı oluşturma\nAMAÇ:\nKİMLER KULLANIR:\nÖN KOŞULLAR: (onay, yetki, gerekli bilgi)\nADIMLAR:\n  1. ...\n  2. ...\n  3. ...\nDOĞRULAMA: (nasıl anlaşılır ki iş tamam)\nSORUN OLURSA: (kime başvurulur, hangi log)\nİLGİLİ BELGELER:\nSON GÜNCELLEME / SÜRÜM:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-10-ise-giris-cikis-kontrol-listeleri\">10. İşe Giriş / Çıkış Kontrol Listeleri\u003c/h2>\n\u003ch3 id=\"s-10-1-yeni-calisan-it-tarafi\">10.1 Yeni çalışan (IT tarafı)\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> İK/yönetici onayı ve bilgi formu alındı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kullanıcı hesabı (AD/Entra) oluşturuldu, doğru gruplar eklendi\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> E-posta ve lisans atandı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Bilgisayar/telefon hazırlandı (kurulum, imaj, güncellemeler, şifreleme)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Gerekli yazılımlar ve erişimler (paylaşımlar, uygulamalar, VPN) verildi\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yazıcı, telefon hattı, kart/rozet\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> MFA ve şifre politikası anlatıldı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Zimmet formu imzalandı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kısa oryantasyon: destek nasıl istenir (ticket, telefon)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ticket kapatıldı\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-10-2-ayrilan-calisan\">10.2 Ayrılan çalışan\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ayrılış tarihi ve talep onayı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Hesap engellendi, oturumlar iptal, şifre sıfırlandı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> E-posta/OneDrive verisi yöneticiye devredildi\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Gruplar ve erişimler kaldırıldı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Cihazlar iade alındı, veri aktarıldı, cihaz silindi/yeniden kuruldu\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Telefon, kart, anahtar, token, VPN, üçüncü taraf hesaplar\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Lisanslar serbest bırakıldı (veri devri sonrası)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Envanter güncellendi\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-10-3-yeni-bilgisayar-kurulum-kontrol-listesi\">10.3 Yeni bilgisayar kurulum kontrol listesi\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Doğru imaj/işletim sistemi, güncellemeler\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Bilgisayar adı standardı, domain/Entra katılımı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Sürücüler, BIOS/UEFI güncellemesi, TPM ve Secure Boot\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> BitLocker açık, kurtarma anahtarı kaydedildi\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Antivirüs/EDR, güvenlik duvarı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Standart yazılım paketi (Office, tarayıcı, PDF, VPN, uzak destek ajanı)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yazıcılar ve ağ sürücüleri\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yerel yönetici şifresi (LAPS) ve kullanıcı yetkisi (standart)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Envanter kaydı, etiket\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-11-varlik-envanter-y-netimi\">11. Varlık/Envanter Yönetimi\u003c/h2>\n\u003ch3 id=\"s-11-1-yasam-d-ngusu\">11.1 Yaşam döngüsü\u003c/h3>\n\u003cp>\u003cstrong>Satın alma → Kurulum/dağıtım → Kullanım/bakım → Yenileme → Hurdaya ayırma\u003c/strong>\u003c/p>\n\u003ch3 id=\"s-11-2-envanter-tablosu-sablonu\">11.2 Envanter tablosu şablonu\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Alan\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Varlık no\u003c/td>\n\u003ctd>PC-0042\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tür/Model\u003c/td>\n\u003ctd>Dizüstü, Dell Latitude\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Seri no\u003c/td>\n\u003ctd>...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Zimmetli kişi / konum\u003c/td>\n\u003ctd>Ali Veli, Muhasebe\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP / MAC\u003c/td>\n\u003ctd>192.168.1.42 / ...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>İşletim sistemi\u003c/td>\n\u003ctd>Windows 11 Pro\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Alış tarihi / garanti bitişi\u003c/td>\n\u003ctd>...\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Durum\u003c/td>\n\u003ctd>Kullanımda / depoda / arızalı / hurda\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Notlar\u003c/td>\n\u003ctd>RAM yükseltmesi yapıldı\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-11-3-guvenli-imha\">11.3 Güvenli imha\u003c/h3>\n\u003cul>\n\u003cli>Disk silme: standartlara uygun güvenli silme (NIST 800-88) ya da fiziksel imha\u003c/li>\n\u003cli>Sadece &quot;sil + biçimlendir&quot; yetmez\u003c/li>\n\u003cli>Silme/imha belgesi tut, e-atık yönetmeliğine uy\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-11-4-lisans-takibi\">11.4 Lisans takibi\u003c/h3>\n\u003cul>\n\u003cli>Hangi yazılım, kaç lisans, kimde, ne zaman bitiyor\u003c/li>\n\u003cli>Kullanılmayan lisansı geri al (maliyet)\u003c/li>\n\u003cli>Lisanssız yazılım kullanımı hukuki risktir\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-12-dokumantasyon-neler-mutlaka-bulunmali\">12. Dokümantasyon: Neler Mutlaka Bulunmalı\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Belge\u003c/th>\n\u003cth>İçerik\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ağ şeması\u003c/td>\n\u003ctd>Cihazlar, bağlantılar, VLAN&#39;lar (draw.io / diagrams.net ile çizilebilir)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP planı\u003c/td>\n\u003ctd>Alt ağlar, VLAN&#39;lar, DHCP aralıkları, sabit IP&#39;ler\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sunucu envanteri\u003c/td>\n\u003ctd>Ad, rol, IP, işletim sistemi, sorumlu, yedek durumu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kimlik bilgisi kasası\u003c/td>\n\u003ctd>Şifre yöneticisi (Bitwarden, KeePass), \u003cstrong>Excel/Word&#39;de değil\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yedek planı\u003c/td>\n\u003ctd>Ne, ne zaman, nereye, saklama, geri yükleme prosedürü\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Felaket kurtarma planı\u003c/td>\n\u003ctd>Öncelik sırası, iletişim, adımlar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tedarikçi iletişimi\u003c/td>\n\u003ctd>ISS, donanım desteği, lisans sağlayıcı, sözleşme bitiş tarihleri\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prosedürler/SOP\u003c/td>\n\u003ctd>Tekrarlanan işlerin adımları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Değişiklik günlüğü\u003c/td>\n\u003ctd>Ne zaman, kim, ne değiştirdi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-12-1-ip-plani-rnegi\">12.1 IP planı örneği\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ağ / VLAN\u003c/th>\n\u003cth>Alt ağ\u003c/th>\n\u003cth>Ağ geçidi\u003c/th>\n\u003cth>DHCP\u003c/th>\n\u003cth>Sabit IP aralığı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Yönetim (VLAN 1/99)\u003c/td>\n\u003ctd>192.168.1.0/24\u003c/td>\n\u003ctd>.1\u003c/td>\n\u003ctd>Yok\u003c/td>\n\u003ctd>.2 - .50\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanıcı (VLAN 10)\u003c/td>\n\u003ctd>192.168.10.0/24\u003c/td>\n\u003ctd>.1\u003c/td>\n\u003ctd>.100 - .200\u003c/td>\n\u003ctd>.2 - .99\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sunucu (VLAN 20)\u003c/td>\n\u003ctd>192.168.20.0/24\u003c/td>\n\u003ctd>.1\u003c/td>\n\u003ctd>Yok\u003c/td>\n\u003ctd>.2 - .254\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Misafir (VLAN 30)\u003c/td>\n\u003ctd>192.168.30.0/24\u003c/td>\n\u003ctd>.1\u003c/td>\n\u003ctd>.50 - .200\u003c/td>\n\u003ctd>Yok\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-12-2-isimlendirme-standardi-rnegi\">12.2 İsimlendirme standardı örneği\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tür\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bilgisayar\u003c/td>\n\u003ctd>\u003ccode>PC-MUH-001\u003c/code>, \u003ccode>NB-IT-007\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sunucu\u003c/td>\n\u003ctd>\u003ccode>SRV-DC01\u003c/code>, \u003ccode>SRV-FILE01\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Switch\u003c/td>\n\u003ctd>\u003ccode>SW-K1-01\u003c/code> (kat 1, no 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yazıcı\u003c/td>\n\u003ctd>\u003ccode>PRN-K2-MUH\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanıcı adı\u003c/td>\n\u003ctd>\u003ccode>ad.soyad\u003c/code> veya \u003ccode>asoyad\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Standart \u003cstrong>tutarlı\u003c/strong> olmalı; ilk günden belirle.\u003c/p>\n\u003ch2 id=\"s-13-kesinti-duyuru-sablonlari\">13. Kesinti Duyuru Şablonları\u003c/h2>\n\u003ch3 id=\"s-13-1-plansiz-kesinti\">13.1 Plansız kesinti\u003c/h3>\n\u003cpre>\u003ccode>Konu: [BİLGİ] İnternet bağlantısında kesinti\n\nMerhaba,\nSaat 10:15 itibarıyla firmamızda internet erişiminde kesinti yaşanmaktadır.\nIT ekibi konuyu inceliyor. Şu an iç ağ ve dosya paylaşımları etkilenmemektedir.\nBir sonraki bilgilendirme: 11:00.\nBu süreçte telefon hattıyla ve ticket sistemi üzerinden destek alabilirsiniz.\n\nIT Destek\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-13-2-planli-bakim\">13.2 Planlı bakım\u003c/h3>\n\u003cpre>\u003ccode>Konu: [PLANLI BAKIM] 25 Ekim Cumartesi 22:00-24:00 sunucu bakımı\n\nMerhaba,\n25 Ekim Cumartesi 22:00-24:00 arasında dosya sunucusunda güncelleme yapılacaktır.\nBu sürede paylaşılan klasörlere erişilemeyecektir.\nLütfen açık dosyalarınızı Cumartesi 21:30'a kadar kaydedip kapatın.\nBir sorun olursa: it@firma.com\n\nIT Destek\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-13-3-c-zum-bildirimi\">13.3 Çözüm bildirimi\u003c/h3>\n\u003cpre>\u003ccode>Konu: [ÇÖZÜLDÜ] İnternet bağlantısı normale döndü\n\nMerhaba,\n10:15'te başlayan internet kesintisi 11:40 itibarıyla giderilmiştir.\nNeden: Hizmet sağlayıcı kaynaklı hat sorunu.\nSorun devam ederse lütfen ticket açın.\n\nIT Destek\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-14-ticket-itsm-araclari\">14. Ticket / ITSM Araçları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Araç\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>GLPI\u003c/strong>\u003c/td>\n\u003ctd>Açık kaynak, ticket + envanter, Türkiye&#39;de yaygın; ev laboratuvarında kurup öğrenmek için ideal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Jira Service Management\u003c/td>\n\u003ctd>Yaygın, esnek, SLA ve iş akışı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Freshservice / Freshdesk\u003c/td>\n\u003ctd>Bulut tabanlı, kolay\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ServiceNow\u003c/td>\n\u003ctd>Büyük kurumsal ITSM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Zendesk\u003c/td>\n\u003ctd>Müşteri desteği odaklı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>osTicket / Znuny (OTRS)\u003c/td>\n\u003ctd>Açık kaynak alternatifler\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Hangisi olursa olsun mantık aynı: kategori, öncelik, atama, SLA, durum, çözüm notu, bilgi tabanı.\u003c/p>\n\u003ch2 id=\"s-15-sertifika-ogrenme\">15. Sertifika / Öğrenme\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>ITIL 4 Foundation:\u003c/strong> Süreç kavramları ve iş dünyasında ortak dil\u003c/li>\n\u003cli>Microsoft/CompTIA sertifikaları teknik tarafı, ITIL süreç tarafını tamamlar\u003c/li>\n\u003cli>Kendi notlarını düzenli tut: yarın &quot;dün ne yaptım&quot; sorusuna cevap verebil\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-16-surec-aliskanliklari-ozeti\">16. Süreç Alışkanlıkları Özeti\u003c/h2>\n\u003col>\n\u003cli>Her şey ticket&#39;ta başlar, ticket&#39;ta biter\u003c/li>\n\u003cli>Önce yedek, sonra değişiklik\u003c/li>\n\u003cli>Önemli çözümü bilgi tabanına yaz\u003c/li>\n\u003cli>Tekrar eden sorun = problem kaydı\u003c/li>\n\u003cli>Değişiklikte geri dönüş planı\u003c/li>\n\u003cli>Kullanıcıyı bilgilendir, kapatmadan önce teyit et\u003c/li>\n\u003cli>Şifreleri kasada tut, kimseyle paylaşma\u003c/li>\n\u003cli>Dokümantasyonu güncel tut, eskimiş belge, belge yokluğundan kötüdür\u003c/li>\n\u003c/ol>\n","sections":[{"id":"s-itil-surec-y-netimi-ve-dokumantasyon-rehberi","title":"ITIL, Süreç Yönetimi ve Dokümantasyon Rehberi","level":1,"path":"","isTitle":true,"text":"Ticket, değişiklik, envanter, bilgi tabanı ve şablonlar\nTeknik bilgi kadar düzenli çalışmak da IT desteğin değerini belirler. Bu rehber süreç kavramlarını ve kopyala-kullan şablonları içerir."},{"id":"s-1-temel-surec-kavramlari-itil-mantigi","title":"1. Temel Süreç Kavramları (ITIL Mantığı)","level":2,"path":"","isTitle":false,"text":"Süreç\nSoru\nÖrnek\nIncident (Olay)\nBir şey bozuldu, hizmeti ne kadar çabuk geri getiririz?\n\"Yazıcı çalışmıyor\"\nService Request (Hizmet talebi)\nStandart bir şey isteniyor\n\"Yeni kullanıcı hesabı\", \"VPN erişimi\"\nProblem\nTekrar eden olayların kök nedeni ne?\n\"Her pazartesi VPN düşüyor, neden?\"\nChange (Değişiklik)\nÜretim ortamında bir şeyi güvenle nasıl değiştiririz?\n\"Switch firmware güncellemesi\"\nKnowledge (Bilgi)\nÇözümü kayıt altına alıp paylaş\nBilgi tabanı makalesi\nFark: Incident = ateşi söndür. Problem = yangının neden çıktığını bul. Change = yapıyı güvenle değiştir."},{"id":"s-2-destek-seviyeleri","title":"2. Destek Seviyeleri","level":2,"path":"","isTitle":false,"text":"Seviye\nKim\nİş\nL1 (Service Desk)\nİlk karşılama\nKayıt aç, bilinen çözümleri uygula, yönlendir\nL2\nTeknik destek\nDaha derin analiz, yerinde müdahale, sunucu/ağ kontrolleri\nL3\nUzman/mühendis\nKarmaşık sorunlar, tasarım, kök neden\nTedarikçi\nÜçüncü taraf\nGaranti, donanım, yazılım üreticisi desteği\nL1'de doğru bilgiyi toplamak ve doğru kişiye devretmek en önemli iş."},{"id":"s-3-oncelik-matrisi","title":"3. Öncelik Matrisi","level":2,"path":"","isTitle":false,"text":"Öncelik = Etki × Aciliyet\nAciliyet: Yüksek\nOrta\nDüşük\nEtki: Tüm firma/kritik hizmet\nP1 Kritik\nP1/P2\nP2\nEtki: Departman\nP2 Yüksek\nP2/P3\nP3\nEtki: Tek kullanıcı\nP3 Orta\nP3\nP4 Düşük\nÖncelik\nÖrnek\nÖrnek hedef süre (kuruma göre değişir)\nP1\nSunucu çöktü, internet yok, fidye yazılımı\nAnında müdahale\nP2\nBir departman çalışamıyor\nBirkaç saat içinde\nP3\nTek kullanıcı sorunu\nAynı/ertesi iş günü\nP4\nBilgi/talep, kozmetik\nPlana göre\nKullanıcının \"acil\" demesi önceliği tek başına belirlemez. Etkiyi sor."},{"id":"s-4-sla-kavramlari","title":"4. SLA Kavramları","level":2,"path":"","isTitle":false,"text":"Terim\nAnlamı\nSLA\nMüşteriyle yapılan hizmet seviyesi sözleşmesi (yanıt/çözüm süresi)\nOLA\nFirma içi ekipler arası seviye anlaşması\nUC (Underpinning Contract)\nTedarikçiyle sözleşme\nİlk yanıt süresi\nKullanıcıya ilk dönüşün süresi\nÇözüm süresi\nKaydın kapanma süresi\nÖlçümler\nİlk temasta çözüm oranı (FCR), yeniden açılma oranı, memnuniyet (CSAT), ortalama çözüm süresi"},{"id":"s-5-iyi-ticket-yazimi","title":"5. İyi Ticket Yazımı","level":2,"path":"","isTitle":false,"text":""},{"id":"s-5-1-ticket-sablonu","title":"5.1 Ticket şablonu","level":3,"path":"5. İyi Ticket Yazımı","isTitle":false,"text":"BAŞLIK: [Kısa ve net] Örn: \"Muhasebe 3. kat yazıcısı ağdan erişilemiyor\"\nKİM: Ad Soyad, departman, konum, iletişim\nNE ZAMAN BAŞLADI: tarih-saat\nSORUN: Ne oluyor, hata mesajı (aynen), ekran görüntüsü\nETKİ: Kaç kişi, iş durdu mu\nDAHA ÖNCE ÇALIŞIYOR MUYDU: evet/hayır, son değişiklik\nYAPILAN ADIMLAR:\n  1. ...\n  2. ...\nSONUÇ/ÇÖZÜM: ne yapıldı, neden düzeldi\nDOĞRULAMA: kullanıcı test etti mi\nKAPANIŞ NOTU: kök neden / öneri"},{"id":"s-5-2-kurallar","title":"5.2 Kurallar","level":3,"path":"5. İyi Ticket Yazımı","isTitle":false,"text":"Başlık sorunu anlatsın (\"Sorun var\" yetersiz)\nHata mesajını kopyala, tahmin yazma\nHer işlemi zaman sırasıyla yaz (başkası devralabilsin)\nÇözümü yazmadan kapatma\nKullanıcıya kapatmadan önce teyit ettir\nAynı sorun 3. kez geliyorsa Problem kaydı aç"},{"id":"s-6-degisiklik-y-netimi-change-management","title":"6. Değişiklik Yönetimi (Change Management)","level":2,"path":"","isTitle":false,"text":""},{"id":"s-6-1-degisiklik-turleri","title":"6.1 Değişiklik türleri","level":3,"path":"6. Değişiklik Yönetimi (Change Management)","isTitle":false,"text":"Tür\nAnlamı\nÖrnek\nStandard\nÖnceden onaylı, düşük riskli, rutin\nYeni kullanıcı oluşturma, yazıcı sürücü yükleme\nNormal\nİnceleme ve onay ister\nSwitch yapılandırması, sunucu güncellemesi\nEmergency\nAcil, hızlandırılmış onay\nAktif güvenlik açığına yama"},{"id":"s-6-2-degisiklik-talep-sablonu","title":"6.2 Değişiklik talep şablonu","level":3,"path":"6. Değişiklik Yönetimi (Change Management)","isTitle":false,"text":"DEĞİŞİKLİK TALEBİ\nNo / Tarih:\nTalep eden:\nBaşlık:\nAmaç/Gerekçe:\nEtkilenen sistem ve kullanıcılar:\nRisk (düşük/orta/yüksek) ve olası etkisi:\nPlanlanan tarih ve saat (bakım penceresi):\nUygulama adımları:\n  1. ...\nTest/doğrulama adımları:\nGeri dönüş (rollback) planı:\n  - Yedek/snapshot alındı mı:\n  - Geri dönüş adımları:\nBilgilendirilecek kişiler:\nOnaylayan(lar): ...\nSonuç (başarılı/başarısız/geri alındı):"},{"id":"s-6-3-altin-kurallar","title":"6.3 Altın kurallar","level":3,"path":"6. Değişiklik Yönetimi (Change Management)","isTitle":false,"text":"Yedek/snapshot al, geri dönüş planın olmadan başlama\nMesai dışı veya bakım penceresinde yap (mümkünse)\nAynı anda tek büyük değişiklik\nEtkilenen kullanıcıları önceden bilgilendir\nSonucu ve gerçek süreyi kaydet\nCuma akşamı büyük değişiklik yapma"},{"id":"s-7-olay-sonrasi-inceleme-blameless-post-mortem","title":"7. Olay Sonrası İnceleme (Blameless Post-Mortem)","level":2,"path":"","isTitle":false,"text":"Ciddi kesintilerden sonra suçlu aramadan neden olduğuna ve nasıl önlerize bakılır.\nOLAY SONRASI İNCELEME\nOlay özeti:\nEtki: (kim, ne kadar süre, iş etkisi)\nZaman çizelgesi:\nKök neden:\nNeyi iyi yaptık:\nNeyi daha iyi yapabilirdik:\nÖnleyici aksiyonlar: (kim, ne zamana kadar)"},{"id":"s-8-bilgi-tabani-knowledge-base-makale-sablonu","title":"8. Bilgi Tabanı (Knowledge Base) Makale Şablonu","level":2,"path":"","isTitle":false,"text":"BAŞLIK: Outlook sürekli şifre soruyor\nGEÇERLİ OLDUĞU YER: Windows 10/11, Microsoft 365 Outlook\nBELİRTİ: Kullanıcı sürekli kimlik bilgisi penceresi görüyor\nNEDEN: Eski/bozuk kayıtlı kimlik bilgisi veya modern kimlik doğrulama sorunu\nÇÖZÜM:\n  1. Outlook'u kapat\n  2. Denetim Masası > Kimlik Bilgisi Yöneticisi > Windows Kimlik Bilgileri\n  3. \"MicrosoftOffice\" ve \"Outlook\" ile ilgili kayıtları sil\n  4. Outlook'u aç, yeniden giriş yap\nDOĞRULAMA: Outlook şifre sormadan açılıyor\nDAHA ÖNCE KARŞILAŞILAN: Ticket #1234\nEKLER / EKRAN GÖRÜNTÜSÜ: ...\nSON GÜNCELLEME: tarih / yazar\nAlışkanlık: İlk kez çözdüğün her önemli sorunu 5 dakikada makaleye çevir. Bir yıl sonra en değerli varlığın olur."},{"id":"s-9-standart-operasyon-proseduru-sop-runbook-sablonu","title":"9. Standart Operasyon Prosedürü (SOP) / Runbook Şablonu","level":2,"path":"","isTitle":false,"text":"PROSEDÜR: Yeni kullanıcı oluşturma\nAMAÇ:\nKİMLER KULLANIR:\nÖN KOŞULLAR: (onay, yetki, gerekli bilgi)\nADIMLAR:\n  1. ...\n  2. ...\n  3. ...\nDOĞRULAMA: (nasıl anlaşılır ki iş tamam)\nSORUN OLURSA: (kime başvurulur, hangi log)\nİLGİLİ BELGELER:\nSON GÜNCELLEME / SÜRÜM:"},{"id":"s-10-ise-giris-cikis-kontrol-listeleri","title":"10. İşe Giriş / Çıkış Kontrol Listeleri","level":2,"path":"","isTitle":false,"text":""},{"id":"s-10-1-yeni-calisan-it-tarafi","title":"10.1 Yeni çalışan (IT tarafı)","level":3,"path":"10. İşe Giriş / Çıkış Kontrol Listeleri","isTitle":false,"text":"İK/yönetici onayı ve bilgi formu alındı\n Kullanıcı hesabı (AD/Entra) oluşturuldu, doğru gruplar eklendi\n E-posta ve lisans atandı\n Bilgisayar/telefon hazırlandı (kurulum, imaj, güncellemeler, şifreleme)\n Gerekli yazılımlar ve erişimler (paylaşımlar, uygulamalar, VPN) verildi\n Yazıcı, telefon hattı, kart/rozet\n MFA ve şifre politikası anlatıldı\n Zimmet formu imzalandı\n Kısa oryantasyon: destek nasıl istenir (ticket, telefon)\n Ticket kapatıldı"},{"id":"s-10-2-ayrilan-calisan","title":"10.2 Ayrılan çalışan","level":3,"path":"10. İşe Giriş / Çıkış Kontrol Listeleri","isTitle":false,"text":"Ayrılış tarihi ve talep onayı\n Hesap engellendi, oturumlar iptal, şifre sıfırlandı\n E-posta/OneDrive verisi yöneticiye devredildi\n Gruplar ve erişimler kaldırıldı\n Cihazlar iade alındı, veri aktarıldı, cihaz silindi/yeniden kuruldu\n Telefon, kart, anahtar, token, VPN, üçüncü taraf hesaplar\n Lisanslar serbest bırakıldı (veri devri sonrası)\n Envanter güncellendi"},{"id":"s-10-3-yeni-bilgisayar-kurulum-kontrol-listesi","title":"10.3 Yeni bilgisayar kurulum kontrol listesi","level":3,"path":"10. İşe Giriş / Çıkış Kontrol Listeleri","isTitle":false,"text":"Doğru imaj/işletim sistemi, güncellemeler\n Bilgisayar adı standardı, domain/Entra katılımı\n Sürücüler, BIOS/UEFI güncellemesi, TPM ve Secure Boot\n BitLocker açık, kurtarma anahtarı kaydedildi\n Antivirüs/EDR, güvenlik duvarı\n Standart yazılım paketi (Office, tarayıcı, PDF, VPN, uzak destek ajanı)\n Yazıcılar ve ağ sürücüleri\n Yerel yönetici şifresi (LAPS) ve kullanıcı yetkisi (standart)\n Envanter kaydı, etiket"},{"id":"s-11-varlik-envanter-y-netimi","title":"11. Varlık/Envanter Yönetimi","level":2,"path":"","isTitle":false,"text":""},{"id":"s-11-1-yasam-d-ngusu","title":"11.1 Yaşam döngüsü","level":3,"path":"11. Varlık/Envanter Yönetimi","isTitle":false,"text":"Satın alma → Kurulum/dağıtım → Kullanım/bakım → Yenileme → Hurdaya ayırma"},{"id":"s-11-2-envanter-tablosu-sablonu","title":"11.2 Envanter tablosu şablonu","level":3,"path":"11. Varlık/Envanter Yönetimi","isTitle":false,"text":"Alan\nÖrnek\nVarlık no\nPC-0042\nTür/Model\nDizüstü, Dell Latitude\nSeri no\n...\nZimmetli kişi / konum\nAli Veli, Muhasebe\nIP / MAC\n192.168.1.42 / ...\nİşletim sistemi\nWindows 11 Pro\nAlış tarihi / garanti bitişi\n...\nDurum\nKullanımda / depoda / arızalı / hurda\nNotlar\nRAM yükseltmesi yapıldı"},{"id":"s-11-3-guvenli-imha","title":"11.3 Güvenli imha","level":3,"path":"11. Varlık/Envanter Yönetimi","isTitle":false,"text":"Disk silme: standartlara uygun güvenli silme (NIST 800-88) ya da fiziksel imha\nSadece \"sil + biçimlendir\" yetmez\nSilme/imha belgesi tut, e-atık yönetmeliğine uy"},{"id":"s-11-4-lisans-takibi","title":"11.4 Lisans takibi","level":3,"path":"11. Varlık/Envanter Yönetimi","isTitle":false,"text":"Hangi yazılım, kaç lisans, kimde, ne zaman bitiyor\nKullanılmayan lisansı geri al (maliyet)\nLisanssız yazılım kullanımı hukuki risktir"},{"id":"s-12-dokumantasyon-neler-mutlaka-bulunmali","title":"12. Dokümantasyon: Neler Mutlaka Bulunmalı","level":2,"path":"","isTitle":false,"text":"Belge\nİçerik\nAğ şeması\nCihazlar, bağlantılar, VLAN'lar (draw.io / diagrams.net ile çizilebilir)\nIP planı\nAlt ağlar, VLAN'lar, DHCP aralıkları, sabit IP'ler\nSunucu envanteri\nAd, rol, IP, işletim sistemi, sorumlu, yedek durumu\nKimlik bilgisi kasası\nŞifre yöneticisi (Bitwarden, KeePass), Excel/Word'de değil\nYedek planı\nNe, ne zaman, nereye, saklama, geri yükleme prosedürü\nFelaket kurtarma planı\nÖncelik sırası, iletişim, adımlar\nTedarikçi iletişimi\nISS, donanım desteği, lisans sağlayıcı, sözleşme bitiş tarihleri\nProsedürler/SOP\nTekrarlanan işlerin adımları\nDeğişiklik günlüğü\nNe zaman, kim, ne değiştirdi"},{"id":"s-12-1-ip-plani-rnegi","title":"12.1 IP planı örneği","level":3,"path":"12. Dokümantasyon: Neler Mutlaka Bulunmalı","isTitle":false,"text":"Ağ / VLAN\nAlt ağ\nAğ geçidi\nDHCP\nSabit IP aralığı\nYönetim (VLAN 1/99)\n192.168.1.0/24\n.1\nYok\n.2 - .50\nKullanıcı (VLAN 10)\n192.168.10.0/24\n.1\n.100 - .200\n.2 - .99\nSunucu (VLAN 20)\n192.168.20.0/24\n.1\nYok\n.2 - .254\nMisafir (VLAN 30)\n192.168.30.0/24\n.1\n.50 - .200\nYok"},{"id":"s-12-2-isimlendirme-standardi-rnegi","title":"12.2 İsimlendirme standardı örneği","level":3,"path":"12. Dokümantasyon: Neler Mutlaka Bulunmalı","isTitle":false,"text":"Tür\nÖrnek\nBilgisayar\nPC-MUH-001, NB-IT-007\nSunucu\nSRV-DC01, SRV-FILE01\nSwitch\nSW-K1-01 (kat 1, no 1)\nYazıcı\nPRN-K2-MUH\nKullanıcı adı\nad.soyad veya asoyad\nStandart tutarlı olmalı; ilk günden belirle."},{"id":"s-13-kesinti-duyuru-sablonlari","title":"13. Kesinti Duyuru Şablonları","level":2,"path":"","isTitle":false,"text":""},{"id":"s-13-1-plansiz-kesinti","title":"13.1 Plansız kesinti","level":3,"path":"13. Kesinti Duyuru Şablonları","isTitle":false,"text":"Konu: [BİLGİ] İnternet bağlantısında kesinti\nMerhaba,\nSaat 10:15 itibarıyla firmamızda internet erişiminde kesinti yaşanmaktadır.\nIT ekibi konuyu inceliyor. Şu an iç ağ ve dosya paylaşımları etkilenmemektedir.\nBir sonraki bilgilendirme: 11:00.\nBu süreçte telefon hattıyla ve ticket sistemi üzerinden destek alabilirsiniz.\nIT Destek"},{"id":"s-13-2-planli-bakim","title":"13.2 Planlı bakım","level":3,"path":"13. Kesinti Duyuru Şablonları","isTitle":false,"text":"Konu: [PLANLI BAKIM] 25 Ekim Cumartesi 22:00-24:00 sunucu bakımı\nMerhaba,\n25 Ekim Cumartesi 22:00-24:00 arasında dosya sunucusunda güncelleme yapılacaktır.\nBu sürede paylaşılan klasörlere erişilemeyecektir.\nLütfen açık dosyalarınızı Cumartesi 21:30'a kadar kaydedip kapatın.\nBir sorun olursa: it@firma.com\nIT Destek"},{"id":"s-13-3-c-zum-bildirimi","title":"13.3 Çözüm bildirimi","level":3,"path":"13. Kesinti Duyuru Şablonları","isTitle":false,"text":"Konu: [ÇÖZÜLDÜ] İnternet bağlantısı normale döndü\nMerhaba,\n10:15'te başlayan internet kesintisi 11:40 itibarıyla giderilmiştir.\nNeden: Hizmet sağlayıcı kaynaklı hat sorunu.\nSorun devam ederse lütfen ticket açın.\nIT Destek"},{"id":"s-14-ticket-itsm-araclari","title":"14. Ticket / ITSM Araçları","level":2,"path":"","isTitle":false,"text":"Araç\nNot\nGLPI\nAçık kaynak, ticket + envanter, Türkiye'de yaygın; ev laboratuvarında kurup öğrenmek için ideal\nJira Service Management\nYaygın, esnek, SLA ve iş akışı\nFreshservice / Freshdesk\nBulut tabanlı, kolay\nServiceNow\nBüyük kurumsal ITSM\nZendesk\nMüşteri desteği odaklı\nosTicket / Znuny (OTRS)\nAçık kaynak alternatifler\nHangisi olursa olsun mantık aynı: kategori, öncelik, atama, SLA, durum, çözüm notu, bilgi tabanı."},{"id":"s-15-sertifika-ogrenme","title":"15. Sertifika / Öğrenme","level":2,"path":"","isTitle":false,"text":"ITIL 4 Foundation: Süreç kavramları ve iş dünyasında ortak dil\nMicrosoft/CompTIA sertifikaları teknik tarafı, ITIL süreç tarafını tamamlar\nKendi notlarını düzenli tut: yarın \"dün ne yaptım\" sorusuna cevap verebil"},{"id":"s-16-surec-aliskanliklari-ozeti","title":"16. Süreç Alışkanlıkları Özeti","level":2,"path":"","isTitle":false,"text":"Her şey ticket'ta başlar, ticket'ta biter\nÖnce yedek, sonra değişiklik\nÖnemli çözümü bilgi tabanına yaz\nTekrar eden sorun = problem kaydı\nDeğişiklikte geri dönüş planı\nKullanıcıyı bilgilendir, kapatmadan önce teyit et\nŞifreleri kasada tut, kimseyle paylaşma\nDokümantasyonu güncel tut, eskimiş belge, belge yokluğundan kötüdür"}]},{"slug":"yonetim","file":"09-bt-yonetimi-operasyon-rehberi.md","title":"BT Yönetimi ve Operasyon Rehberi","short":"BT Yönetimi ve Operasyon","desc":"SLA/KPI, onboarding/offboarding, varlık yönetimi, BCP/DRP süreklilik planı, bütçe","words":1776,"html":"\u003ch1 id=\"s-bt-y-netimi-ve-operasyon-rehberi\">BT Yönetimi ve Operasyon Rehberi\u003c/h1>\n\u003cp>BT ekibini yöneten, süreç kuran ya da küçük/orta ölçekli bir kurumda BT&#39;yi tek başına yürüten kişiler için pratik yönetim notları. Teknik detaylar için diğer rehberlere, süreçlerin temeli için \u003ccode>05-itil-surec-dokumantasyon-rehberi.md\u003c/code> dosyasına bak.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-1-bt-nin-deger-onerisi\">1. BT&#39;NİN DEĞER ÖNERİSİ\u003c/h1>\n\u003cp>BT, \u003cstrong>işin sürekliliğini\u003c/strong> sağlayan bir hizmet sağlayıcıdır. Başarı ölçütü kaç ticket kapandığı değil, \u003cstrong>iş birimlerinin kesintisiz çalışmasıdır\u003c/strong>.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rol\u003c/th>\n\u003cth>Odak\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Destek (L1/L2)\u003c/td>\n\u003ctd>Hızlı çözüm, iyi iletişim\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sistem/ağ yöneticisi\u003c/td>\n\u003ctd>Altyapı sağlığı, güvenlik, yedek\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BT yöneticisi\u003c/td>\n\u003ctd>Strateji, bütçe, risk, ekip, tedarikçi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güvenlik sorumlusu\u003c/td>\n\u003ctd>Risk azaltma, olay yönetimi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003chr>\n\u003ch1 id=\"s-2-hizmet-katalogu-ve-sla\">2. HİZMET KATALOĞU VE SLA\u003c/h1>\n\u003ch2 id=\"s-2-1-hizmet-katalogu\">2.1 Hizmet kataloğu\u003c/h2>\n\u003cp>Kullanıcıların \u003cstrong>ne isteyebileceğini\u003c/strong> ve \u003cstrong>ne kadar sürede\u003c/strong> alacağını tanımla:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Hizmet\u003c/th>\n\u003cth>Örnek hedef süre\u003c/th>\n\u003cth>Sahibi\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Şifre sıfırlama\u003c/td>\n\u003ctd>15 dakika\u003c/td>\n\u003ctd>Destek\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yeni kullanıcı hesabı\u003c/td>\n\u003ctd>1 iş günü\u003c/td>\n\u003ctd>Destek + İK onayı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yeni bilgisayar kurulumu\u003c/td>\n\u003ctd>2 iş günü\u003c/td>\n\u003ctd>Destek\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yazılım talebi\u003c/td>\n\u003ctd>3 iş günü (onaylı listede)\u003c/td>\n\u003ctd>Destek + yönetici\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Uzaktan erişim (VPN)\u003c/td>\n\u003ctd>1 iş günü\u003c/td>\n\u003ctd>Ağ yöneticisi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-2-2-sla-rnek-tablosu\">2.2 SLA örnek tablosu\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Öncelik\u003c/th>\n\u003cth>Tanım\u003c/th>\n\u003cth>İlk yanıt\u003c/th>\n\u003cth>Çözüm hedefi\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>P1 Kritik\u003c/td>\n\u003ctd>Tüm kurum etkileniyor, iş durdu\u003c/td>\n\u003ctd>15 dk\u003c/td>\n\u003ctd>4 saat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2 Yüksek\u003c/td>\n\u003ctd>Bir departman çalışamıyor\u003c/td>\n\u003ctd>1 saat\u003c/td>\n\u003ctd>8 saat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P3 Orta\u003c/td>\n\u003ctd>Tek kullanıcı, kısmi etki\u003c/td>\n\u003ctd>4 saat\u003c/td>\n\u003ctd>2 iş günü\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P4 Düşük\u003c/td>\n\u003ctd>Soru, kozmetik, talep\u003c/td>\n\u003ctd>1 iş günü\u003c/td>\n\u003ctd>5 iş günü\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>SLA&#39;yı \u003cstrong>ölçemiyorsan\u003c/strong> sözleşmek anlamsız. Önce ticket sisteminde zamanı ölç.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch1 id=\"s-3-olcumler-kpi\">3. ÖLÇÜMLER (KPI)\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Gösterge\u003c/th>\n\u003cth>Nasıl hesaplanır\u003c/th>\n\u003cth>Ne söyler\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>İlk yanıt süresi\u003c/td>\n\u003ctd>Açılıştan ilk yanıta\u003c/td>\n\u003ctd>Kullanıcı ilgi görüyor mu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Çözüm süresi (MTTR)\u003c/td>\n\u003ctd>Açılıştan çözüme ortalama\u003c/td>\n\u003ctd>Operasyon hızı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SLA uyum oranı\u003c/td>\n\u003ctd>SLA içinde kapanan / toplam\u003c/td>\n\u003ctd>Hizmet güvenilirliği\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>İlk temasta çözüm oranı\u003c/td>\n\u003ctd>Tek seferde çözülen / toplam\u003c/td>\n\u003ctd>Bilgi ve yetki kalitesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tekrar eden ticket\u003c/td>\n\u003ctd>Aynı konuda tekrar\u003c/td>\n\u003ctd>Kök neden çözülmüyor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanıcı memnuniyeti (CSAT)\u003c/td>\n\u003ctd>Kapanış anketi\u003c/td>\n\u003ctd>Algılanan kalite\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Açık ticket yaşı\u003c/td>\n\u003ctd>Bekleyen işlerin ortalama yaşı\u003c/td>\n\u003ctd>Birikme riski\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Değişiklik başarı oranı\u003c/td>\n\u003ctd>Sorunsuz değişiklik / toplam\u003c/td>\n\u003ctd>Süreç olgunluğu\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Uyarı:\u003c/strong> Sayıları tek başına hedef yapma. &quot;Çok ticket kapatmak&quot; için kalitesiz çözüm üretilebilir. Metrikleri \u003cstrong>birlikte\u003c/strong> oku.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-4-ise-giris-cikis-onboarding-offboarding\">4. İŞE GİRİŞ – ÇIKIŞ (ONBOARDING / OFFBOARDING)\u003c/h1>\n\u003ch2 id=\"s-4-1-ise-giris-akisi\">4.1 İşe giriş akışı\u003c/h2>\n\u003col>\n\u003cli>İK, başlangıç tarihinden \u003cstrong>en az 5 iş günü önce\u003c/strong> talep açar (ad, bölüm, yönetici, ünvan, gerekli yetkiler).\u003c/li>\n\u003cli>BT hesap, e-posta, lisans, cihaz ve yetkileri hazırlar.\u003c/li>\n\u003cli>Zimmet tutanağı imzalanır, envantere işlenir.\u003c/li>\n\u003cli>İlk gün: şifre/MFA, güvenlik farkındalığı, destek kanalları tanıtılır.\u003c/li>\n\u003cli>Kapanış: yönetici her şeyin çalıştığını onaylar.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-2-isten-ayrilis-akisi\">4.2 İşten ayrılış akışı\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Zaman\u003c/th>\n\u003cth>Yapılacak\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ayrılıştan önce\u003c/td>\n\u003ctd>Devredilecek veri, posta yönlendirme, ekipman listesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ayrılış anı\u003c/td>\n\u003ctd>Hesap devre dışı, oturumlar kapat, MFA iptal, VPN/uzaktan erişim kaldır\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sonrası\u003c/td>\n\u003ctd>Cihaz teslim al, güvenli sil, lisansı geri al, zimmeti kapat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>30–90 gün\u003c/td>\n\u003ctd>Posta/dosya arşivi sonrası hesabı sil (politikaya göre)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>Kurumun \u003cstrong>en sık atlanan güvenlik açığı\u003c/strong>, ayrılan çalışanın aktif kalan hesaplarıdır. İK ile otomatik bildirim kur.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch1 id=\"s-5-varlik-yonetimi\">5. VARLIK YÖNETİMİ\u003c/h1>\n\u003ch2 id=\"s-5-1-neleri-takip-et\">5.1 Neleri takip et\u003c/h2>\n\u003cul>\n\u003cli>Donanım: bilgisayar, sunucu, ağ cihazı, yazıcı, telefon\u003c/li>\n\u003cli>Yazılım ve lisans: sürüm, adet, bitiş tarihi, sahibi\u003c/li>\n\u003cli>Bulut abonelikleri: kim ödüyor, kim yönetiyor\u003c/li>\n\u003cli>Alan adları ve sertifikalar: \u003cstrong>bitiş tarihleri\u003c/strong>\u003c/li>\n\u003cli>Yedekler ve kritik anahtarlar (konumu, sahibi)\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-5-2-tablo-sablonu-donanim-envanteri\">5.2 Tablo şablonu (donanım envanteri)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Alan\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Varlık no\u003c/td>\n\u003ctd>IST-LT-0042\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tür / model\u003c/td>\n\u003ctd>Laptop / ThinkPad T14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Seri no\u003c/td>\n\u003ctd>ABC1234\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanıcı / zimmet\u003c/td>\n\u003ctd>Ad Soyad (Muhasebe)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Konum\u003c/td>\n\u003ctd>İstanbul, 2. kat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Satın alma / garanti\u003c/td>\n\u003ctd>2025-03 / 2028-03\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Durum\u003c/td>\n\u003ctd>Kullanımda / Depoda / Bakımda / Hurda\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Not\u003c/td>\n\u003ctd>Değişim planı: 2029\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-5-3-yasam-d-ngusu\">5.3 Yaşam döngüsü\u003c/h2>\n\u003cp>Planla → Satın al → Hazırla → Kullan → Bakım → Yenile → \u003cstrong>Güvenli elden çıkar\u003c/strong>. Her cihazın bir \u003cstrong>sahibi\u003c/strong> ve bir \u003cstrong>planlı yenileme tarihi\u003c/strong> olsun.\u003c/p>\n\u003ch2 id=\"s-5-4-sertifika-ve-lisans-bitisleri\">5.4 Sertifika ve lisans bitişleri\u003c/h2>\n\u003cp>Kurumlarda beklenmedik kesintilerin en sık nedenlerinden biri \u003cstrong>süresi dolan sertifika, alan adı veya lisanstır.\u003c/strong> Takvim hatırlatıcısı kur (60/30/7 gün önce).\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-6-is-surekliligi-ve-felaket-kurtarma\">6. İŞ SÜREKLİLİĞİ VE FELAKET KURTARMA\u003c/h1>\n\u003ch2 id=\"s-6-1-temel-kavramlar\">6.1 Temel kavramlar\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Terim\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>RTO\u003c/strong> (Recovery Time Objective)\u003c/td>\n\u003ctd>Servisin en geç ne kadar sürede geri gelmesi gerekir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>RPO\u003c/strong> (Recovery Point Objective)\u003c/td>\n\u003ctd>En fazla ne kadar veri kaybı kabul edilebilir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BIA\u003c/td>\n\u003ctd>İş etki analizi: hangi sistem durursa ne kaybedilir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BCP\u003c/td>\n\u003ctd>İş sürekliliği planı (işin devamı)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DRP\u003c/td>\n\u003ctd>Felaket kurtarma planı (BT sistemlerini geri getirme)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-6-2-sistem-ncelik-tablosu-rnek\">6.2 Sistem öncelik tablosu (örnek)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sistem\u003c/th>\n\u003cth>RTO\u003c/th>\n\u003cth>RPO\u003c/th>\n\u003cth>Yedek yöntemi\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Kimlik (AD/Entra)\u003c/td>\n\u003ctd>2 saat\u003c/td>\n\u003ctd>1 saat\u003c/td>\n\u003ctd>Sistem durumu + 2. DC\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-posta\u003c/td>\n\u003ctd>4 saat\u003c/td>\n\u003ctd>0 (bulut)\u003c/td>\n\u003ctd>M365 + üçüncü parti yedek\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ERP/Finans\u003c/td>\n\u003ctd>4 saat\u003c/td>\n\u003ctd>1 saat\u003c/td>\n\u003ctd>Veritabanı + VM yedeği\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosya sunucusu\u003c/td>\n\u003ctd>8 saat\u003c/td>\n\u003ctd>24 saat\u003c/td>\n\u003ctd>Günlük yedek + gölge kopya\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Web sitesi\u003c/td>\n\u003ctd>24 saat\u003c/td>\n\u003ctd>24 saat\u003c/td>\n\u003ctd>Haftalık yedek\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-6-3-felaket-kurtarma-testi\">6.3 Felaket kurtarma testi\u003c/h2>\n\u003cul>\n\u003cli>Yılda en az bir kez \u003cstrong>geri yükleme testi\u003c/strong> yap, süreyi ölç.\u003c/li>\n\u003cli>Test sonucunu ve çıkan aksaklıkları yaz, planı güncelle.\u003c/li>\n\u003cli>Test senaryoları: tek dosya, tek sunucu, tüm ortam (masa başı tatbikat).\u003c/li>\n\u003cli>Yedeklerin \u003cstrong>bir kopyası ağdan ve ana yönetici hesaplarından bağımsız\u003c/strong> (offline/immutable) olsun.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>&quot;Yedeğimiz var&quot; ile &quot;geri yükleyebiliyoruz&quot; aynı şey değildir.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch1 id=\"s-7-degisiklik-risk-ve-bakim\">7. DEĞİŞİKLİK, RİSK VE BAKIM\u003c/h1>\n\u003ch2 id=\"s-7-1-degisiklik-y-netimi-zeti\">7.1 Değişiklik yönetimi özeti\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tür\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003cth>Onay\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Standart\u003c/td>\n\u003ctd>Yeni kullanıcı, rutin yama\u003c/td>\n\u003ctd>Önceden onaylı, hızlı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Normal\u003c/td>\n\u003ctd>Sunucu güncellemesi, yeni sistem\u003c/td>\n\u003ctd>Değişiklik kaydı + onay\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Acil\u003c/td>\n\u003ctd>Güvenlik yaması, çöken sistemin onarımı\u003c/td>\n\u003ctd>Hızlandırılmış onay, sonradan inceleme\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Her değişiklikte: \u003cstrong>ne, neden, ne zaman, etkisi, geri alma planı, test planı.\u003c/strong>\u003c/p>\n\u003ch2 id=\"s-7-2-risk-kaydi\">7.2 Risk kaydı\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Risk\u003c/th>\n\u003cth>Olasılık\u003c/th>\n\u003cth>Etki\u003c/th>\n\u003cth>Önlem\u003c/th>\n\u003cth>Sahibi\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Yedek sunucusu arızası\u003c/td>\n\u003ctd>Orta\u003c/td>\n\u003ctd>Yüksek\u003c/td>\n\u003ctd>İkinci kopya, izleme\u003c/td>\n\u003ctd>Sistem yön.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tek kişiye bağımlılık\u003c/td>\n\u003ctd>Yüksek\u003c/td>\n\u003ctd>Yüksek\u003c/td>\n\u003ctd>Dokümantasyon, çapraz eğitim\u003c/td>\n\u003ctd>BT yöneticisi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sertifika süresi dolması\u003c/td>\n\u003ctd>Orta\u003c/td>\n\u003ctd>Orta\u003c/td>\n\u003ctd>Takvim hatırlatıcı\u003c/td>\n\u003ctd>Ağ yön.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fidye yazılımı\u003c/td>\n\u003ctd>Orta\u003c/td>\n\u003ctd>Çok yüksek\u003c/td>\n\u003ctd>Yedek, MFA, eğitim, yama\u003c/td>\n\u003ctd>Güvenlik\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-7-3-planli-bakim\">7.3 Planlı bakım\u003c/h2>\n\u003cul>\n\u003cli>Bakım pencerelerini önceden duyur (ne, ne zaman, etkisi).\u003c/li>\n\u003cli>Bakım öncesi yedek ve geri dönüş planı.\u003c/li>\n\u003cli>Bakım sonrası doğrulama ve duyuru.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-8-dokumantasyon-ve-bilgi-tabani\">8. DOKÜMANTASYON VE BİLGİ TABANI\u003c/h1>\n\u003cul>\n\u003cli>\u003cstrong>Runbook:\u003c/strong> Sık yapılan işlerin adım adım prosedürü (yeni kullanıcı, yedek geri yükleme).\u003c/li>\n\u003cli>\u003cstrong>Ağ şeması, IP planı, sunucu listesi:\u003c/strong> Güncel tutulan temel kayıtlar.\u003c/li>\n\u003cli>\u003cstrong>Bilgi tabanı (KB):\u003c/strong> Çözülen sorunlar; kullanıcıya self-servis makaleler.\u003c/li>\n\u003cli>\u003cstrong>Acil durum rehberi:\u003c/strong> Kritik arıza ve güvenlik olayında kimi arayacaksın.\u003c/li>\n\u003cli>\u003cstrong>Kimlik bilgileri:\u003c/strong> Şifre yöneticisi/kasa (Bitwarden, KeePass, Keeper, Vault) kullan; dokümana düz yazma.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>Tek kişide duran bilgi bir risktir. &quot;Otobüs faktörü&quot;: Bir kişi yarın ayrılsa BT çalışmaya devam eder mi?\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch1 id=\"s-9-tedarikci-ve-sozlesme-yonetimi\">9. TEDARİKÇİ VE SÖZLEŞME YÖNETİMİ\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Konu\u003c/th>\n\u003cth>Dikkat\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>SLA ve destek saatleri\u003c/td>\n\u003ctd>7/24 mi, mesai içi mi? Yanıt ve çözüm süreleri\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yenileme tarihleri\u003c/td>\n\u003ctd>Otomatik yenileme ve fesih bildirim süresi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yedek tedarikçi\u003c/td>\n\u003ctd>Kritik hizmetlerde alternatif\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Veri konumu ve KVKK\u003c/td>\n\u003ctd>Veri nerede, kimde, sözleşmede ne yazıyor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Acil iletişim\u003c/td>\n\u003ctd>Bir isim ve telefon, genel destek hattı yetmez\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Performans gözden geçirme\u003c/td>\n\u003ctd>Üç/altı aylık değerlendirme\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003chr>\n\u003ch1 id=\"s-10-butce-ve-planlama\">10. BÜTÇE VE PLANLAMA\u003c/h1>\n\u003ch2 id=\"s-10-1-butce-kalemleri\">10.1 Bütçe kalemleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kalem\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Donanım yenileme\u003c/td>\n\u003ctd>Bilgisayar, sunucu, ağ cihazı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lisanslar ve abonelikler\u003c/td>\n\u003ctd>M365, antivirüs/EDR, yedekleme, izleme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Altyapı ve hizmet\u003c/td>\n\u003ctd>İnternet hatları, bulut, güvenli e-posta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güvenlik\u003c/td>\n\u003ctd>EDR, MFA, güvenlik duvarı, eğitim, sızma testi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Eğitim ve personel\u003c/td>\n\u003ctd>Sertifika, kurs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Beklenmeyen\u003c/td>\n\u003ctd>Arıza yedeği (%5–10)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-10-2-planlama-ipuclari\">10.2 Planlama ipuçları\u003c/h2>\n\u003cul>\n\u003cli>Donanımı \u003cstrong>3–5 yıllık döngüyle\u003c/strong> planla; yılda bir kısmını yenile (hepsini aynı yıl değil).\u003c/li>\n\u003cli>Abonelikleri yılda bir gözden geçir: kullanılmayan lisansları kapat.\u003c/li>\n\u003cli>Önceliği \u003cstrong>risk\u003c/strong> belirlesin: yedek ve güvenlik önce, konfor sonra.\u003c/li>\n\u003cli>Yöneticilere teknik dil yerine \u003cstrong>iş etkisi\u003c/strong> ile anlat (&quot;sunucu eskidi&quot; yerine &quot;ödeme sistemi 1 gün durabilir&quot;).\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-11-guvenlik-programi-yonetici-ozeti\">11. GÜVENLİK PROGRAMI (YÖNETİCİ ÖZETİ)\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Katman\u003c/th>\n\u003cth>Temel önlem\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Kimlik\u003c/td>\n\u003ctd>MFA, güçlü parola politikası, ayrıcalıklı hesap ayrımı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cihaz\u003c/td>\n\u003ctd>Şifreleme, EDR/antivirüs, güncel yama, yönetim (Intune/GPO)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ağ\u003c/td>\n\u003ctd>Segmentasyon, güvenlik duvarı, misafir ağı ayrımı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Veri\u003c/td>\n\u003ctd>Yedek (3-2-1, offline kopya), erişim kontrolü, DLP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>İnsan\u003c/td>\n\u003ctd>Phishing farkındalık eğitimi ve simülasyonları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Olay\u003c/td>\n\u003ctd>Yazılı olay müdahale planı, iletişim listesi, tatbikat\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Standartlar (referans):\u003c/strong> ISO/IEC 27001, CIS Controls, NIST CSF. Küçük ekipler için \u003cstrong>CIS Controls IG1\u003c/strong> pratik bir başlangıçtır.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-12-ekip-yonetimi-ve-iletisim\">12. EKİP YÖNETİMİ VE İLETİŞİM\u003c/h1>\n\u003ch2 id=\"s-12-1-ekip\">12.1 Ekip\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Nöbet ve devir:\u003c/strong> Kritik sistemler için kim, ne zaman, nasıl ulaşılır.\u003c/li>\n\u003cli>\u003cstrong>Çapraz eğitim:\u003c/strong> Her kritik sistemin en az iki sorumlusu olsun.\u003c/li>\n\u003cli>\u003cstrong>Geri bildirim:\u003c/strong> Kritik olaylardan sonra suçlayıcı olmayan (&quot;blameless&quot;) inceleme yap.\u003c/li>\n\u003cli>\u003cstrong>Gelişim:\u003c/strong> Eğitim ve sertifika bütçesi, öğrenme süresi.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-12-2-y-neticilere-raporlama\">12.2 Yöneticilere raporlama\u003c/h2>\n\u003cp>Aylık kısa rapor: \u003cstrong>ticket hacmi ve SLA\u003c/strong>, \u003cstrong>kritik olaylar\u003c/strong>, \u003cstrong>tamamlanan projeler\u003c/strong>, \u003cstrong>riskler\u003c/strong>, \u003cstrong>sonraki ay planı\u003c/strong>. Grafik ve 1 sayfa yeterlidir.\u003c/p>\n\u003ch2 id=\"s-12-3-kesinti-duyurusu-sablonu\">12.3 Kesinti duyurusu şablonu\u003c/h2>\n\u003cpre>\u003ccode>Konu: [Planlı Bakım] E-posta servisi 23 Ekim 22:00–23:30\nEtki: Bu saatler arasında e-posta gönderilip alınamayacak.\nNeden: Güvenlik güncellemesi\nAlternatif: Acil durumda telefon ile ulaşabilirsiniz (dahili 100)\nSorumlu: BT Destek\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch1 id=\"s-13-ilk-30-gun-bt-ortamini-devralma-listesi\">13. İLK 30 GÜN: BT ORTAMINI DEVRALMA LİSTESİ\u003c/h1>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kritik sistemlerin listesi ve sahipleri\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yönetici hesapları ve parola kasası erişimi\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yedek durumu: son başarılı yedek, \u003cstrong>son geri yükleme testi\u003c/strong>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Sertifika, alan adı ve lisans bitiş tarihleri\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ağ şeması, IP planı, güvenlik duvarı kuralları\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Açık ticket&#39;lar ve tekrar eden sorunlar\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Tedarikçi sözleşmeleri ve iletişim listesi\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Güvenlik açıkları: MFA kapsamı, yama durumu, internete açık servisler\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Acil durum planı var mı, güncel mi?\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> İlk iyileştirme planı (düşük maliyetli, yüksek etkili 5 madde)\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>En hızlı kazanımlar:\u003c/strong> MFA&#39;yı yaygınlaştır, yedeği test et, yama durumunu görünür kıl, envanteri çıkar, dokümantasyona başla.\u003c/p>\n","sections":[{"id":"s-bt-y-netimi-ve-operasyon-rehberi","title":"BT Yönetimi ve Operasyon Rehberi","level":1,"path":"","isTitle":true,"text":"BT ekibini yöneten, süreç kuran ya da küçük/orta ölçekli bir kurumda BT'yi tek başına yürüten kişiler için pratik yönetim notları. Teknik detaylar için diğer rehberlere, süreçlerin temeli için 05-itil-surec-dokumantasyon-rehberi.md dosyasına bak."},{"id":"s-1-bt-nin-deger-onerisi","title":"1. BT'NİN DEĞER ÖNERİSİ","level":1,"path":"","isTitle":false,"text":"BT, işin sürekliliğini sağlayan bir hizmet sağlayıcıdır. Başarı ölçütü kaç ticket kapandığı değil, iş birimlerinin kesintisiz çalışmasıdır.\nRol\nOdak\nDestek (L1/L2)\nHızlı çözüm, iyi iletişim\nSistem/ağ yöneticisi\nAltyapı sağlığı, güvenlik, yedek\nBT yöneticisi\nStrateji, bütçe, risk, ekip, tedarikçi\nGüvenlik sorumlusu\nRisk azaltma, olay yönetimi"},{"id":"s-2-hizmet-katalogu-ve-sla","title":"2. HİZMET KATALOĞU VE SLA","level":1,"path":"","isTitle":false,"text":""},{"id":"s-2-1-hizmet-katalogu","title":"2.1 Hizmet kataloğu","level":2,"path":"2. HİZMET KATALOĞU VE SLA","isTitle":false,"text":"Kullanıcıların ne isteyebileceğini ve ne kadar sürede alacağını tanımla:\nHizmet\nÖrnek hedef süre\nSahibi\nŞifre sıfırlama\n15 dakika\nDestek\nYeni kullanıcı hesabı\n1 iş günü\nDestek + İK onayı\nYeni bilgisayar kurulumu\n2 iş günü\nDestek\nYazılım talebi\n3 iş günü (onaylı listede)\nDestek + yönetici\nUzaktan erişim (VPN)\n1 iş günü\nAğ yöneticisi"},{"id":"s-2-2-sla-rnek-tablosu","title":"2.2 SLA örnek tablosu","level":2,"path":"2. HİZMET KATALOĞU VE SLA","isTitle":false,"text":"Öncelik\nTanım\nİlk yanıt\nÇözüm hedefi\nP1 Kritik\nTüm kurum etkileniyor, iş durdu\n15 dk\n4 saat\nP2 Yüksek\nBir departman çalışamıyor\n1 saat\n8 saat\nP3 Orta\nTek kullanıcı, kısmi etki\n4 saat\n2 iş günü\nP4 Düşük\nSoru, kozmetik, talep\n1 iş günü\n5 iş günü\nSLA'yı ölçemiyorsan sözleşmek anlamsız. Önce ticket sisteminde zamanı ölç."},{"id":"s-3-olcumler-kpi","title":"3. ÖLÇÜMLER (KPI)","level":1,"path":"","isTitle":false,"text":"Gösterge\nNasıl hesaplanır\nNe söyler\nİlk yanıt süresi\nAçılıştan ilk yanıta\nKullanıcı ilgi görüyor mu\nÇözüm süresi (MTTR)\nAçılıştan çözüme ortalama\nOperasyon hızı\nSLA uyum oranı\nSLA içinde kapanan / toplam\nHizmet güvenilirliği\nİlk temasta çözüm oranı\nTek seferde çözülen / toplam\nBilgi ve yetki kalitesi\nTekrar eden ticket\nAynı konuda tekrar\nKök neden çözülmüyor\nKullanıcı memnuniyeti (CSAT)\nKapanış anketi\nAlgılanan kalite\nAçık ticket yaşı\nBekleyen işlerin ortalama yaşı\nBirikme riski\nDeğişiklik başarı oranı\nSorunsuz değişiklik / toplam\nSüreç olgunluğu\nUyarı: Sayıları tek başına hedef yapma. \"Çok ticket kapatmak\" için kalitesiz çözüm üretilebilir. Metrikleri birlikte oku."},{"id":"s-4-ise-giris-cikis-onboarding-offboarding","title":"4. İŞE GİRİŞ – ÇIKIŞ (ONBOARDING / OFFBOARDING)","level":1,"path":"","isTitle":false,"text":""},{"id":"s-4-1-ise-giris-akisi","title":"4.1 İşe giriş akışı","level":2,"path":"4. İŞE GİRİŞ – ÇIKIŞ (ONBOARDING / OFFBOARDING)","isTitle":false,"text":"İK, başlangıç tarihinden en az 5 iş günü önce talep açar (ad, bölüm, yönetici, ünvan, gerekli yetkiler).\nBT hesap, e-posta, lisans, cihaz ve yetkileri hazırlar.\nZimmet tutanağı imzalanır, envantere işlenir.\nİlk gün: şifre/MFA, güvenlik farkındalığı, destek kanalları tanıtılır.\nKapanış: yönetici her şeyin çalıştığını onaylar."},{"id":"s-4-2-isten-ayrilis-akisi","title":"4.2 İşten ayrılış akışı","level":2,"path":"4. İŞE GİRİŞ – ÇIKIŞ (ONBOARDING / OFFBOARDING)","isTitle":false,"text":"Zaman\nYapılacak\nAyrılıştan önce\nDevredilecek veri, posta yönlendirme, ekipman listesi\nAyrılış anı\nHesap devre dışı, oturumlar kapat, MFA iptal, VPN/uzaktan erişim kaldır\nSonrası\nCihaz teslim al, güvenli sil, lisansı geri al, zimmeti kapat\n30–90 gün\nPosta/dosya arşivi sonrası hesabı sil (politikaya göre)\nKurumun en sık atlanan güvenlik açığı, ayrılan çalışanın aktif kalan hesaplarıdır. İK ile otomatik bildirim kur."},{"id":"s-5-varlik-yonetimi","title":"5. VARLIK YÖNETİMİ","level":1,"path":"","isTitle":false,"text":""},{"id":"s-5-1-neleri-takip-et","title":"5.1 Neleri takip et","level":2,"path":"5. VARLIK YÖNETİMİ","isTitle":false,"text":"Donanım: bilgisayar, sunucu, ağ cihazı, yazıcı, telefon\nYazılım ve lisans: sürüm, adet, bitiş tarihi, sahibi\nBulut abonelikleri: kim ödüyor, kim yönetiyor\nAlan adları ve sertifikalar: bitiş tarihleri\nYedekler ve kritik anahtarlar (konumu, sahibi)"},{"id":"s-5-2-tablo-sablonu-donanim-envanteri","title":"5.2 Tablo şablonu (donanım envanteri)","level":2,"path":"5. VARLIK YÖNETİMİ","isTitle":false,"text":"Alan\nÖrnek\nVarlık no\nIST-LT-0042\nTür / model\nLaptop / ThinkPad T14\nSeri no\nABC1234\nKullanıcı / zimmet\nAd Soyad (Muhasebe)\nKonum\nİstanbul, 2. kat\nSatın alma / garanti\n2025-03 / 2028-03\nDurum\nKullanımda / Depoda / Bakımda / Hurda\nNot\nDeğişim planı: 2029"},{"id":"s-5-3-yasam-d-ngusu","title":"5.3 Yaşam döngüsü","level":2,"path":"5. VARLIK YÖNETİMİ","isTitle":false,"text":"Planla → Satın al → Hazırla → Kullan → Bakım → Yenile → Güvenli elden çıkar. Her cihazın bir sahibi ve bir planlı yenileme tarihi olsun."},{"id":"s-5-4-sertifika-ve-lisans-bitisleri","title":"5.4 Sertifika ve lisans bitişleri","level":2,"path":"5. VARLIK YÖNETİMİ","isTitle":false,"text":"Kurumlarda beklenmedik kesintilerin en sık nedenlerinden biri süresi dolan sertifika, alan adı veya lisanstır. Takvim hatırlatıcısı kur (60/30/7 gün önce)."},{"id":"s-6-is-surekliligi-ve-felaket-kurtarma","title":"6. İŞ SÜREKLİLİĞİ VE FELAKET KURTARMA","level":1,"path":"","isTitle":false,"text":""},{"id":"s-6-1-temel-kavramlar","title":"6.1 Temel kavramlar","level":2,"path":"6. İŞ SÜREKLİLİĞİ VE FELAKET KURTARMA","isTitle":false,"text":"Terim\nAnlamı\nRTO (Recovery Time Objective)\nServisin en geç ne kadar sürede geri gelmesi gerekir\nRPO (Recovery Point Objective)\nEn fazla ne kadar veri kaybı kabul edilebilir\nBIA\nİş etki analizi: hangi sistem durursa ne kaybedilir\nBCP\nİş sürekliliği planı (işin devamı)\nDRP\nFelaket kurtarma planı (BT sistemlerini geri getirme)"},{"id":"s-6-2-sistem-ncelik-tablosu-rnek","title":"6.2 Sistem öncelik tablosu (örnek)","level":2,"path":"6. İŞ SÜREKLİLİĞİ VE FELAKET KURTARMA","isTitle":false,"text":"Sistem\nRTO\nRPO\nYedek yöntemi\nKimlik (AD/Entra)\n2 saat\n1 saat\nSistem durumu + 2. DC\nE-posta\n4 saat\n0 (bulut)\nM365 + üçüncü parti yedek\nERP/Finans\n4 saat\n1 saat\nVeritabanı + VM yedeği\nDosya sunucusu\n8 saat\n24 saat\nGünlük yedek + gölge kopya\nWeb sitesi\n24 saat\n24 saat\nHaftalık yedek"},{"id":"s-6-3-felaket-kurtarma-testi","title":"6.3 Felaket kurtarma testi","level":2,"path":"6. İŞ SÜREKLİLİĞİ VE FELAKET KURTARMA","isTitle":false,"text":"Yılda en az bir kez geri yükleme testi yap, süreyi ölç.\nTest sonucunu ve çıkan aksaklıkları yaz, planı güncelle.\nTest senaryoları: tek dosya, tek sunucu, tüm ortam (masa başı tatbikat).\nYedeklerin bir kopyası ağdan ve ana yönetici hesaplarından bağımsız (offline/immutable) olsun.\n\"Yedeğimiz var\" ile \"geri yükleyebiliyoruz\" aynı şey değildir."},{"id":"s-7-degisiklik-risk-ve-bakim","title":"7. DEĞİŞİKLİK, RİSK VE BAKIM","level":1,"path":"","isTitle":false,"text":""},{"id":"s-7-1-degisiklik-y-netimi-zeti","title":"7.1 Değişiklik yönetimi özeti","level":2,"path":"7. DEĞİŞİKLİK, RİSK VE BAKIM","isTitle":false,"text":"Tür\nÖrnek\nOnay\nStandart\nYeni kullanıcı, rutin yama\nÖnceden onaylı, hızlı\nNormal\nSunucu güncellemesi, yeni sistem\nDeğişiklik kaydı + onay\nAcil\nGüvenlik yaması, çöken sistemin onarımı\nHızlandırılmış onay, sonradan inceleme\nHer değişiklikte: ne, neden, ne zaman, etkisi, geri alma planı, test planı."},{"id":"s-7-2-risk-kaydi","title":"7.2 Risk kaydı","level":2,"path":"7. DEĞİŞİKLİK, RİSK VE BAKIM","isTitle":false,"text":"Risk\nOlasılık\nEtki\nÖnlem\nSahibi\nYedek sunucusu arızası\nOrta\nYüksek\nİkinci kopya, izleme\nSistem yön.\nTek kişiye bağımlılık\nYüksek\nYüksek\nDokümantasyon, çapraz eğitim\nBT yöneticisi\nSertifika süresi dolması\nOrta\nOrta\nTakvim hatırlatıcı\nAğ yön.\nFidye yazılımı\nOrta\nÇok yüksek\nYedek, MFA, eğitim, yama\nGüvenlik"},{"id":"s-7-3-planli-bakim","title":"7.3 Planlı bakım","level":2,"path":"7. DE // Türkçe karakterleri duyarsız arama: harf harf 1:1 eşleme (indeksler hizalı kalır)
const MAP = {'İ':'i','I':'i','ı':'i','Ş':'s','ş':'s','Ğ':'g','ğ':'g','Ü':'u','ü':'u','Ö':'o','ö':'o','Ç':'c','ç':'c'};
function fold(s){
  let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i]; let m=MAP[c];
    if(!m){ m=c.toLowerCase(); if(m.length!==1) m=c; }
    o+=m;
  }
  return o;
}
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tokens = q => fold(q).split(/\s+/).filter(Boolean);

const bySlug={}, byFile={}, byPrefix={}, catOf={}, order=[];
docs.forEach(d=>{

});
cats.forEach(c=>c.docs.forEach(sl=>{ catOf[sl]=c; order.push(bySlug[sl]); }));

}

const main=$('main');
let cur={type:'home'}, lastRes=[], resFilter=null, marks=[], mi=-1;

function highlightHTML(text, terms){
  const f=fold(text), ranges=[];
  terms.forEach(t=>{ let i=0; while((i=f.indexOf(t,i))!==-1){ ranges.push([i,i+t.length]); i+=t.length; } });
  ranges.sort((a,b)=>a[0]-b[0]);
  let out='', pos=0;
  for(const r of ranges){
    if(r[1]<=pos) continue;
    const s=Math.max(r[0],pos);
    out+=esc(text.slice(pos,s))+'<mark>'+esc(text.slice(s,r[1]))+'</mark>';
    pos=r[1];
  }
  return out+esc(text.slice(pos));
}

}
function go(h){ if(location.hash===h) route(); else location.hash=h; }

    h+='<div class="nav-cat'+(isCatCol?' collapsed':'')+'" data-cat="'+c.id+'">';
    h+='<button class="nav-cat-h" data-cat-btn="'+c.id+'" aria-expanded="'+(!isCatCol)+'">';
    h+='<span class="cat-left"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</span>';
    h+='<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
    h+='</button>';

    h+='<div class="nav-cat-items">';
    c.docs.forEach(sl=>{
      const d=bySlug[sl];
      const isAct = cur.type==='doc' && cur.slug===sl;
      const isDocCol = collapsedDocs.has(sl);
      const hasSections = d.sections.some(s=>!s.isTitle && s.level<=2);

      h+='<div class="nav-doc-item'+(isDocCol?' collapsed':'')+'" data-doc-item="'+sl+'">';
      h+='<div class="nav-doc-row">';
      h+='<a class="nav-doc'+(isAct?' active':'')+'" href="#/d/'+sl+'">'+esc(d.short)+'</a>';
      if(hasSections){
        h+='<button class="nav-doc-toggle" data-doc-toggle="'+sl+'" aria-label="Bölümleri aç/kapat" title="Bölümleri aç/kapat">';
        h+='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
        h+='</button>';
      }
      h+='</div>';

      if(hasSections){
        h+='<div class="nav-secs">';
        d.sections.forEach(s=>{
          if(s.isTitle||s.level>2) return;
          const isSecCur = isAct && cur.sec===s.id;
          h+='<a class="nav-sec l'+s.level+(d.hasH1?' ind':'')+(isSecCur?' cur':'')+'" data-id="'+s.id+'" href="#/d/'+sl+'/'+s.id+'">'+esc(s.title)+'</a>';
        });
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</div>'; // .nav-cat-items
    h+='</div>'; // .nav-cat
  });

  h+='<div class="side-foot">Rehberler kurumsal IT standartları ve saha uygulamaları dikkate alınarak hazırlanmıştır.</div>';
  $('nav').innerHTML=h;

  // Accordion Event Listener'ları
  $('expAll').onclick=()=>{
    collapsedCats.clear();
    collapsedDocs.clear();
    saveNavState();
    renderNav();
  };
  $('colAll').onclick=()=>{
    cats.forEach(c=>collapsedCats.add(c.id));
    docs.forEach(d=>collapsedDocs.add(d.slug));
    saveNavState();
    renderNav();
  };
  document.querySelectorAll('[data-cat-btn]').forEach(btn=>{
    btn.onclick=e=>{
      e.preventDefault();
      const cid = btn.dataset.catBtn;
      if(collapsedCats.has(cid)) collapsedCats.delete(cid);
      else collapsedCats.add(cid);
      saveNavState();
      renderNav();
    };
  });
  document.querySelectorAll('[data-doc-toggle]').forEach(btn=>{
    btn.onclick=e=>{
      e.preventDefault();
      e.stopPropagation();
      const sl = btn.dataset.docToggle;
      if(collapsedDocs.has(sl)) collapsedDocs.delete(sl);
      else collapsedDocs.add(sl);
      saveNavState();
      renderNav();
    };
  });
}

function keepVisible(el){
  const a=$('side'), r=el.getBoundingClientRect(), ar=a.getBoundingClientRect();
  if(r.top<ar.top+10) a.scrollTop-=(ar.top+10-r.top);
  else if(r.bottom>ar.bottom-10) a.scrollTop+=r.bottom-(ar.bottom-10);
}
function spy(){
  if(cur.type!=='doc') return;
  const ids=new Set([...document.querySelectorAll('.nav-sec')].map(a=>a.dataset.id));
  let id=null;
  for(const h of document.querySelectorAll('#doc h1[id],#doc h2[id],#doc h3[id]')){
    if(!ids.has(h.id)) continue;
    if(h.getBoundingClientRect().top<=100) id=h.id; else break;
  }
  document.querySelectorAll('.nav-sec').forEach(a=>{
    const on=a.dataset.id===id; a.classList.toggle('cur',on); if(on && !document.body.classList.contains('menu-open')) keepVisible(a);
  });
}
let tick=false;
function toggleTop(){ $('toTop').hidden = window.scrollY<800; }
window.addEventListener('scroll',()=>{ toggleTop(); if(tick||cur.type!=='doc') return; tick=true; requestAnimationFrame(()=>{ tick=false; spy(); }); },{passive:true});
function closeMenu(){ document.body.classList.remove('menu-open'); }

/* ---------- Ana Sayfa ---------- */

    +'<p>Saha sorun giderme senaryoları, ağ ve güvenlik duvarı (Firewall/VPN), sunucu ve veri merkezi, Microsoft 365, siber güvenlik, otomasyon ve BT süreç yönetimi.</p>'
    +'<div class="stats"><div class="stat"><b>'+docs.length+'</b><small>kapsamlı rehber</small></div><div class="stat"><b>'+nsec+'</b><small>bölüm ve senaryo</small></div><div class="stat"><b>~'+Math.round(words/200)+' dk</b><small>toplam okuma süresi</small></div></div>'
    +'<div class="chips" aria-label="Hızlı arama konuları">';

  h+='</div></section>';
  if(START.length){
    h+='<div class="sec-title">Buradan başla</div><div class="start">';
    START.forEach(s=>{ const d=bySlug[s.slug]; if(!d) return; h+='<a href="#/d/'+d.slug+'"><span class="ic">'+s.icon+'</span><b>'+esc(s.label)+'</b><small>'+esc(s.text)+'</small></a>'; });
    h+='</div>';
  }
  h+='<div class="sec-title" style="margin-bottom:-14px">Tüm rehber kategorileri</div><div class="grid">';
  cats.forEach(c=>{
    h+='<div class="card"><h3><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</h3>';
    c.docs.forEach(sl=>{
      const d=bySlug[sl];
      h+='<a class="d" href="#/d/'+sl+'"><strong>'+esc(d.short)+'</strong><small>'+esc(d.desc)+'</small></a>';
    });
    h+='</div>';
  });
