2,"path":"4. KESİNTİSİZ GÜÇ KAYNAĞI (UPS) VE ELEKTRİK","isTitle":false,"text":"Güç faktörü (Power Factor - PF) genellikle 0.8 veya 0.9'dur: Watt = VA × PF.\nÖrneğin 10.000 VA (10 kVA) bir UPS, PF=0.9 ise azami 9.000 Watt aktif yük taşıyabilir.\nKapasite Kuralı: UPS hiçbir zaman %80'den fazla sürekli yükte çalıştırılmamalıdır (Ani kalkış akımları ve gelecekteki büyüme için %20-30 pay bırakılmalıdır)."},{"id":"s-4-3-otomatik-ve-sirali-kapatma-graceful-shutdown","title":"4.3 Otomatik ve Sıralı Kapatma (Graceful Shutdown)","level":2,"path":"4. KESİNTİSİZ GÜÇ KAYNAĞI (UPS) VE ELEKTRİK","isTitle":false,"text":"Uzun süreli elektrik kesintilerinde jeneratör devreye girmezse aküler tükenmeden önce sunucuların aniden kapanması veri tabanlarını bozar.\nUPS üzerinde bir Ağ Yönetim Kartı (Network Management Card - NMC) bulunmalıdır.\nNMC kartı şebeke kesildiğinde ve akü seviyesi %20'nin altına indiğinde ağ üzerinden sunuculara sinyal gönderir:\nÖnce sanal makineler (VMware PowerChute / Proxmox NUT / Hyper-V agent) sırayla kapatılır.\nArdından sanallaştırma ana makineleri (ESXi / Proxmox host) kapatılır.\nEn son depolama ünitesi (SAN / NAS Storage) güvenli park moduna geçer."},{"id":"s-4-4-aku-bakimi-ve-riskler","title":"4.4 Akü Bakımı ve Riskler","level":2,"path":"4. KESİNTİSİZ GÜÇ KAYNAĞI (UPS) VE ELEKTRİK","isTitle":false,"text":"Akülerin tipik ekonomik ömrü 3–5 yıldır.\nYılda en az iki kez UPS akü testi (self-test ve kontrollü şebeke kesintisi testi) yapılmalıdır.\nAkülerde şişme, aşırı ısınma, sülfatlaşma veya koku fark edildiğinde hemen değiştirilmelidir."},{"id":"s-5-sunucu-donanimi-ve-dayaniklilik-hardware-resilience","title":"5. SUNUCU DONANIMI VE DAYANIKLILIK (HARDWARE RESILIENCE)","level":1,"path":"","isTitle":false,"text":""},{"id":"s-5-1-out-of-band-y-netim-idrac-ilo-ipmi","title":"5.1 Out-of-Band Yönetim (iDRAC / iLO / IPMI)","level":2,"path":"5. SUNUCU DONANIMI VE DAYANIKLILIK (HARDWARE RESILIENCE)","isTitle":false,"text":"Sunucunun işletim sistemi çökse, mavi ekranda kalsa veya sunucu kapalı bile olsa bağımsız çalışan anakart yönetim işlemcisi:\nDell: iDRAC (Integrated Dell Remote Access Controller)\nHPE: iLO (Integrated Lights-Out)\nLenovo / Supermicro: XClarity / IPMI\nNeler Yapılabilir?\nUzaktan sanal konsol (KVM) ile BIOS ekranına erişim.\nUzaktan ISO bağlayıp işletim sistemi kurma (Virtual Media).\nDonanım sıcaklıkları, fan hızları, güç tüketimi ve PSU durumlarını izleme.\nFiziksel sunucuyu uzaktan açma/kapatma/yeniden başlatma.\nDisk arızalarında anlık e-posta veya SNMP uyarısı alma.\nGüvenlik Uyarısı: iDRAC / iLO arayüzleri kesinlikle internete açılmamalı; yalnızca izole bir Yönetim VLAN'ı (Management VLAN) üzerinden ve VPN ile erişilebilir olmalıdır."},{"id":"s-5-2-raid-seviyeleri-ve-ariza-toleransi","title":"5.2 RAID Seviyeleri ve Arıza Toleransı","level":2,"path":"5. SUNUCU DONANIMI VE DAYANIKLILIK (HARDWARE RESILIENCE)","isTitle":false,"text":"Sunucularda tek disk kullanılmaz; veriler donanımsal RAID denetleyicisi ile yedekli tutulur:\nRAID Seviyesi\nMinimum Disk\nKullanılabilir Alan\nArıza Toleransı\nHız (Okuma / Yazma)\nEn İyi Kullanım\nRAID 0 (Striping)\n2\n%100\n0 disk (1 disk giderse her şey silinir!)\nÇok Hızlı / Çok Hızlı\nSunucu ortamında asla kullanılmaz.\nRAID 1 (Mirroring)\n2\n%50\n1 disk\nHızlı / Normal\nİşletim sistemi diskleri (OS boot drives).\nRAID 5 (Parity)\n3\n(N - 1) disk\n1 disk\nHızlı / Yavaş (Parite hesabı)\nGenel dosya paylaşımı (Büyük disklerde rebuild riski vardır!).\nRAID 6 (Dual Parity)\n4\n(N - 2) disk\n2 disk\nHızlı / Yavaş\nBüyük kapasiteli arşiv ve yedekleme sunucuları.\nRAID 10 (1+0 Striped Mirror)\n4\n%50\nHer gruptan 1 disk (azami N/2)\nÇok Hızlı / Hızlı\nYüksek IOPS isteyen veritabanları (SQL, ERP, Sanallaştırma)."},{"id":"s-5-3-hot-spare-ve-hot-swap-disk-degisimi","title":"5.3 Hot-Spare ve Hot-Swap Disk Değişimi","level":2,"path":"5. SUNUCU DONANIMI VE DAYANIKLILIK (HARDWARE RESILIENCE)","isTitle":false,"text":"Hot-Swap: Sunucuyu kapatmadan arızalı diski çekip yenisini takabilme özelliği.\nHot-Spare: Kabinette hazırda dönen ancak boştaki yedek disk. Birincil disklerden biri arızalandığında RAID denetleyicisi insan müdahalesi beklemeden bu diski devreye sokar ve diziyi onarır (Auto-Rebuild).\nRebuild Riski: RAID 5 dizisinde büyük kapasiteli (örn. 8TB) bir disk bozulduğunda yeni diskin rebuild işlemi günler sürebilir. Bu süreçte diğer diskler yoğun okuma stresine girer; ikinci bir disk bozulursa tüm veri kaybedilir. Bu nedenle kritik ortamlarda RAID 5 yerine RAID 10 veya RAID 6 tercih edilir."},{"id":"s-5-4-cift-guc-kaynagi-redundant-psu","title":"5.4 Çift Güç Kaynağı (Redundant PSU)","level":2,"path":"5. SUNUCU DONANIMI VE DAYANIKLILIK (HARDWARE RESILIENCE)","isTitle":false,"text":"Kurumsal sunucularda en az 2 adet güç kaynağı (PSU) bulunur.\nKritik Bağlantı Hatası: Her iki güç kaynağını da aynı prize veya aynı UPS'e takmak yedekliliği bozar.\nDoğru Uygulama:\nPSU 1 -> Kabinet PDU A -> UPS 1 (veya Şebeke/Jeneratör)\nPSU 2 -> Kabinet PDU B -> UPS 2\nBu sayede UPS'lerden biri patlasa veya sigortası atsa dahi sunucu kapanmadan çalışmaya devam eder."},{"id":"s-6-ortam-izleme-ve-iklimlendirme","title":"6. ORTAM İZLEME VE İKLİMLENDİRME","level":1,"path":"","isTitle":false,"text":"Sistem Odası Sıcaklık Standardı: ASHRAE standardına göre önerilen sıcaklık 18°C – 24°C, bağıl nem %40 – %55 olmalıdır.\nSensörler: Kabinette sıcaklık, bağıl nem, su sızıntı kablosu (klima drenaj borusu altı) ve duman detektörü bulunmalıdır.\nAlarm Eşikleri: Sıcaklık 27°C'yi geçtiğinde IT ekibine anlık SMS / WhatsApp / E-posta alarmı tetiklenmeli; 35°C'yi aştığında sunucular otomatik kapatılmalıdır.\nYangın Söndürme: Sistem odalarında su fıskiyesi (sprinkler) yerine gazlı söndürme sistemleri (FM-200 / NOVEC 1230) kullanılır. Bu gazlar donanıma zarar vermez ve oksijeni boğmadan yangını kimyasal reaksiyonla söndürür."},{"id":"s-7-sistem-odasi-kontrol-listesi","title":"7. SİSTEM ODASI KONTROL LİSTESİ","level":1,"path":"","isTitle":false,"text":"Kabinet kapakları kilitli, sistem odasına girişler kartlı geçiş/parmak izi ve kamera ile izleniyor.\n Kablo karmaşası (spagetti) yok; tüm patch kabloları organizatörlerden geçirildi ve etiketlendi.\n Klimalar yedekli (2 klima dönüşümlü çalışıyor; biri arızalanırsa diğeri otomatik devreye giriyor).\n UPS akü göstergesi ve yük durumu haftalık fiziksel olarak kontrol ediliyor.\n Sunucu ön panelindeki arıza LED'leri (kehribar/turuncu arıza ışığı) periyodik taranıyor.\n Boş kabinet yuvalarına kör paneller takılarak sıcak/soğuk hava sirkülasyonu sağlandı."}]},{"slug":"istemci","file":"08-istemci-donanim-windows-rehberi.md","title":"İstemci, Donanım ve Windows Yönetimi Rehberi","short":"İstemci ve Donanım","desc":"Windows kurulum/imaj, sürücü, güncelleme halkaları, BitLocker, donanım teşhisi, uzak destek","words":1415,"html":"\u003ch1 id=\"s-istemci-donanim-ve-windows-y-netimi-rehberi\">İstemci, Donanım ve Windows Yönetimi Rehberi\u003c/h1>\n\u003cp>Çalışan bilgisayarlarının kurulumu, bakımı ve sorun giderilmesi: imaj, sürücü, güncelleme, şifreleme, donanım teşhisi ve uzak destek.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-1-windows-kurulumu\">1. WINDOWS KURULUMU\u003c/h1>\n\u003ch2 id=\"s-1-1-temiz-kurulum-adimlari\">1.1 Temiz kurulum adımları\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Yedek al\u003c/strong> (kullanıcı verisi, lisans/anahtarlar, tarayıcı profili).\u003c/li>\n\u003cli>Windows ISO&#39;sunu resmi kaynaktan indir (Media Creation Tool), USB&#39;ye yaz (Rufus/MCT).\u003c/li>\n\u003cli>BIOS/UEFI: \u003cstrong>Boot\u003c/strong> sırası USB, \u003cstrong>Secure Boot\u003c/strong> ve \u003cstrong>TPM 2.0\u003c/strong> açık (Windows 11 için).\u003c/li>\n\u003cli>Kurulum sırasında diski bölümlendir; eski verileri silmeden önce emin ol.\u003c/li>\n\u003cli>Bilgisayar adı ver (standart isimlendirme), yönetici hesabını yapılandır.\u003c/li>\n\u003cli>Windows Update + üretici sürücüleri.\u003c/li>\n\u003cli>Domain/Entra ID&#39;ye katıl, politika ve uygulamalar gelsin.\u003c/li>\n\u003cli>Envantere kaydet, zimmet tutanağı hazırla.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-1-2-isimlendirme-rnegi\">1.2 İsimlendirme örneği\u003c/h2>\n\u003cp>\u003ccode>&lt;Konum&gt;-&lt;Tür&gt;-&lt;Seri/No&gt;\u003c/code> → \u003ccode>IST-LT-0042\u003c/code> (İstanbul, Laptop, 42). Standardı \u003cstrong>ilk günden\u003c/strong> belirle.\u003c/p>\n\u003ch2 id=\"s-1-3-toplu-kurulum-y-ntemleri\">1.3 Toplu kurulum yöntemleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Yöntem\u003c/th>\n\u003cth>Ne zaman\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Elle kurulum\u003c/td>\n\u003ctd>Tek tük cihaz, lab\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Referans imaj (Sysprep + WIM)\u003c/td>\n\u003ctd>Aynı donanımda çok cihaz\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Windows Autopilot\u003c/strong> (Intune)\u003c/td>\n\u003ctd>Modern, imajsız, uzaktan dağıtım\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MDT/SCCM/Configuration Manager\u003c/td>\n\u003ctd>Büyük şirket içi altyapı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Provizyon paketi (PPKG)\u003c/td>\n\u003ctd>Küçük ortamlar, hızlı yapılandırma\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003chr>\n\u003ch1 id=\"s-2-surucu-ve-guncelleme-yonetimi\">2. SÜRÜCÜ VE GÜNCELLEME YÖNETİMİ\u003c/h1>\n\u003ch2 id=\"s-2-1-surucu\">2.1 Sürücü\u003c/h2>\n\u003cul>\n\u003cli>Önce \u003cstrong>üretici sürücüsü\u003c/strong> (Dell, HP, Lenovo vb. destek sayfaları ve araçları).\u003c/li>\n\u003cli>Aygıt Yöneticisi&#39;nde sarı ünlem olan aygıtları kontrol et.\u003c/li>\n\u003cli>Sorunlu sürücü: \u003cstrong>Sürücüyü geri al\u003c/strong> ya da kaldırıp yeniden yükle.\u003c/li>\n\u003cli>Kurumsal ortamda sürücü paketlerini merkezi dağıt.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>pnputil /enum-drivers          # Yüklü sürücüler\ndriverquery                    # Sürücü listesi\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-2-2-windows-update-stratejisi\">2.2 Windows Update stratejisi\u003c/h2>\n\u003cul>\n\u003cli>Güncellemeleri \u003cstrong>halkalara (ring)\u003c/strong> böl: Pilot (IT) → Erken kullanıcılar → Tüm şirket.\u003c/li>\n\u003cli>Kritik güvenlik güncellemelerini hızlı uygula, özellik güncellemelerini test ettikten sonra.\u003c/li>\n\u003cli>Mesai içinde zorunlu yeniden başlatmalardan kaçın; \u003cstrong>aktif saat\u003c/strong> tanımla.\u003c/li>\n\u003cli>Intune \u003cstrong>Update Rings\u003c/strong> veya WSUS/Windows Update for Business kullan.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>Get-HotFix\nGet-WindowsUpdateLog\nusoclient StartScan\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Güncelleme takılırsa:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>net stop wuauserv\nnet stop bits\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nnet start wuauserv\nnet start bits\n\u003c/code>\u003c/pre>\n\u003cp>Ardından \u003ccode>sfc /scannow\u003c/code> ve \u003ccode>DISM /Online /Cleanup-Image /RestoreHealth\u003c/code> çalıştır.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-3-disk-sifreleme-ve-veri-koruma\">3. DİSK ŞİFRELEME VE VERİ KORUMA\u003c/h1>\n\u003ch2 id=\"s-3-1-bitlocker\">3.1 BitLocker\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>TPM\u003c/strong> ile otomatik açılır, kullanıcı fark etmez.\u003c/li>\n\u003cli>Kurtarma anahtarlarını \u003cstrong>merkezi yedekle\u003c/strong> (AD veya Entra ID/Intune).\u003c/li>\n\u003cli>Kullanıcıya anahtarı e-postayla gönderme; kimlik doğrulaması sonrası güvenli ilet.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>manage-bde -status\nmanage-bde -protectors -get C:\n# AD'ye yedek: manage-bde -protectors -adbackup C: -id {KeyProtectorID}\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-3-2-diger-nlemler\">3.2 Diğer önlemler\u003c/h2>\n\u003cul>\n\u003cli>Uzaktan silme (Intune Wipe/Retire) süreci hazır olsun (kayıp/çalıntı laptop).\u003c/li>\n\u003cli>USB depolama kısıtlamasını politikayla yönet.\u003c/li>\n\u003cli>Tam disk şifreleme \u003cstrong>dizüstülerde zorunlu\u003c/strong> olmalı.\u003c/li>\n\u003cli>Yerel yönetici hesabı için \u003cstrong>LAPS\u003c/strong> (parola rotasyonu) kullan.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-4-yerel-yonetim-ve-politikalar\">4. YEREL YÖNETİM VE POLİTİKALAR\u003c/h1>\n\u003ch2 id=\"s-4-1-yetki-ilkeleri\">4.1 Yetki ilkeleri\u003c/h2>\n\u003cul>\n\u003cli>Kullanıcılara \u003cstrong>standart yetki\u003c/strong> ver, günlük işte yönetici olmasınlar.\u003c/li>\n\u003cli>Yönetici işi için ayrı yönetici hesabı kullan (günlük hesaptan farklı).\u003c/li>\n\u003cli>Yerel yönetici şifresi her cihazda benzersiz olsun (\u003cstrong>LAPS / Windows LAPS\u003c/strong>).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-4-2-sik-kullanilan-politika-konulari\">4.2 Sık kullanılan politika konuları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Konu\u003c/th>\n\u003cth>Amaç\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Şifre ve hesap kilitleme\u003c/td>\n\u003ctd>Tahmin saldırılarını engelleme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ekran kilidi zaman aşımı\u003c/td>\n\u003ctd>Başıboş oturumu önleme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>USB ve çıkarılabilir depolama\u003c/td>\n\u003ctd>Veri sızıntısı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows Defender/Güvenlik Duvarı\u003c/td>\n\u003ctd>Temel koruma zorunlu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yazılım kısıtlama (AppLocker/WDAC)\u003c/td>\n\u003ctd>Yetkisiz yazılımı engelleme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Başlangıç ve masaüstü\u003c/td>\n\u003ctd>Tutarlı kullanıcı deneyimi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cpre>\u003ccode>gpresult /r            # Uygulanan politikalar\ngpresult /h rapor.html # Detaylı HTML rapor\ngpupdate /force\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch1 id=\"s-5-performans-ve-sorun-giderme\">5. PERFORMANS VE SORUN GİDERME\u003c/h1>\n\u003ch2 id=\"s-5-1-araclar\">5.1 Araçlar\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Araç\u003c/th>\n\u003cth>Kullanım\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Görev Yöneticisi\u003c/td>\n\u003ctd>Anlık CPU/RAM/Disk\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kaynak İzleyicisi (\u003ccode>resmon\u003c/code>)\u003c/td>\n\u003ctd>Hangi süreç diski/ağı kullanıyor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Performans İzleyicisi (\u003ccode>perfmon\u003c/code>)\u003c/td>\n\u003ctd>Uzun süreli sayaçlar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Olay Görüntüleyici (\u003ccode>eventvwr\u003c/code>)\u003c/td>\n\u003ctd>Hata ve uyarı kayıtları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güvenilirlik Geçmişi (\u003ccode>perfmon /rel\u003c/code>)\u003c/td>\n\u003ctd>Çökme/hata zaman çizelgesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Autoruns, Process Explorer\u003c/td>\n\u003ctd>Sysinternals ile ayrıntılı analiz\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows Memory Diagnostic (\u003ccode>mdsched\u003c/code>)\u003c/td>\n\u003ctd>RAM testi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-5-2-yavaslik-icin-kontrol-sirasi\">5.2 Yavaşlık için kontrol sırası\u003c/h2>\n\u003col>\n\u003cli>Disk türü ve doluluğu (HDD mi, %90 dolu mu?)\u003c/li>\n\u003cli>Arka plan: antivirüs, güncelleme, OneDrive eşitleme\u003c/li>\n\u003cli>Başlangıç uygulamaları\u003c/li>\n\u003cli>RAM yeterli mi? (8 GB altı modern Windows için sınırda)\u003c/li>\n\u003cli>Isı ve güç planı (laptop yüksek performans/dengeli)\u003c/li>\n\u003cli>Zararlı yazılım\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-5-3-bozuk-windows-onarimi\">5.3 Bozuk Windows onarımı\u003c/h2>\n\u003cpre>\u003ccode>sfc /scannow\nDISM /Online /Cleanup-Image /RestoreHealth\nchkdsk C: /f /r\n\u003c/code>\u003c/pre>\n\u003cp>Hâlâ olmazsa: \u003cstrong>Bu bilgisayarı sıfırla\u003c/strong> (verileri koru), olmazsa yedek alıp temiz kurulum.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-6-donanim\">6. DONANIM\u003c/h1>\n\u003ch2 id=\"s-6-1-bilesenler-ve-belirtiler\">6.1 Bileşenler ve belirtiler\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bileşen\u003c/th>\n\u003cth>Arıza belirtisi\u003c/th>\n\u003cth>Kontrol\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>RAM\u003c/td>\n\u003ctd>Mavi ekran, açılmama, bip\u003c/td>\n\u003ctd>\u003ccode>mdsched\u003c/code>, tek modülle deneme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disk (HDD/SSD)\u003c/td>\n\u003ctd>Yavaşlık, tıkırtı, bozuk dosya\u003c/td>\n\u003ctd>SMART, CrystalDiskInfo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güç kaynağı/adaptör\u003c/td>\n\u003ctd>Rastgele kapanma, şarj olmama\u003c/td>\n\u003ctd>Başka adaptörle dene\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Batarya\u003c/td>\n\u003ctd>Hızlı bitme, şişme\u003c/td>\n\u003ctd>\u003ccode>powercfg /batteryreport\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Isınma\u003c/td>\n\u003ctd>Fan sesi, kapanma\u003c/td>\n\u003ctd>Toz temizliği, termal macun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ekran\u003c/td>\n\u003ctd>Titreme, çizgi\u003c/td>\n\u003ctd>Harici ekranla test\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ağ kartı\u003c/td>\n\u003ctd>Bağlantı yok\u003c/td>\n\u003ctd>Sürücü, başka adaptör\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cpre>\u003ccode>powercfg /batteryreport     # Batarya sağlık raporu\nwmic diskdrive get status   # Basit disk durumu\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-6-2-yukseltme-nerileri-en-iyi-fayda-maliyet\">6.2 Yükseltme önerileri (en iyi fayda/maliyet)\u003c/h2>\n\u003col>\n\u003cli>HDD → \u003cstrong>SSD\u003c/strong> (en büyük hız farkı)\u003c/li>\n\u003cli>RAM 4 → 8/16 GB\u003c/li>\n\u003cli>Bakım: toz temizliği, termal macun\u003c/li>\n\u003cli>Eski laptopta batarya değişimi\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-6-3-cevre-birimleri\">6.3 Çevre birimleri\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Monitör:\u003c/strong> Doğru kablo (HDMI/DP), çözünürlük/yenileme hızı ayarı.\u003c/li>\n\u003cli>\u003cstrong>Dock:\u003c/strong> Firmware ve sürücü güncel olsun; sorunların çoğu kablo veya firmware kaynaklıdır.\u003c/li>\n\u003cli>\u003cstrong>Yazıcı/tarayıcı:\u003c/strong> Üretici sürücüsü, ağ IP&#39;si, tarama klasörü izinleri (SMB).\u003c/li>\n\u003cli>\u003cstrong>Bluetooth:\u003c/strong> Eşleşmeyi kaldırıp yeniden eşle, sürücüyü güncelle.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-6-4-garanti-ve-rma\">6.4 Garanti ve RMA\u003c/h2>\n\u003cul>\n\u003cli>Seri numarası ve servis etiketiyle garanti sorgula.\u003c/li>\n\u003cli>Üretici destek ekibine hata kodu, yapılan testler ve ekran görüntüsüyle başvur.\u003c/li>\n\u003cli>Cihazı göndermeden \u003cstrong>veriyi yedekle/şifrele\u003c/strong> ve varsa disk iadesi seçeneğini değerlendir.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-7-uzak-destek\">7. UZAK DESTEK\u003c/h1>\n\u003ch2 id=\"s-7-1-araclar\">7.1 Araçlar\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Araç\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Hızlı Yardım (Quick Assist)\u003c/td>\n\u003ctd>Windows ile gelir, tek seferlik\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RDP (\u003ccode>mstsc\u003c/code>)\u003c/td>\n\u003ctd>Aynı ağda/VPN ile kurumsal bilgisayarlara\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Intune uzaktan yardım (Remote Help)\u003c/td>\n\u003ctd>M365 ortamında rızaya dayalı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TeamViewer/AnyDesk/RustDesk\u003c/td>\n\u003ctd>Üçüncü parti, kurum politikasına uygun olmalı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PowerShell Remoting\u003c/td>\n\u003ctd>Betikle toplu müdahale\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-7-2-uzak-destek-etigi-ve-guvenligi\">7.2 Uzak destek etiği ve güvenliği\u003c/h2>\n\u003cul>\n\u003cli>Kullanıcının \u003cstrong>açık onayını\u003c/strong> al, oturum süresince ne yaptığını anlat.\u003c/li>\n\u003cli>Kullanıcının kişisel verilerine (e-posta, dosyalar) gereksiz bakma.\u003c/li>\n\u003cli>Oturumu bitirince bağlantıyı kapat, erişim kodunu paylaşma.\u003c/li>\n\u003cli>Müşteri/kullanıcının kimliğini doğrula (sahte destek aramaları yaygındır).\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode># PowerShell Remoting\nEnter-PSSession -ComputerName PC01\nInvoke-Command -ComputerName PC01,PC02 -ScriptBlock { Get-Service Spooler }\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch1 id=\"s-8-yazilim-dagitimi\">8. YAZILIM DAĞITIMI\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Yöntem\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Intune (Win32 / Microsoft Store)\u003c/td>\n\u003ctd>Bulut tabanlı, uzaktan çalışan cihazlar için ideal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPO yazılım dağıtımı (MSI)\u003c/td>\n\u003ctd>Domain ortamında basit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SCCM/MECM\u003c/td>\n\u003ctd>Büyük kurumsal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>winget\u003c/strong>\u003c/td>\n\u003ctd>Komut satırı paket yöneticisi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chocolatey\u003c/td>\n\u003ctd>Betikle dağıtım için popüler\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cpre>\u003ccode>winget search vlc\nwinget install --id VideoLAN.VLC -e\nwinget upgrade --all\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>İlkeler:\u003c/strong> Lisansları takip et, yetkisiz yazılımı kısıtla, standart yazılım listesi oluştur, sessiz kurulum parametrelerini dokümante et.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-9-kullanici-profili-ve-veri-tasima\">9. KULLANICI PROFİLİ VE VERİ TAŞIMA\u003c/h1>\n\u003ch2 id=\"s-9-1-yeni-bilgisayara-gecis-kontrol-listesi\">9.1 Yeni bilgisayara geçiş kontrol listesi\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Masaüstü, Belgeler, İndirilenler (veya OneDrive Known Folder Move)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Tarayıcı yer imleri ve parolalar (hesap eşitleme)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Outlook profili / imza / PST dosyaları\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yazıcılar ve ağ sürücüleri\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Özel uygulamalar ve lisans anahtarları\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Eski cihazın güvenli silinmesi (format/sıfırlama)\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-9-2-araclar\">9.2 Araçlar\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>OneDrive Known Folder Move:\u003c/strong> Kullanıcı klasörlerini buluta yönlendirir, cihaz değişimini kolaylaştırır.\u003c/li>\n\u003cli>\u003ccode>robocopy\u003c/code>: Büyük veri kopyası, izinleri ve zaman damgalarını korur.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>robocopy C:\\Users\\ali D:\\Yedek\\ali /E /COPYALL /R:2 /W:2 /LOG:C:\\kopya.log\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch1 id=\"s-10-cihaz-yasam-dongusu-ve-elden-cikarma\">10. CİHAZ YAŞAM DÖNGÜSÜ VE ELDEN ÇIKARMA\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Aşama\u003c/th>\n\u003cth>Yapılacak\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Satın alma\u003c/td>\n\u003ctd>Standart modeller, garanti, uyumluluk\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hazırlık\u003c/td>\n\u003ctd>İmaj/Autopilot, etiketleme, envanter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanım\u003c/td>\n\u003ctd>Güncellemeler, bakım, zimmet takibi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yenileme\u003c/td>\n\u003ctd>Genelde 3–5 yıl, bataryalı cihazlarda batarya sağlığı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Elden çıkarma\u003c/td>\n\u003ctd>\u003cstrong>Güvenli silme\u003c/strong>, zimmet kapatma, geri dönüşüm/e-atık\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Güvenli silme:\u003c/strong> SSD&#39;lerde &quot;format&quot; yeterli değildir; şifreli disk + kriptografik silme veya üretici güvenli silme aracını kullan. Hassas verili disklerde fiziksel imha değerlendirilebilir. Silme işlemini \u003cstrong>tutanakla\u003c/strong> kayıt altına al.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-11-hizli-kontrol-karti\">11. HIZLI KONTROL KARTI\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Soru\u003c/th>\n\u003cth>Cevap\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bilgisayar yavaş\u003c/td>\n\u003ctd>Görev Yöneticisi → disk/RAM → başlangıç → SFC/DISM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güncelleme takıldı\u003c/td>\n\u003ctd>SoftwareDistribution sıfırla, wuauserv/bits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sürücü sorunu\u003c/td>\n\u003ctd>Sürücüyü geri al / üreticiden yeniden yükle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BitLocker anahtar istiyor\u003c/td>\n\u003ctd>Entra ID/AD&#39;den kurtarma anahtarı, kimlik doğrula\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Domain güveni bozuk\u003c/td>\n\u003ctd>\u003ccode>Test-ComputerSecureChannel -Repair\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Batarya hızlı bitiyor\u003c/td>\n\u003ctd>\u003ccode>powercfg /batteryreport\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disk bozuk şüphesi\u003c/td>\n\u003ctd>SMART kontrol, \u003cstrong>önce yedek\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","sections":[{"id":"s-istemci-donanim-ve-windows-y-netimi-rehberi","title":"İstemci, Donanım ve Windows Yönetimi Rehberi","level":1,"path":"","isTitle":true,"text":"Çalışan bilgisayarlarının kurulumu, bakımı ve sorun giderilmesi: imaj, sürücü, güncelleme, şifreleme, donanım teşhisi ve uzak destek."},{"id":"s-1-windows-kurulumu","title":"1. WINDOWS KURULUMU","level":1,"path":"","isTitle":false,"text":""},{"id":"s-1-1-temiz-kurulum-adimlari","title":"1.1 Temiz kurulum adımları","level":2,"path":"1. WINDOWS KURULUMU","isTitle":false,"text":"Yedek al (kullanıcı verisi, lisans/anahtarlar, tarayıcı profili).\nWindows ISO'sunu resmi kaynaktan indir (Media Creation Tool), USB'ye yaz (Rufus/MCT).\nBIOS/UEFI: Boot sırası USB, Secure Boot ve TPM 2.0 açık (Windows 11 için).\nKurulum sırasında diski bölümlendir; eski verileri silmeden önce emin ol.\nBilgisayar adı ver (standart isimlendirme), yönetici hesabını yapılandır.\nWindows Update + üretici sürücüleri.\nDomain/Entra ID'ye katıl, politika ve uygulamalar gelsin.\nEnvantere kaydet, zimmet tutanağı hazırla."},{"id":"s-1-2-isimlendirme-rnegi","title":"1.2 İsimlendirme örneği","level":2,"path":"1. WINDOWS KURULUMU","isTitle":false,"text":"\u003cKonum>-\u003cTür>-\u003cSeri/No> → IST-LT-0042 (İstanbul, Laptop, 42). Standardı ilk günden belirle."},{"id":"s-1-3-toplu-kurulum-y-ntemleri","title":"1.3 Toplu kurulum yöntemleri","level":2,"path":"1. WINDOWS KURULUMU","isTitle":false,"text":"Yöntem\nNe zaman\nElle kurulum\nTek tük cihaz, lab\nReferans imaj (Sysprep + WIM)\nAynı donanımda çok cihaz\nWindows Autopilot (Intune)\nModern, imajsız, uzaktan dağıtım\nMDT/SCCM/Configuration Manager\nBüyük şirket içi altyapı\nProvizyon paketi (PPKG)\nKüçük ortamlar, hızlı yapılandırma"},{"id":"s-2-surucu-ve-guncelleme-yonetimi","title":"2. SÜRÜCÜ VE GÜNCELLEME YÖNETİMİ","level":1,"path":"","isTitle":false,"text":""},{"id":"s-2-1-surucu","title":"2.1 Sürücü","level":2,"path":"2. SÜRÜCÜ VE GÜNCELLEME YÖNETİMİ","isTitle":false,"text":"Önce üretici sürücüsü (Dell, HP, Lenovo vb. destek sayfaları ve araçları).\nAygıt Yöneticisi'nde sarı ünlem olan aygıtları kontrol et.\nSorunlu sürücü: Sürücüyü geri al ya da kaldırıp yeniden yükle.\nKurumsal ortamda sürücü paketlerini merkezi dağıt.\npnputil /enum-drivers          # Yüklü sürücüler\ndriverquery                    # Sürücü listesi"},{"id":"s-2-2-windows-update-stratejisi","title":"2.2 Windows Update stratejisi","level":2,"path":"2. SÜRÜCÜ VE GÜNCELLEME YÖNETİMİ","isTitle":false,"text":"Güncellemeleri halkalara (ring) böl: Pilot (IT) → Erken kullanıcılar → Tüm şirket.\nKritik güvenlik güncellemelerini hızlı uygula, özellik güncellemelerini test ettikten sonra.\nMesai içinde zorunlu yeniden başlatmalardan kaçın; aktif saat tanımla.\nIntune Update Rings veya WSUS/Windows Update for Business kullan.\nGet-HotFix\nGet-WindowsUpdateLog\nusoclient StartScan\nGüncelleme takılırsa:\nnet stop wuauserv\nnet stop bits\nren C:\\Windows\\SoftwareDistribution SoftwareDistribution.old\nnet start wuauserv\nnet start bits\nArdından sfc /scannow ve DISM /Online /Cleanup-Image /RestoreHealth çalıştır."},{"id":"s-3-disk-sifreleme-ve-veri-koruma","title":"3. DİSK ŞİFRELEME VE VERİ KORUMA","level":1,"path":"","isTitle":false,"text":""},{"id":"s-3-1-bitlocker","title":"3.1 BitLocker","level":2,"path":"3. DİSK ŞİFRELEME VE VERİ KORUMA","isTitle":false,"text":"TPM ile otomatik açılır, kullanıcı fark etmez.\nKurtarma anahtarlarını merkezi yedekle (AD veya Entra ID/Intune).\nKullanıcıya anahtarı e-postayla gönderme; kimlik doğrulaması sonrası güvenli ilet.\nmanage-bde -status\nmanage-bde -protectors -get C:\n# AD'ye yedek: manage-bde -protectors -adbackup C: -id {KeyProtectorID}"},{"id":"s-3-2-diger-nlemler","title":"3.2 Diğer önlemler","level":2,"path":"3. DİSK ŞİFRELEME VE VERİ KORUMA","isTitle":false,"text":"Uzaktan silme (Intune Wipe/Retire) süreci hazır olsun (kayıp/çalıntı laptop).\nUSB depolama kısıtlamasını politikayla yönet.\nTam disk şifreleme dizüstülerde zorunlu olmalı.\nYerel yönetici hesabı için LAPS (parola rotasyonu) kullan."},{"id":"s-4-yerel-yonetim-ve-politikalar","title":"4. YEREL YÖNETİM VE POLİTİKALAR","level":1,"path":"","isTitle":false,"text":""},{"id":"s-4-1-yetki-ilkeleri","title":"4.1 Yetki ilkeleri","level":2,"path":"4. YEREL YÖNETİM VE POLİTİKALAR","isTitle":false,"text":"Kullanıcılara standart yetki ver, günlük işte yönetici olmasınlar.\nYönetici işi için ayrı yönetici hesabı kullan (günlük hesaptan farklı).\nYerel yönetici şifresi her cihazda benzersiz olsun (LAPS / Windows LAPS)."},{"id":"s-4-2-sik-kullanilan-politika-konulari","title":"4.2 Sık kullanılan politika konuları","level":2,"path":"4. YEREL YÖNETİM VE POLİTİKALAR","isTitle":false,"text":"Konu\nAmaç\nŞifre ve hesap kilitleme\nTahmin saldırılarını engelleme\nEkran kilidi zaman aşımı\nBaşıboş oturumu önleme\nUSB ve çıkarılabilir depolama\nVeri sızıntısı\nWindows Defender/Güvenlik Duvarı\nTemel koruma zorunlu\nYazılım kısıtlama (AppLocker/WDAC)\nYetkisiz yazılımı engelleme\nBaşlangıç ve masaüstü\nTutarlı kullanıcı deneyimi\ngpresult /r            # Uygulanan politikalar\ngpresult /h rapor.html # Detaylı HTML rapor\ngpupdate /force"},{"id":"s-5-performans-ve-sorun-giderme","title":"5. PERFORMANS VE SORUN GİDERME","level":1,"path":"","isTitle":false,"text":""},{"id":"s-5-1-araclar","title":"5.1 Araçlar","level":2,"path":"5. PERFORMANS VE SORUN GİDERME","isTitle":false,"text":"Araç\nKullanım\nGörev Yöneticisi\nAnlık CPU/RAM/Disk\nKaynak İzleyicisi (resmon)\nHangi süreç diski/ağı kullanıyor\nPerformans İzleyicisi (perfmon)\nUzun süreli sayaçlar\nOlay Görüntüleyici (eventvwr)\nHata ve uyarı kayıtları\nGüvenilirlik Geçmişi (perfmon /rel)\nÇökme/hata zaman çizelgesi\nAutoruns, Process Explorer\nSysinternals ile ayrıntılı analiz\nWindows Memory Diagnostic (mdsched)\nRAM testi"},{"id":"s-5-2-yavaslik-icin-kontrol-sirasi","title":"5.2 Yavaşlık için kontrol sırası","level":2,"path":"5. PERFORMANS VE SORUN GİDERME","isTitle":false,"text":"Disk türü ve doluluğu (HDD mi, %90 dolu mu?)\nArka plan: antivirüs, güncelleme, OneDrive eşitleme\nBaşlangıç uygulamaları\nRAM yeterli mi? (8 GB altı modern Windows için sınırda)\nIsı ve güç planı (laptop yüksek performans/dengeli)\nZararlı yazılım"},{"id":"s-5-3-bozuk-windows-onarimi","title":"5.3 Bozuk Windows onarımı","level":2,"path":"5. PERFORMANS VE SORUN GİDERME","isTitle":false,"text":"sfc /scannow\nDISM /Online /Cleanup-Image /RestoreHealth\nchkdsk C: /f /r\nHâlâ olmazsa: Bu bilgisayarı sıfırla (verileri koru), olmazsa yedek alıp temiz kurulum."},{"id":"s-6-donanim","title":"6. DONANIM","level":1,"path":"","isTitle":false,"text":""},{"id":"s-6-1-bilesenler-ve-belirtiler","title":"6.1 Bileşenler ve belirtiler","level":2,"path":"6. DONANIM","isTitle":false,"text":"Bileşen\nArıza belirtisi\nKontrol\nRAM\nMavi ekran, açılmama, bip\nmdsched, tek modülle deneme\nDisk (HDD/SSD)\nYavaşlık, tıkırtı, bozuk dosya\nSMART, CrystalDiskInfo\nGüç kaynağı/adaptör\nRastgele kapanma, şarj olmama\nBaşka adaptörle dene\nBatarya\nHızlı bitme, şişme\npowercfg /batteryreport\nIsınma\nFan sesi, kapanma\nToz temizliği, termal macun\nEkran\nTitreme, çizgi\nHarici ekranla test\nAğ kartı\nBağlantı yok\nSürücü, başka adaptör\npowercfg /batteryreport     # Batarya sağlık raporu\nwmic diskdrive get status   # Basit disk durumu"},{"id":"s-6-2-yukseltme-nerileri-en-iyi-fayda-maliyet","title":"6.2 Yükseltme önerileri (en iyi fayda/maliyet)","level":2,"path":"6. DONANIM","isTitle":false,"text":"HDD → SSD (en büyük hız farkı)\nRAM 4 → 8/16 GB\nBakım: toz temizliği, termal macun\nEski laptopta batarya değişimi"},{"id":"s-6-3-cevre-birimleri","title":"6.3 Çevre birimleri","level":2,"path":"6. DONANIM","isTitle":false,"text":"Monitör: Doğru kablo (HDMI/DP), çözünürlük/yenileme hızı ayarı.\nDock: Firmware ve sürücü güncel olsun; sorunların çoğu kablo veya firmware kaynaklıdır.\nYazıcı/tarayıcı: Üretici sürücüsü, ağ IP'si, tarama klasörü izinleri (SMB).\nBluetooth: Eşleşmeyi kaldırıp yeniden eşle, sürücüyü güncelle."},{"id":"s-6-4-garanti-ve-rma","title":"6.4 Garanti ve RMA","level":2,"path":"6. DONANIM","isTitle":false,"text":"Seri numarası ve servis etiketiyle garanti sorgula.\nÜretici destek ekibine hata kodu, yapılan testler ve ekran görüntüsüyle başvur.\nCihazı göndermeden veriyi yedekle/şifrele ve varsa disk iadesi seçeneğini değerlendir."},{"id":"s-7-uzak-destek","title":"7. UZAK DESTEK","level":1,"path":"","isTitle":false,"text":""},{"id":"s-7-1-araclar","title":"7.1 Araçlar","level":2,"path":"7. UZAK DESTEK","isTitle":false,"text":"Araç\nNot\nHızlı Yardım (Quick Assist)\nWindows ile gelir, tek seferlik\nRDP (mstsc)\nAynı ağda/VPN ile kurumsal bilgisayarlara\nIntune uzaktan yardım (Remote Help)\nM365 ortamında rızaya dayalı\nTeamViewer/AnyDesk/RustDesk\nÜçüncü parti, kurum politikasına uygun olmalı\nPowerShell Remoting\nBetikle toplu müdahale"},{"id":"s-7-2-uzak-destek-etigi-ve-guvenligi","title":"7.2 Uzak destek etiği ve güvenliği","level":2,"path":"7. UZAK DESTEK","isTitle":false,"text":"Kullanıcının açık onayını al, oturum süresince ne yaptığını anlat.\nKullanıcının kişisel verilerine (e-posta, dosyalar) gereksiz bakma.\nOturumu bitirince bağlantıyı kapat, erişim kodunu paylaşma.\nMüşteri/kullanıcının kimliğini doğrula (sahte destek aramaları yaygındır).\n# PowerShell Remoting\nEnter-PSSession -ComputerName PC01\nInvoke-Command -ComputerName PC01,PC02 -ScriptBlock { Get-Service Spooler }"},{"id":"s-8-yazilim-dagitimi","title":"8. YAZILIM DAĞITIMI","level":1,"path":"","isTitle":false,"text":"Yöntem\nNot\nIntune (Win32 / Microsoft Store)\nBulut tabanlı, uzaktan çalışan cihazlar için ideal\nGPO yazılım dağıtımı (MSI)\nDomain ortamında basit\nSCCM/MECM\nBüyük kurumsal\nwinget\nKomut satırı paket yöneticisi\nChocolatey\nBetikle dağıtım için popüler\nwinget search vlc\nwinget install --id VideoLAN.VLC -e\nwinget upgrade --all\nİlkeler: Lisansları takip et, yetkisiz yazılımı kısıtla, standart yazılım listesi oluştur, sessiz kurulum parametrelerini dokümante et."},{"id":"s-9-kullanici-profili-ve-veri-tasima","title":"9. KULLANICI PROFİLİ VE VERİ TAŞIMA","level":1,"path":"","isTitle":false,"text":""},{"id":"s-9-1-yeni-bilgisayara-gecis-kontrol-listesi","title":"9.1 Yeni bilgisayara geçiş kontrol listesi","level":2,"path":"9. KULLANICI PROFİLİ VE VERİ TAŞIMA","isTitle":false,"text":"Masaüstü, Belgeler, İndirilenler (veya OneDrive Known Folder Move)\n Tarayıcı yer imleri ve parolalar (hesap eşitleme)\n Outlook profili / imza / PST dosyaları\n Yazıcılar ve ağ sürücüleri\n Özel uygulamalar ve lisans anahtarları\n Eski cihazın güvenli silinmesi (format/sıfırlama)"},{"id":"s-9-2-araclar","title":"9.2 Araçlar","level":2,"path":"9. KULLANICI PROFİLİ VE VERİ TAŞIMA","isTitle":false,"text":"OneDrive Known Folder Move: Kullanıcı klasörlerini buluta yönlendirir, cihaz değişimini kolaylaştırır.\nrobocopy: Büyük veri kopyası, izinleri ve zaman damgalarını korur.\nrobocopy C:\\Users\\ali D:\\Yedek\\ali /E /COPYALL /R:2 /W:2 /LOG:C:\\kopya.log"},{"id":"s-10-cihaz-yasam-dongusu-ve-elden-cikarma","title":"10. CİHAZ YAŞAM DÖNGÜSÜ VE ELDEN ÇIKARMA","level":1,"path":"","isTitle":false,"text":"Aşama\nYapılacak\nSatın alma\nStandart modeller, garanti, uyumluluk\nHazırlık\nİmaj/Autopilot, etiketleme, envanter\nKullanım\nGüncellemeler, bakım, zimmet takibi\nYenileme\nGenelde 3–5 yıl, bataryalı cihazlarda batarya sağlığı\nElden çıkarma\nGüvenli silme, zimmet kapatma, geri dönüşüm/e-atık\nGüvenli silme: SSD'lerde \"format\" yeterli değildir; şifreli disk + kriptografik silme veya üretici güvenli silme aracını kullan. Hassas verili disklerde fiziksel imha değerlendirilebilir. Silme işlemini tutanakla kayıt altına al."},{"id":"s-11-hizli-kontrol-karti","title":"11. HIZLI KONTROL KARTI","level":1,"path":"","isTitle":false,"text":"Soru\nCevap\nBilgisayar yavaş\nGörev Yöneticisi → disk/RAM → başlangıç → SFC/DISM\nGüncelleme takıldı\nSoftwareDistribution sıfırla, wuauserv/bits\nSürücü sorunu\nSürücüyü geri al / üreticiden yeniden yükle\nBitLocker anahtar istiyor\nEntra ID/AD'den kurtarma anahtarı, kimlik doğrula\nDomain güveni bozuk\nTest-ComputerSecureChannel -Repair\nBatarya hızlı bitiyor\npowercfg /batteryreport\nDisk bozuk şüphesi\nSMART kontrol, önce yedek"}]},{"slug":"bulut","file":"01-bulut-kimlik-m365-intune-rehberi.md","title":"Bulut ve Kimlik Yönetimi Rehberi","short":"Bulut ve Kimlik (M365)","desc":"Microsoft 365, Entra ID, Exchange Online, Intune, Azure temelleri","words":1939,"html":"\u003ch1 id=\"s-bulut-ve-kimlik-y-netimi-rehberi\">Bulut ve Kimlik Yönetimi Rehberi\u003c/h1>\n\u003cp>\u003cstrong>Microsoft 365 · Entra ID · Exchange Online · Intune · Azure Temelleri\u003c/strong>\u003c/p>\n\u003cp>Günümüzde birçok firmada kullanıcı, posta ve cihaz yönetimi artık bulutta yapılıyor. Bu rehber, IT destek olarak günlük işlerde hızlıca bakacağın notları içerir.\u003c/p>\n\u003cblockquote>\n\u003cp>Portal arayüzleri ve menü isimleri sık değişir. Menü birebir aynı değilse arama kutusunu kullan. Komut ve kavramlar daha kalıcıdır.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s-1-buyuk-resim\">1. Büyük Resim\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ürün\u003c/th>\n\u003cth>Ne işe yarar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Microsoft 365\u003c/strong>\u003c/td>\n\u003ctd>Lisans paketi: Office uygulamaları, Exchange (posta), Teams, SharePoint, OneDrive\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Entra ID\u003c/strong> (eski adı Azure AD)\u003c/td>\n\u003ctd>Bulut kimlik servisi: kullanıcılar, gruplar, MFA, oturum açma, Conditional Access\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Exchange Online\u003c/strong>\u003c/td>\n\u003ctd>Bulut e-posta sunucusu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Intune\u003c/strong>\u003c/td>\n\u003ctd>Cihaz ve uygulama yönetimi (MDM/MAM): bilgisayar, telefon, tablet\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Defender\u003c/strong>\u003c/td>\n\u003ctd>Güvenlik: antivirüs, e-posta koruması, uç nokta güvenliği\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Azure\u003c/strong>\u003c/td>\n\u003ctd>Genel bulut platformu: sanal makine, depolama, ağ\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Mantık:\u003c/strong> Kullanıcı Entra ID&#39;de tanımlanır → lisans atanır → lisansa göre servisler (posta, Teams, OneDrive) açılır → cihaz Intune ile yönetilir.\u003c/p>\n\u003ch2 id=\"s-2-y-netim-portallari\">2. Yönetim Portalları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Portal\u003c/th>\n\u003cth>Adres\u003c/th>\n\u003cth>Kullanım\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Microsoft 365 admin center\u003c/td>\n\u003ctd>\u003ccode>admin.microsoft.com\u003c/code>\u003c/td>\n\u003ctd>Kullanıcı, lisans, faturalama\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Entra admin center\u003c/td>\n\u003ctd>\u003ccode>entra.microsoft.com\u003c/code>\u003c/td>\n\u003ctd>Kimlik, MFA, gruplar, oturum günlükleri\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Exchange admin center\u003c/td>\n\u003ctd>\u003ccode>admin.exchange.microsoft.com\u003c/code>\u003c/td>\n\u003ctd>Posta kutuları, mail akışı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Intune admin center\u003c/td>\n\u003ctd>\u003ccode>intune.microsoft.com\u003c/code>\u003c/td>\n\u003ctd>Cihaz, uygulama, politika\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Teams admin center\u003c/td>\n\u003ctd>\u003ccode>admin.teams.microsoft.com\u003c/code>\u003c/td>\n\u003ctd>Teams ayarları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Defender portalı\u003c/td>\n\u003ctd>\u003ccode>security.microsoft.com\u003c/code>\u003c/td>\n\u003ctd>Güvenlik, karantina, olaylar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Azure portalı\u003c/td>\n\u003ctd>\u003ccode>portal.azure.com\u003c/code>\u003c/td>\n\u003ctd>Azure kaynakları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanıcı hesabım\u003c/td>\n\u003ctd>\u003ccode>myaccount.microsoft.com\u003c/code>\u003c/td>\n\u003ctd>Kullanıcının kendi güvenlik ayarları\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-3-gunluk-kullanici-isleri\">3. Günlük Kullanıcı İşleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>İş\u003c/th>\n\u003cth>Nerede / Nasıl\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Yeni kullanıcı\u003c/td>\n\u003ctd>M365 admin &gt; Users &gt; Active users &gt; Add a user\u003c/td>\n\u003ctd>Önce \u003cstrong>kullanım konumu (usage location)\u003c/strong> seçilmeli, yoksa lisans atanmaz\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lisans atama/alma\u003c/td>\n\u003ctd>Kullanıcı &gt; Licenses and apps\u003c/td>\n\u003ctd>Lisans boşaltınca posta kutusu silinebilir, dikkat (bkz. Bölüm 5)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Şifre sıfırlama\u003c/td>\n\u003ctd>Kullanıcı &gt; Reset password\u003c/td>\n\u003ctd>Kimlik doğrulamayı unutma\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MFA sıfırlama\u003c/td>\n\u003ctd>Entra &gt; Users &gt; kullanıcı &gt; Authentication methods &gt; \u003cstrong>Require re-register MFA\u003c/strong> ve \u003cstrong>Revoke MFA sessions\u003c/strong>\u003c/td>\n\u003ctd>Telefon kaybında\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hesabı engelleme\u003c/td>\n\u003ctd>Kullanıcı &gt; Block sign-in\u003c/td>\n\u003ctd>Silmek yerine önce engelle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gruba ekleme\u003c/td>\n\u003ctd>Kullanıcı &gt; Groups, ya da grup &gt; Members\u003c/td>\n\u003ctd>Dinamik grupta elle ekleme olmaz\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Takma e-posta (alias)\u003c/td>\n\u003ctd>Kullanıcı &gt; Manage username and email\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Silinen kullanıcıyı geri alma\u003c/td>\n\u003ctd>Users &gt; Deleted users\u003c/td>\n\u003ctd>Silindikten sonra yaklaşık 30 gün içinde\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yönetici rolü verme\u003c/td>\n\u003ctd>Kullanıcı &gt; Assigned roles\u003c/td>\n\u003ctd>\u003cstrong>En az yetki:\u003c/strong> gerekmedikçe Global Admin verme\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-4-ise-giris-onboarding-adimlari\">4. İşe Giriş (Onboarding) Adımları\u003c/h2>\n\u003col>\n\u003cli>Yöneticiden onay ve bilgi al (ad, departman, başlangıç tarihi, yönetici, hangi erişimler).\u003c/li>\n\u003cli>Kullanıcıyı oluştur, doğru \u003cstrong>grupları\u003c/strong> ekle (izinler gruplarla verilir).\u003c/li>\n\u003cli>Lisansı ata (kullanım konumunu unutma).\u003c/li>\n\u003cli>İlk şifreyi güvenli ilet (ilk girişte değiştirme zorunlu), MFA kaydını yaptır.\u003c/li>\n\u003cli>Posta kutusu, Teams, ortak klasör ve gerekli uygulama erişimlerini ver.\u003c/li>\n\u003cli>Bilgisayarı hazırla (Autopilot ya da elle kurulum), Intune&#39;a kaydet.\u003c/li>\n\u003cli>Kullanıcıya kısa bir kullanım notu ve destek iletişim bilgisini ver.\u003c/li>\n\u003cli>Ticket&#39;a yaz: ne verildi, ne zaman, kim onayladı.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-5-isten-ayrilma-offboarding-adimlari\">5. İşten Ayrılma (Offboarding) Adımları\u003c/h2>\n\u003cp>Sırayla:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Hesabı engelle\u003c/strong> (Block sign-in) ve \u003cstrong>oturumları sonlandır\u003c/strong> (Revoke sessions).\u003c/li>\n\u003cli>Şifreyi sıfırla (bilinmeyen rastgele bir şifre).\u003c/li>\n\u003cli>MFA yöntemlerini kaldır.\u003c/li>\n\u003cli>Posta kutusunu \u003cstrong>Shared mailbox\u003c/strong>&#39;a çevir, \u003cstrong>sonra\u003c/strong> lisansı al (posta kutusu verisi korunur, 50 GB&#39;a kadar lisans gerekmez).\u003c/li>\n\u003cli>Gerekirse e-postayı yöneticiye devret (yetki ver) ya da yönlendir.\u003c/li>\n\u003cli>Gruplardan çıkar, ekip/dosya sahipliğini devret (Teams, SharePoint).\u003c/li>\n\u003cli>OneDrive verisini yöneticiye devret (kullanıcı silinince OneDrive belirli süre saklanır, varsayılan 30 gün).\u003c/li>\n\u003cli>Cihazı geri al, Intune&#39;dan \u003cstrong>Retire\u003c/strong> veya \u003cstrong>Wipe\u003c/strong> yap.\u003c/li>\n\u003cli>Telefon, kart, anahtar, VPN, üçüncü taraf uygulama erişimlerini kapat.\u003c/li>\n\u003cli>Bir süre sonra (kurum politikasına göre) hesabı sil.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-6-entra-id-kavramlari\">6. Entra ID Kavramları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kavram\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Tenant\u003c/td>\n\u003ctd>Firmanın bulut kimlik alanı (örn. \u003ccode>firma.onmicrosoft.com\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanıcı türleri\u003c/td>\n\u003ctd>Member (çalışan), Guest (dış kullanıcı/misafir)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gruplar\u003c/td>\n\u003ctd>Security grup (izin), Microsoft 365 grup (Teams/ortak posta ile), Dynamic (kurala göre otomatik)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Roller\u003c/td>\n\u003ctd>Global Administrator, User Administrator, \u003cstrong>Helpdesk Administrator\u003c/strong>, Password Administrator, Exchange Administrator\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MFA\u003c/td>\n\u003ctd>Şifrenin yanında ikinci doğrulama (uygulama bildirimi, kod, FIDO anahtarı)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SSPR\u003c/td>\n\u003ctd>Kullanıcının şifresini kendi sıfırlaması (Self-Service Password Reset)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Conditional Access\u003c/td>\n\u003ctd>Koşullu erişim: &quot;Ofis dışından giriş için MFA şart&quot;, &quot;uyumsuz cihaz erişemez&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cihaz türleri\u003c/td>\n\u003ctd>Entra joined (sadece bulut), Hybrid joined (hem yerel AD hem Entra), Registered (kişisel cihaz)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Entra Connect\u003c/td>\n\u003ctd>Yerel AD ile Entra ID arasında kullanıcı/şifre eşitleme aracı\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Eşitlemeyi hemen başlatma (Entra Connect sunucusunda):\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Start-ADSyncSyncCycle -PolicyType Delta\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Oturum açma sorunlarında ilk bakılacak yer:\u003c/strong>\nEntra admin center &gt; \u003cstrong>Monitoring &gt; Sign-in logs\u003c/strong>. Kullanıcıyı filtrele; hatanın nedenini (MFA, Conditional Access, yanlış şifre, engelli hesap) orada görürsün.\u003c/p>\n\u003ch2 id=\"s-7-exchange-online-isleri\">7. Exchange Online İşleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>İş\u003c/th>\n\u003cth>Nasıl\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Paylaşılan posta kutusu\u003c/td>\n\u003ctd>EAC &gt; Recipients &gt; Mailboxes &gt; Add a shared mailbox\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yetki verme\u003c/td>\n\u003ctd>Mailbox &gt; Delegation: \u003cstrong>Read and manage\u003c/strong> (Full Access), \u003cstrong>Send as\u003c/strong>, \u003cstrong>Send on behalf\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-posta yönlendirme\u003c/td>\n\u003ctd>Mailbox &gt; Mail flow settings &gt; Email forwarding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Otomatik yanıt (OOF)\u003c/td>\n\u003ctd>Kullanıcı Outlook&#39;tan ya da yönetici EAC&#39;den\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dağıtım listesi\u003c/td>\n\u003ctd>Recipients &gt; Groups\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Posta izleme\u003c/td>\n\u003ctd>Mail flow &gt; \u003cstrong>Message trace\u003c/strong> (mail nerede kaldı?)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Karantina\u003c/td>\n\u003ctd>\u003ccode>security.microsoft.com\u003c/code> &gt; Email &amp; collaboration &gt; Review &gt; Quarantine\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Silinen öğeleri kurtarma\u003c/td>\n\u003ctd>Outlook &gt; Deleted Items &gt; &quot;Recover items recently removed&quot;\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>PowerShell (Exchange Online):\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Connect-ExchangeOnline\nGet-Mailbox -Identity ali@firma.com\nSet-Mailbox ali@firma.com -Type Shared\nAdd-MailboxPermission -Identity ortak@firma.com -User ali@firma.com -AccessRights FullAccess -AutoMapping $true\nAdd-RecipientPermission -Identity ortak@firma.com -Trustee ali@firma.com -AccessRights SendAs\nSet-Mailbox ali@firma.com -ForwardingSmtpAddress yonetici@firma.com -DeliverToMailboxAndForward $true\nGet-MailboxStatistics ali@firma.com | Select DisplayName, TotalItemSize\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-8-teams-sharepoint-onedrive\">8. Teams, SharePoint, OneDrive\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Teams:\u003c/strong> Ekip (Team) → kanallar; bir Team arkada bir Microsoft 365 grubudur, sahip/üye ayrımı vardır. Sahipsiz kalan ekibe sahip ata.\u003c/li>\n\u003cli>\u003cstrong>SharePoint:\u003c/strong> Site koleksiyonları ve kitaplıklar. İzni mümkünse \u003cstrong>gruplara\u003c/strong> ver, tek tek kullanıcıya değil.\u003c/li>\n\u003cli>\u003cstrong>OneDrive:\u003c/strong> Kişisel depolama; \u003cstrong>Known Folder Move\u003c/strong> ile Masaüstü/Belgeler/Resimler otomatik OneDrive&#39;a yedeklenir.\u003c/li>\n\u003cli>\u003cstrong>Paylaşım sorunu:\u003c/strong> Dış paylaşım yönetici tarafından kapatılmış olabilir (SharePoint admin center &gt; Policies &gt; Sharing).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-9-intune-cihaz-y-netimi\">9. Intune (Cihaz Yönetimi)\u003c/h2>\n\u003ch3 id=\"s-9-1-kayit-y-ntemleri\">9.1 Kayıt yöntemleri\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Yöntem\u003c/th>\n\u003cth>Ne zaman\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Autopilot\u003c/strong>\u003c/td>\n\u003ctd>Yeni cihaz kutudan çıkar, kullanıcı giriş yapar, ayarlar ve uygulamalar otomatik gelir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Elle kayıt\u003c/td>\n\u003ctd>Ayarlar &gt; Hesaplar &gt; İş veya okul erişimi &gt; Bağlan\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Toplu kayıt (bulk)\u003c/td>\n\u003ctd>Çok sayıda cihaz için paket\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BYOD\u003c/td>\n\u003ctd>Kişisel telefon, sınırlı yönetim (uygulama koruma)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Autopilot için\u003c/strong> cihazın donanım karması (hardware hash) Intune&#39;a eklenir. Üretici/bayi de ekleyebilir.\u003c/p>\n\u003ch3 id=\"s-9-2-temel-bilesenler\">9.2 Temel bileşenler\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bileşen\u003c/th>\n\u003cth>Görevi\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Compliance policy\u003c/td>\n\u003ctd>&quot;Uyumlu cihaz&quot; kuralları: BitLocker açık, antivirüs aktif, minimum işletim sistemi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Configuration profile\u003c/td>\n\u003ctd>Ayarları dağıtma: Wi-Fi, VPN, güvenlik duvarı, masaüstü kısıtları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>App deployment\u003c/td>\n\u003ctd>Uygulama dağıtımı: Microsoft Store, Win32 (\u003ccode>.intunewin\u003c/code> paketi), M365 Apps\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Update rings\u003c/td>\n\u003ctd>Windows güncellemelerinin ne zaman/nasıl uygulanacağı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Company Portal\u003c/td>\n\u003ctd>Kullanıcının kendi uygulamalarını yüklediği/cihazını gördüğü uygulama\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-9-3-uzaktan-islemler-cihaz-actions\">9.3 Uzaktan işlemler (cihaz &gt; actions)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>İşlem\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Sync\u003c/td>\n\u003ctd>Cihazı politikaları hemen çekmeye zorlar (ilk deneyeceğin şey)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Restart\u003c/td>\n\u003ctd>Uzaktan yeniden başlat\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Remote lock\u003c/td>\n\u003ctd>Cihazı kilitle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Retire\u003c/strong>\u003c/td>\n\u003ctd>Firma verisini ve yönetimi kaldırır, kişisel veriye dokunmaz\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Wipe\u003c/strong>\u003c/td>\n\u003ctd>Cihazı fabrika ayarlarına döndürür (çalıntı/kayıp, devir)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fresh Start\u003c/td>\n\u003ctd>Windows&#39;u yeniler, yönetimi korur\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Collect diagnostics\u003c/td>\n\u003ctd>Tanılama günlüğü toplar\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Wipe geri dönüşsüzdür\u003c/strong>, onay almadan çalıştırma.\u003c/p>\n\u003ch3 id=\"s-9-4-bitlocker-kurtarma-anahtari\">9.4 BitLocker kurtarma anahtarı\u003c/h3>\n\u003cp>Kullanıcı kurtarma anahtarı isterse: Entra/Intune &gt; Devices &gt; cihaz &gt; \u003cstrong>Recovery keys\u003c/strong> ya da kullanıcı kendi hesabında \u003ccode>myaccount.microsoft.com\u003c/code> &gt; Devices. Kimliği doğrulamadan anahtarı verme.\u003c/p>\n\u003ch2 id=\"s-10-sik-sorunlar-ve-ilk-adimlar\">10. Sık Sorunlar ve İlk Adımlar\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Belirti\u003c/th>\n\u003cth>Kontrol / Çözüm\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Kullanıcı giriş yapamıyor\u003c/td>\n\u003ctd>Sign-in logs; hesap engelli mi, şifre/MFA, Conditional Access, lisans\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Outlook sürekli şifre soruyor\u003c/td>\n\u003ctd>Windows Kimlik Bilgisi Yöneticisi&#39;nde Office/Outlook kayıtlarını sil, oturumu kapatıp aç, gerekirse profili yeniden oluştur\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Mail gelmiyor\u003c/td>\n\u003ctd>Message trace, karantina, posta kutusu dolu mu, gönderici engelli mi, mail flow kuralları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Mail gönderemiyor\u003c/td>\n\u003ctd>Alıcı adresi, kutu doluluğu, gönderme limiti, hesap ele geçirilmiş olabilir (spam gönderimi)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OneDrive eşitlemiyor\u003c/td>\n\u003ctd>Disk dolu mu, dosya adı/yol çok uzun mu, simge hatası; sıfırlama: \u003ccode>%localappdata%\\Microsoft\\OneDrive\\onedrive.exe /reset\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Teams açılmıyor/donuyor\u003c/td>\n\u003ctd>Çıkış yap, önbelleği temizle, web sürümünü test et, güncelle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MFA telefonu kayıp\u003c/td>\n\u003ctd>Kimliği doğrula, MFA&#39;yı sıfırla (Bölüm 3), oturumları iptal et, yeni kayıt yaptır\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Lisans atanamıyor&quot;\u003c/td>\n\u003ctd>Kullanım konumu seçili mi, boş lisans var mı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cihaz &quot;uyumsuz&quot; görünüyor\u003c/td>\n\u003ctd>Cihazı Sync et; Compliance sekmesinde hangi kural başarısız bak (BitLocker, antivirüs, güncelleme)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Uygulama Intune&#39;dan inmiyor\u003c/td>\n\u003ctd>Cihaz internete bağlı mı, kullanıcı gruba dahil mi, atama türü (Required/Available)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Şirket hesabı eklenmiyor\u003c/td>\n\u003ctd>Tarih/saat, ağ, kullanıcı cihaz limiti, eski kayıt (cihazı Entra&#39;dan sil, yeniden ekle)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-11-powershell-ile-y-netim-microsoft-graph\">11. PowerShell ile Yönetim (Microsoft Graph)\u003c/h2>\n\u003cp>Eski \u003ccode>AzureAD\u003c/code> ve \u003ccode>MSOnline\u003c/code> modülleri kullanımdan kalkıyor, yerine \u003cstrong>Microsoft Graph PowerShell\u003c/strong> kullanılır.\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Install-Module Microsoft.Graph -Scope CurrentUser\nConnect-MgGraph -Scopes &quot;User.ReadWrite.All&quot;,&quot;Group.ReadWrite.All&quot;\n\nGet-MgUser -All | Select DisplayName, UserPrincipalName, AccountEnabled\nGet-MgUser -UserId ali@firma.com | Format-List\nUpdate-MgUser -UserId ali@firma.com -AccountEnabled:$false      # Hesabı engelle\nRevoke-MgUserSignInSession -UserId ali@firma.com                  # Oturumları sonlandır\nGet-MgUserLicenseDetail -UserId ali@firma.com                     # Lisansları gör\nDisconnect-MgGraph\n\u003c/code>\u003c/pre>\n\u003cp>Toplu işlemlerde önce 1-2 kullanıcıyla test et.\u003c/p>\n\u003ch2 id=\"s-12-lisans-mantigi-kisa\">12. Lisans Mantığı (Kısa)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Paket\u003c/th>\n\u003cth>Genel içerik\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Business Basic\u003c/td>\n\u003ctd>Web/mobil Office, Exchange, Teams, OneDrive\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Business Standard\u003c/td>\n\u003ctd>Basic + masaüstü Office uygulamaları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Business Premium\u003c/td>\n\u003ctd>Standard + gelişmiş güvenlik + Intune/cihaz yönetimi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E3 / E5\u003c/td>\n\u003ctd>Kurumsal paketler, E5&#39;te gelişmiş güvenlik ve analiz\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Fiyat ve içerik zamanla değişir, kesin bilgi için Microsoft&#39;un güncel lisans sayfasına bak.\u003c/p>\n\u003ch2 id=\"s-13-azure-ve-bulut-temelleri\">13. Azure ve Bulut Temelleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kavram\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IaaS / PaaS / SaaS\u003c/td>\n\u003ctd>Altyapı (VM) / Platform (uygulama ortamı) / Yazılım (M365 gibi hazır hizmet)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Paylaşılan sorumluluk\u003c/td>\n\u003ctd>Bulut sağlayıcı altyapıyı, \u003cstrong>sen\u003c/strong> verini, hesaplarını ve ayarlarını korursun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Subscription\u003c/td>\n\u003ctd>Faturalama ve yönetim kapsamı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resource Group\u003c/td>\n\u003ctd>İlişkili kaynakların kutusu (VM, disk, ağ)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VM\u003c/td>\n\u003ctd>Bulutta sanal sunucu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Storage Account\u003c/td>\n\u003ctd>Blob, dosya, kuyruk, tablo depolama\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VNet / NSG\u003c/td>\n\u003ctd>Sanal ağ / ağ güvenlik kuralları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Region / Availability Zone\u003c/td>\n\u003ctd>Coğrafi bölge / bölge içi fiziksel ayrım\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RBAC\u003c/td>\n\u003ctd>Rol tabanlı yetkilendirme (Owner, Contributor, Reader)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cost Management\u003c/td>\n\u003ctd>Harcama takibi, bütçe uyarısı (\u003cstrong>kullanılmayan VM&#39;i kapat/sil\u003c/strong>)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-14-ogrenme-ve-sertifika-yolu\">14. Öğrenme ve Sertifika Yolu\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sertifika\u003c/th>\n\u003cth>Konu\u003c/th>\n\u003cth>Seviye\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>MS-900\u003c/td>\n\u003ctd>Microsoft 365 temelleri\u003c/td>\n\u003ctd>Başlangıç\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AZ-900\u003c/td>\n\u003ctd>Azure temelleri\u003c/td>\n\u003ctd>Başlangıç\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SC-900\u003c/td>\n\u003ctd>Güvenlik, uyumluluk, kimlik temelleri\u003c/td>\n\u003ctd>Başlangıç\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MD-102\u003c/td>\n\u003ctd>Endpoint Administrator (Intune)\u003c/td>\n\u003ctd>Orta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SC-300\u003c/td>\n\u003ctd>Identity and Access Administrator (Entra)\u003c/td>\n\u003ctd>Orta\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AZ-104\u003c/td>\n\u003ctd>Azure Administrator\u003c/td>\n\u003ctd>Orta\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Sınav kodları ve içerikler değişebilir, güncel durumu Microsoft Learn&#39;den doğrula. Microsoft Learn ücretsiz eğitim yolları sunar.\u003c/p>\n\u003cp>\u003cstrong>Pratik:\u003c/strong> M365 deneme (trial) kiracısı aç, kullanıcı/grup/lisans/MFA/Intune kaydını kendin dene. Deneme ve geliştirici programı koşulları değişebilir, güncel durumu kontrol et.\u003c/p>\n\u003ch2 id=\"s-15-hizli-kontrol-karti\">15. Hızlı Kontrol Kartı\u003c/h2>\n\u003cul>\n\u003cli>Kullanıcı sorunu → \u003cstrong>Sign-in logs\u003c/strong>\u003c/li>\n\u003cli>Mail sorunu → \u003cstrong>Message trace\u003c/strong>\u003c/li>\n\u003cli>Cihaz sorunu → \u003cstrong>Intune &gt; Sync\u003c/strong>, compliance detayı\u003c/li>\n\u003cli>Lisans sorunu → \u003cstrong>Kullanım konumu\u003c/strong> + boş lisans\u003c/li>\n\u003cli>Güvenlik şüphesi → Şifre sıfırla + \u003cstrong>Revoke sessions\u003c/strong> + mail kurallarına bak (gizli yönlendirme)\u003c/li>\n\u003cli>Her işlemi ticket&#39;a yaz\u003c/li>\n\u003c/ul>\n","sections":[{"id":"s-bulut-ve-kimlik-y-netimi-rehberi","title":"Bulut ve Kimlik Yönetimi Rehberi","level":1,"path":"","isTitle":true,"text":"Microsoft 365 · Entra ID · Exchange Online · Intune · Azure Temelleri\nGünümüzde birçok firmada kullanıcı, posta ve cihaz yönetimi artık bulutta yapılıyor. Bu rehber, IT destek olarak günlük işlerde hızlıca bakacağın notları içerir.\nPortal arayüzleri ve menü isimleri sık değişir. Menü birebir aynı değilse arama kutusunu kullan. Komut ve kavramlar daha kalıcıdır."},{"id":"s-1-buyuk-resim","title":"1. Büyük Resim","level":2,"path":"","isTitle":false,"text":"Ürün\nNe işe yarar\nMicrosoft 365\nLisans paketi: Office uygulamaları, Exchange (posta), Teams, SharePoint, OneDrive\nEntra ID (eski adı Azure AD)\nBulut kimlik servisi: kullanıcılar, gruplar, MFA, oturum açma, Conditional Access\nExchange Online\nBulut e-posta sunucusu\nIntune\nCihaz ve uygulama yönetimi (MDM/MAM): bilgisayar, telefon, tablet\nDefender\nGüvenlik: antivirüs, e-posta koruması, uç nokta güvenliği\nAzure\nGenel bulut platformu: sanal makine, depolama, ağ\nMantık: Kullanıcı Entra ID'de tanımlanır → lisans atanır → lisansa göre servisler (posta, Teams, OneDrive) açılır → cihaz Intune ile yönetilir."},{"id":"s-2-y-netim-portallari","title":"2. Yönetim Portalları","level":2,"path":"","isTitle":false,"text":"Portal\nAdres\nKullanım\nMicrosoft 365 admin center\nadmin.microsoft.com\nKullanıcı, lisans, faturalama\nEntra admin center\nentra.microsoft.com\nKimlik, MFA, gruplar, oturum günlükleri\nExchange admin center\nadmin.exchange.microsoft.com\nPosta kutuları, mail akışı\nIntune admin center\nintune.microsoft.com\nCihaz, uygulama, politika\nTeams admin center\nadmin.teams.microsoft.com\nTeams ayarları\nDefender portalı\nsecurity.microsoft.com\nGüvenlik, karantina, olaylar\nAzure portalı\nportal.azure.com\nAzure kaynakları\nKullanıcı hesabım\nmyaccount.microsoft.com\nKullanıcının kendi güvenlik ayarları"},{"id":"s-3-gunluk-kullanici-isleri","title":"3. Günlük Kullanıcı İşleri","level":2,"path":"","isTitle":false,"text":"İş\nNerede / Nasıl\nNot\nYeni kullanıcı\nM365 admin > Users > Active users > Add a user\nÖnce kullanım konumu (usage location) seçilmeli, yoksa lisans atanmaz\nLisans atama/alma\nKullanıcı > Licenses and apps\nLisans boşaltınca posta kutusu silinebilir, dikkat (bkz. Bölüm 5)\nŞifre sıfırlama\nKullanıcı > Reset password\nKimlik doğrulamayı unutma\nMFA sıfırlama\nEntra > Users > kullanıcı > Authentication methods > Require re-register MFA ve Revoke MFA sessions\nTelefon kaybında\nHesabı engelleme\nKullanıcı > Block sign-in\nSilmek yerine önce engelle\nGruba ekleme\nKullanıcı > Groups, ya da grup > Members\nDinamik grupta elle ekleme olmaz\nTakma e-posta (alias)\nKullanıcı > Manage username and email\nSilinen kullanıcıyı geri alma\nUsers > Deleted users\nSilindikten sonra yaklaşık 30 gün içinde\nYönetici rolü verme\nKullanıcı > Assigned roles\nEn az yetki: gerekmedikçe Global Admin verme"},{"id":"s-4-ise-giris-onboarding-adimlari","title":"4. İşe Giriş (Onboarding) Adımları","level":2,"path":"","isTitle":false,"text":"Yöneticiden onay ve bilgi al (ad, departman, başlangıç tarihi, yönetici, hangi erişimler).\nKullanıcıyı oluştur, doğru grupları ekle (izinler gruplarla verilir).\nLisansı ata (kullanım konumunu unutma).\nİlk şifreyi güvenli ilet (ilk girişte değiştirme zorunlu), MFA kaydını yaptır.\nPosta kutusu, Teams, ortak klasör ve gerekli uygulama erişimlerini ver.\nBilgisayarı hazırla (Autopilot ya da elle kurulum), Intune'a kaydet.\nKullanıcıya kısa bir kullanım notu ve destek iletişim bilgisini ver.\nTicket'a yaz: ne verildi, ne zaman, kim onayladı."},{"id":"s-5-isten-ayrilma-offboarding-adimlari","title":"5. İşten Ayrılma (Offboarding) Adımları","level":2,"path":"","isTitle":false,"text":"Sırayla:\nHesabı engelle (Block sign-in) ve oturumları sonlandır (Revoke sessions).\nŞifreyi sıfırla (bilinmeyen rastgele bir şifre).\nMFA yöntemlerini kaldır.\nPosta kutusunu Shared mailbox'a çevir, sonra lisansı al (posta kutusu verisi korunur, 50 GB'a kadar lisans gerekmez).\nGerekirse e-postayı yöneticiye devret (yetki ver) ya da yönlendir.\nGruplardan çıkar, ekip/dosya sahipliğini devret (Teams, SharePoint).\nOneDrive verisini yöneticiye devret (kullanıcı silinince OneDrive belirli süre saklanır, varsayılan 30 gün).\nCihazı geri al, Intune'dan Retire veya Wipe yap.\nTelefon, kart, anahtar, VPN, üçüncü taraf uygulama erişimlerini kapat.\nBir süre sonra (kurum politikasına göre) hesabı sil."},{"id":"s-6-entra-id-kavramlari","title":"6. Entra ID Kavramları","level":2,"path":"","isTitle":false,"text":"Kavram\nAnlamı\nTenant\nFirmanın bulut kimlik alanı (örn. firma.onmicrosoft.com)\nKullanıcı türleri\nMember (çalışan), Guest (dış kullanıcı/misafir)\nGruplar\nSecurity grup (izin), Microsoft 365 grup (Teams/ortak posta ile), Dynamic (kurala göre otomatik)\nRoller\nGlobal Administrator, User Administrator, Helpdesk Administrator, Password Administrator, Exchange Administrator\nMFA\nŞifrenin yanında ikinci doğrulama (uygulama bildirimi, kod, FIDO anahtarı)\nSSPR\nKullanıcının şifresini kendi sıfırlaması (Self-Service Password Reset)\nConditional Access\nKoşullu erişim: \"Ofis dışından giriş için MFA şart\", \"uyumsuz cihaz erişemez\"\nCihaz türleri\nEntra joined (sadece bulut), Hybrid joined (hem yerel AD hem Entra), Registered (kişisel cihaz)\nEntra Connect\nYerel AD ile Entra ID arasında kullanıcı/şifre eşitleme aracı\nEşitlemeyi hemen başlatma (Entra Connect sunucusunda):\nStart-ADSyncSyncCycle -PolicyType Delta\nOturum açma sorunlarında ilk bakılacak yer:\nEntra admin center > Monitoring > Sign-in logs. Kullanıcıyı filtrele; hatanın nedenini (MFA, Conditional Access, yanlış şifre, engelli hesap) orada görürsün."},{"id":"s-7-exchange-online-isleri","title":"7. Exchange Online İşleri","level":2,"path":"","isTitle":false,"text":"İş\nNasıl\nPaylaşılan posta kutusu\nEAC > Recipients > Mailboxes > Add a shared mailbox\nYetki verme\nMailbox > Delegation: Read and manage (Full Access), Send as, Send on behalf\nE-posta yönlendirme\nMailbox > Mail flow settings > Email forwarding\nOtomatik yanıt (OOF)\nKullanıcı Outlook'tan ya da yönetici EAC'den\nDağıtım listesi\nRecipients > Groups\nPosta izleme\nMail flow > Message trace (mail nerede kaldı?)\nKarantina\nsecurity.microsoft.com > Email & collaboration > Review > Quarantine\nSilinen öğeleri kurtarma\nOutlook > Deleted Items > \"Recover items recently removed\"\nPowerShell (Exchange Online):\nConnect-ExchangeOnline\nGet-Mailbox -Identity ali@firma.com\nSet-Mailbox ali@firma.com -Type Shared\nAdd-MailboxPermission -Identity ortak@firma.com -User ali@firma.com -AccessRights FullAccess -AutoMapping $true\nAdd-RecipientPermission -Identity ortak@firma.com -Trustee ali@firma.com -AccessRights SendAs\nSet-Mailbox ali@firma.com -ForwardingSmtpAddress yonetici@firma.com -DeliverToMailboxAndForward $true\nGet-MailboxStatistics ali@firma.com | Select DisplayName, TotalItemSize"},{"id":"s-8-teams-sharepoint-onedrive","title":"8. Teams, SharePoint, OneDrive","level":2,"path":"","isTitle":false,"text":"Teams: Ekip (Team) → kanallar; bir Team arkada bir Microsoft 365 grubudur, sahip/üye ayrımı vardır. Sahipsiz kalan ekibe sahip ata.\nSharePoint: Site koleksiyonları ve kitaplıklar. İzni mümkünse gruplara ver, tek tek kullanıcıya değil.\nOneDrive: Kişisel depolama; Known Folder Move ile Masaüstü/Belgeler/Resimler otomatik OneDrive'a yedeklenir.\nPaylaşım sorunu: Dış paylaşım yönetici tarafından kapatılmış olabilir (SharePoint admin center > Policies > Sharing)."},{"id":"s-9-intune-cihaz-y-netimi","title":"9. Intune (Cihaz Yönetimi)","level":2,"path":"","isTitle":false,"text":""},{"id":"s-9-1-kayit-y-ntemleri","title":"9.1 Kayıt yöntemleri","level":3,"path":"9. Intune (Cihaz Yönetimi)","isTitle":false,"text":"Yöntem\nNe zaman\nAutopilot\nYeni cihaz kutudan çıkar, kullanıcı giriş yapar, ayarlar ve uygulamalar otomatik gelir\nElle kayıt\nAyarlar > Hesaplar > İş veya okul erişimi > Bağlan\nToplu kayıt (bulk)\nÇok sayıda cihaz için paket\nBYOD\nKişisel telefon, sınırlı yönetim (uygulama koruma)\nAutopilot için cihazın donanım karması (hardware hash) Intune'a eklenir. Üretici/bayi de ekleyebilir."},{"id":"s-9-2-temel-bilesenler","title":"9.2 Temel bileşenler","level":3,"path":"9. Intune (Cihaz Yönetimi)","isTitle":false,"text":"Bileşen\nGörevi\nCompliance policy\n\"Uyumlu cihaz\" kuralları: BitLocker açık, antivirüs aktif, minimum işletim sistemi\nConfiguration profile\nAyarları dağıtma: Wi-Fi, VPN, güvenlik duvarı, masaüstü kısıtları\nApp deployment\nUygulama dağıtımı: Microsoft Store, Win32 (.intunewin paketi), M365 Apps\nUpdate rings\nWindows güncellemelerinin ne zaman/nasıl uygulanacağı\nCompany Portal\nKullanıcının kendi uygulamalarını yüklediği/cihazını gördüğü uygulama"},{"id":"s-9-3-uzaktan-islemler-cihaz-actions","title":"9.3 Uzaktan işlemler (cihaz > actions)","level":3,"path":"9. Intune (Cihaz Yönetimi)","isTitle":false,"text":"İşlem\nAnlamı\nSync\nCihazı politikaları hemen çekmeye zorlar (ilk deneyeceğin şey)\nRestart\nUzaktan yeniden başlat\nRemote lock\nCihazı kilitle\nRetire\nFirma verisini ve yönetimi kaldırır, kişisel veriye dokunmaz\nWipe\nCihazı fabrika ayarlarına döndürür (çalıntı/kayıp, devir)\nFresh Start\nWindows'u yeniler, yönetimi korur\nCollect diagnostics\nTanılama günlüğü toplar\nWipe geri dönüşsüzdür, onay almadan çalıştırma."},{"id":"s-9-4-bitlocker-kurtarma-anahtari","title":"9.4 BitLocker kurtarma anahtarı","level":3,"path":"9. Intune (Cihaz Yönetimi)","isTitle":false,"text":"Kullanıcı kurtarma anahtarı isterse: Entra/Intune > Devices > cihaz > Recovery keys ya da kullanıcı kendi hesabında myaccount.microsoft.com > Devices. Kimliği doğrulamadan anahtarı verme."},{"id":"s-10-sik-sorunlar-ve-ilk-adimlar","title":"10. Sık Sorunlar ve İlk Adımlar","level":2,"path":"","isTitle":false,"text":"Belirti\nKontrol / Çözüm\nKullanıcı giriş yapamıyor\nSign-in logs; hesap engelli mi, şifre/MFA, Conditional Access, lisans\nOutlook sürekli şifre soruyor\nWindows Kimlik Bilgisi Yöneticisi'nde Office/Outlook kayıtlarını sil, oturumu kapatıp aç, gerekirse profili yeniden oluştur\nMail gelmiyor\nMessage trace, karantina, posta kutusu dolu mu, gönderici engelli mi, mail flow kuralları\nMail gönderemiyor\nAlıcı adresi, kutu doluluğu, gönderme limiti, hesap ele geçirilmiş olabilir (spam gönderimi)\nOneDrive eşitlemiyor\nDisk dolu mu, dosya adı/yol çok uzun mu, simge hatası; sıfırlama: %localappdata%\\Microsoft\\OneDrive\\onedrive.exe /reset\nTeams açılmıyor/donuyor\nÇıkış yap, önbelleği temizle, web sürümünü test et, güncelle\nMFA telefonu kayıp\nKimliği doğrula, MFA'yı sıfırla (Bölüm 3), oturumları iptal et, yeni kayıt yaptır\n\"Lisans atanamıyor\"\nKullanım konumu seçili mi, boş lisans var mı\nCihaz \"uyumsuz\" görünüyor\nCihazı Sync et; Compliance sekmesinde hangi kural başarısız bak (BitLocker, antivirüs, güncelleme)\nUygulama Intune'dan inmiyor\nCihaz internete bağlı mı, kullanıcı gruba dahil mi, atama türü (Required/Available)\nŞirket hesabı eklenmiyor\nTarih/saat, ağ, kullanıcı cihaz limiti, eski kayıt (cihazı Entra'dan sil, yeniden ekle)"},{"id":"s-11-powershell-ile-y-netim-microsoft-graph","title":"11. PowerShell ile Yönetim (Microsoft Graph)","level":2,"path":"","isTitle":false,"text":"Eski AzureAD ve MSOnline modülleri kullanımdan kalkıyor, yerine Microsoft Graph PowerShell kullanılır.\nInstall-Module Microsoft.Graph -Scope CurrentUser\nConnect-MgGraph -Scopes \"User.ReadWrite.All\",\"Group.ReadWrite.All\"\nGet-MgUser -All | Select DisplayName, UserPrincipalName, AccountEnabled\nGet-MgUser -UserId ali@firma.com | Format-List\nUpdate-MgUser -UserId ali@firma.com -AccountEnabled:$false      # Hesabı engelle\nRevoke-MgUserSignInSession -UserId ali@firma.com                  # Oturumları sonlandır\nGet-MgUserLicenseDetail -UserId ali@firma.com                     # Lisansları gör\nDisconnect-MgGraph\nToplu işlemlerde önce 1-2 kullanıcıyla test et."},{"id":"s-12-lisans-mantigi-kisa","title":"12. Lisans Mantığı (Kısa)","level":2,"path":"","isTitle":false,"text":"Paket\nGenel içerik\nBusiness Basic\nWeb/mobil Office, Exchange, Teams, OneDrive\nBusiness Standard\nBasic + masaüstü Office uygulamaları\nBusiness Premium\nStandard + gelişmiş güvenlik + Intune/cihaz yönetimi\nE3 / E5\nKurumsal paketler, E5'te gelişmiş güvenlik ve analiz\nFiyat ve içerik zamanla değişir, kesin bilgi için Microsoft'un güncel lisans sayfasına bak."},{"id":"s-13-azure-ve-bulut-temelleri","title":"13. Azure ve Bulut Temelleri","level":2,"path":"","isTitle":false,"text":"Kavram\nAnlamı\nIaaS / PaaS / SaaS\nAltyapı (VM) / Platform (uygulama ortamı) / Yazılım (M365 gibi hazır hizmet)\nPaylaşılan sorumluluk\nBulut sağlayıcı altyapıyı, sen verini, hesaplarını ve ayarlarını korursun\nSubscription\nFaturalama ve yönetim kapsamı\nResource Group\nİlişkili kaynakların kutusu (VM, disk, ağ)\nVM\nBulutta sanal sunucu\nStorage Account\nBlob, dosya, kuyruk, tablo depolama\nVNet / NSG\nSanal ağ / ağ güvenlik kuralları\nRegion / Availability Zone\nCoğrafi bölge / bölge içi fiziksel ayrım\nRBAC\nRol tabanlı yetkilendirme (Owner, Contributor, Reader)\nCost Management\nHarcama takibi, bütçe uyarısı (kullanılmayan VM'i kapat/sil)"},{"id":"s-14-ogrenme-ve-sertifika-yolu","title":"14. Öğrenme ve Sertifika Yolu","level":2,"path":"","isTitle":false,"text":"Sertifika\nKonu\nSeviye\nMS-900\nMicrosoft 365 temelleri\nBaşlangıç\nAZ-900\nAzure temelleri\nBaşlangıç\nSC-900\nGüvenlik, uyumluluk, kimlik temelleri\nBaşlangıç\nMD-102\nEndpoint Administrator (Intune)\nOrta\nSC-300\nIdentity and Access Administrator (Entra)\nOrta\nAZ-104\nAzure Administrator\nOrta\nSınav kodları ve içerikler değişebilir, güncel durumu Microsoft Learn'den doğrula. Microsoft Learn ücretsiz eğitim yolları sunar.\nPratik: M365 deneme (trial) kiracısı aç, kullanıcı/grup/lisans/MFA/Intune kaydını kendin dene. Deneme ve geliştirici programı koşulları değişebilir, güncel durumu kontrol et."},{"id":"s-15-hizli-kontrol-karti","title":"15. Hızlı Kontrol Kartı","level":2,"path":"","isTitle":false,"text":"Kullanıcı sorunu → Sign-in logs\nMail sorunu → Message trace\nCihaz sorunu → Intune > Sync, compliance detayı\nLisans sorunu → Kullanım konumu + boş lisans\nGüvenlik şüphesi → Şifre sıfırla + Revoke sessions + mail kurallarına bak (gizli yönlendirme)\nHer işlemi ticket'a yaz"}]},{"slug":"guvenlik","file":"03-guvenlik-olay-mudahale-rehberi.md","title":"Bilgi Güvenliği ve Olay Müdahale Rehberi","short":"Güvenlik ve Olay Müdahale","desc":"Phishing analizi, fidye yazılımı, hesap ele geçirme, Event ID logları, sıkılaştırma","words":1990,"html":"\u003ch1 id=\"s-bilgi-guvenligi-ve-olay-mudahale-rehberi\">Bilgi Güvenliği ve Olay Müdahale Rehberi\u003c/h1>\n\u003cp>\u003cstrong>IT destek ve sistem yönetimi için savunma odaklı notlar\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Bu rehber savunma ve müdahale amaçlıdır. Tarama/test araçlarını \u003cstrong>sadece yetkin olduğun ve izin aldığın\u003c/strong> ağlarda kullan. Yetkisiz tarama suçtur.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s-1-temel-ilkeler\">1. Temel İlkeler\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>İlke\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>CIA üçlüsü\u003c/strong>\u003c/td>\n\u003ctd>Gizlilik (Confidentiality), Bütünlük (Integrity), Erişilebilirlik (Availability)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Defense in depth\u003c/td>\n\u003ctd>Tek önleme güvenme, çok katmanlı koruma\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Least privilege\u003c/td>\n\u003ctd>Kullanıcıya sadece işi için gereken yetki\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Zero trust\u003c/td>\n\u003ctd>&quot;Asla güvenme, her zaman doğrula&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Need to know\u003c/td>\n\u003ctd>Bilgiye yalnızca ihtiyacı olan erişir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Separation of duties\u003c/td>\n\u003ctd>Kritik işler tek kişide toplanmaz\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-2-yaygin-tehditler-ve-savunma\">2. Yaygın Tehditler ve Savunma\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tehdit\u003c/th>\n\u003cth>Nedir\u003c/th>\n\u003cth>Savunma\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Phishing\u003c/td>\n\u003ctd>Sahte e-posta/site ile bilgi çalma\u003c/td>\n\u003ctd>Farkındalık, e-posta filtreleme, MFA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BEC (iş e-postası dolandırıcılığı)\u003c/td>\n\u003ctd>Yönetici/tedarikçi gibi davranıp para/bilgi isteme\u003c/td>\n\u003ctd>Ödeme doğrulama prosedürü (telefonla geri arama)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fidye yazılımı\u003c/td>\n\u003ctd>Dosyaları şifreleyip fidye isteme\u003c/td>\n\u003ctd>Güncel yedek (çevrimdışı dahil), yama, MFA, ağ bölümleme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kaba kuvvet / şifre deneme\u003c/td>\n\u003ctd>Çok sayıda şifre deneme\u003c/td>\n\u003ctd>Hesap kilitleme, MFA, güçlü şifre\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kimlik bilgisi doldurma\u003c/td>\n\u003ctd>Sızan şifreleri başka sitede deneme\u003c/td>\n\u003ctd>Her yerde farklı şifre, MFA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kötü amaçlı yazılım\u003c/td>\n\u003ctd>Virüs, trojan, casus yazılım\u003c/td>\n\u003ctd>Antivirüs/EDR, güncelleme, kullanıcı yetkisini kısma\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sosyal mühendislik\u003c/td>\n\u003ctd>İnsanı kandırma (telefon, yüz yüze)\u003c/td>\n\u003ctd>Kimlik doğrulama prosedürü, eğitim\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>İç tehdit\u003c/td>\n\u003ctd>Yetkili kullanıcının kötüye kullanımı\u003c/td>\
