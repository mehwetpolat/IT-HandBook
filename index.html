n\u003ctd>Loglama, yetki gözden geçirme\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DDoS\u003c/td>\n\u003ctd>Hizmeti aşırı yükle durdurma\u003c/td>\n\u003ctd>Sağlayıcı koruması, hız sınırlama\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güncellenmemiş sistem\u003c/td>\n\u003ctd>Bilinen açıklardan saldırı\u003c/td>\n\u003ctd>Düzenli yama yönetimi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-3-supheli-e-posta-phishing-mudahalesi\">3. Şüpheli E-posta (Phishing) Müdahalesi\u003c/h2>\n\u003ch3 id=\"s-3-1-kullanici-bildirdiginde\">3.1 Kullanıcı bildirdiğinde\u003c/h3>\n\u003col>\n\u003cli>Kullanıcıya \u003cstrong>tıklamamasını\u003c/strong>, eki açmamasını, yanıtlamamasını söyle.\u003c/li>\n\u003cli>Tıkladı/şifre girdiyse hemen \u003cstrong>Bölüm 5\u003c/strong> (hesap ele geçirilmesi) adımlarına geç.\u003c/li>\n\u003cli>E-postayı ek olarak (başlıklarıyla) topla, ekran görüntüsü al.\u003c/li>\n\u003cli>Aynı e-postayı \u003cstrong>başka kimler aldı?\u003c/strong> Mesaj izleme/arama ile bul.\u003c/li>\n\u003cli>Gönderen/alan adı ve bağlantıları engelle, e-postaları tüm kutulardan temizle (yetkin varsa).\u003c/li>\n\u003cli>Güvenlik sorumlusunu bilgilendir, olayı kaydet.\u003c/li>\n\u003cli>Kullanıcıya teşekkür et, geri bildirim ver (bildirimi teşvik et).\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"s-3-2-phishing-isaretleri\">3.2 Phishing işaretleri\u003c/h3>\n\u003cul>\n\u003cli>Aciliyet/korku (&quot;hesabınız kapanacak&quot;, &quot;hemen ödeme&quot;)\u003c/li>\n\u003cli>Gönderen adresi şirketle benzer ama farklı (\u003ccode>firma-destek.com\u003c/code>, \u003ccode>rnicrosoft\u003c/code>)\u003c/li>\n\u003cli>Bağlantının üzerine gelince görünen adres farklı\u003c/li>\n\u003cli>Beklenmeyen ek (özellikle .zip, .iso, .html, makrolu Office, .exe, .lnk)\u003c/li>\n\u003cli>Genel hitap (&quot;Sayın müşteri&quot;), yazım/dil hataları\u003c/li>\n\u003cli>Şifre, kart, kod isteği\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-3-3-baslik-header-analizi\">3.3 Başlık (header) analizi\u003c/h3>\n\u003cp>Başlıkta bak:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Authentication-Results:\u003c/strong> \u003ccode>spf=pass/fail\u003c/code>, \u003ccode>dkim=pass/fail\u003c/code>, \u003ccode>dmarc=pass/fail\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>From\u003c/strong> ile \u003cstrong>Return-Path / Reply-To\u003c/strong> uyuşuyor mu?\u003c/li>\n\u003cli>\u003cstrong>Received\u003c/strong> zinciri: gerçek gönderici sunucu\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kayıt\u003c/th>\n\u003cth>Görevi\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>SPF\u003c/td>\n\u003ctd>Bu alan adı için hangi sunucular e-posta gönderebilir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DKIM\u003c/td>\n\u003ctd>İmza ile e-postanın değişmediğini doğrular\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DMARC\u003c/td>\n\u003ctd>SPF/DKIM başarısızsa ne yapılacağını söyler (none/quarantine/reject)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-3-4-guvenli-kontrol\">3.4 Güvenli kontrol\u003c/h3>\n\u003cul>\n\u003cli>Bağlantıyı tıklamadan kontrol: VirusTotal, urlscan.io (kurum politikası izin veriyorsa)\u003c/li>\n\u003cli>Ek dosyayı \u003cstrong>kullanıcının bilgisayarında açma\u003c/strong>, izole ortamda/sandbox&#39;ta incele\u003c/li>\n\u003cli>Şüpheli dosyanın hash&#39;ini kontrol et\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-4-fidye-yazilimi-ransomware-mudahale-karti\">4. Fidye Yazılımı (Ransomware) Müdahale Kartı\u003c/h2>\n\u003cp>\u003cstrong>Belirtiler:\u003c/strong> Dosya uzantıları değişti, açılmıyor, fidye notu, ağ paylaşımlarında toplu değişiklik.\u003c/p>\n\u003cp>\u003cstrong>İlk dakikalar:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Yayılmayı durdur:\u003c/strong> Etkilenen cihazı ağdan ayır (kabloyu çek, Wi-Fi kapat, switch portunu kapat).\u003c/li>\n\u003cli>Cihazı kapatmadan önce yetkili kişiye danış (adli inceleme için bellek bilgisi önemli olabilir). Ağdan ayıramıyorsan talimatla kapatmayı değerlendir.\u003c/li>\n\u003cli>\u003cstrong>Yöneticiyi/güvenlik sorumlusunu hemen ara.\u003c/strong> Kendi başına fidye ödeme kararı verme.\u003c/li>\n\u003cli>Etkilenen cihaz/paylaşım listesi çıkar, \u003cstrong>ne zaman başladı\u003c/strong> not al.\u003c/li>\n\u003cli>Ağdaki diğer paylaşımları (dosya sunucusu) korumak için erişimi kes.\u003c/li>\n\u003cli>Yedeklerin \u003cstrong>etkilenip etkilenmediğini\u003c/strong> kontrol et (çevrimdışı/ayrı kopya).\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Sonra:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Kaynağı bul (hangi kullanıcı/e-posta/cihaz), ilk giriş noktasını kapat\u003c/li>\n\u003cli>Ortamı temizle, \u003cstrong>temiz yedekten\u003c/strong> geri yükle (etkilenen sistemi yeniden kur, sadece &quot;temizleme&quot;ye güvenme)\u003c/li>\n\u003cli>Tüm ilgili hesapların şifrelerini değiştir, oturumları iptal et\u003c/li>\n\u003cli>Güvenlik açığını kapat (yama, MFA, ağ bölümleme)\u003c/li>\n\u003cli>Yasal/kurumsal bildirim yükümlülüklerini yönetimle değerlendir (Bölüm 12)\u003c/li>\n\u003cli>Olay sonrası değerlendirme yap\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Yapma:\u003c/strong> Şifreli dosyaları silme/yeniden adlandırma, kanıt yok etme, acele ile temizleme, yönetime haber vermeden dış kişilerle iletişim.\u003c/p>\n\u003ch2 id=\"s-5-hesap-ele-gecirilmesi-suphesi\">5. Hesap Ele Geçirilmesi Şüphesi\u003c/h2>\n\u003cp>\u003cstrong>Belirtiler:\u003c/strong> Kullanıcının bilmediği gönderilmiş e-postalar, olağandışı konumdan giriş, bilinmeyen MFA bildirimi, posta kuralları, şifre değişimi.\u003c/p>\n\u003col>\n\u003cli>Şifreyi \u003cstrong>sıfırla\u003c/strong> (güçlü, rastgele), \u003cstrong>tüm oturumları iptal et\u003c/strong> (Revoke sessions).\u003c/li>\n\u003cli>MFA yöntemlerini gözden geçir, tanınmayan cihaz/yöntemi kaldır, gerekirse yeniden kaydettir.\u003c/li>\n\u003cli>\u003cstrong>Posta kurallarını kontrol et:\u003c/strong> Gizli yönlendirme (forwarding), &quot;gelenleri sil/taşı&quot; kuralları saldırganların bıraktığı yaygın izlerdir.\u003c/li>\n\u003cli>Giriş günlüklerini incele: Entra \u003cstrong>Sign-in logs\u003c/strong> (konum, IP, uygulama, başarı/başarısız).\u003c/li>\n\u003cli>Kullanıcının hesabıyla yetkilendirilmiş şüpheli uygulamaları/OAuth izinlerini kaldır.\u003c/li>\n\u003cli>Hesapla gönderilen e-postaların alıcılarını belirle, gerekirse uyar.\u003c/li>\n\u003cli>Aynı şifreyi başka yerlerde kullandıysa onları da değiştirtir.\u003c/li>\n\u003cli>Cihazda zararlı olup olmadığını tara.\u003c/li>\n\u003cli>Olayı kaydet ve bildir.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-6-kayip-calinti-cihaz\">6. Kayıp/Çalıntı Cihaz\u003c/h2>\n\u003col>\n\u003cli>Kullanıcıdan ne zaman/nerede kaybolduğunu ve içeriğini (veri, erişimler) öğren.\u003c/li>\n\u003cli>Cihaz \u003cstrong>BitLocker/şifreleme\u003c/strong> ile korunuyor mu? (Evetse risk çok daha düşük.)\u003c/li>\n\u003cli>Intune ile \u003cstrong>Remote lock\u003c/strong> veya \u003cstrong>Wipe\u003c/strong> (kurum politikasına göre).\u003c/li>\n\u003cli>Hesap oturumlarını iptal et, şifreyi değiştir, saklı kimlik bilgilerini geçersiz kıl.\u003c/li>\n\u003cli>VPN/sertifika/uygulama erişimlerini kapat.\u003c/li>\n\u003cli>Gerekirse emniyete bildirim, yönetime rapor.\u003c/li>\n\u003cli>Cihazı envanterde &quot;kayıp&quot; olarak işaretle.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-7-olay-mudahale-asamalari-nist-modeli\">7. Olay Müdahale Aşamaları (NIST Modeli)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Aşama\u003c/th>\n\u003cth>Ne yapılır\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1. Hazırlık\u003c/td>\n\u003ctd>Politika, iletişim listesi, araçlar, yedek, eğitim\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2. Tespit ve analiz\u003c/td>\n\u003ctd>Belirtiyi doğrula, kapsamı belirle, önceliklendir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. Sınırlama, yok etme, kurtarma\u003c/td>\n\u003ctd>İzole et → nedeni kaldır → sistemleri güvenle geri getir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. Olay sonrası\u003c/td>\n\u003ctd>Ders çıkarma, raporlama, önlem ekleme\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>İlk 15 dakika kontrol listesi:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ne oldu, ne zaman fark edildi?\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Hangi sistem/kullanıcı etkilendi?\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yayılıyor mu? → izole et\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kanıtı koru (ekran görüntüsü, log, \u003cstrong>hiçbir şeyi silme\u003c/strong>)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Doğru kişiyi/yöneticiyi bilgilendir\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ticket/olay kaydı aç, saatleri not al\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-8-log-okuma\">8. Log Okuma\u003c/h2>\n\u003ch3 id=\"s-8-1-windows-guvenlik-olay-kimlikleri\">8.1 Windows Güvenlik Olay Kimlikleri\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>4624\u003c/td>\n\u003ctd>Başarılı oturum açma\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4625\u003c/td>\n\u003ctd>\u003cstrong>Başarısız\u003c/strong> oturum açma\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4634 / 4647\u003c/td>\n\u003ctd>Oturum kapatma\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4648\u003c/td>\n\u003ctd>Açık kimlik bilgisiyle giriş denemesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4672\u003c/td>\n\u003ctd>Özel (yönetici) yetkili oturum\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4688\u003c/td>\n\u003ctd>Yeni işlem (process) oluşturuldu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4720\u003c/td>\n\u003ctd>Kullanıcı hesabı oluşturuldu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4722 / 4725\u003c/td>\n\u003ctd>Hesap etkinleştirildi / devre dışı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4724 / 4723\u003c/td>\n\u003ctd>Şifre sıfırlama / değiştirme denemesi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4728 / 4732\u003c/td>\n\u003ctd>Kullanıcı gruba eklendi (global / yerel)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4740\u003c/td>\n\u003ctd>Hesap kilitlendi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1102\u003c/td>\n\u003ctd>Güvenlik günlüğü \u003cstrong>temizlendi\u003c/strong> (şüpheli!)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Oturum türleri (4624/4625 Logon Type):\u003c/strong> 2 = yerel, 3 = ağ, 10 = uzak masaüstü (RDP).\u003c/p>\n\u003cp>\u003cstrong>Hesap kilidinin kaynağını bulma:\u003c/strong> DC&#39;de \u003ccode>4740\u003c/code> olayı &quot;Caller Computer Name&quot; alanını gösterir.\u003c/p>\n\u003cp>\u003cstrong>Çok sayıda başarısız oturum açma (PowerShell):\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625; StartTime=(Get-Date).AddHours(-24)} |\n  Select-Object TimeCreated, @{n='Kullanici';e={$_.Properties[5].Value}}, @{n='KaynakIP';e={$_.Properties[19].Value}} |\n  Group-Object Kullanici | Sort-Object Count -Descending | Select-Object -First 10\n\u003c/code>\u003c/pre>\n\u003cp>Yönetici olarak çalıştır. Tek kullanıcıya çok deneme = şifre deneme saldırısı olabilir.\u003c/p>\n\u003ch3 id=\"s-8-2-linux\">8.2 Linux\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">sudo grep &quot;Failed password&quot; /var/log/auth.log | tail -20      # Başarısız SSH girişleri\nsudo grep &quot;Accepted&quot; /var/log/auth.log | tail -20             # Başarılı girişler\nlast -n 20                                                    # Son girişler\nsudo lastb | head                                             # Başarısız girişler\nsudo journalctl -u ssh --since &quot;1 hour ago&quot;\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-9-sikilastirma-kontrol-listeleri\">9. Sıkılaştırma Kontrol Listeleri\u003c/h2>\n\u003ch3 id=\"s-9-1-is-istasyonu\">9.1 İş istasyonu\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Disk şifreleme (BitLocker), TPM aktif\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Windows Update ve uygulama güncellemeleri otomatik\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Defender/EDR açık ve güncel\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Günlük kullanımda \u003cstrong>standart kullanıcı\u003c/strong>, yönetici yetkisi ayrı hesapta\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yerel yönetici şifresi her cihazda \u003cstrong>farklı\u003c/strong> (Windows LAPS)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> SMBv1 kapalı, gereksiz servisler kapalı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ekran kilidi (otomatik, 5-10 dk)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> USB depolama kısıtı (gerekirse)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Güvenlik duvarı açık\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-9-2-sunucu\">9.2 Sunucu\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Gereksiz rol/servis/port kapalı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yönetici erişimi sınırlı, ayrı yönetici hesabı\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> RDP: doğrudan internete açma, VPN arkasında, MFA, ağ düzeyi kimlik doğrulama (NLA)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yama ve yedek düzeni\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Günlükleme açık, merkezi log\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Varsayılan şifreleri değiştir\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-9-3-ag\">9.3 Ağ\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Varsayılan cihaz şifreleri değişmiş\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Telnet kapalı, \u003cstrong>SSH\u003c/strong> açık\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kullanılmayan portlar kapalı, port güvenliği\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yönetim arayüzü ayrı VLAN&#39;da\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Misafir Wi-Fi ayrı VLAN/izole\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Wi-Fi: \u003cstrong>WPA2/WPA3\u003c/strong>, güçlü parola (kurumsalda 802.1X/RADIUS)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Firmware güncel\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Config yedekleri güvenli yerde\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-9-4-hesap-ve-kimlik\">9.4 Hesap ve kimlik\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> MFA herkeste, özellikle yönetici ve e-posta\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ortak hesap yok, paylaşılan şifre yok\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Ayrılan çalışanın hesabı derhal kapanır\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yönetici gruplarının üyeleri düzenli gözden geçirilir\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Servis hesapları minimum yetkili, güçlü şifreli\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-10-guvenlik-duvari-vpn-wi-fi\">10. Güvenlik Duvarı, VPN, Wi-Fi\u003c/h2>\n\u003cp>\u003cstrong>Güvenlik duvarı mantığı:\u003c/strong> Varsayılan \u003cstrong>gelen trafik reddedilir\u003c/strong>, sadece gerekenlere izin verilir. Kurallar yukarıdan aşağı değerlendirilir, ilk eşleşen uygulanır. Kural ekleme nedenini not et.\u003c/p>\n\u003cpre>\u003ccode>netsh advfirewall show allprofiles                       # Windows güvenlik duvarı durumu\nnetsh advfirewall firewall show rule name=all | more\nsudo ufw status verbose                                  # Ubuntu\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>VPN türü\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IPsec / IKEv2\u003c/td>\n\u003ctd>Kurumsal, yaygın\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SSL VPN\u003c/td>\n\u003ctd>Tarayıcı/istemci tabanlı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WireGuard\u003c/td>\n\u003ctd>Hızlı, basit, ev laboratuvarı için ideal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OpenVPN\u003c/td>\n\u003ctd>Esnek, yaygın\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Split tunnel\u003c/td>\n\u003ctd>Sadece kurumsal trafik VPN&#39;den, internet doğrudan (güvenlik/performans takası)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-11-acik-y-netimi-ve-savunma-araclari\">11. Açık Yönetimi ve Savunma Araçları\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Yama yönetimi:\u003c/strong> Envanteri bil → yamaları öncelik sırasıyla uygula (internete açık ve kritik sistemler önce) → doğrula\u003c/li>\n\u003cli>\u003cstrong>Defender komutları:\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-MpComputerStatus\nUpdate-MpSignature\nStart-MpScan -ScanType QuickScan\nGet-MpThreatDetection\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Kendi ağında\u003c/strong> (izinli) cihaz keşfi: \u003ccode>nmap -sn 192.168.1.0/24\u003c/code> (canlı cihazlar), \u003ccode>nmap -sV 192.168.1.20\u003c/code> (açık portlar ve servis sürümü). Amaç: beklenmeyen açık port ve cihazları bulmak.\u003c/li>\n\u003cli>Wireshark: ağ sorunlarını ve şüpheli trafiği analiz etmek için\u003c/li>\n\u003cli>Sysinternals: Autoruns (başlangıçta çalışanlar), Process Explorer, TCPView\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-12-sifre-kimlik-ve-veri-koruma\">12. Şifre, Kimlik ve Veri Koruma\u003c/h2>\n\u003cp>\u003cstrong>Şifre:\u003c/strong> Uzunluk, karmaşıklıktan daha önemli. Uzun parola ibareleri (passphrase) önerilir. Sızıntı/şüphe olmadıkça düzenli zorunlu değişim eskisi kadar önerilmiyor. \u003cstrong>Her hesap için farklı şifre\u003c/strong> + \u003cstrong>şifre yöneticisi\u003c/strong> (Bitwarden, KeePass vb.).\u003c/p>\n\u003cp>\u003cstrong>MFA güç sırası (genelde):\u003c/strong> FIDO2/güvenlik anahtarı &gt; kimlik doğrulama uygulaması (numara eşleştirme) &gt; SMS (en zayıf, yine de hiç olmamasından iyi).\u003c/p>\n\u003cp>\u003cstrong>KVKK / veri koruma farkındalığı (Türkiye):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Kişisel veri: kimlik, iletişim, sağlık, finans, çalışan bilgileri\u003c/li>\n\u003cli>Veri ihlalinde ilgili makama bildirim süresi kısadır (mevzuata göre \u003cstrong>72 saat\u003c/strong> gibi); bu karar yönetim/hukuk/KVKK sorumlusuna aittir. Sen ihlali \u003cstrong>hemen\u003c/strong> yukarı bildir.\u003c/li>\n\u003cli>Ulusal siber olaylar için USOM (TR-CERT) bildirim kanalı vardır; kurumun prosedürüne bak.\u003c/li>\n\u003cli>Kişisel veriyi kendi cihazına/kişisel e-postana kopyalama; gereksiz veri toplama/saklama\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-13-kullanici-farkindaligi-icin-kisa-kurallar\">13. Kullanıcı Farkındalığı İçin Kısa Kurallar\u003c/h2>\n\u003cul>\n\u003cli>Tanımadığın bağlantıya/ekte tıklama, şüpheliyi \u003cstrong>IT&#39;ye ilet\u003c/strong>\u003c/li>\n\u003cli>Şifreni \u003cstrong>kimseyle paylaşma\u003c/strong>, IT sana şifreni sormaz\u003c/li>\n\u003cli>Bilmediğin USB&#39;yi bilgisayara takma\u003c/li>\n\u003cli>Ekranı kilitle (Win+L)\u003c/li>\n\u003cli>Yabancıya kapıyı açma, rozetsiz kişiyi sor\u003c/li>\n\u003cli>Masada şifre notu bırakma\u003c/li>\n\u003cli>Para/ödeme taleplerini ikinci kanaldan (telefon) doğrula\u003c/li>\n\u003cli>Kişisel ve iş verisini ayır\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-14-kimlik-dogrulama-proseduru-it-destek-icin\">14. Kimlik Doğrulama Prosedürü (IT Destek İçin)\u003c/h2>\n\u003cp>Telefonla gelen şifre/MFA sıfırlama talebinde:\u003c/p>\n\u003col>\n\u003cli>Kullanıcı adı ve çalışan numarası/doğum tarihi gibi \u003cstrong>bilgi\u003c/strong> sor\u003c/li>\n\u003cli>Kayıtlı telefon numarasından/yöneticiden \u003cstrong>geri arama\u003c/strong> veya yönetici onayı\u003c/li>\n\u003cli>Şüphe varsa işlem \u003cstrong>yapma\u003c/strong>, yöneticiye danış\u003c/li>\n\u003cli>İşlemi ve doğrulama yöntemini ticket&#39;a yaz\u003c/li>\n\u003c/ol>\n\u003cp>Saldırganlar sık sık &quot;acil toplantıdayım, hemen lazım&quot; baskısı kullanır. \u003cstrong>Baskı bir uyarı işaretidir.\u003c/strong>\u003c/p>\n\u003ch2 id=\"s-15-olay-raporu-sablonu\">15. Olay Raporu Şablonu\u003c/h2>\n\u003cpre>\u003ccode>OLAY RAPORU\nOlay No / Tarih-Saat:\nBildiren kişi:\nOlay türü: (phishing / hesap ele geçirme / zararlı yazılım / veri kaybı / kayıp cihaz / diğer)\nEtkilenen sistem/kullanıcılar:\nÖzet:\nZaman çizelgesi:\n  - hh:mm  ...\n  - hh:mm  ...\nAlınan önlemler:\nKök neden (biliniyorsa):\nDurum: (açık / sınırlandı / çözüldü)\nVeri etkisi: (kişisel/gizli veri var mı)\nKimler bilgilendirildi:\nAlınan dersler / önleyici aksiyonlar:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-16-ogrenme-yolu\">16. Öğrenme Yolu\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kaynak\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>CompTIA Security+\u003c/td>\n\u003ctd>Genel güvenlik temeli, sektörde yaygın\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Microsoft SC-900\u003c/td>\n\u003ctd>Microsoft güvenlik ve kimlik temelleri\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TryHackMe (SOC Level 1, Pre-Security)\u003c/td>\n\u003ctd>Uygulamalı, savunma odaklı yollar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blue team laboratuvarları\u003c/td>\n\u003ctd>Log analizi, Wazuh/Security Onion gibi araçlar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NIST Cybersecurity Framework\u003c/td>\n\u003ctd>Çerçeve düşüncesi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Sertifika ve platform içerikleri değişebilir, güncel bilgi için resmi sitelere bak.\u003c/p>\n","sections":[{"id":"s-bilgi-guvenligi-ve-olay-mudahale-rehberi","title":"Bilgi Güvenliği ve Olay Müdahale Rehberi","level":1,"path":"","isTitle":true,"text":"IT destek ve sistem yönetimi için savunma odaklı notlar\nBu rehber savunma ve müdahale amaçlıdır. Tarama/test araçlarını sadece yetkin olduğun ve izin aldığın ağlarda kullan. Yetkisiz tarama suçtur."},{"id":"s-1-temel-ilkeler","title":"1. Temel İlkeler","level":2,"path":"","isTitle":false,"text":"İlke\nAnlamı\nCIA üçlüsü\nGizlilik (Confidentiality), Bütünlük (Integrity), Erişilebilirlik (Availability)\nDefense in depth\nTek önleme güvenme, çok katmanlı koruma\nLeast privilege\nKullanıcıya sadece işi için gereken yetki\nZero trust\n\"Asla güvenme, her zaman doğrula\"\nNeed to know\nBilgiye yalnızca ihtiyacı olan erişir\nSeparation of duties\nKritik işler tek kişide toplanmaz"},{"id":"s-2-yaygin-tehditler-ve-savunma","title":"2. Yaygın Tehditler ve Savunma","level":2,"path":"","isTitle":false,"text":"Tehdit\nNedir\nSavunma\nPhishing\nSahte e-posta/site ile bilgi çalma\nFarkındalık, e-posta filtreleme, MFA\nBEC (iş e-postası dolandırıcılığı)\nYönetici/tedarikçi gibi davranıp para/bilgi isteme\nÖdeme doğrulama prosedürü (telefonla geri arama)\nFidye yazılımı\nDosyaları şifreleyip fidye isteme\nGüncel yedek (çevrimdışı dahil), yama, MFA, ağ bölümleme\nKaba kuvvet / şifre deneme\nÇok sayıda şifre deneme\nHesap kilitleme, MFA, güçlü şifre\nKimlik bilgisi doldurma\nSızan şifreleri başka sitede deneme\nHer yerde farklı şifre, MFA\nKötü amaçlı yazılım\nVirüs, trojan, casus yazılım\nAntivirüs/EDR, güncelleme, kullanıcı yetkisini kısma\nSosyal mühendislik\nİnsanı kandırma (telefon, yüz yüze)\nKimlik doğrulama prosedürü, eğitim\nİç tehdit\nYetkili kullanıcının kötüye kullanımı\nLoglama, yetki gözden geçirme\nDDoS\nHizmeti aşırı yükle durdurma\nSağlayıcı koruması, hız sınırlama\nGüncellenmemiş sistem\nBilinen açıklardan saldırı\nDüzenli yama yönetimi"},{"id":"s-3-supheli-e-posta-phishing-mudahalesi","title":"3. Şüpheli E-posta (Phishing) Müdahalesi","level":2,"path":"","isTitle":false,"text":""},{"id":"s-3-1-kullanici-bildirdiginde","title":"3.1 Kullanıcı bildirdiğinde","level":3,"path":"3. Şüpheli E-posta (Phishing) Müdahalesi","isTitle":false,"text":"Kullanıcıya tıklamamasını, eki açmamasını, yanıtlamamasını söyle.\nTıkladı/şifre girdiyse hemen Bölüm 5 (hesap ele geçirilmesi) adımlarına geç.\nE-postayı ek olarak (başlıklarıyla) topla, ekran görüntüsü al.\nAynı e-postayı başka kimler aldı? Mesaj izleme/arama ile bul.\nGönderen/alan adı ve bağlantıları engelle, e-postaları tüm kutulardan temizle (yetkin varsa).\nGüvenlik sorumlusunu bilgilendir, olayı kaydet.\nKullanıcıya teşekkür et, geri bildirim ver (bildirimi teşvik et)."},{"id":"s-3-2-phishing-isaretleri","title":"3.2 Phishing işaretleri","level":3,"path":"3. Şüpheli E-posta (Phishing) Müdahalesi","isTitle":false,"text":"Aciliyet/korku (\"hesabınız kapanacak\", \"hemen ödeme\")\nGönderen adresi şirketle benzer ama farklı (firma-destek.com, rnicrosoft)\nBağlantının üzerine gelince görünen adres farklı\nBeklenmeyen ek (özellikle .zip, .iso, .html, makrolu Office, .exe, .lnk)\nGenel hitap (\"Sayın müşteri\"), yazım/dil hataları\nŞifre, kart, kod isteği"},{"id":"s-3-3-baslik-header-analizi","title":"3.3 Başlık (header) analizi","level":3,"path":"3. Şüpheli E-posta (Phishing) Müdahalesi","isTitle":false,"text":"Başlıkta bak:\nAuthentication-Results: spf=pass/fail, dkim=pass/fail, dmarc=pass/fail\nFrom ile Return-Path / Reply-To uyuşuyor mu?\nReceived zinciri: gerçek gönderici sunucu\nKayıt\nGörevi\nSPF\nBu alan adı için hangi sunucular e-posta gönderebilir\nDKIM\nİmza ile e-postanın değişmediğini doğrular\nDMARC\nSPF/DKIM başarısızsa ne yapılacağını söyler (none/quarantine/reject)"},{"id":"s-3-4-guvenli-kontrol","title":"3.4 Güvenli kontrol","level":3,"path":"3. Şüpheli E-posta (Phishing) Müdahalesi","isTitle":false,"text":"Bağlantıyı tıklamadan kontrol: VirusTotal, urlscan.io (kurum politikası izin veriyorsa)\nEk dosyayı kullanıcının bilgisayarında açma, izole ortamda/sandbox'ta incele\nŞüpheli dosyanın hash'ini kontrol et"},{"id":"s-4-fidye-yazilimi-ransomware-mudahale-karti","title":"4. Fidye Yazılımı (Ransomware) Müdahale Kartı","level":2,"path":"","isTitle":false,"text":"Belirtiler: Dosya uzantıları değişti, açılmıyor, fidye notu, ağ paylaşımlarında toplu değişiklik.\nİlk dakikalar:\nYayılmayı durdur: Etkilenen cihazı ağdan ayır (kabloyu çek, Wi-Fi kapat, switch portunu kapat).\nCihazı kapatmadan önce yetkili kişiye danış (adli inceleme için bellek bilgisi önemli olabilir). Ağdan ayıramıyorsan talimatla kapatmayı değerlendir.\nYöneticiyi/güvenlik sorumlusunu hemen ara. Kendi başına fidye ödeme kararı verme.\nEtkilenen cihaz/paylaşım listesi çıkar, ne zaman başladı not al.\nAğdaki diğer paylaşımları (dosya sunucusu) korumak için erişimi kes.\nYedeklerin etkilenip etkilenmediğini kontrol et (çevrimdışı/ayrı kopya).\nSonra:\nKaynağı bul (hangi kullanıcı/e-posta/cihaz), ilk giriş noktasını kapat\nOrtamı temizle, temiz yedekten geri yükle (etkilenen sistemi yeniden kur, sadece \"temizleme\"ye güvenme)\nTüm ilgili hesapların şifrelerini değiştir, oturumları iptal et\nGüvenlik açığını kapat (yama, MFA, ağ bölümleme)\nYasal/kurumsal bildirim yükümlülüklerini yönetimle değerlendir (Bölüm 12)\nOlay sonrası değerlendirme yap\nYapma: Şifreli dosyaları silme/yeniden adlandırma, kanıt yok etme, acele ile temizleme, yönetime haber vermeden dış kişilerle iletişim."},{"id":"s-5-hesap-ele-gecirilmesi-suphesi","title":"5. Hesap Ele Geçirilmesi Şüphesi","level":2,"path":"","isTitle":false,"text":"Belirtiler: Kullanıcının bilmediği gönderilmiş e-postalar, olağandışı konumdan giriş, bilinmeyen MFA bildirimi, posta kuralları, şifre değişimi.\nŞifreyi sıfırla (güçlü, rastgele), tüm oturumları iptal et (Revoke sessions).\nMFA yöntemlerini gözden geçir, tanınmayan cihaz/yöntemi kaldır, gerekirse yeniden kaydettir.\nPosta kurallarını kontrol et: Gizli yönlendirme (forwarding), \"gelenleri sil/taşı\" kuralları saldırganların bıraktığı yaygın izlerdir.\nGiriş günlüklerini incele: Entra Sign-in logs (konum, IP, uygulama, başarı/başarısız).\nKullanıcının hesabıyla yetkilendirilmiş şüpheli uygulamaları/OAuth izinlerini kaldır.\nHesapla gönderilen e-postaların alıcılarını belirle, gerekirse uyar.\nAynı şifreyi başka yerlerde kullandıysa onları da değiştirtir.\nCihazda zararlı olup olmadığını tara.\nOlayı kaydet ve bildir."},{"id":"s-6-kayip-calinti-cihaz","title":"6. Kayıp/Çalıntı Cihaz","level":2,"path":"","isTitle":false,"text":"Kullanıcıdan ne zaman/nerede kaybolduğunu ve içeriğini (veri, erişimler) öğren.\nCihaz BitLocker/şifreleme ile korunuyor mu? (Evetse risk çok daha düşük.)\nIntune ile Remote lock veya Wipe (kurum politikasına göre).\nHesap oturumlarını iptal et, şifreyi değiştir, saklı kimlik bilgilerini geçersiz kıl.\nVPN/sertifika/uygulama erişimlerini kapat.\nGerekirse emniyete bildirim, yönetime rapor.\nCihazı envanterde \"kayıp\" olarak işaretle."},{"id":"s-7-olay-mudahale-asamalari-nist-modeli","title":"7. Olay Müdahale Aşamaları (NIST Modeli)","level":2,"path":"","isTitle":false,"text":"Aşama\nNe yapılır\n1. Hazırlık\nPolitika, iletişim listesi, araçlar, yedek, eğitim\n2. Tespit ve analiz\nBelirtiyi doğrula, kapsamı belirle, önceliklendir\n3. Sınırlama, yok etme, kurtarma\nİzole et → nedeni kaldır → sistemleri güvenle geri getir\n4. Olay sonrası\nDers çıkarma, raporlama, önlem ekleme\nİlk 15 dakika kontrol listesi:\nNe oldu, ne zaman fark edildi?\n Hangi sistem/kullanıcı etkilendi?\n Yayılıyor mu? → izole et\n Kanıtı koru (ekran görüntüsü, log, hiçbir şeyi silme)\n Doğru kişiyi/yöneticiyi bilgilendir\n Ticket/olay kaydı aç, saatleri not al"},{"id":"s-8-log-okuma","title":"8. Log Okuma","level":2,"path":"","isTitle":false,"text":""},{"id":"s-8-1-windows-guvenlik-olay-kimlikleri","title":"8.1 Windows Güvenlik Olay Kimlikleri","level":3,"path":"8. Log Okuma","isTitle":false,"text":"ID\nAnlamı\n4624\nBaşarılı oturum açma\n4625\nBaşarısız oturum açma\n4634 / 4647\nOturum kapatma\n4648\nAçık kimlik bilgisiyle giriş denemesi\n4672\nÖzel (yönetici) yetkili oturum\n4688\nYeni işlem (process) oluşturuldu\n4720\nKullanıcı hesabı oluşturuldu\n4722 / 4725\nHesap etkinleştirildi / devre dışı\n4724 / 4723\nŞifre sıfırlama / değiştirme denemesi\n4728 / 4732\nKullanıcı gruba eklendi (global / yerel)\n4740\nHesap kilitlendi\n1102\nGüvenlik günlüğü temizlendi (şüpheli!)\nOturum türleri (4624/4625 Logon Type): 2 = yerel, 3 = ağ, 10 = uzak masaüstü (RDP).\nHesap kilidinin kaynağını bulma: DC'de 4740 olayı \"Caller Computer Name\" alanını gösterir.\nÇok sayıda başarısız oturum açma (PowerShell):\nGet-WinEvent -FilterHashtable @{LogName='Security'; Id=4625; StartTime=(Get-Date).AddHours(-24)} |\n  Select-Object TimeCreated, @{n='Kullanici';e={$_.Properties[5].Value}}, @{n='KaynakIP';e={$_.Properties[19].Value}} |\n  Group-Object Kullanici | Sort-Object Count -Descending | Select-Object -First 10\nYönetici olarak çalıştır. Tek kullanıcıya çok deneme = şifre deneme saldırısı olabilir."},{"id":"s-8-2-linux","title":"8.2 Linux","level":3,"path":"8. Log Okuma","isTitle":false,"text":"sudo grep \"Failed password\" /var/log/auth.log | tail -20      # Başarısız SSH girişleri\nsudo grep \"Accepted\" /var/log/auth.log | tail -20             # Başarılı girişler\nlast -n 20                                                    # Son girişler\nsudo lastb | head                                             # Başarısız girişler\nsudo journalctl -u ssh --since \"1 hour ago\""},{"id":"s-9-sikilastirma-kontrol-listeleri","title":"9. Sıkılaştırma Kontrol Listeleri","level":2,"path":"","isTitle":false,"text":""},{"id":"s-9-1-is-istasyonu","title":"9.1 İş istasyonu","level":3,"path":"9. Sıkılaştırma Kontrol Listeleri","isTitle":false,"text":"Disk şifreleme (BitLocker), TPM aktif\n Windows Update ve uygulama güncellemeleri otomatik\n Defender/EDR açık ve güncel\n Günlük kullanımda standart kullanıcı, yönetici yetkisi ayrı hesapta\n Yerel yönetici şifresi her cihazda farklı (Windows LAPS)\n SMBv1 kapalı, gereksiz servisler kapalı\n Ekran kilidi (otomatik, 5-10 dk)\n USB depolama kısıtı (gerekirse)\n Güvenlik duvarı açık"},{"id":"s-9-2-sunucu","title":"9.2 Sunucu","level":3,"path":"9. Sıkılaştırma Kontrol Listeleri","isTitle":false,"text":"Gereksiz rol/servis/port kapalı\n Yönetici erişimi sınırlı, ayrı yönetici hesabı\n RDP: doğrudan internete açma, VPN arkasında, MFA, ağ düzeyi kimlik doğrulama (NLA)\n Yama ve yedek düzeni\n Günlükleme açık, merkezi log\n Varsayılan şifreleri değiştir"},{"id":"s-9-3-ag","title":"9.3 Ağ","level":3,"path":"9. Sıkılaştırma Kontrol Listeleri","isTitle":false,"text":"Varsayılan cihaz şifreleri değişmiş\n Telnet kapalı, SSH açık\n Kullanılmayan portlar kapalı, port güvenliği\n Yönetim arayüzü ayrı VLAN'da\n Misafir Wi-Fi ayrı VLAN/izole\n Wi-Fi: WPA2/WPA3, güçlü parola (kurumsalda 802.1X/RADIUS)\n Firmware güncel\n Config yedekleri güvenli yerde"},{"id":"s-9-4-hesap-ve-kimlik","title":"9.4 Hesap ve kimlik","level":3,"path":"9. Sıkılaştırma Kontrol Listeleri","isTitle":false,"text":"MFA herkeste, özellikle yönetici ve e-posta\n Ortak hesap yok, paylaşılan şifre yok\n Ayrılan çalışanın hesabı derhal kapanır\n Yönetici gruplarının üyeleri düzenli gözden geçirilir\n Servis hesapları minimum yetkili, güçlü şifreli"},{"id":"s-10-guvenlik-duvari-vpn-wi-fi","title":"10. Güvenlik Duvarı, VPN, Wi-Fi","level":2,"path":"","isTitle":false,"text":"Güvenlik duvarı mantığı: Varsayılan gelen trafik reddedilir, sadece gerekenlere izin verilir. Kurallar yukarıdan aşağı değerlendirilir, ilk eşleşen uygulanır. Kural ekleme nedenini not et.\nnetsh advfirewall show allprofiles                       # Windows güvenlik duvarı durumu\nnetsh advfirewall firewall show rule name=all | more\nsudo ufw status verbose                                  # Ubuntu\nVPN türü\nNot\nIPsec / IKEv2\nKurumsal, yaygın\nSSL VPN\nTarayıcı/istemci tabanlı\nWireGuard\nHızlı, basit, ev laboratuvarı için ideal\nOpenVPN\nEsnek, yaygın\nSplit tunnel\nSadece kurumsal trafik VPN'den, internet doğrudan (güvenlik/performans takası)"},{"id":"s-11-acik-y-netimi-ve-savunma-araclari","title":"11. Açık Yönetimi ve Savunma Araçları","level":2,"path":"","isTitle":false,"text":"Yama yönetimi: Envanteri bil → yamaları öncelik sırasıyla uygula (internete açık ve kritik sistemler önce) → doğrula\nDefender komutları:\nGet-MpComputerStatus\nUpdate-MpSignature\nStart-MpScan -ScanType QuickScan\nGet-MpThreatDetection\nKendi ağında (izinli) cihaz keşfi: nmap -sn 192.168.1.0/24 (canlı cihazlar), nmap -sV 192.168.1.20 (açık portlar ve servis sürümü). Amaç: beklenmeyen açık port ve cihazları bulmak.\nWireshark: ağ sorunlarını ve şüpheli trafiği analiz etmek için\nSysinternals: Autoruns (başlangıçta çalışanlar), Process Explorer, TCPView"},{"id":"s-12-sifre-kimlik-ve-veri-koruma","title":"12. Şifre, Kimlik ve Veri Koruma","level":2,"path":"","isTitle":false,"text":"Şifre: Uzunluk, karmaşıklıktan daha önemli. Uzun parola ibareleri (passphrase) önerilir. Sızıntı/şüphe olmadıkça düzenli zorunlu değişim eskisi kadar önerilmiyor. Her hesap için farklı şifre + şifre yöneticisi (Bitwarden, KeePass vb.).\nMFA güç sırası (genelde): FIDO2/güvenlik anahtarı > kimlik doğrulama uygulaması (numara eşleştirme) > SMS (en zayıf, yine de hiç olmamasından iyi).\nKVKK / veri koruma farkındalığı (Türkiye):\nKişisel veri: kimlik, iletişim, sağlık, finans, çalışan bilgileri\nVeri ihlalinde ilgili makama bildirim süresi kısadır (mevzuata göre 72 saat gibi); bu karar yönetim/hukuk/KVKK sorumlusuna aittir. Sen ihlali hemen yukarı bildir.\nUlusal siber olaylar için USOM (TR-CERT) bildirim kanalı vardır; kurumun prosedürüne bak.\nKişisel veriyi kendi cihazına/kişisel e-postana kopyalama; gereksiz veri toplama/saklama"},{"id":"s-13-kullanici-farkindaligi-icin-kisa-kurallar","title":"13. Kullanıcı Farkındalığı İçin Kısa Kurallar","level":2,"path":"","isTitle":false,"text":"Tanımadığın bağlantıya/ekte tıklama, şüpheliyi IT'ye ilet\nŞifreni kimseyle paylaşma, IT sana şifreni sormaz\nBilmediğin USB'yi bilgisayara takma\nEkranı kilitle (Win+L)\nYabancıya kapıyı açma, rozetsiz kişiyi sor\nMasada şifre notu bırakma\nPara/ödeme taleplerini ikinci kanaldan (telefon) doğrula\nKişisel ve iş verisini ayır"},{"id":"s-14-kimlik-dogrulama-proseduru-it-destek-icin","title":"14. Kimlik Doğrulama Prosedürü (IT Destek İçin)","level":2,"path":"","isTitle":false,"text":"Telefonla gelen şifre/MFA sıfırlama talebinde:\nKullanıcı adı ve çalışan numarası/doğum tarihi gibi bilgi sor\nKayıtlı telefon numarasından/yöneticiden geri arama veya yönetici onayı\nŞüphe varsa işlem yapma, yöneticiye danış\nİşlemi ve doğrulama yöntemini ticket'a yaz\nSaldırganlar sık sık \"acil toplantıdayım, hemen lazım\" baskısı kullanır. Baskı bir uyarı işaretidir."},{"id":"s-15-olay-raporu-sablonu","title":"15. Olay Raporu Şablonu","level":2,"path":"","isTitle":false,"text":"OLAY RAPORU\nOlay No / Tarih-Saat:\nBildiren kişi:\nOlay türü: (phishing / hesap ele geçirme / zararlı yazılım / veri kaybı / kayıp cihaz / diğer)\nEtkilenen sistem/kullanıcılar:\nÖzet:\nZaman çizelgesi:\n  - hh:mm  ...\n  - hh:mm  ...\nAlınan önlemler:\nKök neden (biliniyorsa):\nDurum: (açık / sınırlandı / çözüldü)\nVeri etkisi: (kişisel/gizli veri var mı)\nKimler bilgilendirildi:\nAlınan dersler / önleyici aksiyonlar:"},{"id":"s-16-ogrenme-yolu","title":"16. Öğrenme Yolu","level":2,"path":"","isTitle":false,"text":"Kaynak\nNot\nCompTIA Security+\nGenel güvenlik temeli, sektörde yaygın\nMicrosoft SC-900\nMicrosoft güvenlik ve kimlik temelleri\nTryHackMe (SOC Level 1, Pre-Security)\nUygulamalı, savunma odaklı yollar\nBlue team laboratuvarları\nLog analizi, Wazuh/Security Onion gibi araçlar\nNIST Cybersecurity Framework\nÇerçeve düşüncesi\nSertifika ve platform içerikleri değişebilir, güncel bilgi için resmi sitelere bak."}]},{"slug":"otomasyon","file":"04-powershell-bash-otomasyon-rehberi.md","title":"PowerShell ve Bash Otomasyon Rehberi","short":"PowerShell ve Bash","desc":"Otomasyon temelleri ve tekrarlayan işler için kurumsal hazır betikler","words":1696,"html":"\u003ch1 id=\"s-powershell-ve-bash-otomasyon-rehberi\">PowerShell ve Bash Otomasyon Rehberi\u003c/h1>\n\u003cp>\u003cstrong>Tekrarlayan IT işlerini betiğe dökmek için hazır kalıplar\u003c/strong>\u003c/p>\n\u003cp>Amaç: Aynı işi üçüncü kez elle yapıyorsan betiğe dök. Bu rehberde temel mantık, güvenlik kuralları ve kopyala-uyarla örnekler var.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Altın kurallar\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Önce \u003cstrong>test ortamında\u003c/strong> veya 1-2 nesne üzerinde dene.\u003c/li>\n\u003cli>Silme/değiştirme yapan komutlarda önce \u003ccode>-WhatIf\u003c/code> ile ne olacağını gör.\u003c/li>\n\u003cli>Şifreyi betiğin içine \u003cstrong>yazma\u003c/strong>.\u003c/li>\n\u003cli>Betiğe yorum satırı ve log ekle, 6 ay sonra kendin de anlayasın.\u003c/li>\n\u003cli>Betiklerini Git ile sürüm kontrolünde tut.\u003c/li>\n\u003c/ol>\n\u003c/blockquote>\n\u003chr>\n\u003ch2 id=\"s-1-powershell-temelleri\">1. PowerShell Temelleri\u003c/h2>\n\u003ch3 id=\"s-1-1-calisma-mantigi\">1.1 Çalışma mantığı\u003c/h3>\n\u003cul>\n\u003cli>Komutlar \u003cstrong>Fiil-İsim\u003c/strong> biçimindedir: \u003ccode>Get-Service\u003c/code>, \u003ccode>Set-ADUser\u003c/code>, \u003ccode>Remove-Item\u003c/code>\u003c/li>\n\u003cli>PowerShell \u003cstrong>nesne\u003c/strong> döndürür, metin değil. Boru (\u003ccode>|\u003c/code>) ile nesneleri bir komuttan diğerine aktarırsın.\u003c/li>\n\u003cli>.NET üzerine kuruludur, .NET sınıflarını doğrudan çağırabilirsin: \u003ccode>[System.IO.File]::ReadAllText(&quot;C:\\a.txt&quot;)\u003c/code>\u003c/li>\n\u003cli>Windows PowerShell 5.1 (\u003ccode>powershell.exe\u003c/code>, Windows&#39;ta yerleşik) ve PowerShell 7 (\u003ccode>pwsh\u003c/code>, ayrı kurulur, çok platformlu) farklı sürümlerdir.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-1-2-yardim-ve-kesif\">1.2 Yardım ve keşif\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-Help Get-Service -Examples      # Örneklerle yardım\nGet-Help Get-Service -Online\nGet-Command *service*               # Komut ara\nGet-Service | Get-Member            # Nesnenin özellik ve metotları\nUpdate-Help                         # Yardım dosyalarını güncelle (yönetici)\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-1-3-en-cok-kullanilan-kaliplar\">1.3 En çok kullanılan kalıplar\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Amaç\u003c/th>\n\u003cth>Komut\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Filtrele\u003c/td>\n\u003ctd>\u003ccode>Where-Object { $_.Status -eq &#39;Running&#39; }\u003c/code> veya \u003ccode>Where-Object Status -eq Running\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sütun seç\u003c/td>\n\u003ctd>\u003ccode>Select-Object Name, Status\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sırala\u003c/td>\n\u003ctd>\u003ccode>Sort-Object CPU -Descending\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>İlk N\u003c/td>\n\u003ctd>\u003ccode>Select-Object -First 10\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Her biri için\u003c/td>\n\u003ctd>\u003ccode>ForEach-Object { ... }\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Say\u003c/td>\n\u003ctd>\u003ccode>Measure-Object\u003c/code> / \u003ccode>.Count\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grupla\u003c/td>\n\u003ctd>\u003ccode>Group-Object Status\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CSV&#39;ye yaz\u003c/td>\n\u003ctd>\u003ccode>Export-Csv rapor.csv -NoTypeInformation -Encoding UTF8\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CSV&#39;den oku\u003c/td>\n\u003ctd>\u003ccode>Import-Csv liste.csv\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ekranda tablo\u003c/td>\n\u003ctd>\u003ccode>Format-Table -AutoSize\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ekranda liste\u003c/td>\n\u003ctd>\u003ccode>Format-List *\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosyaya yaz\u003c/td>\n\u003ctd>\u003ccode>Out-File sonuc.txt\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-1-4-degisken-kosul-d-ngu\">1.4 Değişken, koşul, döngü\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">$ad = &quot;Ali&quot;\n$liste = @(&quot;PC01&quot;,&quot;PC02&quot;,&quot;PC03&quot;)\n\nif ($ad -eq &quot;Ali&quot;) { &quot;Merhaba Ali&quot; } elseif ($ad -like &quot;A*&quot;) { &quot;A ile başlıyor&quot; } else { &quot;Diğer&quot; }\n\nforeach ($pc in $liste) { Write-Host &quot;$pc kontrol ediliyor&quot; }\n\ntry {\n    Get-Item &quot;C:\\olmayan.txt&quot; -ErrorAction Stop\n} catch {\n    Write-Warning &quot;Hata: $($_.Exception.Message)&quot;\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Karşılaştırma:\u003c/strong> \u003ccode>-eq\u003c/code> eşit, \u003ccode>-ne\u003c/code> farklı, \u003ccode>-gt\u003c/code> büyük, \u003ccode>-lt\u003c/code> küçük, \u003ccode>-like\u003c/code> joker, \u003ccode>-match\u003c/code> regex, \u003ccode>-contains\u003c/code> listede var.\u003c/p>\n\u003ch3 id=\"s-1-5-fonksiyon-ve-parametre\">1.5 Fonksiyon ve parametre\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">function Get-DiskBilgi {\n    param(\n        [Parameter(Mandatory)] [string]$Bilgisayar,\n        [int]$EsikYuzde = 15\n    )\n    Get-CimInstance Win32_LogicalDisk -ComputerName $Bilgisayar -Filter &quot;DriveType=3&quot; |\n        Where-Object { ($_.FreeSpace / $_.Size * 100) -lt $EsikYuzde }\n}\nGet-DiskBilgi -Bilgisayar PC01\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-1-6-betik-calistirma-izni\">1.6 Betik çalıştırma izni\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-ExecutionPolicy\nSet-ExecutionPolicy RemoteSigned -Scope CurrentUser      # İnternetten indirilenler imzalı olmalı\n.\\betik.ps1                                              # Çalıştır\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>Bypass\u003c/code> kullanımı sadece bilinçli, tek seferlik durumlarda.\u003c/p>\n\u003ch3 id=\"s-1-7-guvenlik-anahtarlari\">1.7 Güvenlik anahtarları\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Parametre\u003c/th>\n\u003cth>Ne yapar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>-WhatIf\u003c/code>\u003c/td>\n\u003ctd>Çalıştırmadan ne olacağını gösterir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-Confirm\u003c/code>\u003c/td>\n\u003ctd>Her adımda onay ister\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-ErrorAction Stop\u003c/code>\u003c/td>\n\u003ctd>Hatada durdurur, \u003ccode>try/catch\u003c/code> yakalar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Start-Transcript -Path log.txt\u003c/code>\u003c/td>\n\u003ctd>Oturumun tüm çıktısını kaydeder\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Get-Credential\u003c/code>\u003c/td>\n\u003ctd>Şifreyi güvenle sorar (betiğe yazmaz)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-2-hazir-betikler-windows\">2. Hazır Betikler (Windows)\u003c/h2>\n\u003ch3 id=\"s-2-1-csv-den-toplu-kullanici-olusturma-ad\">2.1 CSV&#39;den toplu kullanıcı oluşturma (AD)\u003c/h3>\n\u003cp>\u003ccode>kullanicilar.csv\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode>Ad,Soyad,KullaniciAdi,Departman\nAli,Veli,aveli,Muhasebe\nAyse,Kaya,akaya,IT\n\u003c/code>\u003c/pre>\n\u003cp>Betik:\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Import-Module ActiveDirectory\n$ou = &quot;OU=Kullanicilar,DC=lab,DC=local&quot;\n$sifre = Read-Host &quot;Gecici sifre&quot; -AsSecureString\n$liste = Import-Csv .\\kullanicilar.csv\n\nforeach ($u in $liste) {\n    $params = @{\n        Name                  = &quot;$($u.Ad) $($u.Soyad)&quot;\n        GivenName             = $u.Ad\n        Surname               = $u.Soyad\n        SamAccountName        = $u.KullaniciAdi\n        UserPrincipalName     = &quot;$($u.KullaniciAdi)@lab.local&quot;\n        Department            = $u.Departman\n        Path                  = $ou\n        AccountPassword       = $sifre\n        Enabled               = $true\n        ChangePasswordAtLogon = $true\n    }\n    try {\n        New-ADUser @params -WhatIf          # Önce -WhatIf ile dene, sonra kaldır\n        Write-Host &quot;OK: $($u.KullaniciAdi)&quot;\n    } catch {\n        Write-Warning &quot;HATA $($u.KullaniciAdi): $($_.Exception.Message)&quot;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Gerçek ortamda herkese aynı geçici şifre vermek yerine rastgele şifre üret ve güvenle ilet.\u003c/p>\n\u003ch3 id=\"s-2-2-birden-cok-bilgisayarin-disk-raporu\">2.2 Birden çok bilgisayarın disk raporu\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">$pcler = Get-Content .\\bilgisayarlar.txt\n$sonuc = foreach ($pc in $pcler) {\n    try {\n        Get-CimInstance Win32_LogicalDisk -ComputerName $pc -Filter &quot;DriveType=3&quot; -ErrorAction Stop |\n        Select-Object @{n='PC';e={$pc}}, DeviceID,\n            @{n='ToplamGB';e={[math]::Round($_.Size/1GB,1)}},\n            @{n='BosGB';e={[math]::Round($_.FreeSpace/1GB,1)}},\n            @{n='BosYuzde';e={[math]::Round($_.FreeSpace/$_.Size*100,1)}}\n    } catch { Write-Warning &quot;$pc ulasilamadi&quot; }\n}\n$sonuc | Export-Csv .\\disk-raporu.csv -NoTypeInformation -Encoding UTF8\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-3-ad-hesap-bakimi\">2.3 AD hesap bakımı\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Search-ADAccount -LockedOut | Select Name, SamAccountName                # Kilitli hesaplar\nUnlock-ADAccount -Identity aveli                                          # Kilidi aç\nSearch-ADAccount -AccountInactive -UsersOnly -TimeSpan 90.00:00:00 |      # 90 gündür girmeyenler\n    Select Name, LastLogonDate, Enabled\nSearch-ADAccount -PasswordExpired -UsersOnly | Select Name                # Şifresi dolanlar\nGet-ADUser -Identity aveli -Properties * | Format-List Name,Enabled,LastLogonDate,MemberOf\nGet-ADGroupMember -Identity &quot;Muhasebe&quot; | Select Name\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-4-yuklu-yazilim-envanteri\">2.4 Yüklü yazılım envanteri\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-ItemProperty &quot;HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*&quot;,\n                 &quot;HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*&quot; |\n    Where-Object DisplayName |\n    Select-Object DisplayName, DisplayVersion, Publisher |\n    Sort-Object DisplayName | Export-Csv .\\yazilimlar.csv -NoTypeInformation -Encoding UTF8\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-5-servis-izleme-ve-otomatik-baslatma\">2.5 Servis izleme ve otomatik başlatma\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">$servisler = &quot;Spooler&quot;,&quot;W32Time&quot;\nforeach ($s in $servisler) {\n    $svc = Get-Service $s\n    if ($svc.Status -ne 'Running') {\n        Start-Service $s\n        Write-Host &quot;$(Get-Date -Format s) $s yeniden baslatildi&quot;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-6-gecici-dosya-temizligi\">2.6 Geçici dosya temizliği\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-ChildItem $env:TEMP -Recurse -Force -ErrorAction SilentlyContinue |\n    Where-Object LastWriteTime -lt (Get-Date).AddDays(-7) |\n    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue -WhatIf     # Test sonrası -WhatIf'i kaldır\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-7-buyuk-dosyalari-bulma\">2.7 Büyük dosyaları bulma\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-ChildItem D:\\ -Recurse -File -ErrorAction SilentlyContinue |\n    Sort-Object Length -Descending | Select-Object -First 20 FullName,\n    @{n='MB';e={[math]::Round($_.Length/1MB,1)}}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-8-ag-ping-taramasi-ve-port-testi\">2.8 Ağ: ping taraması ve port testi\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">1..254 | ForEach-Object {\n    $ip = &quot;192.168.1.$_&quot;\n    if (Test-Connection $ip -Count 1 -Quiet) { $ip }\n}\n# PowerShell 7'de hızlı: 1..254 | ForEach-Object -Parallel { ... } -ThrottleLimit 50\n\nTest-NetConnection 192.168.1.20 -Port 443\n\u003c/code>\u003c/pre>\n\u003cp>Sadece kendi/yetkili ağında kullan.\u003c/p>\n\u003ch3 id=\"s-2-9-robocopy-ile-yedekleme-betigi\">2.9 Robocopy ile yedekleme betiği\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">$kaynak = &quot;D:\\Veri&quot;\n$hedef  = &quot;\\\\yedek-nas\\Veri&quot;\n$log    = &quot;C:\\Logs\\yedek_$(Get-Date -Format yyyyMMdd).log&quot;\nNew-Item -ItemType Directory -Path C:\\Logs -Force | Out-Null\n\nrobocopy $kaynak $hedef /MIR /R:2 /W:5 /NP /LOG:$log\n\nif ($LASTEXITCODE -ge 8) {\n    Write-Warning &quot;Yedekleme HATA ile bitti (kod $LASTEXITCODE). Log: $log&quot;\n} else {\n    Write-Host &quot;Yedekleme tamam (kod $LASTEXITCODE)&quot;\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>/MIR\u003c/code> hedefi kaynakla \u003cstrong>eşitler\u003c/strong>, kaynakta silinen dosya hedeften de silinir. Dikkatli kullan.\u003c/li>\n\u003cli>Robocopy çıkış kodları: 0-7 başarı/bilgi, \u003cstrong>8 ve üstü hata\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-2-10-zamanlanmis-g-rev-olarak-kaydetme\">2.10 Zamanlanmış görev olarak kaydetme\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">$eylem    = New-ScheduledTaskAction -Execute &quot;powershell.exe&quot; -Argument &quot;-NoProfile -File C:\\Scripts\\yedek.ps1&quot;\n$tetik    = New-ScheduledTaskTrigger -Daily -At 02:00\nRegister-ScheduledTask -TaskName &quot;GunlukYedek&quot; -Action $eylem -Trigger $tetik -User &quot;SYSTEM&quot; -RunLevel Highest\nGet-ScheduledTask -TaskName GunlukYedek\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-11-uzak-bilgisayarda-komut-calistirma\">2.11 Uzak bilgisayarda komut çalıştırma\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Enable-PSRemoting -Force                                   # Hedefte (yönetici), bir kez\nInvoke-Command -ComputerName PC01,PC02 -ScriptBlock { Get-Service Spooler } -Credential (Get-Credential)\nEnter-PSSession -ComputerName PC01                         # Etkileşimli oturum, çıkış: exit\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-12-olay-gunlugunden-hata-zeti\">2.12 Olay günlüğünden hata özeti\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-WinEvent -FilterHashtable @{LogName='System'; Level=2; StartTime=(Get-Date).AddDays(-1)} |\n    Select-Object TimeCreated, Id, ProviderName, Message -First 20\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>Level\u003c/code>: 1 Kritik, 2 Hata, 3 Uyarı.\u003c/p>\n\u003ch3 id=\"s-2-13-microsoft-365-graph\">2.13 Microsoft 365 / Graph\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Connect-MgGraph -Scopes &quot;User.Read.All&quot;\nGet-MgUser -All -Property DisplayName,UserPrincipalName,AccountEnabled |\n    Select DisplayName,UserPrincipalName,AccountEnabled |\n    Export-Csv .\\m365-kullanicilar.csv -NoTypeInformation -Encoding UTF8\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-14-e-posta-ile-rapor-g-nderme\">2.14 E-posta ile rapor gönderme\u003c/h3>\n\u003cp>Şirketin SMTP ve güvenlik politikasına bağlıdır. \u003ccode>Send-MailMessage\u003c/code> eski ve kullanımdan kalkma yolunda, güncel yaklaşım için kuruluşun yöntemine veya Graph API&#39;ye bak.\u003c/p>\n\u003ch2 id=\"s-3-bash-temelleri-linux\">3. Bash Temelleri (Linux)\u003c/h2>\n\u003ch3 id=\"s-3-1-betik-iskeleti\">3.1 Betik iskeleti\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">#!/bin/bash\nset -euo pipefail        # Hatada dur, tanımsız değişkende dur, boru hatlarında hatayı yakala\n\nISIM=&quot;Ali&quot;\necho &quot;Merhaba $ISIM&quot;\n\nif [ -f /etc/passwd ]; then\n    echo &quot;Dosya var&quot;\nfi\n\nfor dosya in /var/log/*.log; do\n    echo &quot;$dosya&quot;\ndone\n\u003c/code>\u003c/pre>\n\u003cp>Çalıştırma: \u003ccode>chmod +x betik.sh &amp;&amp; ./betik.sh\u003c/code>\u003c/p>\n\u003ch3 id=\"s-3-2-faydali-kaliplar\">3.2 Faydalı kalıplar\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Amaç\u003c/th>\n\u003cth>Komut\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Sonuç kodu\u003c/td>\n\u003ctd>\u003ccode>$?\u003c/code> (0 = başarı)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tarih etiketi\u003c/td>\n\u003ctd>\u003ccode>$(date +%F_%H-%M)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosyaya ekle\u003c/td>\n\u003ctd>\u003ccode>echo &quot;metin&quot; &gt;&gt; log.txt\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hata ve çıktıyı birlikte\u003c/td>\n\u003ctd>\u003ccode>komut &gt;&gt; log.txt 2&gt;&amp;1\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Satır say\u003c/td>\n\u003ctd>\u003ccode>wc -l dosya\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sütun al\u003c/td>\n\u003ctd>\u003ccode>awk &#39;{print $1}&#39; dosya\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Değiştir\u003c/td>\n\u003ctd>\u003ccode>sed -i &#39;s/eski/yeni/g&#39; dosya\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sırala/tekil\u003c/td>\n\u003ctd>\u003ccode>sort dosya | uniq -c | sort -nr\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-3-3-rsync-ile-yedekleme\">3.3 rsync ile yedekleme\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">#!/bin/bash\nset -euo pipefail\nKAYNAK=&quot;/home/veri/&quot;\nHEDEF=&quot;/mnt/yedek/veri/&quot;\nLOG=&quot;/var/log/yedek.log&quot;\n\necho &quot;$(date '+%F %T') yedek basladi&quot; &gt;&gt; &quot;$LOG&quot;\nrsync -avh --delete &quot;$KAYNAK&quot; &quot;$HEDEF&quot; &gt;&gt; &quot;$LOG&quot; 2&gt;&amp;1\necho &quot;$(date '+%F %T') yedek bitti&quot; &gt;&gt; &quot;$LOG&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>--delete\u003c/code> hedefte kaynakta olmayan dosyaları siler, ilk denemede \u003ccode>--dry-run\u003c/code> ekle.\u003c/p>\n\u003ch3 id=\"s-3-4-disk-doluluk-uyarisi\">3.4 Disk doluluk uyarısı\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">#!/bin/bash\nESIK=85\ndf -h --output=pcent,target | tail -n +2 | while read -r yuzde nokta; do\n    kullanim=${yuzde%\\%}\n    if [ &quot;$kullanim&quot; -ge &quot;$ESIK&quot; ]; then\n        echo &quot;UYARI: $nokta %$kullanim dolu&quot;\n    fi\ndone\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-3-5-basarisiz-ssh-girislerini-zetleme\">3.5 Başarısız SSH girişlerini özetleme\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">sudo grep &quot;Failed password&quot; /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr | head\n\u003c/code>\u003c/pre>\n\u003cp>(Log biçimi dağıtıma göre değişebilir, alan numarasını kendi çıktına göre ayarla.)\u003c/p>\n\u003ch3 id=\"s-3-6-cron-a-ekleme\">3.6 cron&#39;a ekleme\u003c/h3>\n\u003cpre>\u003ccode>crontab -e\n# dakika saat gün ay haftanın_günü komut\n30 2 * * * /home/yonetici/yedek.sh\n\u003c/code>\u003c/pre>\n\u003cp>Cron ortamında PATH kısıtlıdır, betikte \u003cstrong>tam yol\u003c/strong> kullan.\u003c/p>\n\u003ch2 id=\"s-4-diger-otomasyon-araclari-kisa\">4. Diğer Otomasyon Araçları (Kısa)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Araç\u003c/th>\n\u003cth>Ne için\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Toplu iş (\u003ccode>.bat\u003c/code>)\u003c/td>\n\u003ctd>Basit, eski usul işler; yeni işlerde PowerShell tercih\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Python\u003c/td>\n\u003ctd>Çok platformlu otomasyon, API entegrasyonu, raporlama\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Görev Zamanlayıcı / cron\u003c/td>\n\u003ctd>Betikleri zamanlamak\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ansible\u003c/td>\n\u003ctd>Birçok sunucuya aynı yapılandırmayı uygulama\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Power Automate\u003c/td>\n\u003ctd>Düşük kodlu iş akışları (M365 ile)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Git\u003c/td>\n\u003ctd>Betik sürümleri ve geri dönüş\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>C#/.NET geçmişin PowerShell&#39;de doğrudan avantaj: .NET nesne ve sınıflarını biliyorsan betiklerin çok daha güçlü olur. Python&#39;a da bir göz at, API ve rapor işlerinde çok kullanışlı.\u003c/p>\n\u003ch2 id=\"s-5-iyi-betik-aliskanliklari\">5. İyi Betik Alışkanlıkları\u003c/h2>\n\u003cul>\n\u003cli>Başa \u003cstrong>amaç, yazar, tarih, kullanım\u003c/strong> yorumu koy\u003c/li>\n\u003cli>Parametre kullan, sabit değerleri betiğin başında değişkene al\u003c/li>\n\u003cli>Hata yakala (\u003ccode>try/catch\u003c/code>), anlamlı mesaj ver\u003c/li>\n\u003cli>\u003cstrong>Log tut\u003c/strong> (ne zaman, ne yapıldı, kaç kayıt etkilendi)\u003c/li>\n\u003cli>Yıkıcı işlemlerden önce \u003ccode>-WhatIf\u003c/code> / \u003ccode>--dry-run\u003c/code>\u003c/li>\n\u003cli>Gizli bilgi (şifre, token) betiğe yazılmaz: \u003ccode>Get-Credential\u003c/code>, \u003ccode>SecretManagement\u003c/code>, ortam değişkeni veya kasa\u003c/li>\n\u003cli>Betiği önce test OU&#39;sunda / test makinesinde çalıştır\u003c/li>\n\u003cli>Çalıştırmadan önce kodu \u003cstrong>kendin oku\u003c/strong>, internetten kopyaladığın betiği anlamadan çalıştırma\u003c/li>\n\u003cli>Betik klasörünü Git&#39;e koy, sürüm notu yaz\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-6-betik-baslik-sablonu\">6. Betik Başlık Şablonu\u003c/h2>\n\u003cpre>\u003ccode class=\"language-powershell\">&lt;#\n.SYNOPSIS\n    Kısa açıklama\n.DESCRIPTION\n    Ne yapar, hangi ön koşullar gerekir\n.PARAMETER Bilgisayar\n    Hedef bilgisayar adı\n.EXAMPLE\n    .\\betik.ps1 -Bilgisayar PC01\n.NOTES\n    Yazar: ...  Tarih: ...  Sürüm: 1.0\n#&gt;\n[CmdletBinding(SupportsShouldProcess)]\nparam(\n    [Parameter(Mandatory)] [string]$Bilgisayar\n)\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"s-7-alistirma-onerileri\">7. Alıştırma Önerileri\u003c/h2>\n\u003col>\n\u003cli>Bilgisayar listesinden ping atıp ulaşılamayanları CSV&#39;ye yazan betik\u003c/li>\n\u003cli>Her sabah disk doluluğunu kontrol edip %85 üstünü rapor eden zamanlanmış görev\u003c/li>\n\u003cli>CSV&#39;den toplu kullanıcı oluşturan betik (lab&#39;da, \u003ccode>-WhatIf\u003c/code> ile)\u003c/li>\n\u003cli>90 gündür girmeyen hesapları listeleyen aylık rapor\u003c/li>\n\u003cli>Bir klasörü yedekleyip log tutan ve hata kodunu kontrol eden betik\u003c/li>\n\u003cli>Bash ile \u003ccode>/var/log/auth.log\u003c/code> içinden başarısız giriş özeti çıkaran betik\u003c/li>\n\u003cli>Betiklerini bir Git deposunda sürümle, README&#39;ye ne işe yaradığını ve nasıl çalıştırılacağını yaz\u003c/li>\n\u003c/ol>\n","sections":[{"id":"s-powershell-ve-bash-otomasyon-rehberi","title":"PowerShell ve Bash Otomasyon Rehberi","level":1,"path":"","isTitle":true,"text":"Tekrarlayan IT işlerini betiğe dökmek için hazır kalıplar\nAmaç: Aynı işi üçüncü kez elle yapıyorsan betiğe dök. Bu rehberde temel mantık, güvenlik kuralları ve kopyala-uyarla örnekler var.\nAltın kurallar\nÖnce test ortamında veya 1-2 nesne üzerinde dene.\nSilme/değiştirme yapan komutlarda önce -WhatIf ile ne olacağını gör.\nŞifreyi betiğin içine yazma.\nBetiğe yorum satırı ve log ekle, 6 ay sonra kendin de anlayasın.\nBetiklerini Git ile sürüm kontrolünde tut."},{"id":"s-1-powershell-temelleri","title":"1. PowerShell Temelleri","level":2,"path":"","isTitle":false,"text":""},{"id":"s-1-1-calisma-mantigi","title":"1.1 Çalışma mantığı","level":3,"path":"1. PowerShell Temelleri","isTitle":false,"text":"Komutlar Fiil-İsim biçimindedir: Get-Service, Set-ADUser, Remove-Item\nPowerShell nesne döndürür, metin değil. Boru (|) ile nesneleri bir komuttan diğerine aktarırsın.\n.NET üzerine kuruludur, .NET sınıflarını doğrudan çağırabilirsin: [System.IO.File]::ReadAllText(\"C:\\a.txt\")\nWindows PowerShell 5.1 (powershell.exe, Windows'ta yerleşik) ve PowerShell 7 (pwsh, ayrı kurulur, çok platformlu) farklı sürümlerdir."},{"id":"s-1-2-yardim-ve-kesif","title":"1.2 Yardım ve keşif","level":3,"path":"1. PowerShell Temelleri","isTitle":false,"text":"Get-Help Get-Service -Examples      # Örneklerle yardım\nGet-Help Get-Service -Online\nGet-Command *service*               # Komut ara\nGet-Service | Get-Member            # Nesnenin özellik ve metotları\nUpdate-Help                         # Yardım dosyalarını güncelle (yönetici)"},{"id":"s-1-3-en-cok-kullanilan-kaliplar","title":"1.3 En çok kullanılan kalıplar","level":3,"path":"1. PowerShell Temelleri","isTitle":false,"text":"Amaç\nKomut\nFiltrele\nWhere-Object { $_.Status -eq 'Running' } veya Where-Object Status -eq Running\nSütun seç\nSelect-Object Name, Status\nSırala\nSort-Object CPU -Descending\nİlk N\nSelect-Object -First 10\nHer biri için\nForEach-Object { ... }\nSay\nMeasure-Object / .Count\nGrupla\nGroup-Object Status\nCSV'ye yaz\nExport-Csv rapor.csv -NoTypeInformation -Encoding UTF8\nCSV'den oku\nImport-Csv liste.csv\nEkranda tablo\nFormat-Table -AutoSize\nEkranda liste\nFormat-List *\nDosyaya yaz\nOut-File sonuc.txt"},{"id":"s-1-4-degisken-kosul-d-ngu","title":"1.4 Değişken, koşul, döngü","level":3,"path":"1. PowerShell Temelleri","isTitle":false,"text":"$ad = \"Ali\"\n$liste = @(\"PC01\",\"PC02\",\"PC03\")\nif ($ad -eq \"Ali\") { \"Merhaba Ali\" } elseif ($ad -like \"A*\") { \"A ile başlıyor\" } else { \"Diğer\" }\nforeach ($pc in $liste) { Write-Host \"$pc kontrol ediliyor\" }\ntry {\n    Get-Item \"C:\\olmayan.txt\" -ErrorAction Stop\n} catch {\n    Write-Warning \"Hata: $($_.Exception.Message)\"\n}\nKarşılaştırma: -eq eşit, -ne farklı, -gt büyük, -lt küçük, -like joker, -match regex, -contains listede var."},{"id":"s-1-5-fonksiyon-ve-parametre","title":"1.5 Fonksiyon ve parametre","level":3,"path":"1. PowerShell Temelleri","isTitle":false,"text":"function Get-DiskBilgi {\n    param(\n        [Parameter(Mandatory)] [string]$Bilgisayar,\n        [int]$EsikYuzde = 15\n    )\n    Get-CimInstance Win32_LogicalDisk -ComputerName $Bilgisayar -Filter \"DriveType=3\" |\n        Where-Object { ($_.FreeSpace / $_.Size * 100) -lt $EsikYuzde }\n}\nGet-DiskBilgi -Bilgisayar PC01"},{"id":"s-1-6-betik-calistirma-izni","title":"1.6 Betik çalıştırma izni","level":3,"path":"1. PowerShell Temelleri","isTitle":false,"text":"Get-ExecutionPolicy\nSet-ExecutionPolicy RemoteSigned -Scope CurrentUser      # İnternetten indirilenler imzalı olmalı\n.\\betik.ps1                                              # Çalıştır\nBypass kullanımı sadece bilinçli, tek seferlik durumlarda."},{"id":"s-1-7-guvenlik-anahtarlari","title":"1.7 Güvenlik anahtarları","level":3,"path":"1. PowerShell Temelleri","isTitle":false,"text":"Parametre\nNe yapar\n-WhatIf\nÇalıştırmadan ne olacağını gösterir\n-Confirm\nHer adımda onay ister\n-ErrorAction Stop\nHatada durdurur, try/catch yakalar\nStart-Transcript -Path log.txt\nOturumun tüm çıktısını kaydeder\nGet-Credential\nŞifreyi güvenle sorar (betiğe yazmaz)"},{"id":"s-2-hazir-betikler-windows","title":"2. Hazır Betikler (Windows)","level":2,"path":"","isTitle":false,"text":""},{"id":"s-2-1-csv-den-toplu-kullanici-olusturma-ad","title":"2.1 CSV'den toplu kullanıcı oluşturma (AD)","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"kullanicilar.csv:\nAd,Soyad,KullaniciAdi,Departman\nAli,Veli,aveli,Muhasebe\nAyse,Kaya,akaya,IT\nBetik:\nImport-Module ActiveDirectory\n$ou = \"OU=Kullanicilar,DC=lab,DC=local\"\n$sifre = Read-Host \"Gecici sifre\" -AsSecureString\n$liste = Import-Csv .\\kullanicilar.csv\nforeach ($u in $liste) {\n    $params = @{\n        Name                  = \"$($u.Ad) $($u.Soyad)\"\n        GivenName             = $u.Ad\n        Surname               = $u.Soyad\n        SamAccountName        = $u.KullaniciAdi\n        UserPrincipalName     = \"$($u.KullaniciAdi)@lab.local\"\n        Department            = $u.Departman\n        Path                  = $ou\n        AccountPassword       = $sifre\n        Enabled               = $true\n        ChangePasswordAtLogon = $true\n    }\n    try {\n        New-ADUser @params -WhatIf          # Önce -WhatIf ile dene, sonra kaldır\n        Write-Host \"OK: $($u.KullaniciAdi)\"\n    } catch {\n        Write-Warning \"HATA $($u.KullaniciAdi): $($_.Exception.Message)\"\n    }\n}\nGerçek ortamda herkese aynı geçici şifre vermek yerine rastgele şifre üret ve güvenle ilet."},{"id":"s-2-2-birden-cok-bilgisayarin-disk-raporu","title":"2.2 Birden çok bilgisayarın disk raporu","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"$pcler = Get-Content .\\bilgisayarlar.txt\n$sonuc = foreach ($pc in $pcler) {\n    try {\n        Get-CimInstance Win32_LogicalDisk -ComputerName $pc -Filter \"DriveType=3\" -ErrorAction Stop |\n        Select-Object @{n='PC';e={$pc}}, DeviceID,\n            @{n='ToplamGB';e={[math]::Round($_.Size/1GB,1)}},\n            @{n='BosGB';e={[math]::Round($_.FreeSpace/1GB,1)}},\n            @{n='BosYuzde';e={[math]::Round($_.FreeSpace/$_.Size*100,1)}}\n    } catch { Write-Warning \"$pc ulasilamadi\" }\n}\n$sonuc | Export-Csv .\\disk-raporu.csv -NoTypeInformation -Encoding UTF8"},{"id":"s-2-3-ad-hesap-bakimi","title":"2.3 AD hesap bakımı","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Search-ADAccount -LockedOut | Select Name, SamAccountName                # Kilitli hesaplar\nUnlock-ADAccount -Identity aveli                                          # Kilidi aç\nSearch-ADAccount -AccountInactive -UsersOnly -TimeSpan 90.00:00:00 |      # 90 gündür girmeyenler\n    Select Name, LastLogonDate, Enabled\nSearch-ADAccount -PasswordExpired -UsersOnly | Select Name                # Şifresi dolanlar\nGet-ADUser -Identity aveli -Properties * | Format-List Name,Enabled,LastLogonDate,MemberOf\nGet-ADGroupMember -Identity \"Muhasebe\" | Select Name"},{"id":"s-2-4-yuklu-yazilim-envanteri","title":"2.4 Yüklü yazılım envanteri","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Get-ItemProperty \"HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*\",\n                 \"HKLM:\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*\" |\n    Where-Object DisplayName |\n    Select-Object DisplayName, DisplayVersion, Publisher |\n    Sort-Object DisplayName | Export-Csv .\\yazilimlar.csv -NoTypeInformation -Encoding UTF8"},{"id":"s-2-5-servis-izleme-ve-otomatik-baslatma","title":"2.5 Servis izleme ve otomatik başlatma","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"$servisler = \"Spooler\",\"W32Time\"\nforeach ($s in $servisler) {\n    $svc = Get-Service $s\n    if ($svc.Status -ne 'Running') {\n        Start-Service $s\n        Write-Host \"$(Get-Date -Format s) $s yeniden baslatildi\"\n    }\n}"},{"id":"s-2-6-gecici-dosya-temizligi","title":"2.6 Geçici dosya temizliği","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Get-ChildItem $env:TEMP -Recurse -Force -ErrorAction SilentlyContinue |\n    Where-Object LastWriteTime -lt (Get-Date).AddDays(-7) |\n    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue -WhatIf     # Test sonrası -WhatIf'i kaldır"},{"id":"s-2-7-buyuk-dosyalari-bulma","title":"2.7 Büyük dosyaları bulma","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Get-ChildItem D:\\ -Recurse -File -ErrorAction SilentlyContinue |\n    Sort-Object Length -Descending | Select-Object -First 20 FullName,\n    @{n='MB';e={[math]::Round($_.Length/1MB,1)}}"},{"id":"s-2-8-ag-ping-taramasi-ve-port-testi","title":"2.8 Ağ: ping taraması ve port testi","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"1..254 | ForEach-Object {\n    $ip = \"192.168.1.$_\"\n    if (Test-Connection $ip -Count 1 -Quiet) { $ip }\n}\n# PowerShell 7'de hızlı: 1..254 | ForEach-Object -Parallel { ... } -ThrottleLimit 50\nTest-NetConnection 192.168.1.20 -Port 443\nSadece kendi/yetkili ağında kullan."},{"id":"s-2-9-robocopy-ile-yedekleme-betigi","title":"2.9 Robocopy ile yedekleme betiği","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"$kaynak = \"D:\\Veri\"\n$hedef  = \"\\\\yedek-nas\\Veri\"\n$log    = \"C:\\Logs\\yedek_$(Get-Date -Format yyyyMMdd).log\"\nNew-Item -ItemType Directory -Path C:\\Logs -Force | Out-Null\nrobocopy $kaynak $hedef /MIR /R:2 /W:5 /NP /LOG:$log\nif ($LASTEXITCODE -ge 8) {\n    Write-Warning \"Yedekleme HATA ile bitti (kod $LASTEXITCODE). Log: $log\"\n} else {\n    Write-Host \"Yedekleme tamam (kod $LASTEXITCODE)\"\n}\n/MIR hedefi kaynakla eşitler, kaynakta silinen dosya hedeften de silinir. Dikkatli kullan.\nRobocopy çıkış kodları: 0-7 başarı/bilgi, 8 ve üstü hata."},{"id":"s-2-10-zamanlanmis-g-rev-olarak-kaydetme","title":"2.10 Zamanlanmış görev olarak kaydetme","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"$eylem    = New-ScheduledTaskAction -Execute \"powershell.exe\" -Argument \"-NoProfile -File C:\\Scripts\\yedek.ps1\"\n$tetik    = New-ScheduledTaskTrigger -Daily -At 02:00\nRegister-ScheduledTask -TaskName \"GunlukYedek\" -Action $eylem -Trigger $tetik -User \"SYSTEM\" -RunLevel Highest\nGet-ScheduledTask -TaskName GunlukYedek"},{"id":"s-2-11-uzak-bilgisayarda-komut-calistirma","title":"2.11 Uzak bilgisayarda komut çalıştırma","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Enable-PSRemoting -Force                                   # Hedefte (yönetici), bir kez\nInvoke-Command -ComputerName PC01,PC02 -ScriptBlock { Get-Service Spooler } -Credential (Get-Credential)\nEnter-PSSession -ComputerName PC01                         # Etkileşimli oturum, çıkış: exit"},{"id":"s-2-12-olay-gunlugunden-hata-zeti","title":"2.12 Olay günlüğünden hata özeti","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Get-WinEvent -FilterHashtable @{LogName='System'; Level=2; StartTime=(Get-Date).AddDays(-1)} |\n    Select-Object TimeCreated, Id, ProviderName, Message -First 20\nLevel: 1 Kritik, 2 Hata, 3 Uyarı."},{"id":"s-2-13-microsoft-365-graph","title":"2.13 Microsoft 365 / Graph","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Connect-MgGraph -Scopes \"User.Read.All\"\nGet-MgUser -All -Property DisplayName,UserPrincipalName,AccountEnabled |\n    Select DisplayName,UserPrincipalName,AccountEnabled |\n    Export-Csv .\\m365-kullanicilar.csv -NoTypeInformation -Encoding UTF8"},{"id":"s-2-14-e-posta-ile-rapor-g-nderme","title":"2.14 E-posta ile rapor gönderme","level":3,"path":"2. Hazır Betikler (Windows)","isTitle":false,"text":"Şirketin SMTP ve güvenlik politikasına bağlıdır. Send-MailMessage eski ve kullanımdan kalkma yolunda, güncel yaklaşım için kuruluşun yöntemine veya Graph API'ye bak."},{"id":"s-3-bash-temelleri-linux","title":"3. Bash Temelleri (Linux)","level":2,"path":"","isTitle":false,"text":""},{"id":"s-3-1-betik-iskeleti","title":"3.1 Betik iskeleti","level":3,"path":"3. Bash Temelleri (Linux)","isTitle":false,"text":"#!/bin/bash\nset -euo pipefail        # Hatada dur, tanımsız değişkende dur, boru hatlarında hatayı yakala\nISIM=\"Ali\"\necho \"Merhaba $ISIM\"\nif [ -f /etc/passwd ]; then\n    echo \"Dosya var\"\nfi\nfor dosya in /var/log/*.log; do\n    echo \"$dosya\"\ndone\nÇalıştırma: chmod +x betik.sh && ./betik.sh"},{"id":"s-3-2-faydali-kaliplar","title":"3.2 Faydalı kalıplar","level":3,"path":"3. Bash Temelleri (Linux)","isTitle":false,"text":"Amaç\nKomut\nSonuç kodu\n$? (0 = başarı)\nTarih etiketi\n$(date +%F_%H-%M)\nDosyaya ekle\necho \"metin\" >> log.txt\nHata ve çıktıyı birlikte\nkomut >> log.txt 2>&1\nSatır say\nwc -l dosya\nSütun al\nawk '{print $1}' dosya\nDeğiştir\nsed -i 's/eski/yeni/g' dosya\nSırala/tekil\nsort dosya | uniq -c | sort -nr"},{"id":"s-3-3-rsync-ile-yedekleme","title":"3.3 rsync ile yedekleme","level":3,"path":"3. Bash Temelleri (Linux)","isTitle":false,"text":"#!/bin/bash\nset -euo pipefail\nKAYNAK=\"/home/veri/\"\nHEDEF=\"/mnt/yedek/veri/\"\nLOG=\"/var/log/yedek.log\"\necho \"$(date '+%F %T') yedek basladi\" >> \"$LOG\"\nrsync -avh --delete \"$KAYNAK\" \"$HEDEF\" >> \"$LOG\" 2>&1\necho \"$(date '+%F %T') yedek bitti\" >> \"$LOG\"\n--delete hedefte kaynakta olmayan dosyaları siler, ilk denemede --dry-run ekle."},{"id":"s-3-4-disk-doluluk-uyarisi","title":"3.4 Disk doluluk uyarısı","level":3,"path":"3. Bash Temelleri (Linux)","isTitle":false,"text":"#!/bin/bash\nESIK=85\ndf -h --output=pcent,target | tail -n +2 | while read -r yuzde nokta; do\n    kullanim=${yuzde%\\%}\n    if [ \"$kullanim\" -ge \"$ESIK\" ]; then\n        echo \"UYARI: $nokta %$kullanim dolu\"\n    fi\ndone"},{"id":"s-3-5-basarisiz-ssh-girislerini-zetleme","title":"3.5 Başarısız SSH girişlerini özetleme","level":3,"path":"3. Bash Temelleri (Linux)","isTitle":false,"text":"sudo grep \"Failed password\" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr | head\n(Log biçimi dağıtıma göre değişebilir, alan numarasını kendi çıktına göre ayarla.)"},{"id":"s-3-6-cron-a-ekleme","title":"3.6 cron'a ekleme","level":3,"path":"3. Bash Temelleri (Linux)","isTitle":false,"text":"crontab -e\n# dakika saat gün ay haftanın_günü komut\n30 2 * * * /home/yonetici/yedek.sh\nCron ortamında PATH kısıtlıdır, betikte tam yol kullan."},{"id":"s-4-diger-otomasyon-araclari-kisa","title":"4. Diğer Otomasyon Araçları (Kısa)","level":2,"path":"","isTitle":false,"text":"Araç\nNe için\nToplu iş (.bat)\nBasit, eski usul işler; yeni işlerde PowerShell tercih\nPython\nÇok platformlu otomasyon, API entegrasyonu, raporlama\nGörev Zamanlayıcı / cron\nBetikleri zamanlamak\nAnsible\nBirçok sunucuya aynı yapılandırmayı uygulama\nPower Automate\nDüşük kodlu iş akışları (M365 ile)\nGit\nBetik sürümleri ve geri dönüş\nC#/.NET geçmişin PowerShell'de doğrudan avantaj: .NET nesne ve sınıflarını biliyorsan betiklerin çok daha güçlü olur. Python'a da bir göz at, API ve rapor işlerinde çok kullanışlı."},{"id":"s-5-iyi-betik-aliskanliklari","title":"5. İyi Betik Alışkanlıkları","level":2,"path":"","isTitle":false,"text":"Başa amaç, yazar, tarih, kullanım yorumu koy\nParametre kullan, sabit değerleri betiğin başında değişkene al\nHata yakala (try/catch), anlamlı mesaj ver\nLog tut (ne zaman, ne yapıldı, kaç kayıt etkilendi)\nYıkıcı işlemlerden önce -WhatIf / --dry-run\nGizli bilgi (şifre, token) betiğe yazılmaz: Get-Credential, SecretManagement, ortam değişkeni veya kasa\nBetiği önce test OU'sunda / test makinesinde çalıştır\nÇalıştırmadan önce kodu kendin oku, internetten kopyaladığın betiği anlamadan çalıştırma\nBetik klasörünü Git'e koy, sürüm notu yaz"},{"id":"s-6-betik-baslik-sablonu","title":"6. Betik Başlık Şablonu","level":2,"path":"","isTitle":false,"text":"\u003c#\n.SYNOPSIS\n    Kısa açıklama\n.DESCRIPTION\n    Ne yapar, hangi ön koşullar gerekir\n.PARAMETER Bilgisayar\n    Hedef bilgisayar adı\n.EXAMPLE\n    .\\betik.ps1 -Bilgisayar PC01\n.NOTES\n    Yazar: ...  Tarih: ...  Sürüm: 1.0\n#>\n[CmdletBinding(SupportsShouldProcess)]\nparam(\n    [Parameter(Mandatory)] [string]$Bilgisayar\n)"},{"id":"s-7-alistirma-onerileri","title":"7. Alıştırma Önerileri","level":2,"path":"","isTitle":false,"text":"Bilgisayar listesinden ping atıp ulaşılamayanları CSV'ye yazan betik\nHer sabah disk doluluğunu kontrol edip %85 üstünü rapor eden zamanlanmış görev\nCSV'den toplu kullanıcı oluşturan betik (lab'da, -WhatIf ile)\n90 gündür girmeyen hesapları listeleyen aylık rapor\nBir klasörü yedekleyip log tutan ve hata kodunu kontrol eden betik\nBash ile /var/log/auth.log içinden başarısız giriş özeti çıkaran betik\nBetiklerini bir Git deposunda sürümle, README'ye ne işe yaradığını ve nasıl çalıştırılacağını yaz"}]},{"slug":"surec","file":"05-itil-surec-dokumantasyon-rehberi.md","title":"ITIL, Süreç Yönetimi ve Dokümantasyon Rehberi","short":"ITIL ve Dokümantasyon","desc":"Incident, change, problem, ticket kalitesi, şablonlar, envanter","words":1868,"html":"\u003ch1 id=\"s-itil-surec-y-netimi-ve-dokumantasyon-rehberi\">ITIL, Süreç Yönetimi ve Dokümantasyon Rehberi\u003c/h1>\n\u003cp>\u003cstrong>Ticket, değişiklik, envanter, bilgi tabanı ve şablonlar\u003c/strong>\u003c/p>\n\u003cp>Teknik bilgi kadar \u003cstrong>düzenli çalışmak\u003c/strong> da IT desteğin değerini belirler. Bu rehber süreç kavramlarını ve kopyala-kullan şablonları içerir.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s-1-temel-surec-kavramlari-itil-mantigi\">1. Temel Süreç Kavramları (ITIL Mantığı)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Süreç\u003c/th>\n\u003cth>Soru\u003c/th>\n\u003cth>Örnek\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Incident\u003c/strong> (Olay)\u003c/td>\n\u003ctd>Bir şey bozuldu, hizmeti ne kadar çabuk geri getiririz?\u003c/td>\n\u003ctd>&quot;Yazıcı çalışmıyor&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Service Request\u003c/strong> (Hizmet talebi)\u003c/td>\n\u003ctd>Standart bir şey isteniyor\u003c/td>\n\u003ctd>&quot;Yeni kullanıcı hesabı&quot;, &quot;VPN erişimi&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Problem\u003c/strong>\u003c/td>\n\u003ctd>Tekrar eden olayların kök nedeni ne?\u003c/td>\n\u003ctd>&quot;Her pazartesi VPN düşüyor, neden?&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Change\u003c/strong> (Değişiklik)\u003c/td>\n\u003ctd>Üretim ortamında bir şeyi güvenle nasıl değiştiririz?\u003c/td>\n\u003ctd>&quot;Switch firmware güncellemesi&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Knowledge\u003c/strong> (Bilgi)\u003c/td>\n\u003ctd>Çözümü kayıt altına alıp paylaş\u003c/td>\n\u003ctd>Bilgi tabanı makalesi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Fark:\u003c/strong> Incident = ateşi söndür. Problem = yangının neden çıktığını bul. Change = yapıyı güvenle değiştir.\u003c/p>\n\u003ch2 id=\"s-2-destek-seviyeleri\">2. Destek Seviyeleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Seviye\u003c/th>\n\u003cth>Kim\u003c/th>\n\u003cth>İş\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>L1 (Service Desk)\u003c/td>\n\u003ctd>İlk karşılama\u003c/td>\n\u003ctd>Kayıt aç, bilinen çözümleri uygula, yönlendir\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>L2\u003c/td>\n\u
