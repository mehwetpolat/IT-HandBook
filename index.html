bağlantısı\nIP alıyor mu\nipconfig\n3. Yerel ağ\nGateway'e ulaşıyor mu\nping gateway\n4. İnternet\nDışarı çıkıyor mu\nping 8.8.8.8\n5. İsim çözümleme\nDNS çalışıyor mu\nping google.com, nslookup google.com\n6. Uygulama\nServis/program çalışıyor mu\nPort testi, servis kontrolü\nYorumlama:\nIP yok / 169.254.x.x → DHCP'ye ulaşılamıyor\nGateway'e ping yok → yerel ağ/kablo/switch/VLAN sorunu\n8.8.8.8 var, google.com yok → DNS sorunu\nİkisi de var, site açılmıyor → proxy, tarayıcı, güvenlik duvarı"},{"id":"s-2-ag-komutlari-windows","title":"2. AĞ KOMUTLARI (Windows)","level":1,"path":"","isTitle":false,"text":"Komut\nNe yapar\nipconfig\nIP, maske, gateway\nipconfig /all\nMAC, DHCP sunucusu, DNS, kira süresi (en çok işe yarayan)\nipconfig /release + ipconfig /renew\nDHCP'den yeni IP al\nipconfig /flushdns\nDNS önbelleğini temizle\nipconfig /displaydns\nDNS önbelleğini göster\nping adres\nErişim testi\nping -t adres\nSürekli ping (Ctrl+C ile dur)\nping -n 20 adres\n20 paket gönder\ntracert adres\nPaketin geçtiği yolu göster\npathping adres\nTracert + kayıp analizi (uzun sürer)\nnslookup alan.adi\nDNS sorgusu\nnslookup alan.adi 8.8.8.8\nBelirli DNS sunucusundan sorgula\narp -a\nIP-MAC tablosu\nnetstat -ano\nAçık bağlantılar ve portlar + PID\nnetstat -ano | findstr :80\n80 portunu kullanan işlem\ntasklist | findstr PID\nPID'den program adını bul\nroute print\nYönlendirme tablosu\nnetsh wlan show profiles\nKayıtlı Wi-Fi'lar\nnetsh int ip reset\nTCP/IP yığınını sıfırla (yeniden başlatma gerekir)\nnetsh winsock reset\nWinsock'u sıfırla (yeniden başlatma gerekir)\ngetmac\nMAC adresi\nhostname\nBilgisayar adı\nPort testi (PowerShell):\nTest-NetConnection sunucu -Port 443\nTest-NetConnection 192.168.1.20 -Port 3389\nTcpTestSucceeded : True ise port açık ve erişilebilir.\nIP sorunu 3 adımlık hızlı çözüm:\nipconfig /release\nipconfig /flushdns\nipconfig /renew"},{"id":"s-3-ip-subnet-ve-vlan-ozeti","title":"3. IP, SUBNET VE VLAN ÖZETİ","level":1,"path":"","isTitle":false,"text":""},{"id":"s-3-1-ozel-private-ip-araliklari","title":"3.1 Özel (private) IP aralıkları","level":2,"path":"3. IP, SUBNET VE VLAN ÖZETİ","isTitle":false,"text":"Aralık\nSınıf\n10.0.0.0 – 10.255.255.255\nA\n172.16.0.0 – 172.31.255.255\nB\n192.168.0.0 – 192.168.255.255\nC\n169.254.0.0/16\nAPIPA (DHCP bulunamadı)\n127.0.0.1\nLoopback (kendisi)"},{"id":"s-3-2-subnet-hizli-tablo","title":"3.2 Subnet hızlı tablo","level":2,"path":"3. IP, SUBNET VE VLAN ÖZETİ","isTitle":false,"text":"CIDR\nMaske\nKullanılabilir host\n/24\n255.255.255.0\n254\n/25\n255.255.255.128\n126\n/26\n255.255.255.192\n62\n/27\n255.255.255.224\n30\n/28\n255.255.255.240\n14\n/29\n255.255.255.248\n6\n/30\n255.255.255.252\n2\n/16\n255.255.0.0\n65.534\nKural: Host sayısı = 2^(host bitleri) − 2 (ağ ve broadcast adresi hariç)."},{"id":"s-3-3-sik-kullanilan-portlar","title":"3.3 Sık kullanılan portlar","level":2,"path":"3. IP, SUBNET VE VLAN ÖZETİ","isTitle":false,"text":"Port\nServis\nPort\nServis\n20/21\nFTP\n110\nPOP3\n22\nSSH\n123\nNTP (UDP)\n23\nTelnet\n143\nIMAP\n25\nSMTP\n161/162\nSNMP (UDP)\n53\nDNS (UDP/TCP)\n389\nLDAP\n67/68\nDHCP (UDP)\n443\nHTTPS\n69\nTFTP (UDP)\n445\nSMB (dosya paylaşımı)\n80\nHTTP\n514\nSyslog (UDP)\n3389\nRDP (uzak masaüstü)\n3306\nMySQL\n1433\nMS SQL\n5432\nPostgreSQL"},{"id":"s-4-sik-karsilasilan-sorunlar-ve-cozumleri","title":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","level":1,"path":"","isTitle":false,"text":""},{"id":"s-4-1-internet-yok","title":"4.1 \"İnternet yok\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Kablo/Wi-Fi bağlı mı? Uçak modu kapalı mı?\nipconfig: IP var mı? 169.254 ise DHCP sorunu → ipconfig /renew\nping gateway: gitmiyorsa kablo/port/VLAN\nping 8.8.8.8: gidiyor ama site açılmıyorsa DNS → ipconfig /flushdns, DNS'i elle 8.8.8.8 yap\nBaşkalarında da yoksa: switch, router, modem, hat sorunu\nProxy kontrolü: Ayarlar > Ağ > Proxy"},{"id":"s-4-2-bilgisayar-yavas","title":"4.2 \"Bilgisayar yavaş\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Görev Yöneticisi (Ctrl+Shift+Esc): CPU, RAM, disk, hangi program?\nDisk %100 ise: Windows Update, antivirüs taraması, arızalı disk olabilir\nBaşlangıç programlarını azalt (Görev Yöneticisi > Başlangıç)\nDisk doluluk: cleanmgr, geçici dosyalar (%temp%)\nDisk sağlığı: wmic diskdrive get status, chkdsk C: /f (yeniden başlatma ister)\nRAM yetersizse artır, HDD ise SSD'ye geçmek en büyük farkı yaratır\nZararlı yazılım taraması yap"},{"id":"s-4-3-yazici-calismiyor","title":"4.3 \"Yazıcı çalışmıyor\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Yazıcı açık, kağıt/toner var mı, ekranda hata var mı?\nYazıcı ağda mı: yazıcının IP'sine ping at\nYazdırma kuyruğunda takılı iş: Hizmetler > Print Spooler > durdurnet stop spooler\ndel /Q /F /S \"%systemroot%\\System32\\spool\\PRINTERS\\*.*\"\nnet start spooler\nSürücüyü kaldırıp yeniden yükle\nDoğru yazıcı varsayılan mı, \"çevrimdışı çalış\" işaretli mi?\nAğ yazıcısını IP ile ekle (Standard TCP/IP Port): ad ile eklemeden daha kararlıdır\nYazıcıya sabit IP ver veya DHCP rezervasyonu yap"},{"id":"s-4-4-sifremi-unuttum-hesap-kilitlendi","title":"4.4 \"Şifremi unuttum / hesap kilitlendi\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Active Directory'de:\nActive Directory Users and Computers (ADUC) > kullanıcıya sağ tık > Reset Password\nKilitliyse Unlock Account kutusunu işaretle\n\"User must change password at next logon\" seçeneğini işaretle\nKimlik doğrulaması yap (kullanıcı gerçekten o mu?). Telefonla gelen talepleri doğrulamadan işleme koyma, sosyal mühendislik riskidir.\nYerel hesapta:\nnet user kullaniciadi YeniSifre123!\nnet user kullaniciadi /active:yes"},{"id":"s-4-5-uzak-masaustune-baglanamiyorum-rdp","title":"4.5 \"Uzak masaüstüne bağlanamıyorum\" (RDP)","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Hedef bilgisayar açık mı, ağda mı? ping\nPort açık mı? Test-NetConnection IP -Port 3389\nHedefte: Sistem > Uzak Masaüstü açık olmalı\nKullanıcı \"Remote Desktop Users\" grubunda mı?\nGüvenlik duvarı 3389'u engelliyor olabilir\nWin Home sürümü RDP sunucusu olamaz (Pro ve üstü gerekir)\nBağlantı komutu: mstsc /v:IP"},{"id":"s-4-6-paylasilan-klas-re-erisemiyorum","title":"4.6 \"Paylaşılan klasöre erişemiyorum\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"ping sunucu, sonra \\\\sunucu veya \\\\IP yaz\nKimlik bilgisi: Windows Kimlik Bilgisi Yöneticisi'nde eski kayıt varsa sil\nİki izin katmanı vardır, ikisi de uygun olmalı: Paylaşım izni + NTFS (Güvenlik sekmesi)\nAğ sürücüsü bağlama: net use Z: \\\\sunucu\\paylasim /persistent:yes\nMevcut bağlantıları gör/sil: net use, net use * /delete\nSMB portu 445 engelli olabilir"},{"id":"s-4-7-outlook-e-posta-sorunu","title":"4.7 \"Outlook / e-posta sorunu\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"İnternet var mı? Başka cihazdan webmail çalışıyor mu? (çalışıyorsa sunucu sorunu değil)\nOutlook'u kapat, outlook /safe ile aç (eklenti sorunu mu)\nProfili yeniden oluştur: Denetim Masası > Posta > Profilleri Göster\nPosta kutusu dolu mu?\nŞifre yakın zamanda değiştiyse kayıtlı şifreyi güncelle\nOST dosyasını yeniden oluştur (eşitleme sorunlarında)"},{"id":"s-4-8-wi-fi-baglanmiyor-surekli-kopuyor","title":"4.8 \"Wi-Fi bağlanmıyor / sürekli kopuyor\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Wi-Fi sürücüsünü güncelle veya kaldırıp yeniden yükle\nAğı unut, yeniden bağlan\nnetsh wlan show wlanreport rapor oluşturur\nSinyal zayıfsa AP'ye yakınlaş, kanal çakışması olabilir\nGüç tasarrufu: Aygıt Yöneticisi > Wi-Fi adaptörü > Güç Yönetimi > \"Gücü korumak için kapatabilir\" işaretini kaldır\n2.4 GHz / 5 GHz farkı: 5 GHz hızlı ama menzili kısa"},{"id":"s-4-9-mavi-ekran-bsod","title":"4.9 \"Mavi ekran (BSOD)\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Hata kodunu not al (örn. IRQL_NOT_LESS_OR_EQUAL, 0x0000007E)\nYeni takılan donanım/sürücü/güncelleme var mı? Geri al\nGüvenli modda aç (açılışta F8 veya Shift + Yeniden Başlat)\nsfc /scannow ve DISM /Online /Cleanup-Image /RestoreHealth\nRAM testi: mdsched\nOlay Görüntüleyici ve C:\\Windows\\Minidump kayıtları\nDisk (chkdsk) ve sıcaklık kontrolü"},{"id":"s-4-10-bilgisayar-acilmiyor","title":"4.10 \"Bilgisayar açılmıyor\"","level":2,"path":"4. SIK KARŞILAŞILAN SORUNLAR ve ÇÖZÜMLERİ","isTitle":false,"text":"Güç kablosu, priz, ekran kablosu, ekran açık mı?\nBip sesi/ışık var mı? (BIOS bip kodları RAM/ekran kartı sorununu işaret eder)\nÇevre birimlerini çıkar (USB, harici disk), sadece güç ve ekranla dene\nWindows açılmıyorsa: kurtarma ortamı, Başlangıç Onarımı\nDisk görünmüyorsa BIOS'ta kontrol et, kablo/disk arızası olabilir\nVeri kritikse format atmadan önce diski çıkarıp başka bilgisayarla yedekle"},{"id":"s-5-windows-sistem-yonetimi","title":"5. WINDOWS SİSTEM YÖNETİMİ","level":1,"path":"","isTitle":false,"text":""},{"id":"s-5-1-sistem-bilgisi-ve-onarim","title":"5.1 Sistem bilgisi ve onarım","level":2,"path":"5. WINDOWS SİSTEM YÖNETİMİ","isTitle":false,"text":"Komut\nNe yapar\nsysteminfo\nSürüm, RAM, son güncelleme, açılış zamanı\nwinver\nWindows sürümü\nmsinfo32\nAyrıntılı sistem bilgisi\nsfc /scannow\nBozuk sistem dosyalarını onar\nDISM /Online /Cleanup-Image /RestoreHealth\nWindows imajını onar (sfc'den önce/sonra)\nchkdsk C: /f /r\nDisk hatası tara ve onar\ngpupdate /force\nGrup ilkelerini hemen uygula\ngpresult /r\nUygulanan grup ilkelerini göster\nwhoami / whoami /groups\nMevcut kullanıcı ve grupları\nshutdown /r /t 0\nHemen yeniden başlat\nshutdown /s /t 60\n60 sn sonra kapat\nshutdown /r /m \\\\PCADI\nUzaktaki bilgisayarı yeniden başlat"},{"id":"s-5-2-sik-kullanilan-windows-kisayollari-calistir-win-r","title":"5.2 Sık kullanılan Windows kısayolları (Çalıştır: Win+R)","level":2,"path":"5. WINDOWS SİSTEM YÖNETİMİ","isTitle":false,"text":"Yaz\nAçılan\nservices.msc\nHizmetler\ndevmgmt.msc\nAygıt Yöneticisi\ndiskmgmt.msc\nDisk Yönetimi\ncompmgmt.msc\nBilgisayar Yönetimi\neventvwr.msc\nOlay Görüntüleyici\nlusrmgr.msc\nYerel kullanıcı ve gruplar\ngpedit.msc\nYerel grup ilkesi\ntaskschd.msc\nGörev Zamanlayıcı\nncpa.cpl\nAğ bağdaştırıcıları\nappwiz.cpl\nProgram ekle/kaldır\nsysdm.cpl\nSistem özellikleri (bilgisayar adı, etki alanı)\nregedit\nKayıt Defteri (dikkat, yedek al)\nmstsc\nUzak Masaüstü\ncmd / powershell\nKomut satırı (yönetici için sağ tık)\n\\\\sunucu\\paylasim\nAğ paylaşımı"},{"id":"s-5-3-powershell-hizli-komutlar","title":"5.3 PowerShell hızlı komutlar","level":2,"path":"5. WINDOWS SİSTEM YÖNETİMİ","isTitle":false,"text":"Get-Service | Where-Object {$_.Status -eq \"Stopped\"}   # Duran servisler\nRestart-Service -Name Spooler                            # Servisi yeniden başlat\nGet-Process | Sort-Object CPU -Descending | Select -First 10   # En çok CPU kullananlar\nGet-EventLog -LogName System -Newest 20 -EntryType Error      # Son 20 sistem hatası\nGet-ComputerInfo                                         # Sistem bilgisi\nGet-NetIPConfiguration                                   # IP bilgisi\nGet-Disk; Get-Volume                                     # Disk ve bölümler\nGet-HotFix                                               # Yüklü güncellemeler\nTest-NetConnection google.com -Port 443                  # Port testi\nGet-LocalUser                                            # Yerel kullanıcılar\nRestart-Computer -ComputerName PCADI -Force              # Uzaktan yeniden başlat"},{"id":"s-5-4-olay-g-runtuleyici-event-viewer","title":"5.4 Olay Görüntüleyici (Event Viewer)","level":2,"path":"5. WINDOWS SİSTEM YÖNETİMİ","isTitle":false,"text":"Yol: eventvwr.msc > Windows Günlükleri > System / Application / Security\nÖnce Hata (Error) ve Kritik olanlara bak, sorunun yaşandığı zamana göre filtrele\nÖnemli Olay Kimlikleri (Event ID):\n4624 başarılı oturum açma\n4625 başarısız oturum açma\n4740 hesap kilitlendi\n41 beklenmedik kapanma (Kernel-Power)\n6005 / 6006 olay günlüğü servisi başladı/durdu (açılış/kapanış)\n7036 servis durumu değişti"},{"id":"s-5-5-yedekleme-mantigi","title":"5.5 Yedekleme mantığı","level":2,"path":"5. WINDOWS SİSTEM YÖNETİMİ","isTitle":false,"text":"3-2-1 kuralı: 3 kopya, 2 farklı ortam, 1 tanesi dışarıda (bulut/farklı bina)\nYedek alınıyor olması yetmez, geri yüklemeyi düzenli test et\nYedek türleri: Tam (full), Artımlı (incremental, son yedekten beri), Fark (differential, son tamdan beri)\nÖnemli: sunucu yedeği, veritabanı, switch/router config yedeği (TFTP/SCP)"},{"id":"s-6-active-directory-ad-ve-kullanici-yonetimi","title":"6. ACTIVE DIRECTORY (AD) ve KULLANICI YÖNETİMİ","level":1,"path":"","isTitle":false,"text":""},{"id":"s-6-1-temel-kavramlar","title":"6.1 Temel kavramlar","level":2,"path":"6. ACTIVE DIRECTORY (AD) ve KULLANICI YÖNETİMİ","isTitle":false,"text":"Kavram\nAnlamı\nDomain (Etki alanı)\nMerkezi kullanıcı/bilgisayar yönetimi, ör. firma.local\nDC (Domain Controller)\nAD'yi tutan sunucu\nOU\nKullanıcı/bilgisayarları gruplamak için klasör benzeri yapı\nGroup Policy (GPO)\nOU'lara uygulanan ayarlar (şifre kuralı, masaüstü, kısıtlamalar)\nSecurity Group\nİzin yönetimi için kullanıcı grubu"},{"id":"s-6-2-gunluk-isler-aduc-dsa-msc","title":"6.2 Günlük işler (ADUC: dsa.msc)","level":2,"path":"6. ACTIVE DIRECTORY (AD) ve KULLANICI YÖNETİMİ","isTitle":false,"text":"İş\nNasıl\nYeni kullanıcı\nOU'ya sağ tık > New > User, doğru gruplara ekle\nŞifre sıfırlama\nKullanıcıya sağ tık > Reset Password\nHesap kilidi açma\nKullanıcı özellikleri > Account > Unlock\nGruba ekleme\nKullanıcı > Member Of > Add\nHesap devre dışı\nSağ tık > Disable Account (silme yerine önce devre dışı bırak)\nBilgisayarı domaine alma\nsysdm.cpl > Değiştir > Etki alanı\nİşten ayrılan kullanıcı: Hesabı silme, önce devre dışı bırak, gruplardan çıkar, e-postayı ve dosyaları devret, belirli bir süre sonra sil."},{"id":"s-6-3-komut-satiri","title":"6.3 Komut satırı","level":2,"path":"6. ACTIVE DIRECTORY (AD) ve KULLANICI YÖNETİMİ","isTitle":false,"text":"net user kullanici /domain          # Domain kullanıcı bilgisi\nnet group \"Domain Admins\" /domain   # Gruptaki kullanıcılar\ngpresult /r                         # Uygulanan GPO'lar\ndcdiag                              # DC sağlık kontrolü (DC üzerinde)\nnltest /dsgetdc:firma.local         # Hangi DC'ye bağlı\nklist purge                         # Kerberos biletlerini temizle"},{"id":"s-6-4-bu-is-istasyonu-ile-etki-alani-guven-iliskisi-basarisiz-hatasi","title":"6.4 \"Bu iş istasyonu ile etki alanı güven ilişkisi başarısız\" hatası","level":2,"path":"6. ACTIVE DIRECTORY (AD) ve KULLANICI YÖNETİMİ","isTitle":false,"text":"Bilgisayarın makine hesabı şifresi uyumsuz. Çözüm: yerel yönetici ile girip domain'den çık, workgroup'a geç, yeniden başlat, tekrar domain'e katıl (veya PowerShell: Reset-ComputerMachinePassword -Credential firma\\yonetici)."},{"id":"s-6-5-dogrulama-guvenlik","title":"6.5 Doğrulama (güvenlik)","level":2,"path":"6. ACTIVE DIRECTORY (AD) ve KULLANICI YÖNETİMİ","isTitle":false,"text":"Şifre sıfırlamadan önce kullanıcının kimliğini doğrula (çalışan no, yönetici onayı, geri arama). Bu, en sık kullanılan sosyal mühendislik yöntemidir."},{"id":"s-7-dhcp-ve-dns","title":"7. DHCP ve DNS","level":1,"path":"","isTitle":false,"text":""},{"id":"s-7-1-dhcp-sureci-dora","title":"7.1 DHCP süreci (DORA)","level":2,"path":"7. DHCP ve DNS","isTitle":false,"text":"Discover: istemci \"DHCP sunucusu var mı?\" der\nOffer: sunucu IP teklif eder\nRequest: istemci teklifi ister\nAcknowledge: sunucu onaylar"},{"id":"s-7-2-dhcp-sorunlari","title":"7.2 DHCP sorunları","level":2,"path":"7. DHCP ve DNS","isTitle":false,"text":"Sorun\nKontrol\nIP 169.254.x.x\nDHCP'ye ulaşılamıyor, kablo/VLAN/DHCP servisi kontrol et\nHavuz dolu\nDHCP scope'ta boş IP kalmamış, havuzu genişlet veya kira süresini kısalt\nÇakışma\nSabit IP'li cihaz DHCP havuzunun içinde, havuzu böl veya rezervasyon yap\nYanlış IP alıyor\nAğa kaçak router/modem takılmış olabilir (rogue DHCP)\nİpuçları:\nYazıcı, sunucu, kameralar için DHCP rezervasyonu (MAC'e sabit IP) kullan\nSabit IP'leri DHCP aralığının dışında tut\nipconfig /all içinde \"DHCP Server\" satırı, IP'yi hangi sunucunun verdiğini gösterir"},{"id":"s-7-3-dns-kayit-turleri","title":"7.3 DNS kayıt türleri","level":2,"path":"7. DHCP ve DNS","isTitle":false,"text":"Kayıt\nGörevi\nA\nİsim → IPv4\nAAAA\nİsim → IPv6\nCNAME\nTakma ad (alias)\nMX\nMail sunucusu\nPTR\nIP → isim (ters sorgu)\nNS\nYetkili DNS sunucusu\nTXT\nMetin (SPF, doğrulama kayıtları)\nSRV\nServis konumu (AD için kritik)"},{"id":"s-7-4-dns-sorun-giderme","title":"7.4 DNS sorun giderme","level":2,"path":"7. DHCP ve DNS","isTitle":false,"text":"nslookup firma.local              # Domain çözülüyor mu\nnslookup -type=MX firma.com       # Mail kaydı\nnslookup google.com 8.8.8.8       # Belirli sunucudan sor\nipconfig /flushdns                # İstemci önbelleğini temizle\nipconfig /registerdns             # Kaydı yeniden oluştur\nDomain'e bağlı bilgisayarların DNS'i domain controller'ı göstermeli. İstemciye 8.8.8.8 verirsen domain'i bulamaz.\n\"Ping IP ile çalışıyor, isimle çalışmıyor\" = DNS sorunudur."},{"id":"s-8-switch-router-hizli-cisco-komutlari","title":"8. SWITCH/ROUTER HIZLI CISCO KOMUTLARI","level":1,"path":"","isTitle":false,"text":"(Detaylı anlatım için cisco-switch-rehberi.md dosyasına bak.)"},{"id":"s-8-1-moda-g-re","title":"8.1 Moda göre","level":2,"path":"8. SWITCH/ROUTER HIZLI CISCO KOMUTLARI","isTitle":false,"text":"Switch> enable                    # Yönetici moda geç\nSwitch# configure terminal        # Ayar moduna geç\nSwitch(config)# interface fa0/1   # Porta gir\nSwitch(config-if)# end            # Direkt # moduna dön\nSwitch# write memory              # Kaydet"},{"id":"s-8-2-sorun-giderme-show-komutlari","title":"8.2 Sorun giderme show komutları","level":2,"path":"8. SWITCH/ROUTER HIZLI CISCO KOMUTLARI","isTitle":false,"text":"Komut\nNe gösterir\nshow ip interface brief\nPort ve IP durumu (en çok kullanılan)\nshow interfaces status\nPort hızı, duplex, VLAN, durum\nshow interfaces fa0/1\nPort detayı, hata/çarpışma sayaçları\nshow vlan brief\nVLAN-port ilişkisi\nshow mac address-table\nHangi MAC hangi portta (cihazı bulmak için)\nshow arp\nIP-MAC eşlemesi\nshow running-config\nÇalışan ayarlar\nshow version\nModel, IOS, çalışma süresi\nshow cdp neighbors\nBağlı komşu cihazlar\nshow logging\nSwitch logları\nshow interfaces trunk\nTrunk portları\nshow spanning-tree\nSTP durumu"},{"id":"s-8-3-port-isleri","title":"8.3 Port işleri","level":2,"path":"8. SWITCH/ROUTER HIZLI CISCO KOMUTLARI","isTitle":false,"text":"Bir cihaz hangi porta bağlı?\nshow mac address-table | include 1a2b\n(MAC adresinin bir kısmıyla ara)\nPort hata sayaçları: show interfaces fa0/1 çıktısında CRC, input errors artıyorsa kablo/konnektör sorunu olabilir, duplex uyumsuzluğuna da bak.\nPortu kapat/aç:\ninterface fa0/5\n shutdown\n no shutdown\nPort err-disabled (kapanmış) ise:\ninterface fa0/5\n shutdown\n no shutdown"},{"id":"s-8-4-duplex-hiz-uyumsuzlugu","title":"8.4 Duplex/hız uyumsuzluğu","level":2,"path":"8. SWITCH/ROUTER HIZLI CISCO KOMUTLARI","isTitle":false,"text":"Belirti: yavaşlık, çok sayıda hata\nHer iki uç da auto olmalı ya da aynı elle ayar yapılmalı\nshow interfaces status ile hız/duplex kontrol et"},{"id":"s-9-linux-temel-komutlar-sunucu","title":"9. LINUX TEMEL KOMUTLAR (Sunucu)","level":1,"path":"","isTitle":false,"text":""},{"id":"s-9-1-dosya-ve-dizin","title":"9.1 Dosya ve dizin","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"Komut\nNe yapar\npwd\nBulunduğun dizin\nls -la\nDosyaları ayrıntılı listele (gizliler dahil)\ncd /yol\nDizin değiştir\ncp kaynak hedef\nKopyala\nmv kaynak hedef\nTaşı/yeniden adlandır\nrm dosya\nSil (geri dönüş yok)\nrm -r klasor\nKlasörü sil (dikkat)\nmkdir klasor\nKlasör oluştur\ncat dosya\nİçeriği göster\nless dosya\nSayfa sayfa oku (q ile çık)\ntail -f /var/log/syslog\nLogu canlı izle\ngrep \"aranan\" dosya\nDosyada ara\nfind / -name \"dosya\"\nDosya bul\nnano dosya\nBasit metin editörü (Ctrl+O kaydet, Ctrl+X çık)"},{"id":"s-9-2-sistem-ve-surecler","title":"9.2 Sistem ve süreçler","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"Komut\nNe yapar\ntop / htop\nCanlı CPU/RAM kullanımı\ndf -h\nDisk doluluğu\ndu -sh klasor\nKlasör boyutu\nfree -h\nRAM kullanımı\nuptime\nNe kadar süredir açık\nps aux | grep isim\nSüreç ara\nkill PID / kill -9 PID\nSüreci sonlandır\nuname -a\nÇekirdek ve sistem bilgisi\nwhoami / id\nKullanıcı ve grup\nhistory\nGeçmiş komutlar"},{"id":"s-9-3-servis-y-netimi-systemd","title":"9.3 Servis yönetimi (systemd)","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"sudo systemctl status nginx        # Durum\nsudo systemctl start nginx         # Başlat\nsudo systemctl stop nginx          # Durdur\nsudo systemctl restart nginx       # Yeniden başlat\nsudo systemctl enable nginx        # Açılışta otomatik başlat\njournalctl -u nginx -n 50          # Servisin son 50 log satırı\njournalctl -xe                     # Son hatalar"},{"id":"s-9-4-ag-linux","title":"9.4 Ağ (Linux)","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"ip a                  # IP bilgileri (ifconfig yerine)\nip route              # Yönlendirme tablosu\nss -tulpn             # Dinlenen portlar ve süreçler\nping -c 4 adres       # 4 paket ping\ntraceroute adres      # Yol izleme\ndig alan.adi          # DNS sorgusu\ncurl -I https://site  # HTTP başlıklarını getir\nsudo ufw status       # Güvenlik duvarı (Ubuntu)\nsudo ufw allow 22/tcp # Port aç"},{"id":"s-9-5-paket-y-netimi","title":"9.5 Paket yönetimi","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"Dağıtım\nGüncelle\nKur\nUbuntu/Debian\nsudo apt update && sudo apt upgrade\nsudo apt install paket\nRHEL/CentOS\nsudo dnf update\nsudo dnf install paket"},{"id":"s-9-6-kullanici-ve-izinler","title":"9.6 Kullanıcı ve izinler","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"sudo adduser ali                   # Kullanıcı ekle\nsudo passwd ali                    # Şifre belirle\nsudo usermod -aG sudo ali          # sudo yetkisi ver (Ubuntu)\nchmod 755 dosya                    # İzin ayarla\nchown kullanici:grup dosya         # Sahip değiştir\nİzin sayıları: r=4, w=2, x=1. 755 = sahip (rwx), grup (r-x), diğerleri (r-x)."},{"id":"s-9-7-ssh","title":"9.7 SSH","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"ssh kullanici@192.168.1.20         # Bağlan\nscp dosya kullanici@ip:/hedef/     # Dosya kopyala\nssh-keygen -t ed25519              # Anahtar çifti üret\nssh-copy-id kullanici@ip           # Genel anahtarı sunucuya kopyala\nGüvenlik: root ile SSH girişini kapat, mümkünse anahtar tabanlı kimlik doğrulama kullan."},{"id":"s-9-8-onemli-log-dosyalari","title":"9.8 Önemli log dosyaları","level":2,"path":"9. LINUX TEMEL KOMUTLAR (Sunucu)","isTitle":false,"text":"/var/log/syslog veya /var/log/messages: genel\n/var/log/auth.log: giriş denemeleri\n/var/log/nginx/ ve /var/log/apache2/: web sunucusu"},{"id":"s-10-guvenlik-temelleri","title":"10. GÜVENLİK TEMELLERİ","level":1,"path":"","isTitle":false,"text":""},{"id":"s-10-1-sikca-karsilasilan-tehditler","title":"10.1 Sıkça karşılaşılan tehditler","level":2,"path":"10. GÜVENLİK TEMELLERİ","isTitle":false,"text":"Tehdit\nÖnlem\nPhishing (oltalama)\nBağlantı/ekleri kontrol et, gönderici adresine bak, şüpheliyi IT'ye ilet\nFidye yazılımı (ransomware)\nGüncel yedek (çevrimdışı kopya dahil), güncelleme, makro kısıtı\nZayıf şifre\nKarmaşıklık/uzunluk kuralı, MFA\nGüncellenmemiş sistem\nDüzenli yama yönetimi\nSosyal mühendislik\nKimlik doğrulama prosedürü, farkındalık\nYetkisiz cihaz\nPort güvenliği, NAC, kayıtlı cihaz listesi"},{"id":"s-10-2-supheli-e-posta-virus-suphesi-gelince","title":"10.2 Şüpheli e-posta/virüs şüphesi gelince","level":2,"path":"10. GÜVENLİK TEMELLERİ","isTitle":false,"text":"Kullanıcıya bağlantıya tıklamamasını/eki açmamasını söyle\nTıkladıysa: bilgisayarı ağdan ayır (kabloyu çek/Wi-Fi kapat), kapatma\nGüvenlik sorumlusuna/yöneticiye haber ver\nParola değişikliği gerekebilir, tam tarama yap\nOlayı kaydet (saat, kullanıcı, e-posta başlığı, ekran görüntüsü)"},{"id":"s-10-3-sifre-politikasi-nerisi","title":"10.3 Şifre politikası önerisi","level":2,"path":"10. GÜVENLİK TEMELLERİ","isTitle":false,"text":"En az 12 karakter, kolay tahmin edilemeyen, her hesap için farklı\nMümkün olan her yerde MFA (çok faktörlü doğrulama)\nŞifre yöneticisi kullanımı teşvik et\nŞifreleri e-posta/mesajla düz metin paylaşma"},{"id":"s-10-4-genel-guvenlik-aliskanliklari","title":"10.4 Genel güvenlik alışkanlıkları","level":2,"path":"10. GÜVENLİK TEMELLERİ","isTitle":false,"text":"En az yetki ilkesi: Kullanıcıya sadece işi için gereken yetkiyi ver\nYönetici hesabıyla günlük iş yapma, ayrı hesap kullan\nEkran kilidi (Win+L), otomatik kilitleme\nDisk şifreleme (BitLocker), özellikle laptop'larda\nKullanılmayan hesap ve portları kapat\nYazılımları ve işletim sistemini güncel tut"},{"id":"s-11-donanim-ve-envanter","title":"11. DONANIM ve ENVANTER","level":1,"path":"","isTitle":false,"text":""},{"id":"s-11-1-hizli-donanim-tanisi","title":"11.1 Hızlı donanım tanısı","level":2,"path":"11. DONANIM ve ENVANTER","isTitle":false,"text":"Belirti\nOlası neden\nAçılmıyor, ışık yok\nGüç kaynağı/kablo/priz\nBip sesleri\nRAM/ekran kartı/BIOS (üretici kodlarına bak)\nEkran gelmiyor, fan dönüyor\nRAM, ekran kablosu, ekran kartı\nAşırı ısınma\nToz, fan arızası, macun\nDisk sesi (tıkırtı)\nHDD arızası, hemen yedekle\nRastgele kapanma\nIsınma, güç kaynağı, RAM\nYavaş + disk %100\nHDD yaşlanmış, SSD'ye geç"},{"id":"s-11-2-disk-sagligi","title":"11.2 Disk sağlığı","level":2,"path":"11. DONANIM ve ENVANTER","isTitle":false,"text":"Windows: wmic diskdrive get status, CrystalDiskInfo (SMART)\nLinux: sudo smartctl -a /dev/sda"},{"id":"s-11-3-envanter-kaydi-icin-tutulmasi-gerekenler","title":"11.3 Envanter kaydı için tutulması gerekenler","level":2,"path":"11. DONANIM ve ENVANTER","isTitle":false,"text":"Cihaz adı, seri no, model\nKullanıcı/zimmet bilgisi, konum\nIP/MAC adresi\nSatın alma tarihi, garanti bitişi\nİşletim sistemi ve önemli yazılımlar\nEtiketleme: cihaza kolayca okunur bir numara yapıştır"},{"id":"s-12-ticket-ve-iletisim","title":"12. TICKET ve İLETİŞİM","level":1,"path":"","isTitle":false,"text":""},{"id":"s-12-1-iyi-bir-ticket-kaydi","title":"12.1 İyi bir ticket kaydı","level":2,"path":"12. TICKET ve İLETİŞİM","isTitle":false,"text":"Kim: kullanıcı, departman, iletişim\nNe: sorunun kısa özeti + hata mesajı\nNe zaman: başlangıç zamanı\nEtki: tek kişi mi, birçok kişi mi, iş durdu mu\nYapılanlar: denenen adımlar ve sonuçları\nÇözüm: ne yapıldı, neden düzeldi\nEkler: ekran görüntüsü, log"},{"id":"s-12-2-oncelik-mantigi","title":"12.2 Öncelik mantığı","level":2,"path":"12. TICKET ve İLETİŞİM","isTitle":false,"text":"Öncelik\nÖrnek\nKritik\nTüm firma internetsiz, sunucu çökmüş, fidye yazılımı\nYüksek\nBir departman çalışamıyor, yönetici sorunu\nOrta\nTek kullanıcı, işi kısmen etkileniyor\nDüşük\nKozmetik, yeni talep, genel soru"},{"id":"s-12-3-kullaniciyla-iletisim","title":"12.3 Kullanıcıyla iletişim","level":2,"path":"12. TICKET ve İLETİŞİM","isTitle":false,"text":"Teknik terim kullanma, sade anlat\nNe yapacağını ve tahmini süreyi söyle\nÇözdükten sonra kullanıcıya test ettir\nBilmediğin bir şeyi bilmiyormuş gibi yapma: \"Araştırıp dönüş yapacağım\" demek yeterlidir\nKullanıcıyı suçlama, sakin ve nazik ol\nÇözülemeyen işi zamanında üst seviyeye (L2/L3) devret, notlarla birlikte"},{"id":"s-12-4-escalation-yukseltme","title":"12.4 Escalation (yükseltme)","level":2,"path":"12. TICKET ve İLETİŞİM","isTitle":false,"text":"Şu durumlarda kıdemli birine danış:\nTüm firmayı etkileyen kesinti\nGüvenlik olayı şüphesi\nVeri kaybı riski\nYetkin olmadığın bir sistem\n30–60 dakikada ilerleme sağlayamadığın sorun"},{"id":"s-13-yeni-bir-ortama-uyum-ilk-gunler-icin-kontrol-listesi","title":"13. YENİ BİR ORTAMA UYUM (İlk Günler İçin Kontrol Listesi)","level":1,"path":"","isTitle":false,"text":""},{"id":"s-13-1-ogrenilmesi-gerekenler","title":"13.1 Öğrenilmesi gerekenler","level":2,"path":"13. YENİ BİR ORTAMA UYUM (İlk Günler İçin Kontrol Listesi)","isTitle":false,"text":"Ağ şeması (IP aralıkları, VLAN'lar, switch/router konumları)\n Sunucu listesi ve görevleri (DC, dosya, yazdırma, yedek, mail)\n Yönetici hesapları ve yetki prosedürü (şifreleri nerede, nasıl saklıyorlar)\n Ticket sistemi ve kullanım şekli\n Yedekleme politikası ve nerede tutulduğu\n Yazılım lisansları ve envanter\n Acil durum iletişim listesi (ISS, donanım destek, kıdemli yöneticiler)\n Mevcut dokümantasyon ve prosedürler\n Hangi işin kime devredileceği"},{"id":"s-13-2-aliskanlik-haline-getir","title":"13.2 Alışkanlık haline getir","level":2,"path":"13. YENİ BİR ORTAMA UYUM (İlk Günler İçin Kontrol Listesi)","isTitle":false,"text":"Her işlemi not et, kendi bilgi tabanını oluştur\nÇözdüğün sorunları ekran görüntüsüyle arşivle (tekrar karşına çıkar)\nYönetici hesabı şifrelerini asla paylaşma, kendin sakla\nAnlamadığın şeyi sormaktan çekinme, ama önce araştır ve denediklerini anlat\nYapılandırma değiştirmeden önce yedek al\nBakım/güncelleme işlerini mesai dışında, haber vererek yap"},{"id":"s-13-3-kendini-gelistirme","title":"13.3 Kendini geliştirme","level":2,"path":"13. YENİ BİR ORTAMA UYUM (İlk Günler İçin Kontrol Listesi)","isTitle":false,"text":"Sertifikalar: CompTIA A+, Network+, Security+; Cisco CCNA; Microsoft AZ-900, MD-102 (Endpoint), AZ-104; Linux için LPIC-1/RHCSA\nEv laboratuvarı: Packet Tracer, VirtualBox/VMware ile Windows Server (AD, DHCP, DNS), Linux sunucu, Proxmox\nPratik: Kendi ağında Pi-hole, Nextcloud, Wireguard, izleme (Zabbix, Grafana) kur\nÖğrendiklerini düzenli notlara ve betik arşivine dönüştür; bir sonraki sorunda zaman kazandırır"},{"id":"s-14-hizli-basvuru-kartlari","title":"14. HIZLI BAŞVURU KARTLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-14-1-hicbir-sey-calismiyor-60-saniye-listesi","title":"14.1 \"Hiçbir şey çalışmıyor\" 60 saniye listesi","level":2,"path":"14. HIZLI BAŞVURU KARTLARI","isTitle":false,"text":"Kablo/Wi-Fi bağlı mı?\nipconfig: IP var mı, 169.254 mü?\nping gateway → ping 8.8.8.8 → ping google.com\nipconfig /release → /flushdns → /renew\nYeniden başlat\nBaşka kullanıcılarda da var mı?\nSon zamanda ne değişti?"},{"id":"s-14-2-en-cok-kullanilan-15-komut","title":"14.2 En çok kullanılan 15 komut","level":2,"path":"14. HIZLI BAŞVURU KARTLARI","isTitle":false,"text":"ipconfig /all          ping                  tracert\nnslookup               netstat -ano          arp -a\ngpupdate /force        sfc /scannow          chkdsk\nsysteminfo             tasklist              taskkill /PID x /F\nnet use                net user              shutdown /r /t 0"},{"id":"s-14-3-dosya-kopyalama-ve-ag-paylasimi","title":"14.3 Dosya kopyalama ve ağ paylaşımı","level":2,"path":"14. HIZLI BAŞVURU KARTLARI","isTitle":false,"text":"robocopy C:\\kaynak D:\\hedef /E /COPYALL /R:2 /W:2    # Güvenilir kopya (yedek için ideal)\nxcopy kaynak hedef /E /I /H                           # Klasör kopyala"},{"id":"s-14-4-zamanlanmis-g-rev-ve-uzaktan-y-netim","title":"14.4 Zamanlanmış görev ve uzaktan yönetim","level":2,"path":"14. HIZLI BAŞVURU KARTLARI","isTitle":false,"text":"schtasks /query                                       # Zamanlanmış görevleri listele\npsexec \\\\PCADI cmd                                    # Uzaktan komut (Sysinternals)\nSysinternals araç seti (Process Explorer, Autoruns, TCPView, PsTools) sistem yöneticisinin vazgeçilmezidir."},{"id":"s-14-5-faydali-araclar","title":"14.5 Faydalı araçlar","level":2,"path":"14. HIZLI BAŞVURU KARTLARI","isTitle":false,"text":"Araç\nNe için\nWireshark\nAğ paket analizi\nPuTTY / Windows Terminal\nSSH, console, seri bağlantı\nAdvanced IP Scanner / Angry IP Scanner\nAğdaki cihazları tara\nNmap\nPort taraması\nWinSCP / FileZilla\nSFTP/FTP dosya aktarımı\nTeamViewer / AnyDesk / Quick Assist\nUzak destek\nCrystalDiskInfo\nDisk sağlığı\nRufus / Ventoy\nÖnyüklenebilir USB\nSysinternals Suite\nGelişmiş Windows araçları\nZabbix / PRTG / LibreNMS\nAğ izleme\nNotepad++ / VS Code\nMetin ve config düzenleme\nNot: Komutları üretim ortamında çalıştırmadan önce test ortamında dene. Silme, format, toplu değişiklik gibi geri dönüşü olmayan işlerde mutlaka yedek al ve onay iste. Şirketin kendi prosedürleri bu rehberden önceliklidir."}]},{"slug":"sorunlar","file":"06-sik-sorunlar-cozum-senaryolari.md","title":"Sık Sorunlar ve Çözüm Senaryoları","short":"Sık Sorunlar ve Çözümler","desc":"Hesap, yazıcı, ağ, posta, Windows, firewall ve donanım için belirti → teşhis → çözüm senaryoları","words":1815,"html":"\u003ch1 id=\"s-sik-sorunlar-ve-c-zum-senaryolari\">Sık Sorunlar ve Çözüm Senaryoları\u003c/h1>\n\u003cp>Sahada en sık gelen talepler için \u003cstrong>belirti → teşhis → çözüm → önlem\u003c/strong> akışı. Her senaryo, ticket&#39;a yazılabilecek şekilde kısa ve uygulanabilir adımlarla hazırlandı.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Yöntem:\u003c/strong> Önce kapsamı belirle (tek kişi mi, herkes mi?), sonra en basit ve geri alınabilir adımdan başla. Her adımın sonucunu ticket&#39;a not et. İlgili başlıklara veya adımlara tıklayarak doğrudan çözüme gidebilirsin.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch1 id=\"s-1-hesap-ve-erisim-senaryolari\">1. HESAP VE ERİŞİM SENARYOLARI\u003c/h1>\n\u003ch2 id=\"s-1-1-senaryo-sabah-giris-yapamiyorum\">1.1 Senaryo: &quot;Sabah giriş yapamıyorum&quot;\u003c/h2>\n\u003cp>\u003cstrong>Belirti:\u003c/strong> Kullanıcı şifresini doğru yazdığını söylüyor, giriş reddediliyor.\u003c/p>\n\u003cp>\u003cstrong>Teşhis:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Caps Lock, klavye dili (TR/EN Q) kontrol et.\u003c/li>\n\u003cli>Hesap kilitli mi? ADUC veya PowerShell: \u003ccode>Get-ADUser kullanici -Properties LockedOut\u003c/code>\u003c/li>\n\u003cli>Şifre süresi dolmuş mu? \u003ccode>net user kullanici /domain\u003c/code> çıktısında &quot;Password expires&quot; satırı.\u003c/li>\n\u003cli>Hesap devre dışı mı, çalışma saati kısıtı var mı?\u003c/li>\n\u003cli>Bilgisayar domain ile konuşabiliyor mu? (VPN/ağ, saat farkı — saat farkı 5 dakikayı geçerse Kerberos bozulur).\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Çözüm:\u003c/strong> Kilidi aç, gerekirse kimliği doğruladıktan sonra şifreyi sıfırla, &quot;bir sonraki girişte değiştir&quot; seçeneğini işaretle.\u003c/p>\n\u003cp>\u003cstrong>Kök neden ara:\u003c/strong> Hesap tekrar tekrar kilitleniyorsa kilidi tetikleyen cihazı bul (telefon posta uygulaması, eski kayıtlı bağlantı, eşlenmiş ağ sürücüsü). Domain Controller üzerinde Olay ID \u003cstrong>4740\u003c/strong> kaynağı gösterir. Detaylı log analizi için \u003ca href=\"#/d/guvenlik\" class=\"smart-link\">Güvenlik ve Olay Müdahale Rehberi\u003c/a> bölümüne bak.\u003c/p>\n\u003ch2 id=\"s-1-2-senaryo-yeni-telefon-aldim-mfa-kodlari-gelmiyor\">1.2 Senaryo: &quot;Yeni telefon aldım, MFA kodları gelmiyor&quot;\u003c/h2>\n\u003col>\n\u003cli>Kullanıcının kimliğini \u003cstrong>ikinci bir kanaldan\u003c/strong> doğrula (yönetici onayı, şirket dahili hattından geri arama).\u003c/li>\n\u003cli>Eski kimlik doğrulayıcı yöntemini sıfırla (Entra ID &gt; Kullanıcı &gt; Kimlik doğrulama yöntemleri &gt; MFA&#39;yı yeniden kaydettir).\u003c/li>\n\u003cli>Kullanıcıyı \u003ccode>https://aka.ms/mysecurityinfo\u003c/code> adresinden yeni cihazı eklemesi için yönlendir.\u003c/li>\n\u003cli>Mümkünse \u003cstrong>birden fazla yöntem\u003c/strong> kaydettir (Microsoft Authenticator uygulaması + SMS/Telefon).\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Önlem:\u003c/strong> Telefon değişimi öncesinde kullanıcıların mevcut Authenticator&#39;dan yeni cihazı eklemeleri için oryantasyon kılavuzu paylaş. M365 detayları için \u003ca href=\"#/d/bulut\" class=\"smart-link\">Bulut ve Kimlik Rehberi\u003c/a>.\u003c/p>\n\u003ch2 id=\"s-1-3-senaryo-klas-re-erisimim-yok\">1.3 Senaryo: &quot;Klasöre erişimim yok&quot;\u003c/h2>\n\u003col>\n\u003cli>Hangi dosya yolu ve tam hata mesajı? (Erişim engellendi / yol bulunamadı).\u003c/li>\n\u003cli>Kullanıcı hangi güvenlik gruplarında? \u003ccode>whoami /groups\u003c/code> komutunu çalıştır.\u003c/li>\n\u003cli>Hem \u003cstrong>Paylaşım İzni (Share Permission)\u003c/strong> hem de \u003cstrong>NTFS İzni (Security Tab)\u003c/strong> kontrol edilir; ikisinin kesişimi (en kısıtlayıcı olan) geçerlidir.\u003c/li>\n\u003cli>Kullanıcı yeni bir gruba eklendiyse Kerberos biletinin yenilenmesi için \u003cstrong>oturumu kapatıp yeniden açmalıdır\u003c/strong> (veya \u003ccode>klist purge\u003c/code>).\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Önlem:\u003c/strong> İzinleri asla şahıs hesaplarına tek tek verme; departman güvenlik gruplarına (Security Group) ata.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-2-yazici-senaryolari\">2. YAZICI SENARYOLARI\u003c/h1>\n\u003ch2 id=\"s-2-1-senaryo-yazdiriyorum-ama-cikti-gelmiyor\">2.1 Senaryo: &quot;Yazdırıyorum ama çıktı gelmiyor&quot;\u003c/h2>\n\u003col>\n\u003cli>Yazıcının ekranında hata/kağıt sıkışması/toner uyarısı var mı?\u003c/li>\n\u003cli>Yazıcı ağda mı? Yazıcının IP adresine ping at: \u003ccode>ping yazici-ip\u003c/code>\u003c/li>\n\u003cli>Kuyrukta takılı iş var mı? Yazdırma biriktiricisini (Spooler) temizle ve yeniden başlat:\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode class=\"language-cmd\">net stop spooler\ndel /Q /F /S &quot;%systemroot%\\System32\\spool\\PRINTERS\\*.*&quot;\nnet start spooler\n\u003c/code>\u003c/pre>\n\u003col start=\"4\">\n\u003cli>Doğru yazıcı varsayılan mı, &quot;çevrimdışı çalış&quot; seçeneği işaretli mi?\u003c/li>\n\u003cli>Yazıcıyı bilgisayar adı yerine \u003cstrong>doğrudan IP (Standard TCP/IP Port)\u003c/strong> ile ekle.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Önlem:\u003c/strong> Tüm kurumsal yazıcılara DHCP üzerinden MAC rezervasyonu yap veya DHCP havuzu dışından sabit IP ver.\u003c/p>\n\u003ch2 id=\"s-2-2-senaryo-sadece-benim-bilgisayarimda-yazici-kayboldu\">2.2 Senaryo: &quot;Sadece benim bilgisayarımda yazıcı kayboldu&quot;\u003c/h2>\n\u003cul>\n\u003cli>Yazıcı sunucusundan yeniden eşle: \u003ccode>\\\\printserver\\yazici-adi\u003c/code>\u003c/li>\n\u003cli>Sürücü uyumsuzluğu: Windows güncellemeleri sonrası Point and Print kısıtlaması nedeniyle sürücü düşebilir; sürücüyü üretici sitesinden temiz kur.\u003c/li>\n\u003cli>GPO ile dağıtılan yazıcı ise: \u003ccode>gpupdate /force\u003c/code> çalıştırıp oturumu kapat aç.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-3-ag-ve-firewall-senaryolari\">3. AĞ VE FIREWALL SENARYOLARI\u003c/h1>\n\u003ch2 id=\"s-3-1-senaryo-sadece-bir-b-lumde-internet-yok\">3.1 Senaryo: &quot;Sadece bir bölümde internet yok&quot;\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Gözlem\u003c/th>\n\u003cth>Olası Neden\u003c/th>\n\u003cth>Yapılacak İlk Adım\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aynı switch&#39;e bağlı herkes etkileniyor\u003c/td>\n\u003ctd>Switch arızası, uplink kablosu, VLAN\u003c/td>\n\u003ctd>Switch güç ışığını ve uplink port ışığını kontrol et.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sadece Wi-Fi etkileniyor\u003c/td>\n\u003ctd>AP askıda, DHCP havuzu dolmuş, RADIUS\u003c/td>\n\u003ctd>AP&#39;yi yeniden başlat, DHCP scope doluluğuna bak.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sadece belirli siteler açılmıyor\u003c/td>\n\u003ctd>DNS, proxy, kurumsal firewall filtreleme\u003c/td>\n\u003ctd>\u003ccode>nslookup\u003c/code> yap, \u003ca href=\"#/d/firewall\" class=\"smart-link\">10-guvenlik-duvari-firewall-vpn-rehberi.md\u003c/a> loglarına bak.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bilgisayar IP adresi \u003ccode>169.254.x.x\u003c/code>\u003c/td>\n\u003ctd>DHCP&#39;ye ulaşılamıyor (APIPA)\u003c/td>\n\u003ctd>Kabloyu/portu test et: \u003ccode>ipconfig /release\u003c/code> ve \u003ccode>ipconfig /renew\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Adım Adım OSI Teşhisi:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>[Fiziksel Kontrol]: Kablo takılı mı, switch port ışığı yeşil mi?\u003c/li>\n\u003cli>[IP Kontrolü]: \u003ccode>ipconfig /all\u003c/code> çalıştır. IP ve Gateway doğru mu?\u003c/li>\n\u003cli>[Yerel Ağ]: \u003ccode>ping &lt;Gateway_IP&gt;\u003c/code> gitmiyorsa kablo/VLAN sorunu.\u003c/li>\n\u003cli>[Dış Ağ]: \u003ccode>ping 8.8.8.8\u003c/code> gidiyorsa internet hattı çalışıyor.\u003c/li>\n\u003cli>[DNS Kontrolü]: \u003ccode>nslookup google.com\u003c/code> çözmüyorsa DNS önbelleğini temizle: \u003ccode>ipconfig /flushdns\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>Ağ mantığı için \u003ca href=\"#/d/agtemel\" class=\"smart-link\">Ağ Temelleri Rehberi\u003c/a> bölümüne bak.\u003c/p>\n\u003ch2 id=\"s-3-2-senaryo-ag-cok-yavas-internet-surunuyor\">3.2 Senaryo: &quot;Ağ çok yavaş / internet sürünüyor&quot;\u003c/h2>\n\u003col>\n\u003cli>Hız testi tek kullanıcıda mı, tüm şirkette mi? (Kablolu ve Wi-Fi karşılaştır).\u003c/li>\n\u003cli>\u003ccode>ping -n 50 &lt;Gateway_IP&gt;\u003c/code>: paket kaybı (% packet loss) veya dalgalanma (jitter) var mı?\u003c/li>\n\u003cli>Switch portunda CRC veya input error sayaçları artıyor mu? (\u003ccode>show interfaces fa0/1\u003c/code> — duplex uyumsuzluğu veya ezilmiş kablo).\u003c/li>\n\u003cli>Firewall bant genişliği izleme ekranında hangi IP&#39;nin hattı tükettiğine bak (Torrent, büyük dosya indirme, bulut yedekleme).\u003c/li>\n\u003cli>Ağda döngü (Loop) şüphesi: Switch port ışıkları deli gibi aynı anda yanıp sönüyorsa Spanning Tree (STP) devreye girmemiş olabilir.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-3-3-senaryo-ayni-ip-adresi-baska-bir-cihazda-kullaniliyor-uyarisi\">3.3 Senaryo: &quot;Aynı IP adresi başka bir cihazda kullanılıyor&quot; uyarısı\u003c/h2>\n\u003col>\n\u003cli>\u003ccode>arp -a\u003c/code> ve \u003ccode>ipconfig /all\u003c/code> ile çakışan IP&#39;nin MAC adresini tespit et.\u003c/li>\n\u003cli>Switch üzerinde \u003ccode>show mac address-table | include &lt;mac&gt;\u003c/code> komutuyla cihazın hangi fiziksel porta bağlı olduğunu bul.\u003c/li>\n\u003cli>Cihazı bulup sabit IP&#39;sini değiştir ya da DHCP havuzunda rezervasyon tanımla.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-3-4-senaryo-firewall-uzerinden-port-acildi-ama-disaridan-ulasilamiyor\">3.4 Senaryo: &quot;Firewall üzerinden port açıldı ama dışarıdan ulaşılamıyor&quot;\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Hedef Servis Dinliyor mu?\u003c/strong> İçerideki sunucuda o port gerçekten açık mı? \u003ccode>netstat -ano | findstr :443\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>Yerel Güvenlik Duvarı:\u003c/strong> Windows Defender Firewall gelen portu engelliyor mu? İlgili port için &quot;Inbound Rule&quot; açıldı mı?\u003c/li>\n\u003cli>\u003cstrong>ISP Port Engeli:\u003c/strong> İnternet Servis Sağlayıcısı (Türk Telekom, Superonline vb.) kurumsal statik IP olmayan hatlarda 80, 443 veya 25 portlarını güven gerekçesiyle engeller. ISP ile görüşüp port filtresini kaldırt.\u003c/li>\n\u003cli>\u003cstrong>NAT / VIP Kontrolü:\u003c/strong> Güvenlik duvarında Destination NAT (Virtual IP) kuralı ve WAN -&gt; DMZ geçiş kuralı (Policy) tanımlı mı? Detaylar: \u003ca href=\"#/d/firewall\" class=\"smart-link\">10-guvenlik-duvari-firewall-vpn-rehberi.md\u003c/a>.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-3-5-senaryo-vpn-basariyla-baglandi-ama-ic-sunuculara-veya-dosya-paylasimina-ulasilamiyor\">3.5 Senaryo: &quot;VPN başarıyla bağlandı ama iç sunuculara veya dosya paylaşımına ulaşılamıyor&quot;\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Subnet Çakışması (En Sık Neden):\u003c/strong> Kullanıcının evindeki modem IP bloğu \u003ccode>192.168.1.0/24\u003c/code> ve şirket iç ağı da \u003ccode>192.168.1.0/24\u003c/code> ise Windows paketleri ev ağına gönderir, tünelden geçirmez!\u003cul>\n\u003cli>\u003cem>Çözüm:\u003c/em> Kurumsal ağlarda asla \u003ccode>192.168.1.0/24\u003c/code> veya \u003ccode>192.168.0.0/24\u003c/code> kullanılmamalı; \u003ccode>10.x.x.x\u003c/code> veya \u003ccode>172.16.x.x\u003c/code> tercih edilmelidir.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>DNS Suffix:\u003c/strong> Kullanıcı sunucuya \u003ccode>\\\\muhasebe-dc\u003c/code> yazarak erişemiyorsa tam adı (FQDN) dene: \u003ccode>\\\\muhasebe-dc.firma.local\u003c/code> veya doğrudan IP ile dene: \u003ccode>\\\\10.10.1.20\\paylasim\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Split Tunnel Rotası:\u003c/strong> VPN istemcisine şirket IP bloklarının rotası push edilmiş mi? Komut satırında \u003ccode>route print\u003c/code> ile kontrol et.\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch1 id=\"s-4-posta-ve-ofis-senaryolari\">4. POSTA VE OFİS SENARYOLARI\u003c/h1>\n\u003ch2 id=\"s-4-1-senaryo-outlook-surekli-sifre-soruyor-baglanti-kesildi\">4.1 Senaryo: &quot;Outlook sürekli şifre soruyor / Bağlantı kesildi&quot;\u003c/h2>\n\u003col>\n\u003cli>Şifre yakın zamanda değiştiyse Windows Kimlik Bilgisi Yöneticisi&#39;ndeki (Credential Manager) eski Microsoft/Office kayıtlarını temizle.\u003c/li>\n\u003cli>Outlook&#39;u eklentisiz güvenli modda açmayı dene: \u003ccode>Win+R\u003c/code> -&gt; \u003ccode>outlook /safe\u003c/code>\u003c/li>\n\u003cli>Modern Kimlik Doğrulama (ADAL/OAuth) penceresi açılmıyorsa: Edge/Internet seçenekleri veya TPM anahtar sorunu olabilir.\u003c/li>\n\u003cli>Profili yeniden oluştur: Denetim Masası &gt; Posta (Mail) &gt; Profilleri Göster &gt; Yeni Profil ekle.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-2-senaryo-g-nderdigim-e-posta-geri-d-ndu-ndr-hata-kodu\">4.2 Senaryo: &quot;Gönderdiğim e-posta geri döndü (NDR Hata Kodu)&quot;\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>5.1.1 (User unknown):\u003c/strong> Alıcı e-posta adresi yanlış yazılmış veya alıcı şirketten ayrılmış.\u003c/li>\n\u003cli>\u003cstrong>5.7.1 (Access denied / SPF fail):\u003c/strong> Gönderen IP SPF kaydında yok veya e-posta spam filtresine takılmış.\u003c/li>\n\u003cli>\u003cstrong>5.2.2 (Mailbox full):\u003c/strong> Alıcının posta kutusu kotası dolmuş.\u003c/li>\n\u003cli>SPF, DKIM ve DMARC kayıtlarını doğrulamak için \u003ccode>nslookup -type=TXT firma.com\u003c/code> sorgusu yap.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-4-3-senaryo-kullanici-supheli-e-postadaki-linke-tikladi-phishing\">4.3 Senaryo: &quot;Kullanıcı şüpheli e-postadaki linke tıkladı (Phishing)&quot;\u003c/h2>\n\u003col>\n\u003cli>[Adım 1 - İzolasyon]: Bilgisayarın ağ kablosunu çek veya Wi-Fi&#39;ı kapat (Cihazı kapatma, bellek kanıtı kaybolmasın!).\u003c/li>\n\u003cli>[Adım 2 - Kimlik Güvenliği]: Kullanıcının şifresini Active Directory / Entra ID üzerinden hemen değiştir ve tüm aktif oturumlarını zorla sonlandır (Revoke Sessions).\u003c/li>\n\u003cli>[Adım 3 - E-posta Analizi]: E-postanın başlık (Header) bilgilerini al: Gönderen IP, SPF/DKIM durumu ve tıklanan zararlı URL&#39;yi tespit et.\u003c/li>\n\u003cli>[Adım 4 - Kurum Koruması]: Tıklanan zararlı URL&#39;yi kurumsal firewall ve EDR üzerinde kara listeye (Blacklist) ekle; şirketteki diğer kullanıcılara gelen aynı e-postaları Exchange Message Trace ile bulup sil.\u003c/li>\n\u003cli>Detaylı adli analiz adımları için \u003ca href=\"#/d/guvenlik\" class=\"smart-link\">Güvenlik ve Olay Müdahale Rehberi\u003c/a>.\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch1 id=\"s-5-windows-ve-istemci-senaryolari\">5. WINDOWS VE İSTEMCİ SENARYOLARI\u003c/h1>\n\u003ch2 id=\"s-5-1-senaryo-bilgisayar-asiri-yavasladi\">5.1 Senaryo: &quot;Bilgisayar aşırı yavaşladı&quot;\u003c/h2>\n\u003col>\n\u003cli>Görev Yöneticisi (\u003ccode>Ctrl+Shift+Esc\u003c/code>): CPU, RAM veya Disk %100 mü?\u003c/li>\n\u003cli>Disk %100 ise: Windows Update arka planda takılmış olabilir veya mekanik HDD ömrünü tamamlamaktadır.\u003c/li>\n\u003cli>Başlangıç programlarını devre dışı bırak (Startup sekmesi).\u003c/li>\n\u003cli>Bozuk sistem dosyalarını onar:\u003cpre>\u003ccode class=\"language-cmd\">sfc /scannow\nDISM /Online /Cleanup-Image /RestoreHealth\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003cli>Disk sağlığı kontrolü: PowerShell&#39;de \u003ccode>wmic diskdrive get status\u003c/code> veya CrystalDiskInfo ile SMART verilerine bak. HDD ise SSD&#39;ye yükseltmek en kesin çözümdür.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-5-2-senaryo-bu-is-istasyonu-ile-etki-alani-arasindaki-guven-iliskisi-basarisiz\">5.2 Senaryo: &quot;Bu iş istasyonu ile etki alanı arasındaki güven ilişkisi başarısız&quot;\u003c/h2>\n\u003cp>Bilgisayarın etki alanı makine hesabı parolası DC ile senkronize değil.\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\"># Yönetici yetkili PowerShell ile onarma:\nTest-ComputerSecureChannel -Repair -Credential (Get-Credential)\n\n# Alternatif komut:\nReset-ComputerMachinePassword -Credential firma\\domainadmin\n\u003c/code>\u003c/pre>\n\u003cp>Komut başarısız olursa: Yerel yönetici (Local Admin) ile oturum aç, bilgisayarı WORKGROUP&#39;a al, yeniden başlat ve tekrar domaine dahil et.\u003c/p>\n\u003ch2 id=\"s-5-3-senaryo-bitlocker-kurtarma-anahtari-recovery-key-istiyor\">5.3 Senaryo: &quot;BitLocker kurtarma anahtarı (Recovery Key) istiyor&quot;\u003c/h2>\n\u003col>\n\u003cli>Kullanıcının kimliğini doğrula.\u003c/li>\n\u003cli>48 haneli kurtarma anahtarını Microsoft Entra ID (Azure AD), Intune veya Active Directory Users and Computers (Cihaz Özellikleri &gt; BitLocker Recovery) üzerinden bul.\u003c/li>\n\u003cli>Neden tetiklendiğini araştır: BIOS güncellemesi yapıldı mı, harici USB takılıyken mi açıldı, anakart/TPM arızası mı var?\u003c/li>\n\u003cli>Detaylar için \u003ca href=\"#/d/istemci\" class=\"smart-link\">İstemci ve Donanım Rehberi\u003c/a>.\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch1 id=\"s-6-donanim-ups-ve-veri-merkezi-senaryolari\">6. DONANIM, UPS VE VERİ MERKEZİ SENARYOLARI\u003c/h1>\n\u003ch2 id=\"s-6-1-senaryo-sistem-odasindan-kabinetten-surekli-aci-bir-bip-sesi-geliyor\">6.1 Senaryo: &quot;Sistem odasından / kabinetten sürekli acı bir bip sesi geliyor&quot;\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>UPS Alarmı mı?\u003c/strong> UPS ekranına bak:\u003cul>\n\u003cli>&quot;Replace Battery&quot; veya akü simgesi kırmızı yanıp sönüyorsa akü ömrü bitmiştir.\u003c/li>\n\u003cli>&quot;Overload&quot; uyarısı varsa UPS kapasitesi aşılmıştır; acil olmayan yükleri devreden çıkar.\u003c/li>\n\u003cli>Şebeke elektriği kesilmiş ve jeneratör devreye girmemiş olabilir.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Sunucu Alarmı mı?\u003c/strong> Sunucuların ön panelindeki LED&#39;lere bak:\u003cul>\n\u003cli>Kehribar (Amber/Turuncu) yanıp sönen disk veya güç kaynağı LED&#39;i var mı?\u003c/li>\n\u003cli>Sunucunun iDRAC / iLO arayüzüne bağlanıp &quot;System Event Log (SEL)&quot; kayıtlarını oku.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Fiziksel altyapı standartları için \u003ca href=\"#/d/donanim\" class=\"smart-link\">11-veri-merkezi-donanim-ups-kablolama-rehberi.md\u003c/a> dokümanını incele.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-6-2-senaryo-sunucuda-turuncu-disk-ariza-isigi-yaniyor-raid-degraded-oldu\">6.2 Senaryo: &quot;Sunucuda turuncu disk arıza ışığı yanıyor / RAID Degraded oldu&quot;\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Asla Panik Yapıp Sunucuyu Kapatma!\u003c/strong> Modern kurumsal sunucular Hot-Swap destekler.\u003c/li>\n\u003cli>iDRAC/iLO veya RAID yönetim yazılımına (MegaRAID, PERC CLI) girip hangi yuvadaki (Slot) diskin &quot;Failed&quot; olduğunu teyit et.\u003c/li>\n\u003cli>\u003cstrong>Acil Yedek:\u003c/strong> Kritik verilerin en güncel yedeğinin alındığından emin ol (Rebuild sırasında ikinci bir diskin bozulma riski vardır!).\u003c/li>\n\u003cli>Aynı model, boyutta ve hızda (RPM) yeni diski tak. RAID denetleyicisi otomatik olarak &quot;Rebuild&quot; sürecini başlatacaktır.\u003c/li>\n\u003cli>Rebuild tamamlanana kadar sunucuya ağır disk yazma yükü bindirme.\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch1 id=\"s-7-ornek-profesyonel-ticket-kaydi\">7. ÖRNEK PROFESYONEL TICKET KAYDI\u003c/h1>\n\u003cpre>\u003ccode>Çağrı No: #IT-2026-8842\nTalep Eden: Ahmet Yılmaz / Finans\nÖncelik: Yüksek (P2 - Departman çalışamıyor)\nKonu: Şube VPN tüneli koptu, ERP sunucusuna erişilemiyor\n\n[Belirti]:\nŞube çalışanları 14:15 itibarıyla merkezdeki ERP sunucusuna (10.10.1.20) bağlanamadıklarını bildirdi.\n\n[Yapılan İnceleme ve Teşhis]:\n1. Şube internet bağlantısı kontrol edildi; internete çıkışta sorun yok (ping 8.8.8.8 başarılı).\n2. Merkez FortiGate firewall üzerinde IPsec tünel durumu kontrol edildi: Tünel &quot;Down&quot; durumdaydı.\n3. IKE logları incelendi (`diagnose vpn ike log filter`): Karşı tarafın dinamik IP'si değiştiği için Phase 1 DPD zaman aşımına düşmüş.\n\n[Uygulanan Çözüm]:\n- Şube modeminin Dynamic DNS (DDNS) kaydı güncellendi.\n- Merkez güvenlik duvarında IPsec tünel yeniden tetiklendi (`diagnose vpn ike restart`).\n- Tünel &quot;Up&quot; durumuna geçti. Şube bilgisayarından 10.10.1.20 IP'sine erişim ve RDP testi başarıyla sağlandı.\n\n[Alınan Önlem / Kök Neden]:\nŞube internet hattı dinamik IP olduğu için kopma yaşanmıştır. ISP ile görüşülerek şubeye statik IP tahsis edilmesi için talep açıldı.\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>Altın Kural:\u003c/strong> Sorunu yalnızca geçici olarak düzeltmek &quot;teknisyenliktir&quot;; kök nedeni bulup tekrarlanmasını engellemek &quot;yöneticiliktir&quot;.\u003c/p>\n\u003c/blockquote>\n","sections":[{"id":"s-sik-sorunlar-ve-c-zum-senaryolari","title":"Sık Sorunlar ve Çözüm Senaryoları","level":1,"path":"","isTitle":true,"text":"Sahada en sık gelen talepler için belirti → teşhis → çözüm → önlem akışı. Her senaryo, ticket'a yazılabilecek şekilde kısa ve uygulanabilir adımlarla hazırlandı.\nYöntem: Önce kapsamı belirle (tek kişi mi, herkes mi?), sonra en basit ve geri alınabilir adımdan başla. Her adımın sonucunu ticket'a not et. İlgili başlıklara veya adımlara tıklayarak doğrudan çözüme gidebilirsin."},{"id":"s-1-hesap-ve-erisim-senaryolari","title":"1. HESAP VE ERİŞİM SENARYOLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-1-1-senaryo-sabah-giris-yapamiyorum","title":"1.1 Senaryo: \"Sabah giriş yapamıyorum\"","level":2,"path":"1. HESAP VE ERİŞİM SENARYOLARI","isTitle":false,"text":"Belirti: Kullanıcı şifresini doğru yazdığını söylüyor, giriş reddediliyor.\nTeşhis:\nCaps Lock, klavye dili (TR/EN Q) kontrol et.\nHesap kilitli mi? ADUC veya PowerShell: Get-ADUser kullanici -Properties LockedOut\nŞifre süresi dolmuş mu? net user kullanici /domain çıktısında \"Password expires\" satırı.\nHesap devre dışı mı, çalışma saati kısıtı var mı?\nBilgisayar domain ile konuşabiliyor mu? (VPN/ağ, saat farkı — saat farkı 5 dakikayı geçerse Kerberos bozulur).\nÇözüm: Kilidi aç, gerekirse kimliği doğruladıktan sonra şifreyi sıfırla, \"bir sonraki girişte değiştir\" seçeneğini işaretle.\nKök neden ara: Hesap tekrar tekrar kilitleniyorsa kilidi tetikleyen cihazı bul (telefon posta uygulaması, eski kayıtlı bağlantı, eşlenmiş ağ sürücüsü). Domain Controller üzerinde Olay ID 4740 kaynağı gösterir. Detaylı log analizi için Güvenlik ve Olay Müdahale Rehberi bölümüne bak."},{"id":"s-1-2-senaryo-yeni-telefon-aldim-mfa-kodlari-gelmiyor","title":"1.2 Senaryo: \"Yeni telefon aldım, MFA kodları gelmiyor\"","level":2,"path":"1. HESAP VE ERİŞİM SENARYOLARI","isTitle":false,"text":"Kullanıcının kimliğini ikinci bir kanaldan doğrula (yönetici onayı, şirket dahili hattından geri arama).\nEski kimlik doğrulayıcı yöntemini sıfırla (Entra ID > Kullanıcı > Kimlik doğrulama yöntemleri > MFA'yı yeniden kaydettir).\nKullanıcıyı https://aka.ms/mysecurityinfo adresinden yeni cihazı eklemesi için yönlendir.\nMümkünse birden fazla yöntem kaydettir (Microsoft Authenticator uygulaması + SMS/Telefon).\nÖnlem: Telefon değişimi öncesinde kullanıcıların mevcut Authenticator'dan yeni cihazı eklemeleri için oryantasyon kılavuzu paylaş. M365 detayları için Bulut ve Kimlik Rehberi."},{"id":"s-1-3-senaryo-klas-re-erisimim-yok","title":"1.3 Senaryo: \"Klasöre erişimim yok\"","level":2,"path":"1. HESAP VE ERİŞİM SENARYOLARI","isTitle":false,"text":"Hangi dosya yolu ve tam hata mesajı? (Erişim engellendi / yol bulunamadı).\nKullanıcı hangi güvenlik gruplarında? whoami /groups komutunu çalıştır.\nHem Paylaşım İzni (Share Permission) hem de NTFS İzni (Security Tab) kontrol edilir; ikisinin kesişimi (en kısıtlayıcı olan) geçerlidir.\nKullanıcı yeni bir gruba eklendiyse Kerberos biletinin yenilenmesi için oturumu kapatıp yeniden açmalıdır (veya klist purge).\nÖnlem: İzinleri asla şahıs hesaplarına tek tek verme; departman güvenlik gruplarına (Security Group) ata."},{"id":"s-2-yazici-senaryolari","title":"2. YAZICI SENARYOLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-2-1-senaryo-yazdiriyorum-ama-cikti-gelmiyor","title":"2.1 Senaryo: \"Yazdırıyorum ama çıktı gelmiyor\"","level":2,"path":"2. YAZICI SENARYOLARI","isTitle":false,"text":"Yazıcının ekranında hata/kağıt sıkışması/toner uyarısı var mı?\nYazıcı ağda mı? Yazıcının IP adresine ping at: ping yazici-ip\nKuyrukta takılı iş var mı? Yazdırma biriktiricisini (Spooler) temizle ve yeniden başlat:\nnet stop spooler\ndel /Q /F /S \"%systemroot%\\System32\\spool\\PRINTERS\\*.*\"\nnet start spooler\nDoğru yazıcı varsayılan mı, \"çevrimdışı çalış\" seçeneği işaretli mi?\nYazıcıyı bilgisayar adı yerine doğrudan IP (Standard TCP/IP Port) ile ekle.\nÖnlem: Tüm kurumsal yazıcılara DHCP üzerinden MAC rezervasyonu yap veya DHCP havuzu dışından sabit IP ver."},{"id":"s-2-2-senaryo-sadece-benim-bilgisayarimda-yazici-kayboldu","title":"2.2 Senaryo: \"Sadece benim bilgisayarımda yazıcı kayboldu\"","level":2,"path":"2. YAZICI SENARYOLARI","isTitle":false,"text":"Yazıcı sunucusundan yeniden eşle: \\\\printserver\\yazici-adi\nSürücü uyumsuzluğu: Windows güncellemeleri sonrası Point and Print kısıtlaması nedeniyle sürücü düşebilir; sürücüyü üretici sitesinden temiz kur.\nGPO ile dağıtılan yazıcı ise: gpupdate /force çalıştırıp oturumu kapat aç."},{"id":"s-3-ag-ve-firewall-senaryolari","title":"3. AĞ VE FIREWALL SENARYOLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-3-1-senaryo-sadece-bir-b-lumde-internet-yok","title":"3.1 Senaryo: \"Sadece bir bölümde internet yok\"","level":2,"path":"3. AĞ VE FIREWALL SENARYOLARI","isTitle":false,"text":"Gözlem\nOlası Neden\nYapılacak İlk Adım\nAynı switch'e bağlı herkes etkileniyor\nSwitch arızası, uplink kablosu, VLAN\nSwitch güç ışığını ve uplink port ışığını kontrol et.\nSadece Wi-Fi etkileniyor\nAP askıda, DHCP havuzu dolmuş, RADIUS\nAP'yi yeniden başlat, DHCP scope doluluğuna bak.\nSadece belirli siteler açılmıyor\nDNS, proxy, kurumsal firewall filtreleme\nnslookup yap, 10-guvenlik-duvari-firewall-vpn-rehberi.md loglarına bak.\nBilgisayar IP adresi 169.254.x.x\nDHCP'ye ulaşılamıyor (APIPA)\nKabloyu/portu test et: ipconfig /release ve ipconfig /renew.\nAdım Adım OSI Teşhisi:\n[Fiziksel Kontrol]: Kablo takılı mı, switch port ışığı yeşil mi?\n[IP Kontrolü]: ipconfig /all çalıştır. IP ve Gateway doğru mu?\n[Yerel Ağ]: ping \u003cGateway_IP> gitmiyorsa kablo/VLAN sorunu.\n[Dış Ağ]: ping 8.8.8.8 gidiyorsa internet hattı çalışıyor.\n[DNS Kontrolü]: nslookup google.com çözmüyorsa DNS önbelleğini temizle: ipconfig /flushdns.\nAğ mantığı için Ağ Temelleri Rehberi bölümüne bak."},{"id":"s-3-2-senaryo-ag-cok-yavas-internet-surunuyor","title":"3.2 Senaryo: \"Ağ çok yavaş / internet sürünüyor\"","level":2,"path":"3. AĞ VE FIREWALL SENARYOLARI","isTitle":false,"text":"Hız testi tek kullanıcıda mı, tüm şirkette mi? (Kablolu ve Wi-Fi karşılaştır).\nping -n 50 \u003cGateway_IP>: paket kaybı (% packet loss) veya dalgalanma (jitter) var mı?\nSwitch portunda CRC veya input error sayaçları artıyor mu? (show interfaces fa0/1 — duplex uyumsuzluğu veya ezilmiş kablo).\nFirewall bant genişliği izleme ekranında hangi IP'nin hattı tükettiğine bak (Torrent, büyük dosya indirme, bulut yedekleme).\nAğda döngü (Loop) şüphesi: Switch port ışıkları deli gibi aynı anda yanıp sönüyorsa Spanning Tree (STP) devreye girmemiş olabilir."},{"id":"s-3-3-senaryo-ayni-ip-adresi-baska-bir-cihazda-kullaniliyor-uyarisi","title":"3.3 Senaryo: \"Aynı IP adresi başka bir cihazda kullanılıyor\" uyarısı","level":2,"path":"3. AĞ VE FIREWALL SENARYOLARI","isTitle":false,"text":"arp -a ve ipconfig /all ile çakışan IP'nin MAC adresini tespit et.\nSwitch üzerinde show mac address-table | include \u003cmac> komutuyla cihazın hangi fiziksel porta bağlı olduğunu bul.\nCihazı bulup sabit IP'sini değiştir ya da DHCP havuzunda rezervasyon tanımla."},{"id":"s-3-4-senaryo-firewall-uzerinden-port-acildi-ama-disaridan-ulasilamiyor","title":"3.4 Senaryo: \"Firewall üzerinden port açıldı ama dışarıdan ulaşılamıyor\"","level":2,"path":"3. AĞ VE FIREWALL SENARYOLARI","isTitle":false,"text":"Hedef Servis Dinliyor mu? İçerideki sunucuda o port gerçekten açık mı? netstat -ano | findstr :443\nYerel Güvenlik Duvarı: Windows Defender Firewall gelen portu engelliyor mu? İlgili port için \"Inbound Rule\" açıldı mı?\nISP Port Engeli: İnternet Servis Sağlayıcısı (Türk Telekom, Superonline vb.) kurumsal statik IP olmayan hatlarda 80, 443 veya 25 portlarını güven gerekçesiyle engeller. ISP ile görüşüp port filtresini kaldırt.\nNAT / VIP Kontrolü: Güvenlik duvarında Destination NAT (Virtual IP) kuralı ve WAN -> DMZ geçiş kuralı (Policy) tanımlı mı? Detaylar: 10-guvenlik-duvari-firewall-vpn-rehberi.md."},{"id":"s-3-5-senaryo-vpn-basariyla-baglandi-ama-ic-sunuculara-veya-dosya-paylasimina-ulasilamiyor","title":"3.5 Senaryo: \"VPN başarıyla bağlandı ama iç sunuculara veya dosya paylaşımına ulaşılamıyor\"","level":2,"path":"3. AĞ VE FIREWALL SENARYOLARI","isTitle":false,"text":"Subnet Çakışması (En Sık Neden): Kullanıcının evindeki modem IP bloğu 192.168.1.0/24 ve şirket iç ağı da 192.168.1.0/24 ise Windows paketleri ev ağına gönderir, tünelden geçirmez!\nÇözüm: Kurumsal ağlarda asla 192.168.1.0/24 veya 192.168.0.0/24 kullanılmamalı; 10.x.x.x veya 172.16.x.x tercih edilmelidir.\nDNS Suffix: Kullanıcı sunucuya \\\\muhasebe-dc yazarak erişemiyorsa tam adı (FQDN) dene: \\\\muhasebe-dc.firma.local veya doğrudan IP ile dene: \\\\10.10.1.20\\paylasim.\nSplit Tunnel Rotası: VPN istemcisine şirket IP bloklarının rotası push edilmiş mi? Komut satırında route print ile kontrol et."},{"id":"s-4-posta-ve-ofis-senaryolari","title":"4. POSTA VE OFİS SENARYOLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-4-1-senaryo-outlook-surekli-sifre-soruyor-baglanti-kesildi","title":"4.1 Senaryo: \"Outlook sürekli şifre soruyor / Bağlantı kesildi\"","level":2,"path":"4. POSTA VE OFİS SENARYOLARI","isTitle":false,"text":"Şifre yakın zamanda değiştiyse Windows Kimlik Bilgisi Yöneticisi'ndeki (Credential Manager) eski Microsoft/Office kayıtlarını temizle.\nOutlook'u eklentisiz güvenli modda açmayı dene: Win+R -> outlook /safe\nModern Kimlik Doğrulama (ADAL/OAuth) penceresi açılmıyorsa: Edge/Internet seçenekleri veya TPM anahtar sorunu olabilir.\nProfili yeniden oluştur: Denetim Masası > Posta (Mail) > Profilleri Göster > Yeni Profil ekle."},{"id":"s-4-2-senaryo-g-nderdigim-e-posta-geri-d-ndu-ndr-hata-kodu","title":"4.2 Senaryo: \"Gönderdiğim e-posta geri döndü (NDR Hata Kodu)\"","level":2,"path":"4. POSTA VE OFİS SENARYOLARI","isTitle":false,"text":"5.1.1 (User unknown): Alıcı e-posta adresi yanlış yazılmış veya alıcı şirketten ayrılmış.\n5.7.1 (Access denied / SPF fail): Gönderen IP SPF kaydında yok veya e-posta spam filtresine takılmış.\n5.2.2 (Mailbox full): Alıcının posta kutusu kotası dolmuş.\nSPF, DKIM ve DMARC kayıtlarını doğrulamak için nslookup -type=TXT firma.com sorgusu yap."},{"id":"s-4-3-senaryo-kullanici-supheli-e-postadaki-linke-tikladi-phishing","title":"4.3 Senaryo: \"Kullanıcı şüpheli e-postadaki linke tıkladı (Phishing)\"","level":2,"path":"4. POSTA VE OFİS SENARYOLARI","isTitle":false,"text":"[Adım 1 - İzolasyon]: Bilgisayarın ağ kablosunu çek veya Wi-Fi'ı kapat (Cihazı kapatma, bellek kanıtı kaybolmasın!).\n[Adım 2 - Kimlik Güvenliği]: Kullanıcının şifresini Active Directory / Entra ID üzerinden hemen değiştir ve tüm aktif oturumlarını zorla sonlandır (Revoke Sessions).\n[Adım 3 - E-posta Analizi]: E-postanın başlık (Header) bilgilerini al: Gönderen IP, SPF/DKIM durumu ve tıklanan zararlı URL'yi tespit et.\n[Adım 4 - Kurum Koruması]: Tıklanan zararlı URL'yi kurumsal firewall ve EDR üzerinde kara listeye (Blacklist) ekle; şirketteki diğer kullanıcılara gelen aynı e-postaları Exchange Message Trace ile bulup sil.\nDetaylı adli analiz adımları için Güvenlik ve Olay Müdahale Rehberi."},{"id":"s-5-windows-ve-istemci-senaryolari","title":"5. WINDOWS VE İSTEMCİ SENARYOLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-5-1-senaryo-bilgisayar-asiri-yavasladi","title":"5.1 Senaryo: \"Bilgisayar aşırı yavaşladı\"","level":2,"path":"5. WINDOWS VE İSTEMCİ SENARYOLARI","isTitle":false,"text":"Görev Yöneticisi (Ctrl+Shift+Esc): CPU, RAM veya Disk %100 mü?\nDisk %100 ise: Windows Update arka planda takılmış olabilir veya mekanik HDD ömrünü tamamlamaktadır.\nBaşlangıç programlarını devre dışı bırak (Startup sekmesi).\nBozuk sistem dosyalarını onar:sfc /scannow\nDISM /Online /Cleanup-Image /RestoreHealth\nDisk sağlığı kontrolü: PowerShell'de wmic diskdrive get status veya CrystalDiskInfo ile SMART verilerine bak. HDD ise SSD'ye yükseltmek en kesin çözümdür."},{"id":"s-5-2-senaryo-bu-is-istasyonu-ile-etki-alani-arasindaki-guven-iliskisi-basarisiz","title":"5.2 Senaryo: \"Bu iş istasyonu ile etki alanı arasındaki güven ilişkisi başarısız\"","level":2,"path":"5. WINDOWS VE İSTEMCİ SENARYOLARI","isTitle":false,"text":"Bilgisayarın etki alanı makine hesabı parolası DC ile senkronize değil.\n# Yönetici yetkili PowerShell ile onarma:\nTest-ComputerSecureChannel -Repair -Credential (Get-Credential)\n# Alternatif komut:\nReset-ComputerMachinePassword -Credential firma\\domainadmin\nKomut başarısız olursa: Yerel yönetici (Local Admin) ile oturum aç, bilgisayarı WORKGROUP'a al, yeniden başlat ve tekrar domaine dahil et."},{"id":"s-5-3-senaryo-bitlocker-kurtarma-anahtari-recovery-key-istiyor","title":"5.3 Senaryo: \"BitLocker kurtarma anahtarı (Recovery Key) istiyor\"","level":2,"path":"5. WINDOWS VE İSTEMCİ SENARYOLARI","isTitle":false,"text":"Kullanıcının kimliğini doğrula.\n48 haneli kurtarma anahtarını Microsoft Entra ID (Azure AD), Intune veya Active Directory Users and Computers (Cihaz Özellikleri > BitLocker Recovery) üzerinden bul.\nNeden tetiklendiğini araştır: BIOS güncellemesi yapıldı mı, harici USB takılıyken mi açıldı, anakart/TPM arızası mı var?\nDetaylar için İstemci ve Donanım Rehberi."},{"id":"s-6-donanim-ups-ve-veri-merkezi-senaryolari","title":"6. DONANIM, UPS VE VERİ MERKEZİ SENARYOLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-6-1-senaryo-sistem-odasindan-kabinetten-surekli-aci-bir-bip-sesi-geliyor","title":"6.1 Senaryo: \"Sistem odasından / kabinetten sürekli acı bir bip sesi geliyor\"","level":2,"path":"6. DONANIM, UPS VE VERİ MERKEZİ SENARYOLARI","isTitle":false,"text":"UPS Alarmı mı? UPS ekranına bak:\n\"Replace Battery\" veya akü simgesi kırmızı yanıp sönüyorsa akü ömrü bitmiştir.\n\"Overload\" uyarısı varsa UPS kapasitesi aşılmıştır; acil olmayan yükleri devreden çıkar.\nŞebeke elektriği kesilmiş ve jeneratör devreye girmemiş olabilir.\nSunucu Alarmı mı? Sunucuların ön panelindeki LED'lere bak:\nKehribar (Amber/Turuncu) yanıp sönen disk veya güç kaynağı LED'i var mı?\nSunucunun iDRAC / iLO arayüzüne bağlanıp \"System Event Log (SEL)\" kayıtlarını oku.\nFiziksel altyapı standartları için 11-veri-merkezi-donanim-ups-kablolama-rehberi.md dokümanını incele."},{"id":"s-6-2-senaryo-sunucuda-turuncu-disk-ariza-isigi-yaniyor-raid-degraded-oldu","title":"6.2 Senaryo: \"Sunucuda turuncu disk arıza ışığı yanıyor / RAID Degraded oldu\"","level":2,"path":"6. DONANIM, UPS VE VERİ MERKEZİ SENARYOLARI","isTitle":false,"text":"Asla Panik Yapıp Sunucuyu Kapatma! Modern kurumsal sunucular Hot-Swap destekler.\niDRAC/iLO veya RAID yönetim yazılımına (MegaRAID, PERC CLI) girip hangi yuvadaki (Slot) diskin \"Failed\" olduğunu teyit et.\nAcil Yedek: Kritik verilerin en güncel yedeğinin alındığından emin ol (Rebuild sırasında ikinci bir diskin bozulma riski vardır!).\nAynı model, boyutta ve hızda (RPM) yeni diski tak. RAID denetleyicisi otomatik olarak \"Rebuild\" sürecini başlatacaktır.\nRebuild tamamlanana kadar sunucuya ağır disk yazma yükü bindirme."},{"id":"s-7-ornek-profesyonel-ticket-kaydi","title":"7. ÖRNEK PROFESYONEL TICKET KAYDI","level":1,"path":"","isTitle":false,"text":"Çağrı No: #IT-2026-8842\nTalep Eden: Ahmet Yılmaz / Finans\nÖncelik: Yüksek (P2 - Departman çalışamıyor)\nKonu: Şube VPN tüneli koptu, ERP sunucusuna erişilemiyor\n[Belirti]:\nŞube çalışanları 14:15 itibarıyla merkezdeki ERP sunucusuna (10.10.1.20) bağlanamadıklarını bildirdi.\n[Yapılan İnceleme ve Teşhis]:\n1. Şube internet bağlantısı kontrol edildi; internete çıkışta sorun yok (ping 8.8.8.8 başarılı).\n2. Merkez FortiGate firewall üzerinde IPsec tünel durumu kontrol edildi: Tünel \"Down\" durumdaydı.\n3. IKE logları incelendi (`diagnose vpn ike log filter`): Karşı tarafın dinamik IP'si değiştiği için Phase 1 DPD zaman aşımına düşmüş.\n[Uygulanan Çözüm]:\n- Şube modeminin Dynamic DNS (DDNS) kaydı güncellendi.\n- Merkez güvenlik duvarında IPsec tünel yeniden tetiklendi (`diagnose vpn ike restart`).\n- Tünel \"Up\" durumuna geçti. Şube bilgisayarından 10.10.1.20 IP'sine erişim ve RDP testi başarıyla sağlandı.\n[Alınan Önlem / Kök Neden]:\nŞube internet hattı dinamik IP olduğu için kopma yaşanmıştır. ISP ile görüşülerek şubeye statik IP tahsis edilmesi için talep açıldı.\nAltın Kural: Sorunu yalnızca geçici olarak düzeltmek \"teknisyenliktir\"; kök nedeni bulup tekrarlanmasını engellemek \"yöneticiliktir\"."}]},{"slug":"agtemel","file":"07-ag-temelleri-rehberi.md","title":"Ağ Temelleri Rehberi","short":"Ağ Temelleri","desc":"OSI/TCP-IP, subnet, VLAN, yönlendirme, Wi-Fi, VPN, ağ teşhisi","words":1571,"html":"\u003ch1 id=\"s-ag-temelleri-rehberi\">Ağ Temelleri Rehberi\u003c/h1>\n\u003cp>Ağ sorunlarını tahmin ederek değil \u003cstrong>katman katman\u003c/strong> çözebilmek için gereken temel bilgiler. Cisco&#39;ya özel komutlar için \u003ccode>cisco-switch-rehberi.md\u003c/code> dosyasına bak.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-1-modeller\">1. MODELLER\u003c/h1>\n\u003ch2 id=\"s-1-1-osi-ve-tcp-ip-karsilastirmasi\">1.1 OSI ve TCP/IP karşılaştırması\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>OSI katmanı\u003c/th>\n\u003cth>TCP/IP\u003c/th>\n\u003cth>Birim\u003c/th>\n\u003cth>Örnekler\u003c/th>\n\u003cth>Tipik sorun\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>7 Uygulama\u003c/td>\n\u003ctd>Uygulama\u003c/td>\n\u003ctd>Veri\u003c/td>\n\u003ctd>HTTP, DNS, SMTP, RDP\u003c/td>\n\u003ctd>Servis kapalı, yanlış ayar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6 Sunum\u003c/td>\n\u003ctd>Uygulama\u003c/td>\n\u003ctd>Veri\u003c/td>\n\u003ctd>TLS, şifreleme\u003c/td>\n\u003ctd>Sertifika hatası\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5 Oturum\u003c/td>\n\u003ctd>Uygulama\u003c/td>\n\u003ctd>Veri\u003c/td>\n\u003ctd>Oturum yönetimi\u003c/td>\n\u003ctd>Oturum kopması\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 Taşıma\u003c/td>\n\u003ctd>Taşıma\u003c/td>\n\u003ctd>Segment\u003c/td>\n\u003ctd>TCP, UDP\u003c/td>\n\u003ctd>Port engelli\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 Ağ\u003c/td>\n\u003ctd>İnternet\u003c/td>\n\u003ctd>Paket\u003c/td>\n\u003ctd>IP, ICMP, yönlendirme\u003c/td>\n\u003ctd>Yanlış IP, gateway\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 Veri bağı\u003c/td>\n\u003ctd>Ağ erişimi\u003c/td>\n\u003ctd>Çerçeve\u003c/td>\n\u003ctd>Ethernet, MAC, VLAN, Wi-Fi\u003c/td>\n\u003ctd>VLAN/MAC/duplex\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1 Fiziksel\u003c/td>\n\u003ctd>Ağ erişimi\u003c/td>\n\u003ctd>Bit\u003c/td>\n\u003ctd>Kablo, fiber, sinyal\u003c/td>\n\u003ctd>Kopuk kablo\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Pratik kural:\u003c/strong> Alttan yukarı kontrol et. Kablo yoksa DNS&#39;i inceleme.\u003c/p>\n\u003ch2 id=\"s-1-2-tcp-ve-udp\">1.2 TCP ve UDP\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>TCP\u003c/th>\n\u003cth>UDP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bağlantı\u003c/td>\n\u003ctd>Bağlantılı (3&#39;lü el sıkışma)\u003c/td>\n\u003ctd>Bağlantısız\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Güvenilirlik\u003c/td>\n\u003ctd>Teslim garantisi, sıralama\u003c/td>\n\u003ctd>Garanti yok\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hız\u003c/td>\n\u003ctd>Daha yavaş\u003c/td>\n\u003ctd>Hızlı, hafif\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kullanım\u003c/td>\n\u003ctd>Web, e-posta, dosya aktarımı\u003c/td>\n\u003ctd>DNS sorguları, VoIP, video, DHCP\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003chr>\n\u003ch1 id=\"s-2-adresleme\">2. ADRESLEME\u003c/h1>\n\u003ch2 id=\"s-2-1-mac-ve-ip\">2.1 MAC ve IP\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>MAC adresi:\u003c/strong> Ağ kartının fiziksel adresi, aynı ağ (L2) içinde kullanılır.\u003c/li>\n\u003cli>\u003cstrong>IP adresi:\u003c/strong> Mantıksal adres, ağlar arası (L3) kullanılır.\u003c/li>\n\u003cli>\u003cstrong>ARP:\u003c/strong> IP&#39;den MAC&#39;i bulur. \u003ccode>arp -a\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-2-2-subnet-hesabi-kisa-yol\">2.2 Subnet hesabı (kısa yol)\u003c/h2>\n\u003cp>Host sayısı = 2^(host bit) − 2\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>CIDR\u003c/th>\n\u003cth>Maske\u003c/th>\n\u003cth>Host\u003c/th>\n\u003cth>Blok boyutu (son oktet)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>/24\u003c/td>\n\u003ctd>255.255.255.0\u003c/td>\n\u003ctd>254\u003c/td>\n\u003ctd>256\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/25\u003c/td>\n\u003ctd>255.255.255.128\u003c/td>\n\u003ctd>126\u003c/td>\n\u003ctd>128\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/26\u003c/td>\n\u003ctd>255.255.255.192\u003c/td>\n\u003ctd>62\u003c/td>\n\u003ctd>64\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/27\u003c/td>\n\u003ctd>255.255.255.224\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>32\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/28\u003c/td>\n\u003ctd>255.255.255.240\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/29\u003c/td>\n\u003ctd>255.255.255.248\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>/30\u003c/td>\n\u003ctd>255.255.255.252\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Örnek:\u003c/strong> \u003ccode>192.168.10.77/26\u003c/code> → blok boyutu 64 → ağ adresi \u003ccode>192.168.10.64\u003c/code>, ilk host \u003ccode>.65\u003c/code>, son host \u003ccode>.126\u003c/code>, broadcast \u003ccode>.127\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Aynı ağda mı?\u003c/strong> İki IP&#39;yi aynı maskeyle karşılaştır; ağ adresleri aynıysa aynı ağdadır, değilse trafik \u003cstrong>gateway\u003c/strong> üzerinden gider.\u003c/p>\n\u003ch2 id=\"s-2-3-ozel-ip-araliklari-rfc-1918\">2.3 Özel IP aralıkları (RFC 1918)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Aralık\u003c/th>\n\u003cth>CIDR\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>10.0.0.0 – 10.255.255.255\u003c/td>\n\u003ctd>10.0.0.0/8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>172.16.0.0 – 172.31.255.255\u003c/td>\n\u003ctd>172.16.0.0/12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>192.168.0.0 – 192.168.255.255\u003c/td>\n\u003ctd>192.168.0.0/16\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Özel adresler internete çıkarken \u003cstrong>NAT\u003c/strong> ile genel adrese çevrilir.\u003c/p>\n\u003ch2 id=\"s-2-4-ip-plani-nerileri\">2.4 IP planı önerileri\u003c/h2>\n\u003cul>\n\u003cli>Bölümlere/VLAN&#39;lara ayrı subnet ver: kullanıcılar, sunucular, yazıcılar, misafir Wi-Fi, yönetim.\u003c/li>\n\u003cli>Sabit IP&#39;leri DHCP aralığının dışında tut.\u003c/li>\n\u003cli>Gateway için tutarlı bir kural kullan (ör. her ağın \u003ccode>.1\u003c/code> adresi).\u003c/li>\n\u003cli>Planı \u003cstrong>dokümante et\u003c/strong> ve güncel tut.\u003c/li>\n\u003c/ul>\n\u003cp>Örnek plan:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>VLAN\u003c/th>\n\u003cth>Ad\u003c/th>\n\u003cth>Subnet\u003c/th>\n\u003cth>Amaç\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>Kullanıcı\u003c/td>\n\u003ctd>10.10.10.0/24\u003c/td>\n\u003ctd>Ofis bilgisayarları\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>Sunucu\u003c/td>\n\u003ctd>10.10.20.0/24\u003c/td>\n\u003ctd>Sunucular\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>Yazıcı\u003c/td>\n\u003ctd>10.10.30.0/24\u003c/td>\n\u003ctd>Yazıcı/IoT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>Misafir\u003c/td>\n\u003ctd>10.10.40.0/24\u003c/td>\n\u003ctd>Misafir Wi-Fi (internet-only)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>99\u003c/td>\n\u003ctd>Yönetim\u003c/td>\n\u003ctd>10.10.99.0/24\u003c/td>\n\u003ctd>Switch/AP yönetimi\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003chr>\n\u003ch1 id=\"s-3-temel-ag-servisleri\">3. TEMEL AĞ SERVİSLERİ\u003c/h1>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Servis\u003c/th>\n\u003cth>Görev\u003c/th>\n\u003cth>Port\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DHCP\u003c/td>\n\u003ctd>Otomatik IP dağıtımı\u003c/td>\n\u003ctd>UDP 67/68\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DNS\u003c/td>\n\u003ctd>İsim → IP çözümleme\u003c/td>\n\u003ctd>UDP/TCP 53\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>NTP\u003c/td>\n\u003ctd>Saat eşitleme\u003c/td>\n\u003ctd>UDP 123\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP/HTTPS\u003c/td>\n\u003ctd>Web\u003c/td>\n\u003ctd>TCP 80/443\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SSH\u003c/td>\n\u003ctd>Güvenli uzak komut satırı\u003c/td>\n\u003ctd>TCP 22\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RDP\u003c/td>\n\u003ctd>Windows uzak masaüstü\u003c/td>\n\u003ctd>TCP 3389\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SMB\u003c/td>\n\u003ctd>Dosya paylaşımı\u003c/td>\n\u003ctd>TCP 445\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LDAP/LDAPS\u003c/td>\n\u003ctd>Dizin servisi (AD)\u003c/td>\n\u003ctd>TCP 389/636\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Syslog\u003c/td>\n\u003ctd>Merkezi log\u003c/td>\n\u003ctd>UDP 514\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SNMP\u003c/td>\n\u003ctd>İzleme\u003c/td>\n\u003ctd>UDP 161/162\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Neden saat önemli?\u003c/strong> Kerberos ve sertifikalar zamana bağlıdır. 5 dakikadan fazla saat farkı AD girişini bozar.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-4-vlan-trunk-ve-yonlendirme\">4. VLAN, TRUNK VE YÖNLENDİRME\u003c/h1>\n\u003ch2 id=\"s-4-1-vlan-neden-kullanilir\">4.1 VLAN neden kullanılır?\u003c/h2>\n\u003cul>\n\u003cli>Broadcast alanını küçültür.\u003c/li>\n\u003cli>Bölümleri güvenlik amacıyla ayırır.\u003c/li>\n\u003cli>Fiziksel olarak aynı switch&#39;te farklı mantıksal ağlar sağlar.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-4-2-access-ve-trunk-port\">4.2 Access ve trunk port\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Access:\u003c/strong> Tek VLAN&#39;a ait uç cihaz portu (bilgisayar, yazıcı).\u003c/li>\n\u003cli>\u003cstrong>Trunk:\u003c/strong> Birden çok VLAN&#39;ı taşır (switch-switch, switch-router/firewall). 802.1Q etiketi kullanır.\u003c/li>\n\u003cli>\u003cstrong>Native VLAN:\u003c/strong> Etiketlenmeden taşınan VLAN; iki uçta aynı olmalı.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-4-3-vlan-lar-arasi-y-nlendirme\">4.3 VLAN&#39;lar arası yönlendirme\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Router-on-a-stick:\u003c/strong> Tek fiziksel link üzerinde alt arayüzler.\u003c/li>\n\u003cli>\u003cstrong>L3 switch (SVI):\u003c/strong> Her VLAN için \u003ccode>interface vlan X\u003c/code> ve IP; en yaygın kurumsal yöntem.\u003c/li>
