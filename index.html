":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"SW1(config)# ip domain-name lab.local\nSW1(config)# username admin secret Admin123\nSW1(config)# crypto key generate rsa\nAnahtar boyutunu sorarsa 1024 yaz (mümkünse 2048 daha iyi). Sonra:\nSW1(config)# ip ssh version 2\nSW1(config)# line vty 0 15\nSW1(config-line)# login local\nSW1(config-line)# transport input ssh\nSW1(config-line)# exit\nHostname ve domain-name olmadan RSA anahtarı üretilmez.\nlogin local: Yerel kullanıcı adı/şifre kullanılır.\ntransport input ssh: Telnet'i kapatır.\nLaptop'tan test: C:\\> ssh -l admin 192.168.1.10"},{"id":"s-a8-banner","title":"A8. Banner","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"SW1(config)# banner motd #Yetkisiz erisim yasaktir!#\n# işareti başlangıç ve bitiş ayracıdır. Mesajın içinde # kullanma."},{"id":"s-a9-brute-force-korumasi-ek-guvenlik","title":"A9. Brute-force koruması (ek güvenlik)","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"SW1(config)# security passwords min-length 8\nSW1(config)# login block-for 60 attempts 3 within 30\nSW1(config)# login on-failure log\nSW1(config)# login on-success log\nBazı komutlar Packet Tracer'ın switch sürümünde desteklenmeyebilir. ? ile kontrol et."},{"id":"s-a10-port-guvenligi","title":"A10. Port güvenliği","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"SW1(config)# interface fa0/1\nSW1(config-if)# switchport mode access\nSW1(config-if)# switchport port-security\nSW1(config-if)# switchport port-security maximum 1\nSW1(config-if)# switchport port-security mac-address sticky\nSW1(config-if)# switchport port-security violation shutdown\nsticky: Portta ilk görülen MAC adresini otomatik öğrenip config'e yazar.\nviolation modları:\nshutdown: Port kapanır (err-disabled). Varsayılandır.\nrestrict: Paketleri düşürür ve log yazar.\nprotect: Paketleri sessizce düşürür.\nKontrol: show port-security, show port-security interface fa0/1\nPort err-disabled olduysa kurtarma:SW1(config-if)# shutdown\nSW1(config-if)# no shutdown\nTest: Fa0/1'deki laptop'u çıkarıp başka bir cihaz tak, portun kapandığını gör."},{"id":"s-a11-kullanilmayan-portlari-kapatma","title":"A11. Kullanılmayan portları kapatma","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"SW1(config)# interface range fa0/7 - 24\nSW1(config-if-range)# shutdown\nSW1(config-if-range)# description KULLANILMIYOR\nGerçek ağlarda kullanılmayan portlar kapatılır, ayrıca ayrı bir \"kullanılmayan\" VLAN'a alınır."},{"id":"s-a12-vlan-olusturma-ve-port-atama","title":"A12. VLAN oluşturma ve port atama","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"SW1(config)# vlan 10\nSW1(config-vlan)# name MUHASEBE\nSW1(config-vlan)# exit\nSW1(config)# vlan 20\nSW1(config-vlan)# name IT\nSW1(config-vlan)# exit\nSW1(config)# interface fa0/2\nSW1(config-if)# switchport mode access\nSW1(config-if)# switchport access vlan 10\nFarklı VLAN'daki cihazlar, router veya Layer 3 olmadan birbirini ping'leyemez. Bunu denemek öğreticidir.\nKontrol: show vlan brief"},{"id":"s-a13-kaydetme-ve-kontrol","title":"A13. Kaydetme ve kontrol","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"SW1(config)# end\nSW1# write memory\nwrite memory, copy running-config startup-config ile aynıdır. Kaydetmezsen reload'da ayarlar kaybolur.\nKontrol komutları:\nKomut\nNe gösterir\nshow running-config\nÇalışan config, şifrelerin gizli olduğunu doğrula\nshow startup-config\nKayıtlı config\nshow ip interface brief\nPort ve Vlan IP durumu\nshow interfaces status\nPort hızı, VLAN, durum\nshow vlan brief\nVLAN ve port ilişkisi\nshow mac address-table\nHangi MAC hangi portta\nshow arp\nIP-MAC eşlemeleri\nshow ip ssh\nSSH durumu\nshow users\nBağlı oturumlar\nshow version\nModel, IOS, çalışma süresi\nshow port-security\nPort güvenliği durumu"},{"id":"s-a14-console-baglantisi-laptop-ile-switch","title":"A14. Console bağlantısı (laptop ile switch)","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"Connections (yıldırım) > Console kablosu (açık mavi, rollover).\nBir ucu laptop RS 232, diğer ucu switch Console portuna.\nLaptop > Desktop > Terminal. Ayarlar:\nBits per second: 9600\nData bits: 8\nParity: None\nStop bits: 1\nFlow control: None\nEnter'a bas. Banner, ardından Password: gelir. Console şifresini gir.\nSW1> gelir. enable yaz, enable şifresini gir.\nConsole'da denenecekler:\nYanlış şifre girip reddedildiğini gör.\nshow running-config ile şifrelerin hash'li/gizli olduğunu kontrol et.\nBir portu shutdown yap, o porttaki laptop'tan ping at, kesildiğini gör, sonra no shutdown.\nshow mac address-table ile MAC öğrenimini izle.\nEnable şifresini değiştir ve write memory ile kaydet."},{"id":"s-a15-yaygin-hatalar","title":"A15. Yaygın hatalar","level":2,"path":"BÖLÜM A: Switch Ayarları ve Güvenlik","isTitle":false,"text":"Belirti\nOlası neden\n% Invalid input detected\nYanlış modda ya da yanlış yazılmış komut\nŞifre sormuyor\nlogin komutu unutulmuş\nSSH bağlanmıyor\nRSA anahtarı yok, ip domain-name/hostname eksik, login local yok\nİlk ping düşüyor\nARP çözülüyor, normaldir, tekrar dene\nPort turuncu/kırmızı\nSTP bekleme süresi ya da port shutdown\nPort err-disabled\nPort güvenliği ihlali\nAyarlar reload sonrası gitti\nwrite memory yapılmamış\nLaptop IP alamıyor (169.254.x.x)\nDHCP yok, elle IP ver\nAynı IP iki cihazda\nIP çakışması, ping düzensiz"},{"id":"s-bolum-b-sunucu-ve-kurcalanabilecek-senaryolar","title":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","level":1,"path":"","isTitle":false,"text":"Sunucuya tıkla: Desktop > IP Configuration ile IP ver (192.168.1.20). Servisler Services sekmesindedir."},{"id":"s-b1-http-web-sunucusu","title":"B1. HTTP (web sunucusu)","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > HTTP: HTTP On.\nindex.html dosyasını Edit ile değiştir.\nLaptop > Web Browser: http://192.168.1.20\nKurcala: Yeni HTML dosyası ekle, iki laptop'tan aynı anda aç."},{"id":"s-b2-dns","title":"B2. DNS","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > DNS: On.\nName: www.lab.local, Address: 192.168.1.20, Add.\nLaptop IP Configuration > DNS Server: 192.168.1.20.\nLaptop'ta ping www.lab.local ya da tarayıcıda www.lab.local.\nSwitch'te isimle ping için:SW1(config)# ip domain-lookup\nSW1(config)# ip name-server 192.168.1.20\nKurcala: Birden çok kayıt ekle (mail.lab.local, ftp.lab.local), yanlış IP girip ne olduğunu gör."},{"id":"s-b3-dhcp","title":"B3. DHCP","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > DHCP: On.\nDefault Gateway: 192.168.1.1\nDNS Server: 192.168.1.20\nStart IP: 192.168.1.100\nSubnet Mask: 255.255.255.0\nMaximum Users: 50\nSave\nLaptop'ları DHCP moduna al.\nKurcala:\nStart IP'yi .100'den başlat ki switch (.10) ve sunucu (.20) ile çakışmasın.\nMaximum Users'ı 1 yap, ikinci laptop'un IP alamadığını gör.\nSwitch'te DHCP snooping dene (gerçek cihazlarda): sahte DHCP sunucusuna karşı koruma."},{"id":"s-b4-tftp-config-yedegi","title":"B4. TFTP (config yedeği)","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > TFTP: On.\nYedek alma:SW1# copy running-config tftp\nAddress or name of remote host []? 192.168.1.20\nDestination filename [SW1-confg]? (Enter)\nGeri yükleme: copy tftp running-config\nStartup config yedeği: copy startup-config tftp\nKurcala: Config'i yedekle, switch'te bir şey boz, yedekten geri yükle. Gerçek hayatta çok kullanılır."},{"id":"s-b5-syslog","title":"B5. Syslog","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > SYSLOG: On.\nSwitch:SW1(config)# logging host 192.168.1.20\nSW1(config)# logging trap informational\nSW1(config)# service timestamps log datetime msec\nBir portu shutdown / no shutdown yap, logları sunucuda izle.\nKurcala: Port güvenliği ihlali oluştur, yanlış şifre dene, log düşüyor mu bak."},{"id":"s-b6-ftp","title":"B6. FTP","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > FTP: On, kullanıcı adı/şifre ve izinler (Write, Read, Delete, Rename, List).\nLaptop > Command Prompt: ftp 192.168.1.20, giriş yap.\nKomutlar: dir, get dosya, put dosya, quit.\nKurcala: Farklı izinlerle iki kullanıcı oluştur, sadece okuma yetkisi olanın dosya yükleyemediğini gör."},{"id":"s-b7-ntp-saat","title":"B7. NTP (saat)","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > NTP: On.\nSwitch: ntp server 192.168.1.20\nKontrol: show ntp status, show clock\nElle saat: clock set 14:30:00 21 October 2026 (SW1# modunda)"},{"id":"s-b8-e-posta","title":"B8. E-posta","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > EMAIL: SMTP ve POP3 On, domain lab.local, kullanıcılar ekle.\nLaptop > Desktop > Email: hesabı kur, iki laptop arasında mail gönder."},{"id":"s-b9-aaa-radius-ileri-seviye-en-sona","title":"B9. AAA / RADIUS (ileri seviye, en sona)","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Services > AAA: kullanıcıları sunucuda tut.\nSwitch:SW1(config)# aaa new-model\nSW1(config)# radius-server host 192.168.1.20 key RadiusAnahtar\nSW1(config)# aaa authentication login default group radius local\nlocal yedeği bırak, yoksa sunucuya erişemezsen kendini dışarıda bırakırsın."},{"id":"s-b10-ek-kurcalama-fikirleri","title":"B10. Ek kurcalama fikirleri","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"Ağ tasarımı\nİkinci switch ekle, iki switch'i cross-over/straight kabloyla bağla, trunk yap:SW1(config)# interface gig0/1\nSW1(config-if)# switchport mode trunk\nVLAN'ları iki switch arasında taşı, farklı switch'lerdeki aynı VLAN cihazlarını ping'le.\nRouter ekle, router-on-a-stick ile VLAN'lar arası yönlendirme kur (alt arayüzler fa0/0.10, fa0/0.20, encapsulation dot1Q 10).\nGüvenlik\nTelnet ile SSH'ı karşılaştır. Packet Tracer simülasyon modunda telnet paketinde şifrenin düz metin olduğunu gör.\nACL ile belirli IP'lerin sunucuya erişimini kısıtla (router üzerinde).\nPort güvenliğini test et (A10).\nSorun giderme egzersizleri\nBilerek yanlış subnet maskesi ver, ping'in neden gitmediğini bul.\nBir portu yanlış VLAN'a at, bağlantı kopmasını gözlemle.\nAynı IP'yi iki cihaza ver, çakışmayı gör.\nKabloyu çıkar, show interfaces status ve MAC tablosunun değişimine bak.\nSertifika ve pratik odağı (IT destek ve sistem yönetimi)\nDHCP, DNS, TFTP/Syslog, VLAN ve port güvenliği sahada en sık karşılaşılan konulardır.\nCCNA konularının büyük kısmı bu laboratuvarla pratik edilebilir.\nYaptığın ayarların ekran görüntülerini ve show run çıktısını not olarak sakla; ileride referans olur."},{"id":"s-onerilen-calisma-sirasi","title":"Önerilen çalışma sırası","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"A2: Temel IP ve hostname\nA3-A8: Şifreler, SSH, banner\nA13-A14: Kaydet ve console'dan test\nB1-B3: HTTP, DNS, DHCP\nB4-B5: TFTP yedeği ve Syslog\nA10-A12: Port güvenliği ve VLAN\nB6-B8: FTP, NTP, E-posta\nB9-B10: AAA ve ileri senaryolar"},{"id":"s-hizli-komut-zeti","title":"Hızlı komut özeti","level":2,"path":"BÖLÜM B: Sunucu ve Kurcalanabilecek Senaryolar","isTitle":false,"text":"enable\nconfigure terminal\nhostname SW1\nno ip domain-lookup\nenable secret Sifre123\nservice password-encryption\nline console 0\n password Console123\n login\n logging synchronous\n exec-timeout 5 0\n exit\nip domain-name lab.local\nusername admin secret Admin123\ncrypto key generate rsa\nip ssh version 2\nline vty 0 15\n login local\n transport input ssh\n exit\nbanner motd #Yetkisiz erisim yasaktir!#\nend\nwrite memory\nNot: Örnekteki şifreler sadece laboratuvar içindir. Gerçek cihazlarda uzun ve tahmin edilmesi zor şifreler kullan."}]},{"slug":"sunucu","file":"02-sunucu-sanallastirma-yedekleme-rehberi.md","title":"Sunucu, Sanallaştırma, Yedekleme ve İzleme Rehberi","short":"Sunucu ve Yedekleme","desc":"Windows Server, AD lab, Hyper-V/Proxmox, Linux sunucu, 3-2-1 yedekleme, izleme","words":2057,"html":"\u003ch1 id=\"s-sunucu-sanallastirma-yedekleme-ve-izleme-rehberi\">Sunucu, Sanallaştırma, Yedekleme ve İzleme Rehberi\u003c/h1>\n\u003cp>\u003cstrong>Windows Server · Active Directory Lab · Hyper-V/Proxmox · Linux Sunucu · Yedekleme · İzleme\u003c/strong>\u003c/p>\n\u003cp>Bu rehber, sunucu tarafı işlerin ortak notlarını tek yerde toplar. Sonunda kendi evinde kurabileceğin bir laboratuvar planı var.\u003c/p>\n\u003chr>\n\u003ch2 id=\"s-1-windows-server-rolleri\">1. Windows Server Rolleri\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rol\u003c/th>\n\u003cth>Ne yapar\u003c/th>\n\u003cth>Kurulum (PowerShell)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>AD DS\u003c/td>\n\u003ctd>Kullanıcı/bilgisayar/kimlik yönetimi\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature AD-Domain-Services -IncludeManagementTools\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DNS\u003c/td>\n\u003ctd>İsim çözümleme\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature DNS -IncludeManagementTools\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DHCP\u003c/td>\n\u003ctd>Otomatik IP dağıtımı\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature DHCP -IncludeManagementTools\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosya Sunucusu\u003c/td>\n\u003ctd>Paylaşımlar, kota\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature FS-FileServer\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yazdırma Sunucusu\u003c/td>\n\u003ctd>Merkezi yazıcı yönetimi\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature Print-Server\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WSUS\u003c/td>\n\u003ctd>Windows güncelleme yönetimi\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature UpdateServices\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hyper-V\u003c/td>\n\u003ctd>Sanallaştırma\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature Hyper-V -IncludeManagementTools -Restart\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IIS\u003c/td>\n\u003ctd>Web sunucusu\u003c/td>\n\u003ctd>\u003ccode>Install-WindowsFeature Web-Server -IncludeManagementTools\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Rol/özellik listesi: \u003ccode>Get-WindowsFeature\u003c/code>. Grafik arayüz: \u003cstrong>Server Manager\u003c/strong>.\u003c/p>\n\u003ch2 id=\"s-2-active-directory-laboratuvari-adim-adim\">2. Active Directory Laboratuvarı (Adım Adım)\u003c/h2>\n\u003ch3 id=\"s-2-1-gerekenler\">2.1 Gerekenler\u003c/h3>\n\u003cul>\n\u003cli>Sanallaştırma yazılımı (Hyper-V, VirtualBox, VMware Workstation, Proxmox)\u003c/li>\n\u003cli>Windows Server ISO (Microsoft Evaluation Center&#39;dan ücretsiz deneme sürümü) ve bir Windows 10/11 istemci\u003c/li>\n\u003cli>Önerilen kaynak: DC için 2 vCPU / 2-4 GB RAM / 40+ GB disk, istemci için 2 vCPU / 4 GB RAM\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-2-2-topoloji\">2.2 Topoloji\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Makine\u003c/th>\n\u003cth>Ad\u003c/th>\n\u003cth>IP\u003c/th>\n\u003cth>Rol\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Sunucu\u003c/td>\n\u003ctd>DC01\u003c/td>\n\u003ctd>192.168.1.20\u003c/td>\n\u003ctd>AD DS, DNS, DHCP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>İstemci\u003c/td>\n\u003ctd>PC01\u003c/td>\n\u003ctd>DHCP\u003c/td>\n\u003ctd>Domaine katılacak\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>İki makine aynı sanal ağda (internal/host-only) olmalı.\u003c/p>\n\u003ch3 id=\"s-2-3-dc01-hazirligi\">2.3 DC01 hazırlığı\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-NetAdapter                                   # Arayüz adını öğren (örn. Ethernet)\nNew-NetIPAddress -InterfaceAlias &quot;Ethernet&quot; -IPAddress 192.168.1.20 -PrefixLength 24 -DefaultGateway 192.168.1.1\nSet-DnsClientServerAddress -InterfaceAlias &quot;Ethernet&quot; -ServerAddresses 127.0.0.1\nRename-Computer -NewName DC01 -Restart\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-4-domain-kurulumu\">2.4 Domain kurulumu\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Install-WindowsFeature AD-Domain-Services -IncludeManagementTools\nInstall-ADDSForest -DomainName &quot;lab.local&quot; -InstallDns\n\u003c/code>\u003c/pre>\n\u003cp>Sihirbaz \u003cstrong>DSRM (Directory Services Restore Mode) şifresi\u003c/strong> ister, bir yere kaydet. Sunucu otomatik yeniden başlar; artık giriş \u003ccode>LAB\\Administrator\u003c/code>.\u003c/p>\n\u003ch3 id=\"s-2-5-ou-kullanici-grup\">2.5 OU, kullanıcı, grup\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">New-ADOrganizationalUnit -Name &quot;Kullanicilar&quot; -Path &quot;DC=lab,DC=local&quot;\nNew-ADUser -Name &quot;Ali Veli&quot; -SamAccountName &quot;aveli&quot; -UserPrincipalName &quot;aveli@lab.local&quot; `\n  -Path &quot;OU=Kullanicilar,DC=lab,DC=local&quot; -AccountPassword (Read-Host -AsSecureString &quot;Sifre&quot;) -Enabled $true\nNew-ADGroup -Name &quot;Muhasebe&quot; -GroupScope Global -Path &quot;OU=Kullanicilar,DC=lab,DC=local&quot;\nAdd-ADGroupMember -Identity &quot;Muhasebe&quot; -Members aveli\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-2-6-dhcp\">2.6 DHCP\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Install-WindowsFeature DHCP -IncludeManagementTools\nAdd-DhcpServerInDC -DnsName &quot;DC01.lab.local&quot; -IPAddress 192.168.1.20   # AD'de yetkilendir\nAdd-DhcpServerv4Scope -Name &quot;LAN&quot; -StartRange 192.168.1.100 -EndRange 192.168.1.200 -SubnetMask 255.255.255.0\nSet-DhcpServerv4OptionValue -Router 192.168.1.1 -DnsServer 192.168.1.20 -DnsDomain &quot;lab.local&quot;\n\u003c/code>\u003c/pre>\n\u003cp>AD ortamında DHCP sunucusunun \u003cstrong>yetkilendirilmesi (authorize)\u003c/strong> gerekir.\u003c/p>\n\u003ch3 id=\"s-2-7-istemciyi-domaine-alma\">2.7 İstemciyi domaine alma\u003c/h3>\n\u003cp>PC01&#39;de: DNS sunucusu olarak \u003ccode>192.168.1.20\u003c/code> ver (DHCP verdiyse otomatik), sonra:\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\">Add-Computer -DomainName lab.local -Credential LAB\\Administrator -Restart\n\u003c/code>\u003c/pre>\n\u003cp>Giriş: \u003ccode>LAB\\aveli\u003c/code>.\u003c/p>\n\u003ch3 id=\"s-2-8-dosya-paylasimi-ve-izinler\">2.8 Dosya paylaşımı ve izinler\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">New-Item -Path D:\\Paylasim\\Muhasebe -ItemType Directory -Force\nNew-SmbShare -Name &quot;Muhasebe&quot; -Path &quot;D:\\Paylasim\\Muhasebe&quot; -FullAccess &quot;LAB\\Muhasebe&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>İzin mantığı:\u003c/strong> Paylaşım izni ve NTFS izni birlikte değerlendirilir, \u003cstrong>en kısıtlayıcı olan\u003c/strong> geçerli olur. Mümkünse kullanıcıya değil \u003cstrong>gruba\u003c/strong> izin ver (AGDLP yaklaşımı: Account → Global group → Domain Local group → Permission).\u003c/p>\n\u003ch3 id=\"s-2-9-group-policy-gpo-rnekleri\">2.9 Group Policy (GPO) örnekleri\u003c/h3>\n\u003cp>\u003ccode>gpmc.msc\u003c/code> ile açılır. GPO&#39;yu OU&#39;ya bağla, \u003ccode>gpupdate /force\u003c/code> ile test et.\u003c/p>\n\u003cul>\n\u003cli>Şifre politikası (uzunluk, karmaşıklık, kilitleme eşiği)\u003c/li>\n\u003cli>Ağ sürücüsü eşleme (Group Policy Preferences &gt; Drive Maps)\u003c/li>\n\u003cli>Duvar kâğıdı, ekran kilidi süresi\u003c/li>\n\u003cli>USB depolama kısıtı\u003c/li>\n\u003cli>Yazılım kurulum ve güvenlik duvarı kuralları\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Hangi GPO uygulanıyor?\u003c/strong> İstemcide \u003ccode>gpresult /r\u003c/code> veya \u003ccode>gpresult /h rapor.html\u003c/code>.\u003c/p>\n\u003ch3 id=\"s-2-10-ad-saglik-komutlari\">2.10 AD sağlık komutları\u003c/h3>\n\u003cpre>\u003ccode>dcdiag                       # DC genel sağlık testi\nrepadmin /replsummary        # Çoklu DC'de replikasyon özeti\nnltest /dsgetdc:lab.local    # Hangi DC'ye bağlı\nnetdom query fsmo            # FSMO rol sahipleri\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>FSMO rolleri (5):\u003c/strong> Schema Master, Domain Naming Master, PDC Emulator, RID Master, Infrastructure Master. Tek DC&#39;li ortamda hepsi aynı sunucudadır.\u003c/p>\n\u003ch2 id=\"s-3-sunucularin-gunluk-haftalik-kontrol-listesi\">3. Sunucuların Günlük/Haftalık Kontrol Listesi\u003c/h2>\n\u003cp>\u003cstrong>Günlük\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yedekleme işleri başarılı mı?\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Disk doluluğu (&gt;%85 uyarı)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kritik servisler çalışıyor mu (AD, DNS, DHCP, dosya, yazdırma)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Olay Görüntüleyici&#39;de Hata/Kritik kayıtlar\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Antivirüs/Defender güncel mi\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> UPS ve sıcaklık normal mi\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Haftalık/Aylık\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Güncelleme/yama (Windows&#39;ta Patch Tuesday = ayın 2. Salı günü)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> \u003ccode>dcdiag\u003c/code>, \u003ccode>repadmin /replsummary\u003c/code>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yedekten \u003cstrong>geri yükleme testi\u003c/strong>\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kullanılmayan hesap ve bilgisayar temizliği\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Yönetici grubu üyeliklerinin gözden geçirilmesi\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Yama sırası:\u003c/strong> Test ortamı → pilot grup → herkes. Sunucu güncellemesini bakım penceresinde yap, önce yedek/snapshot al.\u003c/p>\n\u003ch2 id=\"s-4-disk-raid-ve-donanim\">4. Disk, RAID ve Donanım\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>RAID\u003c/th>\n\u003cth>Min. disk\u003c/th>\n\u003cth>Ne sağlar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>RAID 0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>Hız, \u003cstrong>yedeklilik yok\u003c/strong> (bir disk giderse hepsi gider)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAID 1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>Ayna, 1 disk arızasına dayanır\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAID 5\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>1 disk arızasına dayanır, kapasite verimli\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAID 6\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>2 disk arızasına dayanır\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAID 10\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>Hız + ayna, 1+1 mantığı\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>\u003cstrong>RAID yedek değildir.\u003c/strong> Silme, fidye yazılımı, yangın ve yazılım hatasına karşı koruma sağlamaz.\u003c/p>\n\u003c/blockquote>\n\u003cul>\n\u003cli>Disk sağlığı: SMART (Windows: CrystalDiskInfo; Linux: \u003ccode>smartctl -a /dev/sda\u003c/code>)\u003c/li>\n\u003cli>UPS: ani elektrik kesintisinde kontrollü kapanma; batarya ömrünü ve yük kapasitesini takip et\u003c/li>\n\u003cli>Sunucu odası: sıcaklık, havalandırma, kablo düzeni, etiketleme, erişim kontrolü\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-5-sanallastirma\">5. Sanallaştırma\u003c/h2>\n\u003ch3 id=\"s-5-1-kavramlar\">5.1 Kavramlar\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kavram\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Hypervisor Tip 1\u003c/td>\n\u003ctd>Doğrudan donanım üstünde (Hyper-V, ESXi, Proxmox/KVM)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hypervisor Tip 2\u003c/td>\n\u003ctd>İşletim sistemi üstünde (VirtualBox, VMware Workstation)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VM\u003c/td>\n\u003ctd>Sanal makine\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Snapshot/Checkpoint\u003c/td>\n\u003ctd>Anlık durum kaydı. \u003cstrong>Yedek değildir\u003c/strong>, uzun süre tutma (disk şişer, performans düşer)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Thin / Thick disk\u003c/td>\n\u003ctd>Gerektikçe büyüyen / baştan ayrılmış disk\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sanal switch\u003c/td>\n\u003ctd>VM&#39;lerin ağ bağlantısı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Live migration\u003c/td>\n\u003ctd>Çalışan VM&#39;i kapatmadan başka konağa taşıma\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-5-2-hyper-v-ag-turleri\">5.2 Hyper-V ağ türleri\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tür\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>External\u003c/td>\n\u003ctd>Fiziksel ağa/internete çıkış\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Internal\u003c/td>\n\u003ctd>Konak ile VM&#39;ler arası\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Private\u003c/td>\n\u003ctd>Sadece VM&#39;ler arası\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-5-3-hyper-v-powershell\">5.3 Hyper-V PowerShell\u003c/h3>\n\u003cpre>\u003ccode class=\"language-powershell\">Get-VM\nNew-VM -Name &quot;DC01&quot; -MemoryStartupBytes 4GB -Generation 2 -NewVHDPath &quot;D:\\VM\\DC01.vhdx&quot; -NewVHDSizeBytes 60GB -SwitchName &quot;LabSwitch&quot;\nStart-VM DC01\nCheckpoint-VM -Name DC01 -SnapshotName &quot;Kurulum-oncesi&quot;\nRestore-VMSnapshot -Name &quot;Kurulum-oncesi&quot; -VMName DC01\nStop-VM DC01\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-5-4-proxmox-ev-laboratuvari-icin-guclu-secenek\">5.4 Proxmox (ev laboratuvarı için güçlü seçenek)\u003c/h3>\n\u003cul>\n\u003cli>Web arayüzü: \u003ccode>https://SUNUCU_IP:8006\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>KVM\u003c/strong> (tam sanal makine) ve \u003cstrong>LXC\u003c/strong> (hafif konteyner) çalıştırır\u003c/li>\n\u003cli>Komutlar: \u003ccode>qm list\u003c/code> (VM&#39;ler), \u003ccode>pct list\u003c/code> (konteynerler), \u003ccode>qm start 100\u003c/code>\u003c/li>\n\u003cli>Yedekleme: Datacenter &gt; Backup; depolama: yerel disk, NFS, ZFS\u003c/li>\n\u003cli>Şablon (template) oluşturup hızlı klonlama yap\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-5-5-docker-temelleri-kisa\">5.5 Docker Temelleri (kısa)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">docker ps                          # Çalışan konteynerler\ndocker ps -a                       # Hepsi\ndocker images                      # İmajlar\ndocker run -d -p 8080:80 nginx     # Web sunucusu başlat\ndocker logs konteyner_adi          # Loglar\ndocker exec -it konteyner_adi sh   # İçine gir\ndocker compose up -d               # compose dosyasından başlat\ndocker compose down\n\u003c/code>\u003c/pre>\n\u003cp>Veriyi \u003cstrong>volume\u003c/strong> ile dışarıda tut, konteyner silince veri gitmesin.\u003c/p>\n\u003ch2 id=\"s-6-linux-sunucu-isleri\">6. Linux Sunucu İşleri\u003c/h2>\n\u003ch3 id=\"s-6-1-ilk-kurulum-sonrasi\">6.1 İlk kurulum sonrası\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y\nsudo timedatectl set-timezone Europe/Istanbul\nsudo hostnamectl set-hostname srv01\nsudo adduser yonetici &amp;&amp; sudo usermod -aG sudo yonetici\nsudo ufw allow 22/tcp &amp;&amp; sudo ufw enable\nsudo apt install unattended-upgrades fail2ban -y\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-6-2-ssh-sikilastirma-etc-ssh-sshd-config\">6.2 SSH sıkılaştırma (\u003ccode>/etc/ssh/sshd_config\u003c/code>)\u003c/h3>\n\u003cpre>\u003ccode>PermitRootLogin no\nPasswordAuthentication no     # Önce anahtar girişini test et!\nPubkeyAuthentication yes\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>sudo systemctl restart ssh\u003c/code>. \u003cstrong>Dikkat:\u003c/strong> Yeni bir oturumda anahtarla girişi doğrulamadan mevcut oturumu kapatma, kendini dışarıda bırakabilirsin.\u003c/p>\n\u003ch3 id=\"s-6-3-servisler\">6.3 Servisler\u003c/h3>\n\u003cul>\n\u003cli>Web: \u003cstrong>Nginx\u003c/strong> (\u003ccode>sudo apt install nginx\u003c/code>), yapılandırma \u003ccode>/etc/nginx/\u003c/code>, test \u003ccode>sudo nginx -t\u003c/code>\u003c/li>\n\u003cli>Dosya paylaşımı: \u003cstrong>Samba\u003c/strong> (Windows ile uyumlu), yapılandırma \u003ccode>/etc/samba/smb.conf\u003c/code>\u003c/li>\n\u003cli>Zamanlı işler: \u003cstrong>cron\u003c/strong> (\u003ccode>crontab -e\u003c/code>)\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>cron formatı:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode># dakika saat gün ay haftanın_günü  komut\n30 2 * * *   /home/yonetici/yedek.sh        # Her gün 02:30\n0 */6 * * *  /home/yonetici/kontrol.sh      # 6 saatte bir\n0 3 * * 0    /home/yonetici/haftalik.sh     # Her Pazar 03:00\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-6-4-disk-isleri\">6.4 Disk işleri\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">lsblk                      # Diskler ve bölümler\ndf -h                      # Doluluk\nsudo fdisk -l              # Bölüm tablosu\nsudo mount /dev/sdb1 /mnt  # Bağla\ndu -sh /var/log/*          # Hangi klasör yer kaplıyor\n\u003c/code>\u003c/pre>\n\u003cp>Kalıcı bağlama: \u003ccode>/etc/fstab\u003c/code> (yanlış satır açılışı bozabilir, önce yedek al, \u003ccode>sudo mount -a\u003c/code> ile test et).\u003c/p>\n\u003ch2 id=\"s-7-yedekleme-ve-felaket-kurtarma\">7. Yedekleme ve Felaket Kurtarma\u003c/h2>\n\u003ch3 id=\"s-7-1-temel-kavramlar\">7.1 Temel kavramlar\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Terim\u003c/th>\n\u003cth>Anlamı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>3-2-1 kuralı\u003c/strong>\u003c/td>\n\u003ctd>3 kopya, 2 farklı ortam, 1 tanesi dışarıda/çevrimdışı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RPO\u003c/td>\n\u003ctd>En fazla ne kadar veri kaybı kabul edilir (örn. 1 saat)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RTO\u003c/td>\n\u003ctd>Sistemin ne kadar sürede geri gelmesi gerekir (örn. 4 saat)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tam yedek\u003c/td>\n\u003ctd>Her şeyin kopyası\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Artımlı\u003c/td>\n\u003ctd>Son yedekten (türü fark etmeksizin) beri değişenler\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fark (differential)\u003c/td>\n\u003ctd>Son \u003cstrong>tam\u003c/strong> yedekten beri değişenler\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Immutable/offline yedek\u003c/td>\n\u003ctd>Değiştirilemeyen veya ağdan kopuk kopya (fidye yazılımına karşı)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-7-2-ne-yedeklenir\">7.2 Ne yedeklenir?\u003c/h3>\n\u003cul>\n\u003cli>Dosya sunucusu ve kullanıcı verileri\u003c/li>\n\u003cli>AD (System State), DNS, DHCP ayarları\u003c/li>\n\u003cli>Veritabanları ve uygulama verileri\u003c/li>\n\u003cli>VM&#39;ler (imaj yedeği)\u003c/li>\n\u003cli>Ağ cihazı yapılandırmaları (TFTP/SCP ile)\u003c/li>\n\u003cli>Bulut verisi de (M365 verisinin ayrı yedeği önerilir)\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-7-3-araclar\">7.3 Araçlar\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Araç\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Windows Server Backup\u003c/td>\n\u003ctd>Yerleşik, basit, tek sunucu için\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Veeam Backup &amp; Replication\u003c/td>\n\u003ctd>Yaygın, VM ve fiziksel yedek; Community sürümü sınırlı kullanıma ücretsiz\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>robocopy / rsync\u003c/td>\n\u003ctd>Dosya düzeyi kopyalama, betiklerle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Proxmox Backup / Hyper-V export\u003c/td>\n\u003ctd>Sanallaştırma platformu yedekleri\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cpre>\u003ccode class=\"language-powershell\">wbadmin start systemstatebackup -backuptarget:E:    # AD System State yedeği\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"s-7-4-yedek-politikasi-sablonu\">7.4 Yedek politikası şablonu\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Veri\u003c/th>\n\u003cth>Sıklık\u003c/th>\n\u003cth>Saklama\u003c/th>\n\u003cth>Konum\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Dosya sunucusu\u003c/td>\n\u003ctd>Günlük\u003c/td>\n\u003ctd>30 gün\u003c/td>\n\u003ctd>NAS + bulut/dış disk\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AD / sunucu imajı\u003c/td>\n\u003ctd>Haftalık\u003c/td>\n\u003ctd>4 hafta\u003c/td>\n\u003ctd>NAS + çevrimdışı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Veritabanı\u003c/td>\n\u003ctd>Günlük + saatlik log\u003c/td>\n\u003ctd>30 gün\u003c/td>\n\u003ctd>Ayrı sunucu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ağ config\u003c/td>\n\u003ctd>Değişiklik sonrası\u003c/td>\n\u003ctd>Son 10\u003c/td>\n\u003ctd>TFTP/Git\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-7-5-geri-yukleme-testi\">7.5 Geri yükleme testi\u003c/h3>\n\u003cp>Yedek, \u003cstrong>geri yüklenebildiği kadar\u003c/strong> değerlidir.\u003c/p>\n\u003col>\n\u003cli>Rastgele bir dosyayı geri yükle, aç, doğrula.\u003c/li>\n\u003cli>Üç ayda bir tüm bir VM/sunucuyu test ortamına geri getir.\u003c/li>\n\u003cli>Süreyi ölç (RTO&#39;ya uyuyor mu?).\u003c/li>\n\u003cli>Sonucu belgele.\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"s-7-6-felaket-kurtarma-planinda-olmasi-gerekenler\">7.6 Felaket kurtarma planında olması gerekenler\u003c/h3>\n\u003cul>\n\u003cli>Kritik sistemler ve öncelik sırası\u003c/li>\n\u003cli>Kim, neyi, hangi sırayla yapacak (sorumlular, iletişim listesi)\u003c/li>\n\u003cli>Yedeklerin yeri ve erişim bilgisi (güvenli saklanan)\u003c/li>\n\u003cli>Geri dönüş adımları (runbook)\u003c/li>\n\u003cli>Planın düzenli test edilmesi\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-8-izleme-monitoring\">8. İzleme (Monitoring)\u003c/h2>\n\u003ch3 id=\"s-8-1-neyi-izlemeli\">8.1 Neyi izlemeli?\u003c/h3>\n\u003cul>\n\u003cli>Cihaz ayakta mı (ping/uptime)\u003c/li>\n\u003cli>CPU, RAM, disk doluluğu\u003c/li>\n\u003cli>Ağ trafiği ve port hataları\u003c/li>\n\u003cli>Kritik servisler (AD, DNS, DHCP, web, veritabanı)\u003c/li>\n\u003cli>Yedek işlerinin başarısı\u003c/li>\n\u003cli>Sertifika bitiş tarihleri\u003c/li>\n\u003cli>Sıcaklık/UPS durumu\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"s-8-2-ornek-alarm-esikleri\">8.2 Örnek alarm eşikleri\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Metrik\u003c/th>\n\u003cth>Uyarı\u003c/th>\n\u003cth>Kritik\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Disk doluluğu\u003c/td>\n\u003ctd>%80\u003c/td>\n\u003ctd>%90\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPU (sürekli)\u003c/td>\n\u003ctd>%85\u003c/td>\n\u003ctd>%95\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAM\u003c/td>\n\u003ctd>%85\u003c/td>\n\u003ctd>%95\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ping kaybı\u003c/td>\n\u003ctd>%10\u003c/td>\n\u003ctd>Cihaz yanıt vermiyor\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sertifika bitişi\u003c/td>\n\u003ctd>30 gün\u003c/td>\n\u003ctd>7 gün\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"s-8-3-araclar\">8.3 Araçlar\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Araç\u003c/th>\n\u003cth>Not\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Zabbix\u003c/strong>\u003c/td>\n\u003ctd>Ücretsiz, güçlü, ajan ve SNMP destekli\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>PRTG\u003c/strong>\u003c/td>\n\u003ctd>Kurulumu kolay, sınırlı ücretsiz sürüm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>LibreNMS\u003c/strong>\u003c/td>\n\u003ctd>Ağ cihazları için, SNMP odaklı\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Uptime Kuma\u003c/strong>\u003c/td>\n\u003ctd>Basit, hafif, servis ayakta mı kontrolü, ev laboratuvarı için ideal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Grafana + Prometheus\u003c/strong>\u003c/td>\n\u003ctd>Esnek grafik ve metrik\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>SNMP:\u003c/strong> Cihazlardan durum bilgisi çekme protokolü. v2c (topluluk dizesi, güvensiz), v3 (kimlik doğrulama + şifreleme, tercih et). Varsayılan &quot;public&quot; topluluk dizesini değiştir.\u003c/p>\n\u003ch2 id=\"s-9-onerilen-ev-laboratuvari-plani-asamali\">9. Önerilen Ev Laboratuvarı Planı (Aşamalı)\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Aşama\u003c/th>\n\u003cth>Yapılacak\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Sanallaştırma kur (Hyper-V/VirtualBox/Proxmox), Windows Server + istemci VM&#39;i\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>AD, DNS, DHCP kur; PC01&#39;i domaine al\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>OU/kullanıcı/grup, paylaşım ve NTFS izinleri, 3-4 GPO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>İkinci bir Linux VM: SSH, Nginx, Samba, cron\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Yedekleme: Windows Server Backup + robocopy/rsync, geri yükleme testi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>İzleme: Uptime Kuma veya Zabbix\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Her aşamanın ekran görüntüsünü ve notlarını bir dokümana veya Git deposuna ekle\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-10-sorun-giderme-kisayollari\">10. Sorun Giderme Kısayolları\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Belirti\u003c/th>\n\u003cth>İlk bakış\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Kullanıcı domaine giremiyor\u003c/td>\n\u003ctd>DNS ayarı DC&#39;yi gösteriyor mu, saat farkı (Kerberos 5 dk tolerans), hesap kilidi\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Domain&#39;e katılınamıyor\u003c/td>\n\u003ctd>DNS, ağ erişimi, \u003ccode>ping DC01\u003c/code>, \u003ccode>nslookup lab.local\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPO uygulanmıyor\u003c/td>\n\u003ctd>\u003ccode>gpresult /r\u003c/code>, OU bağlantısı, güvenlik filtreleme, replikasyon\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Paylaşıma erişim yok\u003c/td>\n\u003ctd>Paylaşım + NTFS izni, \u003ccode>\\\\sunucu\u003c/code> ping/DNS, 445 portu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DHCP IP vermiyor\u003c/td>\n\u003ctd>Servis çalışıyor mu, yetkilendirildi mi, havuz dolu mu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sunucu yavaş\u003c/td>\n\u003ctd>Görev Yöneticisi/\u003ccode>top\u003c/code>, disk gecikmesi, sanal konak kaynak yetersizliği\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disk doldu\u003c/td>\n\u003ctd>Büyük dosya/klasörleri bul, log, temp, eski yedek, snapshot&#39;lar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Yedek başarısız\u003c/td>\n\u003ctd>Hedef alan, ağ/izin, VSS hataları, log\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","sections":[{"id":"s-sunucu-sanallastirma-yedekleme-ve-izleme-rehberi","title":"Sunucu, Sanallaştırma, Yedekleme ve İzleme Rehberi","level":1,"path":"","isTitle":true,"text":"Windows Server · Active Directory Lab · Hyper-V/Proxmox · Linux Sunucu · Yedekleme · İzleme\nBu rehber, sunucu tarafı işlerin ortak notlarını tek yerde toplar. Sonunda kendi evinde kurabileceğin bir laboratuvar planı var."},{"id":"s-1-windows-server-rolleri","title":"1. Windows Server Rolleri","level":2,"path":"","isTitle":false,"text":"Rol\nNe yapar\nKurulum (PowerShell)\nAD DS\nKullanıcı/bilgisayar/kimlik yönetimi\nInstall-WindowsFeature AD-Domain-Services -IncludeManagementTools\nDNS\nİsim çözümleme\nInstall-WindowsFeature DNS -IncludeManagementTools\nDHCP\nOtomatik IP dağıtımı\nInstall-WindowsFeature DHCP -IncludeManagementTools\nDosya Sunucusu\nPaylaşımlar, kota\nInstall-WindowsFeature FS-FileServer\nYazdırma Sunucusu\nMerkezi yazıcı yönetimi\nInstall-WindowsFeature Print-Server\nWSUS\nWindows güncelleme yönetimi\nInstall-WindowsFeature UpdateServices\nHyper-V\nSanallaştırma\nInstall-WindowsFeature Hyper-V -IncludeManagementTools -Restart\nIIS\nWeb sunucusu\nInstall-WindowsFeature Web-Server -IncludeManagementTools\nRol/özellik listesi: Get-WindowsFeature. Grafik arayüz: Server Manager."},{"id":"s-2-active-directory-laboratuvari-adim-adim","title":"2. Active Directory Laboratuvarı (Adım Adım)","level":2,"path":"","isTitle":false,"text":""},{"id":"s-2-1-gerekenler","title":"2.1 Gerekenler","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"Sanallaştırma yazılımı (Hyper-V, VirtualBox, VMware Workstation, Proxmox)\nWindows Server ISO (Microsoft Evaluation Center'dan ücretsiz deneme sürümü) ve bir Windows 10/11 istemci\nÖnerilen kaynak: DC için 2 vCPU / 2-4 GB RAM / 40+ GB disk, istemci için 2 vCPU / 4 GB RAM"},{"id":"s-2-2-topoloji","title":"2.2 Topoloji","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"Makine\nAd\nIP\nRol\nSunucu\nDC01\n192.168.1.20\nAD DS, DNS, DHCP\nİstemci\nPC01\nDHCP\nDomaine katılacak\nİki makine aynı sanal ağda (internal/host-only) olmalı."},{"id":"s-2-3-dc01-hazirligi","title":"2.3 DC01 hazırlığı","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"Get-NetAdapter                                   # Arayüz adını öğren (örn. Ethernet)\nNew-NetIPAddress -InterfaceAlias \"Ethernet\" -IPAddress 192.168.1.20 -PrefixLength 24 -DefaultGateway 192.168.1.1\nSet-DnsClientServerAddress -InterfaceAlias \"Ethernet\" -ServerAddresses 127.0.0.1\nRename-Computer -NewName DC01 -Restart"},{"id":"s-2-4-domain-kurulumu","title":"2.4 Domain kurulumu","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"Install-WindowsFeature AD-Domain-Services -IncludeManagementTools\nInstall-ADDSForest -DomainName \"lab.local\" -InstallDns\nSihirbaz DSRM (Directory Services Restore Mode) şifresi ister, bir yere kaydet. Sunucu otomatik yeniden başlar; artık giriş LAB\\Administrator."},{"id":"s-2-5-ou-kullanici-grup","title":"2.5 OU, kullanıcı, grup","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"New-ADOrganizationalUnit -Name \"Kullanicilar\" -Path \"DC=lab,DC=local\"\nNew-ADUser -Name \"Ali Veli\" -SamAccountName \"aveli\" -UserPrincipalName \"aveli@lab.local\" `\n  -Path \"OU=Kullanicilar,DC=lab,DC=local\" -AccountPassword (Read-Host -AsSecureString \"Sifre\") -Enabled $true\nNew-ADGroup -Name \"Muhasebe\" -GroupScope Global -Path \"OU=Kullanicilar,DC=lab,DC=local\"\nAdd-ADGroupMember -Identity \"Muhasebe\" -Members aveli"},{"id":"s-2-6-dhcp","title":"2.6 DHCP","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"Install-WindowsFeature DHCP -IncludeManagementTools\nAdd-DhcpServerInDC -DnsName \"DC01.lab.local\" -IPAddress 192.168.1.20   # AD'de yetkilendir\nAdd-DhcpServerv4Scope -Name \"LAN\" -StartRange 192.168.1.100 -EndRange 192.168.1.200 -SubnetMask 255.255.255.0\nSet-DhcpServerv4OptionValue -Router 192.168.1.1 -DnsServer 192.168.1.20 -DnsDomain \"lab.local\"\nAD ortamında DHCP sunucusunun yetkilendirilmesi (authorize) gerekir."},{"id":"s-2-7-istemciyi-domaine-alma","title":"2.7 İstemciyi domaine alma","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"PC01'de: DNS sunucusu olarak 192.168.1.20 ver (DHCP verdiyse otomatik), sonra:\nAdd-Computer -DomainName lab.local -Credential LAB\\Administrator -Restart\nGiriş: LAB\\aveli."},{"id":"s-2-8-dosya-paylasimi-ve-izinler","title":"2.8 Dosya paylaşımı ve izinler","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"New-Item -Path D:\\Paylasim\\Muhasebe -ItemType Directory -Force\nNew-SmbShare -Name \"Muhasebe\" -Path \"D:\\Paylasim\\Muhasebe\" -FullAccess \"LAB\\Muhasebe\"\nİzin mantığı: Paylaşım izni ve NTFS izni birlikte değerlendirilir, en kısıtlayıcı olan geçerli olur. Mümkünse kullanıcıya değil gruba izin ver (AGDLP yaklaşımı: Account → Global group → Domain Local group → Permission)."},{"id":"s-2-9-group-policy-gpo-rnekleri","title":"2.9 Group Policy (GPO) örnekleri","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"gpmc.msc ile açılır. GPO'yu OU'ya bağla, gpupdate /force ile test et.\nŞifre politikası (uzunluk, karmaşıklık, kilitleme eşiği)\nAğ sürücüsü eşleme (Group Policy Preferences > Drive Maps)\nDuvar kâğıdı, ekran kilidi süresi\nUSB depolama kısıtı\nYazılım kurulum ve güvenlik duvarı kuralları\nHangi GPO uygulanıyor? İstemcide gpresult /r veya gpresult /h rapor.html."},{"id":"s-2-10-ad-saglik-komutlari","title":"2.10 AD sağlık komutları","level":3,"path":"2. Active Directory Laboratuvarı (Adım Adım)","isTitle":false,"text":"dcdiag                       # DC genel sağlık testi\nrepadmin /replsummary        # Çoklu DC'de replikasyon özeti\nnltest /dsgetdc:lab.local    # Hangi DC'ye bağlı\nnetdom query fsmo            # FSMO rol sahipleri\nFSMO rolleri (5): Schema Master, Domain Naming Master, PDC Emulator, RID Master, Infrastructure Master. Tek DC'li ortamda hepsi aynı sunucudadır."},{"id":"s-3-sunucularin-gunluk-haftalik-kontrol-listesi","title":"3. Sunucuların Günlük/Haftalık Kontrol Listesi","level":2,"path":"","isTitle":false,"text":"Günlük\nYedekleme işleri başarılı mı?\n Disk doluluğu (>%85 uyarı)\n Kritik servisler çalışıyor mu (AD, DNS, DHCP, dosya, yazdırma)\n Olay Görüntüleyici'de Hata/Kritik kayıtlar\n Antivirüs/Defender güncel mi\n UPS ve sıcaklık normal mi\nHaftalık/Aylık\nGüncelleme/yama (Windows'ta Patch Tuesday = ayın 2. Salı günü)\n dcdiag, repadmin /replsummary\n Yedekten geri yükleme testi\n Kullanılmayan hesap ve bilgisayar temizliği\n Yönetici grubu üyeliklerinin gözden geçirilmesi\nYama sırası: Test ortamı → pilot grup → herkes. Sunucu güncellemesini bakım penceresinde yap, önce yedek/snapshot al."},{"id":"s-4-disk-raid-ve-donanim","title":"4. Disk, RAID ve Donanım","level":2,"path":"","isTitle":false,"text":"RAID\nMin. disk\nNe sağlar\nRAID 0\n2\nHız, yedeklilik yok (bir disk giderse hepsi gider)\nRAID 1\n2\nAyna, 1 disk arızasına dayanır\nRAID 5\n3\n1 disk arızasına dayanır, kapasite verimli\nRAID 6\n4\n2 disk arızasına dayanır\nRAID 10\n4\nHız + ayna, 1+1 mantığı\nRAID yedek değildir. Silme, fidye yazılımı, yangın ve yazılım hatasına karşı koruma sağlamaz.\nDisk sağlığı: SMART (Windows: CrystalDiskInfo; Linux: smartctl -a /dev/sda)\nUPS: ani elektrik kesintisinde kontrollü kapanma; batarya ömrünü ve yük kapasitesini takip et\nSunucu odası: sıcaklık, havalandırma, kablo düzeni, etiketleme, erişim kontrolü"},{"id":"s-5-sanallastirma","title":"5. Sanallaştırma","level":2,"path":"","isTitle":false,"text":""},{"id":"s-5-1-kavramlar","title":"5.1 Kavramlar","level":3,"path":"5. Sanallaştırma","isTitle":false,"text":"Kavram\nAnlamı\nHypervisor Tip 1\nDoğrudan donanım üstünde (Hyper-V, ESXi, Proxmox/KVM)\nHypervisor Tip 2\nİşletim sistemi üstünde (VirtualBox, VMware Workstation)\nVM\nSanal makine\nSnapshot/Checkpoint\nAnlık durum kaydı. Yedek değildir, uzun süre tutma (disk şişer, performans düşer)\nThin / Thick disk\nGerektikçe büyüyen / baştan ayrılmış disk\nSanal switch\nVM'lerin ağ bağlantısı\nLive migration\nÇalışan VM'i kapatmadan başka konağa taşıma"},{"id":"s-5-2-hyper-v-ag-turleri","title":"5.2 Hyper-V ağ türleri","level":3,"path":"5. Sanallaştırma","isTitle":false,"text":"Tür\nAnlamı\nExternal\nFiziksel ağa/internete çıkış\nInternal\nKonak ile VM'ler arası\nPrivate\nSadece VM'ler arası"},{"id":"s-5-3-hyper-v-powershell","title":"5.3 Hyper-V PowerShell","level":3,"path":"5. Sanallaştırma","isTitle":false,"text":"Get-VM\nNew-VM -Name \"DC01\" -MemoryStartupBytes 4GB -Generation 2 -NewVHDPath \"D:\\VM\\DC01.vhdx\" -NewVHDSizeBytes 60GB -SwitchName \"LabSwitch\"\nStart-VM DC01\nCheckpoint-VM -Name DC01 -SnapshotName \"Kurulum-oncesi\"\nRestore-VMSnapshot -Name \"Kurulum-oncesi\" -VMName DC01\nStop-VM DC01"},{"id":"s-5-4-proxmox-ev-laboratuvari-icin-guclu-secenek","title":"5.4 Proxmox (ev laboratuvarı için güçlü seçenek)","level":3,"path":"5. Sanallaştırma","isTitle":false,"text":"Web arayüzü: https://SUNUCU_IP:8006\nKVM (tam sanal makine) ve LXC (hafif konteyner) çalıştırır\nKomutlar: qm list (VM'ler), pct list (konteynerler), qm start 100\nYedekleme: Datacenter > Backup; depolama: yerel disk, NFS, ZFS\nŞablon (template) oluşturup hızlı klonlama yap"},{"id":"s-5-5-docker-temelleri-kisa","title":"5.5 Docker Temelleri (kısa)","level":3,"path":"5. Sanallaştırma","isTitle":false,"text":"docker ps                          # Çalışan konteynerler\ndocker ps -a                       # Hepsi\ndocker images                      # İmajlar\ndocker run -d -p 8080:80 nginx     # Web sunucusu başlat\ndocker logs konteyner_adi          # Loglar\ndocker exec -it konteyner_adi sh   # İçine gir\ndocker compose up -d               # compose dosyasından başlat\ndocker compose down\nVeriyi volume ile dışarıda tut, konteyner silince veri gitmesin."},{"id":"s-6-linux-sunucu-isleri","title":"6. Linux Sunucu İşleri","level":2,"path":"","isTitle":false,"text":""},{"id":"s-6-1-ilk-kurulum-sonrasi","title":"6.1 İlk kurulum sonrası","level":3,"path":"6. Linux Sunucu İşleri","isTitle":false,"text":"sudo apt update && sudo apt upgrade -y\nsudo timedatectl set-timezone Europe/Istanbul\nsudo hostnamectl set-hostname srv01\nsudo adduser yonetici && sudo usermod -aG sudo yonetici\nsudo ufw allow 22/tcp && sudo ufw enable\nsudo apt install unattended-upgrades fail2ban -y"},{"id":"s-6-2-ssh-sikilastirma-etc-ssh-sshd-config","title":"6.2 SSH sıkılaştırma (/etc/ssh/sshd_config)","level":3,"path":"6. Linux Sunucu İşleri","isTitle":false,"text":"PermitRootLogin no\nPasswordAuthentication no     # Önce anahtar girişini test et!\nPubkeyAuthentication yes\nsudo systemctl restart ssh. Dikkat: Yeni bir oturumda anahtarla girişi doğrulamadan mevcut oturumu kapatma, kendini dışarıda bırakabilirsin."},{"id":"s-6-3-servisler","title":"6.3 Servisler","level":3,"path":"6. Linux Sunucu İşleri","isTitle":false,"text":"Web: Nginx (sudo apt install nginx), yapılandırma /etc/nginx/, test sudo nginx -t\nDosya paylaşımı: Samba (Windows ile uyumlu), yapılandırma /etc/samba/smb.conf\nZamanlı işler: cron (crontab -e)\ncron formatı:\n# dakika saat gün ay haftanın_günü  komut\n30 2 * * *   /home/yonetici/yedek.sh        # Her gün 02:30\n0 */6 * * *  /home/yonetici/kontrol.sh      # 6 saatte bir\n0 3 * * 0    /home/yonetici/haftalik.sh     # Her Pazar 03:00"},{"id":"s-6-4-disk-isleri","title":"6.4 Disk işleri","level":3,"path":"6. Linux Sunucu İşleri","isTitle":false,"text":"lsblk                      # Diskler ve bölümler\ndf -h                      # Doluluk\nsudo fdisk -l              # Bölüm tablosu\nsudo mount /dev/sdb1 /mnt  # Bağla\ndu -sh /var/log/*          # Hangi klasör yer kaplıyor\nKalıcı bağlama: /etc/fstab (yanlış satır açılışı bozabilir, önce yedek al, sudo mount -a ile test et)."},{"id":"s-7-yedekleme-ve-felaket-kurtarma","title":"7. Yedekleme ve Felaket Kurtarma","level":2,"path":"","isTitle":false,"text":""},{"id":"s-7-1-temel-kavramlar","title":"7.1 Temel kavramlar","level":3,"path":"7. Yedekleme ve Felaket Kurtarma","isTitle":false,"text":"Terim\nAnlamı\n3-2-1 kuralı\n3 kopya, 2 farklı ortam, 1 tanesi dışarıda/çevrimdışı\nRPO\nEn fazla ne kadar veri kaybı kabul edilir (örn. 1 saat)\nRTO\nSistemin ne kadar sürede geri gelmesi gerekir (örn. 4 saat)\nTam yedek\nHer şeyin kopyası\nArtımlı\nSon yedekten (türü fark etmeksizin) beri değişenler\nFark (differential)\nSon tam yedekten beri değişenler\nImmutable/offline yedek\nDeğiştirilemeyen veya ağdan kopuk kopya (fidye yazılımına karşı)"},{"id":"s-7-2-ne-yedeklenir","title":"7.2 Ne yedeklenir?","level":3,"path":"7. Yedekleme ve Felaket Kurtarma","isTitle":false,"text":"Dosya sunucusu ve kullanıcı verileri\nAD (System State), DNS, DHCP ayarları\nVeritabanları ve uygulama verileri\nVM'ler (imaj yedeği)\nAğ cihazı yapılandırmaları (TFTP/SCP ile)\nBulut verisi de (M365 verisinin ayrı yedeği önerilir)"},{"id":"s-7-3-araclar","title":"7.3 Araçlar","level":3,"path":"7. Yedekleme ve Felaket Kurtarma","isTitle":false,"text":"Araç\nNot\nWindows Server Backup\nYerleşik, basit, tek sunucu için\nVeeam Backup & Replication\nYaygın, VM ve fiziksel yedek; Community sürümü sınırlı kullanıma ücretsiz\nrobocopy / rsync\nDosya düzeyi kopyalama, betiklerle\nProxmox Backup / Hyper-V export\nSanallaştırma platformu yedekleri\nwbadmin start systemstatebackup -backuptarget:E:    # AD System State yedeği"},{"id":"s-7-4-yedek-politikasi-sablonu","title":"7.4 Yedek politikası şablonu","level":3,"path":"7. Yedekleme ve Felaket Kurtarma","isTitle":false,"text":"Veri\nSıklık\nSaklama\nKonum\nDosya sunucusu\nGünlük\n30 gün\nNAS + bulut/dış disk\nAD / sunucu imajı\nHaftalık\n4 hafta\nNAS + çevrimdışı\nVeritabanı\nGünlük + saatlik log\n30 gün\nAyrı sunucu\nAğ config\nDeğişiklik sonrası\nSon 10\nTFTP/Git"},{"id":"s-7-5-geri-yukleme-testi","title":"7.5 Geri yükleme testi","level":3,"path":"7. Yedekleme ve Felaket Kurtarma","isTitle":false,"text":"Yedek, geri yüklenebildiği kadar değerlidir.\nRastgele bir dosyayı geri yükle, aç, doğrula.\nÜç ayda bir tüm bir VM/sunucuyu test ortamına geri getir.\nSüreyi ölç (RTO'ya uyuyor mu?).\nSonucu belgele."},{"id":"s-7-6-felaket-kurtarma-planinda-olmasi-gerekenler","title":"7.6 Felaket kurtarma planında olması gerekenler","level":3,"path":"7. Yedekleme ve Felaket Kurtarma","isTitle":false,"text":"Kritik sistemler ve öncelik sırası\nKim, neyi, hangi sırayla yapacak (sorumlular, iletişim listesi)\nYedeklerin yeri ve erişim bilgisi (güvenli saklanan)\nGeri dönüş adımları (runbook)\nPlanın düzenli test edilmesi"},{"id":"s-8-izleme-monitoring","title":"8. İzleme (Monitoring)","level":2,"path":"","isTitle":false,"text":""},{"id":"s-8-1-neyi-izlemeli","title":"8.1 Neyi izlemeli?","level":3,"path":"8. İzleme (Monitoring)","isTitle":false,"text":"Cihaz ayakta mı (ping/uptime)\nCPU, RAM, disk doluluğu\nAğ trafiği ve port hataları\nKritik servisler (AD, DNS, DHCP, web, veritabanı)\nYedek işlerinin başarısı\nSertifika bitiş tarihleri\nSıcaklık/UPS durumu"},{"id":"s-8-2-ornek-alarm-esikleri","title":"8.2 Örnek alarm eşikleri","level":3,"path":"8. İzleme (Monitoring)","isTitle":false,"text":"Metrik\nUyarı\nKritik\nDisk doluluğu\n%80\n%90\nCPU (sürekli)\n%85\n%95\nRAM\n%85\n%95\nPing kaybı\n%10\nCihaz yanıt vermiyor\nSertifika bitişi\n30 gün\n7 gün"},{"id":"s-8-3-araclar","title":"8.3 Araçlar","level":3,"path":"8. İzleme (Monitoring)","isTitle":false,"text":"Araç\nNot\nZabbix\nÜcretsiz, güçlü, ajan ve SNMP destekli\nPRTG\nKurulumu kolay, sınırlı ücretsiz sürüm\nLibreNMS\nAğ cihazları için, SNMP odaklı\nUptime Kuma\nBasit, hafif, servis ayakta mı kontrolü, ev laboratuvarı için ideal\nGrafana + Prometheus\nEsnek grafik ve metrik\nSNMP: Cihazlardan durum bilgisi çekme protokolü. v2c (topluluk dizesi, güvensiz), v3 (kimlik doğrulama + şifreleme, tercih et). Varsayılan \"public\" topluluk dizesini değiştir."},{"id":"s-9-onerilen-ev-laboratuvari-plani-asamali","title":"9. Önerilen Ev Laboratuvarı Planı (Aşamalı)","level":2,"path":"","isTitle":false,"text":"Aşama\nYapılacak\n1\nSanallaştırma kur (Hyper-V/VirtualBox/Proxmox), Windows Server + istemci VM'i\n2\nAD, DNS, DHCP kur; PC01'i domaine al\n3\nOU/kullanıcı/grup, paylaşım ve NTFS izinleri, 3-4 GPO\n4\nİkinci bir Linux VM: SSH, Nginx, Samba, cron\n5\nYedekleme: Windows Server Backup + robocopy/rsync, geri yükleme testi\n6\nİzleme: Uptime Kuma veya Zabbix\n7\nHer aşamanın ekran görüntüsünü ve notlarını bir dokümana veya Git deposuna ekle"},{"id":"s-10-sorun-giderme-kisayollari","title":"10. Sorun Giderme Kısayolları","level":2,"path":"","isTitle":false,"text":"Belirti\nİlk bakış\nKullanıcı domaine giremiyor\nDNS ayarı DC'yi gösteriyor mu, saat farkı (Kerberos 5 dk tolerans), hesap kilidi\nDomain'e katılınamıyor\nDNS, ağ erişimi, ping DC01, nslookup lab.local\nGPO uygulanmıyor\ngpresult /r, OU bağlantısı, güvenlik filtreleme, replikasyon\nPaylaşıma erişim yok\nPaylaşım + NTFS izni, \\\\sunucu ping/DNS, 445 portu\nDHCP IP vermiyor\nServis çalışıyor mu, yetkilendirildi mi, havuz dolu mu\nSunucu yavaş\nGörev Yöneticisi/top, disk gecikmesi, sanal konak kaynak yetersizliği\nDisk doldu\nBüyük dosya/klasörleri bul, log, temp, eski yedek, snapshot'lar\nYedek başarısız\nHedef alan, ağ/izin, VSS hataları, log"}]},{"slug":"donanim","file":"11-veri-merkezi-donanim-ups-kablolama-rehberi.md","title":"Veri Merkezi, Fiziksel Altyapı, UPS ve Donanım Rehberi","short":"Veri Merkezi, UPS ve Donanım","desc":"Cat6/Fiber kablolama, T568B renkleri, kabinet düzeni, Online UPS hesabı, iDRAC/iLO, RAID","words":1583,"html":"\u003ch1 id=\"s-veri-merkezi-fiziksel-altyapi-ups-ve-donanim-rehberi\">Veri Merkezi, Fiziksel Altyapı, UPS ve Donanım Rehberi\u003c/h1>\n\u003cp>Yazılım ve işletim sistemleri ne kadar mükemmel olursa olsun, fiziksel altyapı (elektrik, kablolama, iklimlendirme ve donanım sağlığı) sağlam değilse sistemlerin ayakta kalması imkansızdır. Bir IT uzmanı ve sistem yöneticisi için fiziksel katmanın eksiksiz rehberi.\u003c/p>\n\u003chr>\n\u003ch1 id=\"s-1-yapisal-kablolama-ve-renk-standartlari\">1. YAPISAL KABLOLAMA VE RENK STANDARTLARI\u003c/h1>\n\u003ch2 id=\"s-1-1-bakir-kablolama-twisted-pair\">1.1 Bakır Kablolama (Twisted Pair)\u003c/h2>\n\u003cp>Kurumsal ağlarda en yaygın kullanılan UTP/STP kablo türleri:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kategori\u003c/th>\n\u003cth>Azami Hız\u003c/th>\n\u003cth>Azami Frekans\u003c/th>\n\u003cth>Azami Mesafe\u003c/th>\n\u003cth>Tipik Kullanım Alanı\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Cat5e\u003c/strong>\u003c/td>\n\u003ctd>1 Gbps\u003c/td>\n\u003ctd>100 MHz\u003c/td>\n\u003ctd>100 metre\u003c/td>\n\u003ctd>Eski kurulumlar, masaüstü uç kullanıcılar.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cat6\u003c/strong>\u003c/td>\n\u003ctd>1 Gbps (10G 55m&#39;ye kadar)\u003c/td>\n\u003ctd>250 MHz\u003c/td>\n\u003ctd>100 metre\u003c/td>\n\u003ctd>Standart kurumsal ofis ve PoE uç noktalar.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cat6a\u003c/strong>\u003c/td>\n\u003ctd>10 Gbps\u003c/td>\n\u003ctd>500 MHz\u003c/td>\n\u003ctd>100 metre\u003c/td>\n\u003ctd>Veri merkezi, switch arası uplink ve modern omurga.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cat7 / Cat8\u003c/strong>\u003c/td>\n\u003ctd>10G / 25G / 40G\u003c/td>\n\u003ctd>600 - 2000 MHz\u003c/td>\n\u003ctd>30 metre\u003c/td>\n\u003ctd>Veri merkezinde sunucu-switch yüksek hızlı bağlantılar.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cblockquote>\n\u003cp>\u003cstrong>Kritik Kural:\u003c/strong> Ethernet kablolarında tek parça azami hat mesafesi \u003cstrong>100 metredir\u003c/strong> (90m sabit tesisat kablosu + her iki uçta 5&#39;er metrelik patch kablo). 100 metreyi aşan mesafelerde sinyal zayıflar; araya switch veya \u003cstrong>fiber optik\u003c/strong> hat çekilmelidir.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"s-1-2-rj45-renk-standartlari-t568a-ve-t568b\">1.2 RJ45 Renk Standartları (T568A ve T568B)\u003c/h2>\n\u003cp>Kurumsal tesisatlarda dünya standardı olarak \u003cstrong>T568B\u003c/strong> kullanılır:\u003c/p>\n\u003cpre>\u003ccode>RJ45 Konnektör Pin Dizilimi (Tırnak arkada, pinler yukarı bakarken, Soldan Sağa 1'den 8'e):\n\nPin 1: Turuncu-Beyaz\nPin 2: Turuncu\nPin 3: Yeşil-Beyaz\nPin 4: Mavi\nPin 5: Mavi-Beyaz\nPin 6: Yeşil\nPin 7: Kahverengi-Beyaz\nPin 8: Kahverengi\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Düz Kablo (Straight-Through):\u003c/strong> İki ucu da T568B standardında çakılır. Farklı cihazlar arası kullanılır (PC -&gt; Switch, Router -&gt; Switch).\u003c/li>\n\u003cli>\u003cstrong>Çapraz Kablo (Crossover):\u003c/strong> Bir ucu T568A, diğer ucu T568B standardındadır. Aynı tür cihazlar arası (Switch -&gt; Switch, PC -&gt; PC) için geçmişte gerekirdi; modern ağ kartlarında \u003cstrong>Auto-MDIX\u003c/strong> özelliği olduğundan düz kablolar da otomatik algılanır.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-1-3-patch-panel-ve-keystone-jack-cakma\">1.3 Patch Panel ve Keystone Jack Çakma\u003c/h2>\n\u003cul>\n\u003cli>Duvar prizleri ve kabinet içi sonlandırmalar daima \u003cstrong>Keystone Jack\u003c/strong> ve \u003cstrong>Patch Panel\u003c/strong> üzerine punch-down (kronalama) aletiyle çakılır.\u003c/li>\n\u003cli>\u003cstrong>Etiketleme Kuralı:\u003c/strong> Kabinet tarafındaki her patch panel portu (örn. \u003ccode>PP1-Port 24\u003c/code>), odadaki duvar prizinde (örn. \u003ccode>Oda 204 - Data 1\u003c/code>) aynı kodla etiketlenmelidir. Etiketsiz bir kablolama altyapısı arıza durumunda saatlerce zaman kaybettirir.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-2-fiber-optik-temelleri\">2. FİBER OPTİK TEMELLERİ\u003c/h1>\n\u003cp>Binalar arası, katlar arası veya switch uplink bağlantılarında elektromanyetik parazitten etkilenmeyen ve uzun mesafeleri destekleyen fiber optik hatlar kullanılır.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tür\u003c/th>\n\u003cth>Çekirdek Çapı\u003c/th>\n\u003cth>Işık Kaynağı\u003c/th>\n\u003cth>Azami Mesafe\u003c/th>\n\u003cth>Renk Kodu\u003c/th>\n\u003cth>Kullanım\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Multi-Mode (MMF)\u003c/strong> OM3 / OM4\u003c/td>\n\u003ctd>50 µm\u003c/td>\n\u003ctd>LED / VCSEL Lazer\u003c/td>\n\u003ctd>300m - 550m (10G için)\u003c/td>\n\u003ctd>Turkuaz (Aqua) / Menekşe (Violet)\u003c/td>\n\u003ctd>Bina içi katlar arası omurga, kabinetler arası.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Single-Mode (SMF)\u003c/strong> OS2\u003c/td>\n\u003ctd>9 µm\u003c/td>\n\u003ctd>Lazer\u003c/td>\n\u003ctd>10 km - 40+ km\u003c/td>\n\u003ctd>Sarı (Yellow)\u003c/td>\n\u003ctd>Kampüs içi binalar arası, Metro Ethernet, ISP hatları.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Konnektör Türleri:\u003c/strong> En yaygın kurumsal tür \u003cstrong>LC\u003c/strong> (küçük, çiftli push-pull) ve eski tesisatlarda \u003cstrong>SC\u003c/strong> (kare) konektörlerdir.\u003c/li>\n\u003cli>\u003cstrong>SFP / SFP+ Modülleri:\u003c/strong> Switch üzerindeki fiber yuvalarına takılan alıcı-verici (transceiver) modüller. Multi-mode için \u003cstrong>SX\u003c/strong> veya \u003cstrong>SR\u003c/strong>, Single-mode için \u003cstrong>LX\u003c/strong> veya \u003cstrong>LR\u003c/strong> modül seçilmelidir. (Multi-mode kabloya Single-mode modül takılamaz!).\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-3-sunucu-rack-kabinet-duzeni\">3. SUNUCU RACK KABİNET DÜZENİ\u003c/h1>\n\u003cp>Veri merkezinde ve sistem odalarında standart 19 inç kabinetler kullanılır:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Rack Unit (U Ölçüsü):\u003c/strong> 1U = 1.75 inç (44.45 mm). Standart kabinetler genellikle \u003cstrong>42U\u003c/strong> veya \u003cstrong>48U\u003c/strong> yüksekliğindedir.\u003c/li>\n\u003cli>\u003cstrong>Sıcak / Soğuk Koridor Mantığı:\u003c/strong>\u003cul>\n\u003cli>Sunucular ve ağ cihazları havayı \u003cstrong>önden emer, arkadan sıcak olarak dışarı üfler\u003c/strong>.\u003c/li>\n\u003cli>Kabinetlerin ön yüzleri birbirine bakacak şekilde dizilirse soğuk hava kanalı oluşur (Soğuk Koridor).\u003c/li>\n\u003cli>Boş kalan U yuvalarına \u003cstrong>Kör Panel (Blanking Panel)\u003c/strong> takılmalıdır; aksi takdirde arka taraftaki sıcak hava ön tarafa sirküle ederek sunucuları ısıtır.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Ağırlık Dağılımı:\u003c/strong> En ağır bileşenler (UPS, akü grupları ve disk dolu storage sunucuları) daima kabinetin \u003cstrong>en altına\u003c/strong> yerleştirilir. Switch ve patch paneller genellikle üst veya orta kısımdadır.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-4-kesintisiz-guc-kaynagi-ups-ve-elektrik\">4. KESİNTİSİZ GÜÇ KAYNAĞI (UPS) VE ELEKTRİK\u003c/h1>\n\u003ch2 id=\"s-4-1-ups-turleri\">4.1 UPS Türleri\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Offline / Standby:\u003c/strong> Şebeke varken doğrudan verir, elektrik kesilince 4-10 ms içinde aküye geçer. Hassas sunucular için uygun değildir.\u003c/li>\n\u003cli>\u003cstrong>Line-Interactive:\u003c/strong> Voltaj dalgalanmalarını AVR ile düzeltir, kesintide 2-4 ms içinde aküye geçer. Küçük ofis ve switch&#39;ler için uygundur.\u003c/li>\n\u003cli>\u003cstrong>Online (Çift Çevrim - True Online):\u003c/strong> Şebeke elektriğini sürekli AC -&gt; DC -&gt; AC olarak yeniden üretir. Transfer süresi \u003cstrong>0 ms\u003c/strong>&#39;dir (kesintisiz). Frekans ve voltaj dalgalanmalarından sunucuları tamamen izole eder. \u003cstrong>Sistem odaları için zorunlu standarttır.\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"s-4-2-yuk-ve-guc-hesabi-va-vs-watt\">4.2 Yük ve Güç Hesabı (VA vs Watt)\u003c/h2>\n\u003cul>\n\u003cli>Güç faktörü (Power Factor - PF) genellikle 0.8 veya 0.9&#39;dur: \u003ccode>Watt = VA × PF\u003c/code>.\u003c/li>\n\u003cli>Örneğin 10.000 VA (10 kVA) bir UPS, PF=0.9 ise azami \u003cstrong>9.000 Watt\u003c/strong> aktif yük taşıyabilir.\u003c/li>\n\u003cli>\u003cstrong>Kapasite Kuralı:\u003c/strong> UPS hiçbir zaman %80&#39;den fazla sürekli yükte çalıştırılmamalıdır (Ani kalkış akımları ve gelecekteki büyüme için %20-30 pay bırakılmalıdır).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-4-3-otomatik-ve-sirali-kapatma-graceful-shutdown\">4.3 Otomatik ve Sıralı Kapatma (Graceful Shutdown)\u003c/h2>\n\u003cp>Uzun süreli elektrik kesintilerinde jeneratör devreye girmezse aküler tükenmeden önce sunucuların aniden kapanması veri tabanlarını bozar.\u003c/p>\n\u003cul>\n\u003cli>UPS üzerinde bir \u003cstrong>Ağ Yönetim Kartı (Network Management Card - NMC)\u003c/strong> bulunmalıdır.\u003c/li>\n\u003cli>NMC kartı şebeke kesildiğinde ve akü seviyesi %20&#39;nin altına indiğinde ağ üzerinden sunuculara sinyal gönderir:\u003col>\n\u003cli>Önce sanal makineler (VMware PowerChute / Proxmox NUT / Hyper-V agent) sırayla kapatılır.\u003c/li>\n\u003cli>Ardından sanallaştırma ana makineleri (ESXi / Proxmox host) kapatılır.\u003c/li>\n\u003cli>En son depolama ünitesi (SAN / NAS Storage) güvenli park moduna geçer.\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-4-4-aku-bakimi-ve-riskler\">4.4 Akü Bakımı ve Riskler\u003c/h2>\n\u003cul>\n\u003cli>Akülerin tipik ekonomik ömrü \u003cstrong>3–5 yıldır\u003c/strong>.\u003c/li>\n\u003cli>Yılda en az iki kez UPS akü testi (self-test ve kontrollü şebeke kesintisi testi) yapılmalıdır.\u003c/li>\n\u003cli>Akülerde şişme, aşırı ısınma, sülfatlaşma veya koku fark edildiğinde hemen değiştirilmelidir.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-5-sunucu-donanimi-ve-dayaniklilik-hardware-resilience\">5. SUNUCU DONANIMI VE DAYANIKLILIK (HARDWARE RESILIENCE)\u003c/h1>\n\u003ch2 id=\"s-5-1-out-of-band-y-netim-idrac-ilo-ipmi\">5.1 Out-of-Band Yönetim (iDRAC / iLO / IPMI)\u003c/h2>\n\u003cp>Sunucunun işletim sistemi çökse, mavi ekranda kalsa veya sunucu kapalı bile olsa bağımsız çalışan anakart yönetim işlemcisi:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Dell:\u003c/strong> iDRAC (Integrated Dell Remote Access Controller)\u003c/li>\n\u003cli>\u003cstrong>HPE:\u003c/strong> iLO (Integrated Lights-Out)\u003c/li>\n\u003cli>\u003cstrong>Lenovo / Supermicro:\u003c/strong> XClarity / IPMI\u003c/li>\n\u003cli>\u003cstrong>Neler Yapılabilir?\u003c/strong>\u003cul>\n\u003cli>Uzaktan sanal konsol (KVM) ile BIOS ekranına erişim.\u003c/li>\n\u003cli>Uzaktan ISO bağlayıp işletim sistemi kurma (Virtual Media).\u003c/li>\n\u003cli>Donanım sıcaklıkları, fan hızları, güç tüketimi ve PSU durumlarını izleme.\u003c/li>\n\u003cli>Fiziksel sunucuyu uzaktan açma/kapatma/yeniden başlatma.\u003c/li>\n\u003cli>Disk arızalarında anlık e-posta veya SNMP uyarısı alma.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>Güvenlik Uyarısı:\u003c/strong> iDRAC / iLO arayüzleri kesinlikle internete açılmamalı; yalnızca izole bir Yönetim VLAN&#39;ı (Management VLAN) üzerinden ve VPN ile erişilebilir olmalıdır.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"s-5-2-raid-seviyeleri-ve-ariza-toleransi\">5.2 RAID Seviyeleri ve Arıza Toleransı\u003c/h2>\n\u003cp>Sunucularda tek disk kullanılmaz; veriler donanımsal RAID denetleyicisi ile yedekli tutulur:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>RAID Seviyesi\u003c/th>\n\u003cth>Minimum Disk\u003c/th>\n\u003cth>Kullanılabilir Alan\u003c/th>\n\u003cth>Arıza Toleransı\u003c/th>\n\u003cth>Hız (Okuma / Yazma)\u003c/th>\n\u003cth>En İyi Kullanım\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>RAID 0\u003c/strong> (Striping)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>%100\u003c/td>\n\u003ctd>\u003cstrong>0 disk\u003c/strong> (1 disk giderse her şey silinir!)\u003c/td>\n\u003ctd>Çok Hızlı / Çok Hızlı\u003c/td>\n\u003ctd>Sunucu ortamında \u003cstrong>asla kullanılmaz\u003c/strong>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>RAID 1\u003c/strong> (Mirroring)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>%50\u003c/td>\n\u003ctd>1 disk\u003c/td>\n\u003ctd>Hızlı / Normal\u003c/td>\n\u003ctd>İşletim sistemi diskleri (OS boot drives).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>RAID 5\u003c/strong> (Parity)\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>(N - 1) disk\u003c/td>\n\u003ctd>1 disk\u003c/td>\n\u003ctd>Hızlı / Yavaş (Parite hesabı)\u003c/td>\n\u003ctd>Genel dosya paylaşımı (Büyük disklerde rebuild riski vardır!).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>RAID 6\u003c/strong> (Dual Parity)\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>(N - 2) disk\u003c/td>\n\u003ctd>\u003cstrong>2 disk\u003c/strong>\u003c/td>\n\u003ctd>Hızlı / Yavaş\u003c/td>\n\u003ctd>Büyük kapasiteli arşiv ve yedekleme sunucuları.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>RAID 10\u003c/strong> (1+0 Striped Mirror)\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>%50\u003c/td>\n\u003ctd>Her gruptan 1 disk (azami N/2)\u003c/td>\n\u003ctd>\u003cstrong>Çok Hızlı / Hızlı\u003c/strong>\u003c/td>\n\u003ctd>Yüksek IOPS isteyen veritabanları (SQL, ERP, Sanallaştırma).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"s-5-3-hot-spare-ve-hot-swap-disk-degisimi\">5.3 Hot-Spare ve Hot-Swap Disk Değişimi\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Hot-Swap:\u003c/strong> Sunucuyu kapatmadan arızalı diski çekip yenisini takabilme özelliği.\u003c/li>\n\u003cli>\u003cstrong>Hot-Spare:\u003c/strong> Kabinette hazırda dönen ancak boştaki yedek disk. Birincil disklerden biri arızalandığında RAID denetleyicisi insan müdahalesi beklemeden bu diski devreye sokar ve diziyi onarır (Auto-Rebuild).\u003c/li>\n\u003cli>\u003cstrong>Rebuild Riski:\u003c/strong> RAID 5 dizisinde büyük kapasiteli (örn. 8TB) bir disk bozulduğunda yeni diskin rebuild işlemi günler sürebilir. Bu süreçte diğer diskler yoğun okuma stresine girer; ikinci bir disk bozulursa \u003cstrong>tüm veri kaybedilir\u003c/strong>. Bu nedenle kritik ortamlarda RAID 5 yerine \u003cstrong>RAID 10\u003c/strong> veya \u003cstrong>RAID 6\u003c/strong> tercih edilir.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s-5-4-cift-guc-kaynagi-redundant-psu\">5.4 Çift Güç Kaynağı (Redundant PSU)\u003c/h2>\n\u003cul>\n\u003cli>Kurumsal sunucularda en az \u003cstrong>2 adet güç kaynağı (PSU)\u003c/strong> bulunur.\u003c/li>\n\u003cli>\u003cstrong>Kritik Bağlantı Hatası:\u003c/strong> Her iki güç kaynağını da aynı prize veya aynı UPS&#39;e takmak yedekliliği bozar.\u003c/li>\n\u003cli>\u003cstrong>Doğru Uygulama:\u003c/strong>\u003cul>\n\u003cli>PSU 1 -&gt; Kabinet PDU A -&gt; UPS 1 (veya Şebeke/Jeneratör)\u003c/li>\n\u003cli>PSU 2 -&gt; Kabinet PDU B -&gt; UPS 2\u003c/li>\n\u003cli>Bu sayede UPS&#39;lerden biri patlasa veya sigortası atsa dahi sunucu kapanmadan çalışmaya devam eder.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-6-ortam-izleme-ve-iklimlendirme\">6. ORTAM İZLEME VE İKLİMLENDİRME\u003c/h1>\n\u003cul>\n\u003cli>\u003cstrong>Sistem Odası Sıcaklık Standardı:\u003c/strong> ASHRAE standardına göre önerilen sıcaklık \u003cstrong>18°C – 24°C\u003c/strong>, bağıl nem \u003cstrong>%40 – %55\u003c/strong> olmalıdır.\u003c/li>\n\u003cli>\u003cstrong>Sensörler:\u003c/strong> Kabinette sıcaklık, bağıl nem, su sızıntı kablosu (klima drenaj borusu altı) ve duman detektörü bulunmalıdır.\u003c/li>\n\u003cli>\u003cstrong>Alarm Eşikleri:\u003c/strong> Sıcaklık 27°C&#39;yi geçtiğinde IT ekibine anlık SMS / WhatsApp / E-posta alarmı tetiklenmeli; 35°C&#39;yi aştığında sunucular otomatik kapatılmalıdır.\u003c/li>\n\u003cli>\u003cstrong>Yangın Söndürme:\u003c/strong> Sistem odalarında su fıskiyesi (sprinkler) yerine gazlı söndürme sistemleri (\u003cstrong>FM-200 / NOVEC 1230\u003c/strong>) kullanılır. Bu gazlar donanıma zarar vermez ve oksijeni boğmadan yangını kimyasal reaksiyonla söndürür.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1 id=\"s-7-sistem-odasi-kontrol-listesi\">7. SİSTEM ODASI KONTROL LİSTESİ\u003c/h1>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kabinet kapakları kilitli, sistem odasına girişler kartlı geçiş/parmak izi ve kamera ile izleniyor.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Kablo karmaşası (spagetti) yok; tüm patch kabloları organizatörlerden geçirildi ve etiketlendi.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Klimalar yedekli (2 klima dönüşümlü çalışıyor; biri arızalanırsa diğeri otomatik devreye giriyor).\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> UPS akü göstergesi ve yük durumu haftalık fiziksel olarak kontrol ediliyor.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Sunucu ön panelindeki arıza LED&#39;leri (kehribar/turuncu arıza ışığı) periyodik taranıyor.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Boş kabinet yuvalarına kör paneller takılarak sıcak/soğuk hava sirkülasyonu sağlandı.\u003c/li>\n\u003c/ul>\n","sections":[{"id":"s-veri-merkezi-fiziksel-altyapi-ups-ve-donanim-rehberi","title":"Veri Merkezi, Fiziksel Altyapı, UPS ve Donanım Rehberi","level":1,"path":"","isTitle":true,"text":"Yazılım ve işletim sistemleri ne kadar mükemmel olursa olsun, fiziksel altyapı (elektrik, kablolama, iklimlendirme ve donanım sağlığı) sağlam değilse sistemlerin ayakta kalması imkansızdır. Bir IT uzmanı ve sistem yöneticisi için fiziksel katmanın eksiksiz rehberi."},{"id":"s-1-yapisal-kablolama-ve-renk-standartlari","title":"1. YAPISAL KABLOLAMA VE RENK STANDARTLARI","level":1,"path":"","isTitle":false,"text":""},{"id":"s-1-1-bakir-kablolama-twisted-pair","title":"1.1 Bakır Kablolama (Twisted Pair)","level":2,"path":"1. YAPISAL KABLOLAMA VE RENK STANDARTLARI","isTitle":false,"text":"Kurumsal ağlarda en yaygın kullanılan UTP/STP kablo türleri:\nKategori\nAzami Hız\nAzami Frekans\nAzami Mesafe\nTipik Kullanım Alanı\nCat5e\n1 Gbps\n100 MHz\n100 metre\nEski kurulumlar, masaüstü uç kullanıcılar.\nCat6\n1 Gbps (10G 55m'ye kadar)\n250 MHz\n100 metre\nStandart kurumsal ofis ve PoE uç noktalar.\nCat6a\n10 Gbps\n500 MHz\n100 metre\nVeri merkezi, switch arası uplink ve modern omurga.\nCat7 / Cat8\n10G / 25G / 40G\n600 - 2000 MHz\n30 metre\nVeri merkezinde sunucu-switch yüksek hızlı bağlantılar.\nKritik Kural: Ethernet kablolarında tek parça azami hat mesafesi 100 metredir (90m sabit tesisat kablosu + her iki uçta 5'er metrelik patch kablo). 100 metreyi aşan mesafelerde sinyal zayıflar; araya switch veya fiber optik hat çekilmelidir."},{"id":"s-1-2-rj45-renk-standartlari-t568a-ve-t568b","title":"1.2 RJ45 Renk Standartları (T568A ve T568B)","level":2,"path":"1. YAPISAL KABLOLAMA VE RENK STANDARTLARI","isTitle":false,"text":"Kurumsal tesisatlarda dünya standardı olarak T568B kullanılır:\nRJ45 Konnektör Pin Dizilimi (Tırnak arkada, pinler yukarı bakarken, Soldan Sağa 1'den 8'e):\nPin 1: Turuncu-Beyaz\nPin 2: Turuncu\nPin 3: Yeşil-Beyaz\nPin 4: Mavi\nPin 5: Mavi-Beyaz\nPin 6: Yeşil\nPin 7: Kahverengi-Beyaz\nPin 8: Kahverengi\nDüz Kablo (Straight-Through): İki ucu da T568B standardında çakılır. Farklı cihazlar arası kullanılır (PC -> Switch, Router -> Switch).\nÇapraz Kablo (Crossover): Bir ucu T568A, diğer ucu T568B standardındadır. Aynı tür cihazlar arası (Switch -> Switch, PC -> PC) için geçmişte gerekirdi; modern ağ kartlarında Auto-MDIX özelliği olduğundan düz kablolar da otomatik algılanır."},{"id":"s-1-3-patch-panel-ve-keystone-jack-cakma","title":"1.3 Patch Panel ve Keystone Jack Çakma","level":2,"path":"1. YAPISAL KABLOLAMA VE RENK STANDARTLARI","isTitle":false,"text":"Duvar prizleri ve kabinet içi sonlandırmalar daima Keystone Jack ve Patch Panel üzerine punch-down (kronalama) aletiyle çakılır.\nEtiketleme Kuralı: Kabinet tarafındaki her patch panel portu (örn. PP1-Port 24), odadaki duvar prizinde (örn. Oda 204 - Data 1) aynı kodla etiketlenmelidir. Etiketsiz bir kablolama altyapısı arıza durumunda saatlerce zaman kaybettirir."},{"id":"s-2-fiber-optik-temelleri","title":"2. FİBER OPTİK TEMELLERİ","level":1,"path":"","isTitle":false,"text":"Binalar arası, katlar arası veya switch uplink bağlantılarında elektromanyetik parazitten etkilenmeyen ve uzun mesafeleri destekleyen fiber optik hatlar kullanılır.\nTür\nÇekirdek Çapı\nIşık Kaynağı\nAzami Mesafe\nRenk Kodu\nKullanım\nMulti-Mode (MMF) OM3 / OM4\n50 µm\nLED / VCSEL Lazer\n300m - 550m (10G için)\nTurkuaz (Aqua) / Menekşe (Violet)\nBina içi katlar arası omurga, kabinetler arası.\nSingle-Mode (SMF) OS2\n9 µm\nLazer\n10 km - 40+ km\nSarı (Yellow)\nKampüs içi binalar arası, Metro Ethernet, ISP hatları.\nKonnektör Türleri: En yaygın kurumsal tür LC (küçük, çiftli push-pull) ve eski tesisatlarda SC (kare) konektörlerdir.\nSFP / SFP+ Modülleri: Switch üzerindeki fiber yuvalarına takılan alıcı-verici (transceiver) modüller. Multi-mode için SX veya SR, Single-mode için LX veya LR modül seçilmelidir. (Multi-mode kabloya Single-mode modül takılamaz!)."},{"id":"s-3-sunucu-rack-kabinet-duzeni","title":"3. SUNUCU RACK KABİNET DÜZENİ","level":1,"path":"","isTitle":false,"text":"Veri merkezinde ve sistem odalarında standart 19 inç kabinetler kullanılır:\nRack Unit (U Ölçüsü): 1U = 1.75 inç (44.45 mm). Standart kabinetler genellikle 42U veya 48U yüksekliğindedir.\nSıcak / Soğuk Koridor Mantığı:\nSunucular ve ağ cihazları havayı önden emer, arkadan sıcak olarak dışarı üfler.\nKabinetlerin ön yüzleri birbirine bakacak şekilde dizilirse soğuk hava kanalı oluşur (Soğuk Koridor).\nBoş kalan U yuvalarına Kör Panel (Blanking Panel) takılmalıdır; aksi takdirde arka taraftaki sıcak hava ön tarafa sirküle ederek sunucuları ısıtır.\nAğırlık Dağılımı: En ağır bileşenler (UPS, akü grupları ve disk dolu storage sunucuları) daima kabinetin en altına yerleştirilir. Switch ve patch paneller genellikle üst veya orta kısımdadır."},{"id":"s-4-kesintisiz-guc-kaynagi-ups-ve-elektrik","title":"4. KESİNTİSİZ GÜÇ KAYNAĞI (UPS) VE ELEKTRİK","level":1,"path":"","isTitle":false,"text":""},{"id":"s-4-1-ups-turleri","title":"4.1 UPS Türleri","level":2,"path":"4. KESİNTİSİZ GÜÇ KAYNAĞI (UPS) VE ELEKTRİK","isTitle":false,"text":"Offline / Standby: Şebeke varken doğrudan verir, elektrik kesilince 4-10 ms içinde aküye geçer. Hassas sunucular için uygun değildir.\nLine-Interactive: Voltaj dalgalanmalarını AVR ile düzeltir, kesintide 2-4 ms içinde aküye geçer. Küçük ofis ve switch'ler için uygundur.\nOnline (Çift Çevrim - True Online): Şebeke elektriğini sürekli AC -> DC -> AC olarak yeniden üretir. Transfer süresi 0 ms'dir (kesintisiz). Frekans ve voltaj dalgalanmalarından sunucuları tamamen izole eder. Sistem odaları için zorunlu standarttır."},{"id":"s-4-2-yuk-ve-guc-hesabi-va-vs-watt","title":"4.2 Yük ve Güç Hesabı (VA vs Watt)","level":
